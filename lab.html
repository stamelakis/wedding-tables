// ============================================================
//  TABLE FOCUS — tap a table: the canvas glides onto it and a seat list opens
//  (right panel on a PC, bottom sheet on a phone). Type a name, Enter → next seat.
// ============================================================
const focusEl=$("focus"), fSeats=$("fSeats");
let sug=null, viewAnim=null;
function focusedTable(){ return state.tables.find(t=>t.id===focusId)||null; }
function visibleBox(){
  let w=stagewrap.clientWidth, h=stagewrap.clientHeight;
  if(isNarrow() && document.body.classList.contains("focused")) h=Math.max(140, h-focusEl.getBoundingClientRect().height);
  return {w,h};
}
// Glide the view so stage point (cx,cy) sits at the visible centre at zoom z.
function viewTo(cx,cy,z,animate){
  const m=isNarrow()?12:24, wrap=stagewrap;
  if(viewAnim){ cancelAnimationFrame(viewAnim); viewAnim=null; }
  const place=(zz,x,y)=>{ zoom=zz; applyZoom(); const b=visibleBox(); wrap.scrollLeft=m+x*zoom-b.w/2; wrap.scrollTop=m+y*zoom-b.h/2; };
  if(!animate){ place(z,cx,cy); return; }
  const b0=visibleBox(), z0=zoom, cx0=(wrap.scrollLeft+b0.w/2-m)/z0, cy0=(wrap.scrollTop+b0.h/2-m)/z0, t0=performance.now(), dur=280;
  const step=now=>{ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
    place(z0+(z-z0)*e, cx0+(cx-cx0)*e, cy0+(cy-cy0)*e);
    viewAnim = p<1 ? requestAnimationFrame(step) : null; };
  viewAnim=requestAnimationFrame(step);
}
// A seat row may still hold an uncommitted edit (a disc tap preventDefaults pointerdown, so the input never blurs).
// Commit it against the table it belongs to before anything changes focusId or tears the rows down.
function flushLiveRow(){
  const ae=document.activeElement;
  if(!ae || ae.tagName!=="INPUT" || !ae.closest("#fSeats") || ae.dataset.done) return;
  const tb=state.tables.find(x=>x.id===+fSeats.dataset.tid); if(!tb) return;
  const i=+ae.closest(".frow").dataset.i; ae.dataset.done="1"; hideSug();
  if(ae.value.trim() || !tb.seats[i]) commitRow(tb,i,ae.value,null);
}
function focusTable(id, opts={}){
  const t=state.tables.find(x=>x.id===id); if(!t) return;
  if(focusId!==id) flushLiveRow();
  const wasOpen=document.body.classList.contains("focused");
  focusId=id;
  document.body.classList.add("focused"); setNav(false); hideSug();
  stage.querySelectorAll(".table").forEach(w=>w.classList.toggle("focused", +w.dataset.tableId===id));
  renderFocus();
  // focus the wanted row synchronously — iOS only opens the keyboard for focus() inside the user gesture
  if(opts.row!=null) focusRow(opts.row);
  // zoom onto the table once the panel has taken its space (layout changes on open)
  requestAnimationFrame(()=>{
    if(focusId!==id) return;
    const ext=tableExtent(t), b=visibleBox();
    const z=clamp(Math.min(b.w*0.82/(ext.rx*2), b.h*0.82/(ext.ry*2)), 0.5, 1.6);
    viewTo(t.x, t.y, z, wasOpen || !isNarrow());
  });
}
function unfocusTable(){
  if(focusId==null && !document.body.classList.contains("focused")) return;
  flushLiveRow();
  focusId=null; hideSug(); document.body.classList.remove("focused"); focusEl.classList.remove("tall");
  stage.querySelectorAll(".table.focused").forEach(w=>w.classList.remove("focused"));
  layoutCanvas();
}
function renderFocus(){
  const t=focusedTable(); if(!t){ unfocusTable(); return; }
  const occ=t.seats.filter(Boolean).length;
  $("fName").textContent=t.label; $("fCount").textContent=`${occ}/${t.capacity}`;
  // keep a live (uncommitted) input alive across re-renders — only if the rows still belong to the same table
  const ae=document.activeElement; let keep=null;
  if(ae && ae.tagName==="INPUT" && ae.closest("#fSeats") && !ae.dataset.done && +fSeats.dataset.tid===t.id){ keep={ i:+ae.closest(".frow").dataset.i, v:ae.value, s:ae.selectionStart, e:ae.selectionEnd }; }
  const st=fSeats.scrollTop;
  fSeats.dataset.tid=t.id;
  fSeats.innerHTML="";
  const ag=state.groups.find(g=>g.id===state.activeGroupId);   // the group new names will join (empty rows show it faintly)
  for(let i=0;i<t.capacity;i++){
    const gid=t.seats[i];
    const row=document.createElement("div"); row.className="frow"+(gid?" occ":""); row.dataset.i=i;
    const dotColor=gid?guestColor(gid):(ag?ag.color:"#cfc8bd");
    row.innerHTML=`<span class="fn">${i+1}</span><button class="fdot${gid?"":" empty"}" tabindex="-1" title="${escapeHtml(gid?tr("rowGroup"):tr("rowNewGroup"))}" style="background-color:${safeColor(dotColor)}"></button><input type="text" maxlength="40" autocomplete="off" spellcheck="false" placeholder="${escapeHtml(tr("seatPh"))}" value="${gid?escapeHtml(guestName(gid)):""}"><button class="fx" title="${escapeHtml(tr("unseat"))}" tabindex="-1">✕</button>`;
    const dot=row.querySelector(".fdot");
    dot.addEventListener("pointerdown",e=>e.preventDefault());   // don't blur a row being typed in
    dot.addEventListener("click",e=>{ e.stopPropagation(); const g2=t.seats[i]; if(g2) openGroupMenu(g2, anchorOf(dot)); else openActiveGroupMenu(anchorOf(dot)); });
    const inp=row.querySelector("input");
    inp.addEventListener("focus",()=>{ markSeat(i); showSug(i,inp.value); });
    inp.addEventListener("input",()=>showSug(i,inp.value));
    inp.addEventListener("keydown",e=>onRowKey(e,i,inp));
    inp.addEventListener("blur",()=>{
      if(inp.dataset.done) return;
      const tb=focusedTable(), v=inp.value; if(!tb) return;   // capture NOW — the rows may be rebuilt or the panel closed before the timer fires
      setTimeout(()=>{
        if(inp.dataset.done||!state.tables.includes(tb)) return; inp.dataset.done="1";
        if(sug&&sug.i===i) hideSug();
        if(!v.trim() && tb.seats[i]){ if(inp.isConnected) inp.value=guestName(tb.seats[i]); return; }   // blurring an emptied seat just restores it (× or Enter unseat)
        commitRow(tb,i,v,null);
      },120);
    });
    row.querySelector(".fx").addEventListener("click",()=>{ const tb=focusedTable(); if(tb&&tb.seats[i]){ tb.seats[i]=null; save(); renderTables([tb.id]); renderPool(); } });
    fSeats.appendChild(row);
  }
  fSeats.scrollTop=st;
  if(keep){ const inp=rowInput(keep.i); if(inp){ inp.value=keep.v; inp.focus({preventScroll:true}); try{ inp.setSelectionRange(keep.s,keep.e); }catch(e){} } }
}
function rowInput(i){ return fSeats.querySelector(`.frow[data-i="${i}"] input`); }
function focusRow(i){ const inp=rowInput(i); if(!inp) return; inp.focus(); inp.select(); inp.scrollIntoView({block:"nearest"}); }
function markSeat(i){ stage.querySelectorAll(".table.focused .seat").forEach(s=>s.classList.toggle("sel", +s.dataset.seatIndex===i)); }
function onRowKey(e,i,inp){
  e.stopPropagation();
  const tb=focusedTable(); if(!tb) return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    if(sug&&sug.i===i&&sug.items.length){ e.preventDefault(); sug.sel=(sug.sel+(e.key==="ArrowDown"?1:-1)+sug.items.length)%sug.items.length; sug.nav=true; paintSug(); }
    return;
  }
  if(e.key==="Escape"){ e.preventDefault(); if(sug){ hideSug(); } else { inp.dataset.done="1"; inp.blur(); unfocusTable(); } return; }
  if(e.key==="Enter"||e.key==="Tab"){
    e.preventDefault(); inp.dataset.done="1";
    const v=inp.value.trim();
    // a suggestion is only taken when the user typed something or arrowed onto it — never on an untouched row
    const choice=(sug&&sug.i===i&&sug.items.length&&(v||sug.nav))?sug.items[sug.sel]:null; hideSug();
    if(!v && tb.seats[i]){ tb.seats[i]=null; save(); renderTables([tb.id]); renderPool(); }   // Enter on an emptied seat = unseat
    else if(choice&&choice.id!=="__new") commitRow(tb,i,"",choice.id);
    else commitRow(tb,i,v,null);
    renderFocus();
    const next=e.shiftKey? i-1 : i+1;
    if(next>=0 && next<tb.capacity) focusRow(next); else (e.shiftKey?$("fBack"):$("fFill")).focus();
  }
}
// Apply what was typed/chosen for seat i. Returns true if the plan changed.
function commitRow(tb,i,text,chosenId){
  let cur=tb.seats[i]; const v=(text||"").trim(); let changed=false;
  if(cur && !state.guests[cur]){ tb.seats[i]=null; cur=null; changed=true; }   // dangling id from a desynced plan
  if(chosenId && state.guests[chosenId]){ if(cur!==chosenId){ tb.seats[i]=chosenId; changed=true; } }
  else if(v){
    if(cur){ if(state.guests[cur].name!==v){ state.guests[cur].name=v; changed=true; } }
    else {
      const ex=unseatedIds().find(id=>norm(guestName(id))===norm(v));   // typed an existing unseated name → seat that guest, no duplicate
      if(ex) tb.seats[i]=ex; else { const id="g"+nextId(); state.guests[id]={ name:v, groupId:state.activeGroupId||null }; tb.seats[i]=id; }
      changed=true;
    }
  }
  if(changed){ save(); renderTables([tb.id]); renderPool(); renderGroups(); }
  return changed;
}
// Suggestions under the active row: unseated guests matching the text (active group first when empty).
function showSug(i,q){
  const tb=focusedTable(); if(!tb) return;
  const nq=norm(q); const cur=tb.seats[i];
  if(cur && (!nq || nq===norm(guestName(cur)))){ hideSug(); return; }   // an occupied row offers nothing until a different name is typed
  let pool=unseatedIds();
  if(nq){ pool=pool.filter(id=>norm(guestName(id)).includes(nq)); const ex=pool.find(id=>norm(guestName(id))===nq); if(ex) pool=[ex,...pool.filter(id=>id!==ex)]; }   // exact match always first
  else if(state.activeGroupId){ const g=pool.filter(id=>state.guests[id].groupId===state.activeGroupId); if(g.length) pool=g; }
  const items=pool.slice(0,5).map(id=>({id, name:guestName(id), color:guestColor(id)}));
  const exact=nq && items.some(it=>norm(it.name)===nq);
  if(nq && !exact) items.push({ id:"__new", name:cur? tr("renameTo",{n:q.trim()}) : tr("createNew",{n:q.trim()}) });
  if(!items.length){ hideSug(); return; }
  const renameIdx=items.findIndex(it=>it.id==="__new");
  sug={ i, items, sel:(cur&&renameIdx>=0)?renameIdx:0, nav:false, more:Math.max(0,pool.length-5) };   // editing an occupant defaults to "rename", not "swap"
  paintSug();
}
function paintSug(){
  fSeats.querySelectorAll(".fsug").forEach(e=>e.remove());
  if(!sug) return;
  const row=fSeats.querySelector(`.frow[data-i="${sug.i}"]`); if(!row) return;
  const box=document.createElement("div"); box.className="fsug";
  box.innerHTML=sug.items.map((it,k)=>`<div class="${it.id==="__new"?"new":""}${k===sug.sel?" sel":""}" data-k="${k}">${it.color?`<span class="dot" style="background:${it.color}"></span>`:""}${escapeHtml(it.name)}</div>`).join("")
    +(sug.more?`<div class="more">${escapeHtml(tr("moreMatches",{n:sug.more}))}</div>`:"");
  box.querySelectorAll("[data-k]").forEach(el=>{
    el.addEventListener("pointerdown",e=>e.preventDefault());     // keep the input focused (no blur commit)
    el.addEventListener("click",()=>chooseSug(+el.dataset.k));
  });
  row.after(box);
  const sel=box.querySelector(".sel"); if(sel) sel.scrollIntoView({block:"nearest"});
}
function hideSug(){ sug=null; fSeats.querySelectorAll(".fsug").forEach(e=>e.remove()); }
function chooseSug(k){
  if(!sug) return; const it=sug.items[k], i=sug.i, tb=focusedTable(); if(!tb) return;
  const inp=rowInput(i); if(inp) inp.dataset.done="1";
  hideSug();
  if(it.id==="__new") commitRow(tb,i,inp?inp.value:"",null); else commitRow(tb,i,"",it.id);
  renderFocus(); if(i+1<tb.capacity) focusRow(i+1);
}
function stepTable(dir){
  const t=focusedTable(); if(!t) return;
  const i=state.tables.indexOf(t); const n=state.tables.length;
  focusTable(state.tables[(i+dir+n)%n].id);
}
$("fPrev").addEventListener("click",()=>stepTable(-1));
$("fNext").addEventListener("click",()=>stepTable(1));
$("fBack").addEventListener("click",()=>{ if(isNarrow()) overview(); else unfocusTable(); });   // ‹ Τραπέζια: back to the list / the whole floor
$("fSettings").addEventListener("click",e=>{ if(focusId!=null) openMenu(focusId, anchorOf(e.currentTarget)); });
$("fHandle").addEventListener("click",()=>focusEl.classList.toggle("tall"));
$("fName").addEventListener("click",()=>{ if(isNarrow()) focusEl.classList.toggle("tall"); });
$("fClear").addEventListener("click",()=>{ const t=focusedTable(); if(!t) return; if(!t.seats.some(Boolean)) return;
  if(!confirm(tr("clearConfirm",{n:t.label}))) return; t.seats=t.seats.map(()=>null); save(); renderTables([t.id]); renderPool(); toast(tr("tCleared")); });
$("fFill").addEventListener("click",e=>{
  const t=focusedTable(); if(!t) return;
  const un=unseatedIds(); const per={}; un.forEach(id=>{ const g=state.guests[id].groupId||""; per[g]=(per[g]||0)+1; });
  const m=$("fillmenu");

  m.innerHTML=rows.map(r=>`<div class="gm-item" data-gid="${escapeHtml(r.id)}">${r.color?`<span class="dot" style="background:${safeColor(r.color)}"></span>`:""}${escapeHtml(r.name)}<span class="n">${r.n}</span></div>`).join("");
  m.querySelectorAll(".gm-item").forEach(it=>it.onclick=()=>{ m.style.display="none"; fillFrom(t, it.dataset.gid||null); });
  showPopover(m, anchorOf(e.currentTarget));
});
function fillFrom(t, gid){
  let ids=unseatedIds(); if(gid) ids=ids.filter(id=>state.guests[id].groupId===gid);
  if(!ids.length){ toast(tr("fillNone")); return; }
  let k=0; for(let i=0;i<t.capacity&&k<ids.length;i++){ if(!t.seats[i]) t.seats[i]=ids[k++]; }
  save(); renderTables([t.id]); renderPool(); renderGroups(); toast(tr("filled",{n:k}));
}
// Clicking bare floor / canvas background closes the names panel (and, with a mouse, drops a picked guest —
// a finger that misses a small seat must not lose the pick). A tap that merely dismisses a popover does nothing else.
stagewrap.addEventListener("click",e=>{
  if(e.target!==stage&&e.target!==stagewrap) return;
  if(menu.style.display==="block"||$("featuremenu").style.display==="block"||$("guesteditor").style.display==="block") return;
  if(pick){ if(!isTouch) setPick(null); return; }
  unfocusTable();
});
document.addEventListener("keydown",e=>{
  const tag=(e.target&&e.target.tagName)||""; const typing=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(e.target&&e.target.isContentEditable);
  if((e.ctrlKey||e.metaKey)&&!typing){ const k=e.key.toLowerCase(); if(k==="z"&&!e.shiftKey){ e.preventDefault(); undo(); return; } if(k==="y"||(k==="z"&&e.shiftKey)){ e.preventDefault(); redo(); return; } }
  if(e.key!=="Escape") return;
  if(tour){ endTour(); return; }
  if(document.querySelector(".modal-back.open")){ document.querySelectorAll(".modal-back.open").forEach(m=>m.classList.remove("open")); return; }
  if(pick){ setPick(null); return; }
  if(document.body.classList.contains("nav-open")){ setNav(false); return; }
  if(focusId!=null) unfocusTable();
});

// ============================================================
//  GUIDED TOUR — first visit (per device) and ⋯ → Οδηγός χρήσης / "?" · one flow for phones, one for PCs
// ============================================================
const TOUR_KEY="weddingSeatingPlanner.tour.v1";
let tour=null;
function tourSteps(){
  const S=(key,target,opts)=>({key,target,...(opts||{})});
  const first=()=>state.tables[0]&&state.tables[0].id;
  if(isNarrow()) return [
    S("welcome",null),
    S("mList","#tablestrip",{prep:()=>overview()}),
    S("mSheet","#focus",{prep:()=>{ if(first()!=null) focusTable(first()); }, after:()=>overview()}),
    S("mGuests","#sidebar",{prep:()=>setNav(true), after:()=>setNav(false)}),
    S("mMove","#stagewrap"),
    S("mBar","#mobilebar"),
    S("mMore","#moreBtn"),
    S("done",null),
  ];
  return [
    S("welcome",null),
    S("dGuests","#sidebar .sec:nth-child(2)"),
    S("dTables","#tablestrip"),
    S("dSheet","#focus",{prep:()=>{ if(first()!=null) focusTable(first()); }, after:()=>unfocusTable()}),
    S("dFloor","#stagewrap"),
    S("dTools","#sidebar .sec:first-child"),
    S("dView","#viewBtn"),
    S("dSync","#cloudBtn"),
    S("dMore","#moreBtn"),
    S("done",null),
  ].filter(s=>!(IS_LAB && s.key==="dSync"));   // the sandbox has no cloud
}
function startTour(){
  if(tour) return;
  setPick(null); hideSug(); document.querySelectorAll(".modal-back.open").forEach(m=>m.classList.remove("open"));
  tour={ steps:tourSteps(), i:0 }; $("tour").hidden=false; document.body.classList.add("touring");
  try{ localStorage.setItem(TOUR_KEY,"1"); }catch(e){}
  showTourStep();
}
function endTour(){
  if(!tour) return; const st=tour.steps[tour.i]; if(st&&st.after) st.after();
  tour=null; $("tour").hidden=true; document.body.classList.remove("touring");
}
function showTourStep(){
  const st=tour.steps[tour.i]; if(st.prep) st.prep();
  requestAnimationFrame(()=>requestAnimationFrame(()=>placeTour()));
}
function placeTour(){
  if(!tour) return; const st=tour.steps[tour.i];
  const spot=$("tourSpot"), card=$("tourCard"); const vh=window.innerHeight, vw=window.innerWidth;
  const tgt=st.target?document.querySelector(st.target):null; const r=tgt?tgt.getBoundingClientRect():null;
  const visible=!!(r&&r.width>0&&r.height>0);
  if(visible){ spot.style.left=(r.left-6)+"px"; spot.style.top=(r.top-6)+"px"; spot.style.width=(r.width+12)+"px"; spot.style.height=(r.height+12)+"px"; spot.style.outlineWidth="2px"; }
  else { spot.style.left=(vw/2)+"px"; spot.style.top=(vh/2)+"px"; spot.style.width="0px"; spot.style.height="0px"; spot.style.outlineWidth="0"; }
  const tx=(T.tour&&T.tour[st.key])||T_ALL.el.tour[st.key];
  const last=tour.i===tour.steps.length-1;
  card.innerHTML=`<div class="tour-step">${tour.i+1} / ${tour.steps.length}</div><h3>${escapeHtml(tx[0])}</h3><p>${tx[1]}</p>
    <div class="tour-btns"><button class="ibtn" data-a="skip">${escapeHtml(tr("tourSkip"))}</button><span class="spacer"></span>${tour.i>0?`<button class="ibtn" data-a="back">${escapeHtml(tr("tourBack"))}</button>`:""}<button class="ibtn primary" data-a="next">${escapeHtml(last?tr("tourDone"):tr("tourNext"))}</button></div>`;
  card.style.maxWidth=Math.min(400, vw-24)+"px";
  const atTop = visible && (r.top+r.height/2 > vh*0.55);
  card.style.top=atTop?"16px":""; card.style.bottom=atTop?"":"16px";
  if(!isNarrow() && visible){ const w=card.offsetWidth||380; card.style.left=clamp(r.left, 12, vw-w-12)+"px"; card.style.right=""; }
  else { card.style.left="12px"; card.style.right="12px"; }
  card.querySelector('[data-a="skip"]').onclick=()=>endTour();
  const bk=card.querySelector('[data-a="back"]'); if(bk) bk.onclick=()=>{ if(st.after) st.after(); tour.i--; showTourStep(); };
  card.querySelector('[data-a="next"]').onclick=()=>{ if(last){ endTour(); return; } if(st.after) st.after(); tour.i++; showTourStep(); };
}
window.addEventListener("resize",()=>{ if(tour) placeTour(); });
$("helpBtn").addEventListener("click",startTour);
function maybeStartTour(){ try{ if(localStorage.getItem(TOUR_KEY)) return; }catch(e){ return; } setTimeout(startTour, 900); }

  state.tables.push({id, label:String(roundCount+1), shape:"round", x:clamp(c.x,120,state.stage.w-120), y:clamp(c.y,120,state.stage.h-120), capacity:10, seats:Array(10).fill(null)});
  save(); renderTables(); setNav(false); toast(tr("tTableAdded")); focusTable(id,{row:isTouch?null:0});
}

$("addHeadBtn").addEventListener("click",()=>{ const c=visibleCenter(); const t=makeHeadTable(nextId()); t.x=clamp(c.x,200,state.stage.w-200); t.y=clamp(c.y,100,state.stage.h-100); state.tables.push(t); save(); renderTables(); setNav(false); toast(tr("tHeadAdded")); focusTable(t.id); });
$("addGuestBtn").addEventListener("click",()=>{

function autoSeat(){
  const un=unseatedIds().sort((a,b)=>String(state.guests[a].groupId).localeCompare(String(state.guests[b].groupId)));
  let idx=0;
  for(const t of state.tables){ if(t.shape==="head") continue; for(let i=0;i<t.capacity&&idx<un.length;i++){ if(t.seats[i]==null){ t.seats[i]=un[idx++]; } } if(idx>=un.length)break; }
  save(); renderTables(); renderPool(); toast(idx?tr("tAutoSeated",{n:idx}):tr("tNoSeats"));
}
$("autoSeatBtn").addEventListener("click",autoSeat);
function resetPlan(){
  const cur=currentProfile();
  if(!confirm((cur&&cur.cloudId)?tr("confirmResetShared"):tr("confirmReset")))return;
  const g=Object.keys(state.guests).length, s=assignedGuestIds().size;
  if(g>0 && !confirm(tr("resetWarn2",{g,s}))) return;   // a plan with real guests needs a second, explicit yes

  state=IS_LAB?labState():defaultState(); uid=state._uid; fontScale=1; applyStage(); $("stageFloor").value=state.stageMaterial; save(); renderAll();

}

function copyText(ta){
  ta.focus(); ta.select(); try{ ta.setSelectionRange(0,999999); }catch(e){}
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(()=>toast(tr("tCopied"))).catch(()=>toast(ok?tr("tCopied"):tr("tCopyHint")));
  } else { toast(ok?tr("tCopied"):tr("tCopyHint")); }
}

  else if(s && typeof s==="object" && s.importGuests){ mergeGuestList(s); }
  else { toast(tr("tNotPlan")); }
}

  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();

// Merge a guest LIST into the current plan (adds to the pool; never touches tables or existing guests)
function importGuestList(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.importGuests) mergeGuestList(d); else if(d.tables) toast(tr("tFullPlan")); else toast(tr("tNotGuestList")); }catch(e){ toast(tr("tInvalidFile")); } };
    r.readAsText(f); };
  inp.click();
}
function mergeGuestList(data){
  const nameToId={}; state.groups.forEach(g=>nameToId[g.name]=g.id);
  (data.importGroups||[]).forEach(g=>{
    if(!nameToId[g.name]){ const id="grp"+nextId(); state.groups.push({id,name:g.name,color:(g.color?safeColor(g.color):GROUP_PALETTE[state.groups.length%GROUP_PALETTE.length])}); nameToId[g.name]=id; }
  });
  const seenSrc=new Set(Object.values(state.guests).map(g=>g.srcId).filter(Boolean));
  let added=0, skipped=0;
  (data.importGuests||[]).forEach(gi=>{
    const nm=(gi.name||"").trim(); if(!nm) return;
    if(gi.srcId && seenSrc.has(gi.srcId)){ skipped++; return; }
    const id="g"+nextId();
    state.guests[id]={ name:nm, groupId: gi.group? (nameToId[gi.group]||null):null, status: gi.status||"confirmed", note: gi.note||"", srcId: gi.srcId||null };
    if(gi.srcId) seenSrc.add(gi.srcId);
    added++;
  });
  save(); renderAll();
  toast(tr("tMerged",{a:added})+(skipped?tr("tMergedSkipped",{s:skipped}):""));
}

// ============================================================
//  ☁ CLOUD SYNC  (same-origin API: POST/GET/PUT /plans, /codes)
// ============================================================
let cloudTimer=null, pushInFlight=false, pendingSnap=null, pointerGesture=false, conflictTimer=null;
function planPayload(){ const cur=currentProfile(); return { name:cur.name, plan:{...state, _profileName:cur.name} }; }
// Edit key rides in the URL #fragment (never sent to servers / logs); omit it for a view-only link.
function shareLink(cur, viewOnly){ const base=location.origin+location.pathname+"?plan="+cur.cloudId;
  return (viewOnly||!cur.editKey)? base : base+"#key="+cur.editKey; }
function setCloudDot(st){ const b=$("cloudBtn"); if(!b) return;
  b.textContent={ok:tr("cloudOk"),pending:tr("cloudPending"),err:tr("cloudErr")}[st]||tr("cloudIdle"); b.classList.toggle("on", st==="ok"); }
function fmtTime(ms){ try{ return ms? new Date(ms).toLocaleString(LANG):"—"; }catch(e){ return "—"; } }
function canPush(prof){ return !IS_LAB && !!(prof && prof.cloudId && !prof.readonly && !prof.unsynced && (prof.editKey || getSyncCode())); }
let wipeAllowedUntil=0;   // set by deliberate wipes (reset / undo / redo) so the server accepts an empty plan
const PLAN_ID_RE=/^[A-Za-z0-9_-]{8,64}$/;   // plan ids are opaque handles — never let one rewrite an API path
function planPath(id){ return SYNC_URL+"/plans/"+encodeURIComponent(id); }
function authHeaders(prof){ const h={"Content-Type":"application/json"};
  if(prof.editKey) h["X-Edit-Key"]=prof.editKey; else if(getSyncCode()) h["X-Sync-Code"]=getSyncCode(); return h; }
// True while the user is mid-interaction — used to defer a cloud pull so it can't clobber live edits.
function interactionBusy(){
  if(dragData||pick||pointerGesture||viewAnim||tour) return true;
  const ae=document.activeElement;
  if(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.isContentEditable)) return true;
  if(document.querySelector(".modal-back.open")) return true;
  for(const id of ["groupmenu","guesteditor","tablemenu","featuremenu","profilemenu","moremenu","fillmenu","viewmenu","palette"]){ const el=$(id); if(el && el.style.display==="block") return true; }
  return false;
}
async function cloudCreate(){
  const r=await fetch(SYNC_URL+"/plans",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(planPayload())});
  const d=await r.json(); if(!r.ok||!d.id) throw new Error(d.error||"upload failed");
  const cur=currentProfile(); cur.cloudId=d.id; cur.editKey=d.editKey; cur.cloudUpdated=d.updated; cur.readonly=false; saveProfilesIdx(); registerUnderCode(cur); return d;
}
function snapshotFor(prof){ return { profId:prof.id, cloudId:prof.cloudId, editKey:prof.editKey||"", name:prof.name,
  planJSON:JSON.stringify({...state, _profileName:prof.name}), baseUpdated:prof.cloudUpdated||0, allowWipe:Date.now()<wipeAllowedUntil, guests:Object.keys(state.guests).length }; }
async function cloudPush(snap){
  const prof=profiles.profiles.find(p=>p.id===snap.profId); if(!prof||!prof.cloudId) return;
  const headers={"Content-Type":"application/json"};
  if(snap.editKey) headers["X-Edit-Key"]=snap.editKey; else if(getSyncCode()) headers["X-Sync-Code"]=getSyncCode();
  const r=await fetch(planPath(snap.cloudId),{method:"PUT",headers,
    body:JSON.stringify({ name:snap.name, plan:JSON.parse(snap.planJSON), baseUpdated:snap.baseUpdated, allowWipe:snap.allowWipe })});
  if(r.status===422){   // the server refused to wipe a full plan with this empty one — refill from the server instead
    const d=await r.json().catch(()=>({}));
    prof.unsynced=true; saveProfilesIdx(); setCloudDot("err"); toast(tr("cWipeBlocked",{n:d.guests||"?"}),7000);
    clearTimeout(conflictTimer); conflictTimer=setTimeout(()=>pullIfNewer(true),1500);
    return;
  }
  if(r.status===409){
    // The server has a newer copy. Adopt it — the WHOLE of it. Never take just its timestamp: a device that did
    // would pass the next conflict check and overwrite everyone with its stale plan (that is how a plan was lost once).
    const d=await r.json().catch(()=>({}));
    if(prof.id===profiles.activeId && d.plan && !interactionBusy()){ applyPulledPlan(prof,d); toast(tr("cNewer")); }
    else { setCloudDot("pending"); clearTimeout(conflictTimer); conflictTimer=setTimeout(()=>{ pullIfNewer(); },4000); }   // busy right now — try again shortly
    return;
  }
  const d=await r.json(); if(!r.ok) throw new Error(d.error||"update failed");
  prof.cloudUpdated=d.updated; prof.cloudGuests=snap.guests; saveProfilesIdx(); registerUnderCode(prof); return d;
}
async function cloudFetch(id){ if(!PLAN_ID_RE.test(String(id))) throw new Error("bad id"); const r=await fetch(planPath(id)); const d=await r.json(); if(!r.ok) throw new Error(d.error||"not found"); return d; }
async function cloudDelete(prof){
  if(!prof||!prof.cloudId) return;
  try{ await fetch(planPath(prof.cloudId),{method:"DELETE",headers:authHeaders(prof)}); }catch(e){}
  const code=getSyncCode(); if(code){ try{ await fetch(codeUrl(),{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:prof.cloudId})}); }catch(e){} }
  prof.cloudId=""; prof.editKey=""; prof.cloudUpdated=0; prof.readonly=false; saveProfilesIdx();
}
// ---- sync code: link all my devices under one shared code ----
const SYNC_CODE_KEY=PBASE+".syncCode";
function getSyncCode(){ try{ return localStorage.getItem(SYNC_CODE_KEY)||""; }catch(e){ return ""; } }
function setSyncCode(c){ try{ if(c) localStorage.setItem(SYNC_CODE_KEY,c); else localStorage.removeItem(SYNC_CODE_KEY); }catch(e){} }
function randCode(){ const c="abcdefghijkmnpqrstuvwxyz23456789"; let s="";
  const a=(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(new Uint8Array(16)):null;
  for(let i=0;i<16;i++) s+=c[(a?a[i]:Math.floor(Math.random()*256))%c.length]; return s; }
function codeUrl(){ return SYNC_URL+"/codes/"+encodeURIComponent(getSyncCode()); }
async function registerUnderCode(prof){ const code=getSyncCode(); prof=prof||currentProfile(); if(!code||!prof||!prof.cloudId) return;
  const headers={"Content-Type":"application/json"}; if(prof.editKey) headers["X-Edit-Key"]=prof.editKey;
  try{ await fetch(codeUrl(),{method:"POST",headers,body:JSON.stringify({id:prof.cloudId,name:prof.name,updated:prof.cloudUpdated})}); }catch(e){} }
async function registerAllUnderCode(){ const code=getSyncCode(); if(!code) return; for(const p of profiles.profiles){ if(p.cloudId) await registerUnderCode(p); } }
async function syncFromCode(){ const code=getSyncCode(); if(!code) return 0;
  let plans; try{ const r=await fetch(codeUrl()); plans=(await r.json()).plans||[]; }catch(e){ return 0; }
  let added=0;
  for(const p of plans){ if(profiles.profiles.some(x=>x.cloudId===p.id)) continue;
    try{ const d=await cloudFetch(p.id); const s=d.plan||{}; if(!s.tables) continue; delete s._profileName;
      sanitizePlan(s); if(s.layoutVersion!==LAYOUT_VERSION) migrateLayout(s);
      const pid=newProfileId();
      let stored=true; try{ localStorage.setItem(planKey(pid), JSON.stringify(s)); }catch(e){ stored=false; }
      if(!stored) continue;
      profiles.profiles.push({ id:pid, name:d.name||p.name||tr("sharedPlan"), cloudId:p.id, editKey:p.editKey||"", cloudUpdated:d.updated }); added++;
    }catch(e){}
  }
  if(added){ saveProfilesIdx(); renderProfiles(); }
  return added;
}
let cloudPoll=null;
function startCloudPoll(){ if(cloudPoll) return;
  cloudPoll=setInterval(async()=>{
    if(pushInFlight||cloudTimer||pendingSnap) return;
    if(interactionBusy()) return;
    if(getSyncCode()) await syncFromCode();
    const cur=currentProfile(); if(cur&&cur.cloudId){
      try{ const d=await cloudFetch(cur.cloudId);
        if(d.updated && (!cur.cloudUpdated||d.updated>cur.cloudUpdated) && !interactionBusy() && !cloudTimer){ applyPulledPlan(cur,d); toast(tr("cUpdated")); }
      }catch(e){}
    }
  }, 15000);
}
function scheduleCloudPush(){
  const cur=(profiles&&profiles.profiles)?currentProfile():null; if(!canPush(cur)) return;
  // Client-side belt to the server's braces: an empty plan never goes up over a full one unless the wipe was deliberate.
  if(Object.keys(state.guests).length===0 && (cur.cloudGuests||0)>=5 && Date.now()>=wipeAllowedUntil){
    setCloudDot("err"); toast(tr("cWipeBlocked",{n:cur.cloudGuests}),7000); cur.unsynced=true; saveProfilesIdx();
    clearTimeout(conflictTimer); conflictTimer=setTimeout(()=>pullIfNewer(true),1500); return;
  }
  pendingSnap=snapshotFor(cur);
  clearTimeout(cloudTimer); setCloudDot("pending");
  cloudTimer=setTimeout(runPush, 2500);
}
async function runPush(){
  cloudTimer=null; const snap=pendingSnap; if(!snap) return;
  pushInFlight=true;
  try{ await cloudPush(snap); pendingSnap=null; setCloudDot("ok"); }
  catch(e){ setCloudDot("err"); if(navigator.onLine!==false){ clearTimeout(cloudTimer); cloudTimer=setTimeout(runPush, 8000); } }
  finally{ pushInFlight=false; }
}
function flushCloudPush(){
  if(cloudTimer){ clearTimeout(cloudTimer); cloudTimer=null; }
  const snap=pendingSnap; if(!snap) return; pendingSnap=null;
  try{
    const headers={"Content-Type":"application/json"};
    if(snap.editKey) headers["X-Edit-Key"]=snap.editKey; else if(getSyncCode()) headers["X-Sync-Code"]=getSyncCode();
    fetch(planPath(snap.cloudId),{method:"PUT",headers,keepalive:true,
      body:JSON.stringify({ name:snap.name, plan:JSON.parse(snap.planJSON), baseUpdated:snap.baseUpdated })});
  }catch(e){}
}
window.addEventListener("pagehide",flushCloudPush);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushCloudPush(); });
function applyPulledPlan(cur, d){
  const s=d.plan||{}; delete s._profileName;
  if(!s.tables){ cur.cloudUpdated=d.updated; saveProfilesIdx(); return; }
  sanitizePlan(s); if(s.layoutVersion!==LAYOUT_VERSION) migrateLayout(s);
  setPick(null); dragData=null;
  state=s; uid=state._uid||2001; fontScale=state.seatFontScale||1;
  if(d.name) cur.name=d.name; cur.cloudUpdated=d.updated; cur.cloudGuests=Object.keys(state.guests).length; cur.unsynced=false; saveProfilesIdx();
  try{ localStorage.setItem(planKey(cur.id), JSON.stringify(state)); }catch(e){ toast(tr("cLocalErr",{e:String(e&&e.message||e)}),6000); }
  applyStage(); $("stageFloor").value=state.stageMaterial||"grass";
  renderProfiles(); renderAll(); resetHistory();
  if(focusId!=null && focusedTable()) requestAnimationFrame(()=>focusTable(focusId));   // keep the open table in view
  else setTimeout(()=>{ zoom=initialZoom(); applyZoom(); },30);
}
function renderCloudBody(){
  const cur=currentProfile(); const body=$("cloudBody"); const code=getSyncCode();
  const inputStyle='style="flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)"';
  const codeHtml = code
    ? `<div style="border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px">
         <div class="mhint" style="padding:0 0 8px">${tr("cCodeHas")}</div>
         <div style="display:flex;gap:8px"><input id="syncCodeShow" readonly value="${escapeHtml(code)}" ${inputStyle}><button class="ibtn primary" id="syncCodeCopy" title="${escapeHtml(tr("cCodeCopy"))}">📋</button></div>
         <div class="mhint" style="padding:6px 0 0"><a href="#" id="syncCodeRefresh">${escapeHtml(tr("cRefresh"))}</a> · <a href="#" id="syncCodeDisconnect">${escapeHtml(tr("cDisconnect"))}</a></div>
       </div>`
    : `<div style="border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px">
         <div class="mhint" style="padding:0 0 8px">${tr("cCodeNone")}</div>
         <button class="ibtn primary" id="syncCodeGen" style="width:100%;height:38px;margin-bottom:8px">${escapeHtml(tr("cCodeGen"))}</button>
         <div style="display:flex;gap:8px"><input id="syncCodeInput" placeholder="${escapeHtml(tr("cCodePh"))}" ${inputStyle}><button class="ibtn" id="syncCodeJoin">${escapeHtml(tr("cJoin"))}</button></div>
       </div>`;
  const wire=()=>{
    const gen=$("syncCodeGen");
    if(gen) gen.onclick=async()=>{ setSyncCode(randCode()); await registerAllUnderCode(); await syncFromCode(); toast(tr("cCodeCreated")); renderCloudBody(); };
    const join=$("syncCodeJoin");
    if(join) join.onclick=async()=>{ const v=$("syncCodeInput").value.trim().toLowerCase().replace(/\s+/g,"");
      if(v.length<12){ toast(tr("cCodeShort")); return; } setSyncCode(v); await registerAllUnderCode(); const n=await syncFromCode(); toast(n?tr("cJoined",{n}):tr("cJoinedSynced")); renderCloudBody(); };
    const cp=$("syncCodeCopy"); if(cp) cp.onclick=()=>copyText($("syncCodeShow"));
    const rf=$("syncCodeRefresh"); if(rf) rf.onclick=async(e)=>{ e.preventDefault(); const n=await syncFromCode(); toast(n?tr("cAdded",{n}):tr("cUpToDate")); };
    const dc=$("syncCodeDisconnect"); if(dc) dc.onclick=(e)=>{ e.preventDefault(); if(!confirm(tr("cDisconnectConfirm"))) return; setSyncCode(""); toast(tr("cDisconnected")); renderCloudBody(); };
  };
  if(!cur.cloudId){
    body.innerHTML=codeHtml+`<div class="mhint" style="padding:0 0 8px">${escapeHtml(tr("cUploadHint"))}</div>
      <button class="ibtn primary" id="cloudUpload" style="width:100%;height:40px">${escapeHtml(tr("cUpload"))}</button>`;
    wire();
    $("cloudUpload").onclick=async()=>{ const b=$("cloudUpload"); b.disabled=true; b.textContent=tr("cUploading");
      try{ await cloudCreate(); setCloudDot("ok"); renderCloudBody(); toast(tr("cOnline")); }
      catch(e){ b.disabled=false; b.textContent=tr("cUpload"); toast(tr("cUploadFail")); } };
  } else {
    const editLink=shareLink(cur,false), viewLink=shareLink(cur,true), canEdit=canPush(cur)||!!cur.editKey;
    const linkStyle='style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)"';
    body.innerHTML=codeHtml+`
      ${cur.editKey?`<div class="mhint" style="padding:0 0 4px;font-weight:600">${escapeHtml(tr("cEditLink"))}</div><input id="cloudLink" readonly value="${escapeHtml(editLink)}" ${linkStyle}>`:""}
      <div class="mhint" style="padding:8px 0 4px;font-weight:600">${escapeHtml(tr("cViewLink"))}</div><input id="cloudViewLink" readonly value="${escapeHtml(viewLink)}" ${linkStyle}>
      <div class="mrow">${cur.editKey?`<button class="ibtn primary" id="cloudCopy">${escapeHtml(tr("cCopyEdit"))}</button>`:""}<button class="ibtn" id="cloudCopyView">${escapeHtml(tr("cCopyView"))}</button></div>
      <div class="mrow"><button class="ibtn" id="cloudPushNow">${escapeHtml(tr("cPushNow"))}</button><button class="ibtn" id="cloudPullNow">${escapeHtml(tr("cPullNow"))}</button><button class="ibtn danger" id="cloudRemove">${escapeHtml(tr("cRemove"))}</button></div>
      <div class="mhint" style="padding:8px 0 0">${escapeHtml(tr("cLast",{t:fmtTime(cur.cloudUpdated)}))}${canEdit?"":tr("cViewOnlyHere")}</div>`;
    wire();
    const cc=$("cloudCopy"); if(cc) cc.onclick=()=>copyText($("cloudLink"));
    $("cloudCopyView").onclick=()=>copyText($("cloudViewLink"));
    $("cloudPushNow").onclick=async()=>{ const c2=currentProfile(); if(!canPush(c2)){ toast(tr("cViewOnly")); return; }
      try{ await cloudPush(snapshotFor(c2)); setCloudDot("ok"); renderCloudBody(); toast(tr("cPushed")); }catch(e){ toast(tr("cPushFail")); } };
    $("cloudPullNow").onclick=async()=>{ if(!confirm(tr("cPullConfirm"))) return;
      try{ const d=await cloudFetch(cur.cloudId); applyPulledPlan(cur,d); renderCloudBody(); toast(tr("cPulled")); }catch(e){ toast(tr("cPullFail")); } };
    $("cloudRemove").onclick=async()=>{ if(!confirm(tr("cRemoveConfirm"))) return;
      await cloudDelete(currentProfile()); setCloudDot(); renderCloudBody(); toast(tr("cRemoved")); };
  }
}
// Open a ?plan=<id>#key=<editKey> link: fetch it and load as (or into) a profile.
// If a gated visitor's link turns out to be dead, send them home instead of leaving an ungated planner behind.
function gatedVisitor(){ return !IS_LAB && /(^|\.)takeaseat\.gr$/i.test(location.hostname) && !localStorage.getItem("weddingVenueKey") && !profiles.profiles.some(p=>p.cloudId); }
async function openSharedFromURL(){
  if(IS_LAB) return false;
  const params=new URLSearchParams(location.search); const id=params.get("plan"); if(!id) return false;
  const key=(location.hash.match(/(?:^#|&)key=([^&]+)/)||[])[1] || "";
  try{ history.replaceState(null,"",location.origin+location.pathname); }catch(e){}
  if(!PLAN_ID_RE.test(id)){ if(gatedVisitor()){ location.replace("/"); return true; } toast(tr("cOpenFail")); return true; }
  try{
    const d=await cloudFetch(id);
    let prof=profiles.profiles.find(p=>p.cloudId===id);
    if(prof){ profiles.activeId=prof.id; if(key&&!prof.editKey){ prof.editKey=key; prof.readonly=false; } saveProfilesIdx();
      try{ applyPulledPlan(prof,d); }catch(e){ toast(tr("cLoadErr",{e:String(e&&e.message||e)}),8000); throw e; }
      setCloudDot("ok"); toast((prof.editKey||key)?tr("cOpenedSync"):tr("cOpenedView")); }
    else{ const pid=newProfileId(); prof={ id:pid, name:d.name||tr("sharedPlan"), cloudId:id, editKey:key, cloudUpdated:d.updated, readonly:!key };
      profiles.profiles.push(prof); profiles.activeId=pid; saveProfilesIdx();
      applyPulledPlan(prof,d); setCloudDot("ok"); toast(key?tr("cOpenedNamed",{n:d.name||""}):tr("cOpenedNamedView",{n:d.name||""})); }
  }catch(e){ if(gatedVisitor()){ location.replace("/"); return true; } toast(tr("cOpenFail")); }
  return true;
}
async function pullIfNewer(force){
  const cur=currentProfile(); if(!cur||!cur.cloudId){ setCloudDot(); return; }
  force=force||cur.unsynced;   // an unsynced profile takes the server's copy whatever the timestamps say
  try{ const d=await cloudFetch(cur.cloudId);
    if(d.updated && (force || !cur.cloudUpdated || d.updated>cur.cloudUpdated)){
      if(interactionBusy()){ clearTimeout(conflictTimer); conflictTimer=setTimeout(()=>pullIfNewer(force),4000); return; }   // never apply under the user's fingers — retry
      applyPulledPlan(cur,d); toast(tr("cUpdated")); }
    setCloudDot("ok");
  }catch(e){ setCloudDot("err"); if(cur.unsynced) toast(tr("cLoadErr",{e:String(e&&e.message||e)}),7000); }
}
// ---- version history (kept on the server on every save) ----
async function openHistory(){
  const cur=currentProfile(); if(!cur||!cur.cloudId){ toast(tr("histNoCloud")); return; }
  const body=$("histBody"); body.innerHTML=`<div class="mhint">${escapeHtml(tr("histHint"))}</div>`; $("histModal").classList.add("open");
  let d; try{ const r=await fetch(planPath(cur.cloudId)+"/history",{headers:authHeaders(cur)}); if(!r.ok) throw 0; d=await r.json(); }
  catch(e){ body.innerHTML+=`<div class="mhint">${escapeHtml(tr("histFail"))}</div>`; return; }
  const vs=d.versions||[]; if(!vs.length){ body.innerHTML+=`<div class="mhint">${escapeHtml(tr("histEmpty"))}</div>`; return; }
  body.innerHTML+=`<div class="hist">`+vs.map(v=>`<div class="hrow"><div><b>${escapeHtml(fmtTime(v.updated))}</b><div class="muted">${escapeHtml(tr("histRow",{g:v.guests,s:v.seated,n:v.tables}))}</div></div><button class="ibtn" data-u="${v.updated}">${escapeHtml(tr("histRestore"))}</button></div>`).join("")+`</div>`;
  body.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{ const u=+b.dataset.u; if(!confirm(tr("histConfirm",{t:fmtTime(u)}))) return;
    try{ const r=await fetch(planPath(cur.cloudId)+"/restore",{method:"POST",headers:authHeaders(cur),body:JSON.stringify({updated:u})}); if(!r.ok) throw 0;
      const dd=await cloudFetch(cur.cloudId); setPick(null); unfocusTable(); applyPulledPlan(cur,dd); $("histModal").classList.remove("open"); toast(tr("histRestored",{t:fmtTime(u)}),3000); }
    catch(e){ toast(tr("histFail")); } });
}
$("histClose").addEventListener("click",()=>$("histModal").classList.remove("open"));
$("histModal").addEventListener("click",e=>{ if(e.target.id==="histModal") e.currentTarget.classList.remove("open"); });
function openCloud(){ if(IS_LAB){ toast(tr("labHint")); return; } renderCloudBody(); $("cloudModal").classList.add("open"); }
$("cloudBtn").addEventListener("click",openCloud);
$("cloudClose").addEventListener("click",()=>$("cloudModal").classList.remove("open"));
$("cloudModal").addEventListener("click",e=>{ if(e.target.id==="cloudModal") e.currentTarget.classList.remove("open"); });

// ============================================================
//  PRINT
// ============================================================
$("printBtn").addEventListener("click",buildAndPrint);
function buildAndPrint(){
  const area=$("printarea");
  const legend=state.groups.map(g=>`<span><span class="dot" style="background:${g.color}"></span>${escapeHtml(g.name)}</span>`).join("");
  const cards=state.tables.map(t=>{
    const rows=t.seats.map(gid=> gid?`<li><span class="gdot" style="background:${guestColor(gid)}"></span>${escapeHtml(guestName(gid))}${STATUS_TXT(gStatus(gid))?` <span style="color:#a00">(${STATUS_TXT(gStatus(gid))})</span>`:""}</li>`:`<li class="empty">${escapeHtml(tr("printEmpty"))}</li>`).join("");
    const occ=t.seats.filter(Boolean).length;
    return `<div class="pcard"><h3>${escapeHtml(t.label)} <span style="font-weight:400;color:#888;font-size:12px">(${occ}/${t.capacity})</span></h3><ol>${rows}</ol></div>`;
  }).join("");
  const un=unseatedIds();
  const unHtml=un.length?`<div class="punassigned"><strong>${escapeHtml(tr("printUnassigned",{n:un.length}))}</strong> ${un.map(id=>escapeHtml(guestName(id))).join(", ")}</div>`:"";
  const seated=assignedGuestIds().size, totalSeats=state.tables.reduce((s,t)=>s+t.capacity,0);
  area.innerHTML=`<h2>${escapeHtml(tr("printTitle"))}</h2>
    <div class="psub">${escapeHtml(tr("printSub",{t:state.tables.length, s:seated, c:totalSeats}))}</div>
    ${legend?`<div class="plegend">${legend}</div>`:""}
    <div class="ptables">${cards}</div>${unHtml}`;
  window.print();
}

// ============================================================
//  TEXT SIZE + ZOOM
// ============================================================
function setFontScale(v){ fontScale=clamp(v,0.6,2.0); state.seatFontScale=fontScale; save(); renderTables(); toast(tr("tFont",{n:Math.round(fontScale*100)})); }
function setTableFontScale(v){ state.tableFontScale=clamp(v,0.6,2.4); save(); renderTables(); toast(tr("tNumSize",{n:Math.round(state.tableFontScale*100)})); }
function setNameMode(m){ if(!["full","short","initials"].includes(m)) return; state.nameMode=m; save(); renderTables(); }
// The "Aa" view menu: name display · name size · table-number size · zoom — same on PC and phone.
function renderViewMenu(){
  const m=$("viewmenu"); const mode=state.nameMode||"full"; const tfs=state.tableFontScale||1;
  m.innerHTML=`<div class="gm-cap">${escapeHtml(tr("names"))}</div>
    <div class="vrow"><div class="seg" id="vmNames">${["full","short","initials"].map(k=>`<button data-m="${k}" class="${mode===k?"on":""}">${escapeHtml(tr({full:"nm_full",short:"nm_short",initials:"nm_initials"}[k]))}</button>`).join("")}</div></div>
    <div class="gm-cap">${escapeHtml(tr("nameSize"))}</div>
    <div class="vrow"><button class="ibtn" data-a="fdown">A−</button><span class="pct">${Math.round(fontScale*100)}%</span><button class="ibtn" data-a="fup">A＋</button></div>
    <div class="gm-cap">${escapeHtml(tr("numSize"))}</div>
    <div class="vrow"><button class="ibtn" data-a="ndown">1−</button><span class="pct">${Math.round(tfs*100)}%</span><button class="ibtn" data-a="nup">1＋</button></div>
    <div class="gm-cap">${escapeHtml(tr("zoomLbl"))}</div>
    <div class="vrow"><button class="ibtn" data-a="zout">−</button><span class="pct">${Math.round(zoom*100)}%</span><button class="ibtn" data-a="zin">＋</button><button class="ibtn" data-a="fit">${escapeHtml(tr("fit"))}</button></div>`;
  m.querySelectorAll("#vmNames button").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); setNameMode(b.dataset.m); renderViewMenu(); });
  m.querySelectorAll("[data-a]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); const a=b.dataset.a;
    if(a==="fdown") setFontScale(fontScale-0.15); else if(a==="fup") setFontScale(fontScale+0.15);
    else if(a==="ndown") setTableFontScale((state.tableFontScale||1)-0.2); else if(a==="nup") setTableFontScale((state.tableFontScale||1)+0.2);
    else if(a==="zout") zoomBy(1/1.2); else if(a==="zin") zoomBy(1.2); else if(a==="fit"){ zoom=clamp(fitZoom(),0.2,2.5); applyZoom(); }
    renderViewMenu(); });
}
function openViewMenu(anchorEl){ const m=$("viewmenu"); if(m.style.display==="block"){ m.style.display="none"; return; } renderViewMenu(); showPopover(m, anchorOf(anchorEl)); }
function fitZoom(){ const b=visibleBox(), n=isNarrow(); return Math.min(1,(b.w-(n?24:60))/state.stage.w,(b.h-(n?34:80))/state.stage.h); }
// Opening view: the 0.5 floor keeps names readable on a desktop; a phone fits the whole space instead.
function initialZoom(){ if(isNarrow()) layoutCanvas(true); return Math.min(1, Math.max(fitZoom(), isNarrow()?0.1:0.5)); }
function applyZoom(){
  layoutCanvas();
  stage.style.transform=`scale(${zoom})`;
  const m=isNarrow()?12:24, w=(state.stage&&state.stage.w)||1700, h=(state.stage&&state.stage.h)||1360;
  stage.style.margin=`${m}px ${Math.round(m+w*(zoom-1))}px ${Math.round(m+h*(zoom-1))}px ${m}px`;
  $("zoomLabel").textContent=Math.round(zoom*100)+"%";
}
$("zoomIn").addEventListener("click",()=>zoomBy(1.15));
$("zoomOut").addEventListener("click",()=>zoomBy(1/1.15));
$("zoomFit").addEventListener("click",()=>{ zoom=clamp(fitZoom(),0.2,2.5); applyZoom(); });

// ============================================================
//  INIT
// ============================================================
function renderAll(){ renderFeatures(); renderTables(); renderGroups(); renderPool(); updateStats(); }
if(!state.stage) state.stage={w:2100,h:1400};
if(!state.stageMaterial) state.stageMaterial="grass";
applyStage();
const _stageResize=document.createElement("div"); _stageResize.id="stageResize"; _stageResize.title=tr("stageResizeTip");
stage.appendChild(_stageResize); makeStageResizable(_stageResize);
initFloorSelect(); initDecor(); renderProfiles();
renderAll(); resetHistory();
setTimeout(()=>{ zoom=initialZoom(); applyZoom(); },50);
// Turn each SVG texture into a plain bitmap once (canvas → JPEG data URI). Browsers re-render the SVG noise
// filters at every zoom step, which is what made pinch-zoom crawl on phones; a bitmap just gets resampled.
function rasterizeMaterials(){
  const dpr=Math.min(2, window.devicePixelRatio||1); let pending=0;
  const done=()=>{ if(--pending===0){ applyStage(); renderFeatures(); } };
  Object.keys(MATERIALS).forEach(k=>{
    const m=MATERIALS[k]; const uri=m.img.slice(5,-2); const [w,h]=m.size.split(" ").map(parseFloat);
    const img=new Image(); pending++;
    img.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); m.img='url("'+c.toDataURL("image/jpeg",0.86)+'")'; }catch(e){} done(); };
    img.onerror=done; img.src=uri;
  });
}
setTimeout(rasterizeMaterials, 0);
// ☁ open a shared link if present, otherwise refresh the active profile from the cloud (the lab never talks to the cloud)
if(!IS_LAB){ const p0=currentProfile(); if(loadError && p0 && p0.cloudId) toast(tr("cLocalErr",{e:loadError}),7000); }
if(!IS_LAB) (async()=>{ if(!(await openSharedFromURL())) await pullIfNewer(); if(getSyncCode()) await syncFromCode(); startCloudPoll(); maybeStartTour(); })();
else maybeStartTour();
</script>
