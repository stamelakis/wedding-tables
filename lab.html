  const box=$("groupList"); box.innerHTML="";
  const counts={}; Object.keys(state.guests).forEach(id=>{ const g=state.guests[id].groupId; if(g)counts[g]=(counts[g]||0)+1; });
  const allChip=makeGroupChip({id:null,name:tr("all"),color:null}, Object.keys(state.guests).length, true); allChip.title=tr("noGroup"); box.appendChild(allChip);
  state.groups.forEach(g=> box.appendChild(makeGroupChip(g, counts[g.id]||0, false)) );
  const add=document.createElement("div");
  add.className="chip add"; add.textContent=tr("addGroup"); add.title=tr("groupsTitle");
  add.addEventListener("click",openGroupsModal); box.appendChild(add);
  const ag=state.groups.find(g=>g.id===state.activeGroupId);   // say where new names will go
  const hint=$("namesHint"); if(hint) hint.textContent = isTouch ? tr("namesToTouch",{g:ag?ag.name:tr("noGroup")}) : tr("namesTo",{g:ag?ag.name:tr("noGroup")});   // no Ctrl+Enter on a phone
}
function makeGroupChip(g, count, isAll){
  const chip=document.createElement("div");
  chip.className="chip"+((state.activeGroupId||null)===g.id?" active":"");
  chip.innerHTML=`${g.color?`<span class="dot" style="background:${g.color}"></span>`:""}<span>${escapeHtml(g.name)}</span><span class="n">${count}</span>`;
  chip.addEventListener("click",()=>{ state.activeGroupId=g.id; save(); renderGroups(); renderPool(); });
  if(!isAll){
    chip.title=tr("groupTip");
    chip.addEventListener("dblclick",e=>{ e.stopPropagation(); renameGroup(g.id); });
    chip.addEventListener("contextmenu",e=>{ e.preventDefault(); editGroup(g.id,e); });
    chip.querySelector(".dot").addEventListener("click",e=>{ e.stopPropagation(); openPalette(g, e.currentTarget); });
    if(isTouch){ const more=document.createElement("span"); more.className="gmore"; more.textContent="⋯"; more.title=tr("groupMore");
      more.addEventListener("click",e=>{ e.stopPropagation(); editGroup(g.id,e); }); chip.appendChild(more); }
  }
  return chip;
}

let searchQ="";
function unseatedIds(){ const assigned=assignedGuestIds(); return Object.keys(state.guests).filter(id=>!assigned.has(id)); }
function visiblePoolIds(){
  const q=norm(searchQ); let ids=unseatedIds();
  if(q) return ids.filter(id=>norm(guestName(id)).includes(q)||(partyOf(id)&&norm(partyOf(id).name).includes(q)));   // a search looks across all groups (and invitation names)
  if(state.activeGroupId) ids=ids.filter(id=>state.guests[id].groupId===state.activeGroupId);
  return ids;
}
function renderPool(){
  const pool=$("pool"); pool.innerHTML="";
  const un=unseatedIds(), ids=visiblePoolIds();
  $("poolCount").textContent=tr("unseatedN",{n:un.length});
  $("mbCount").textContent=un.length;
  $("searchWrap").classList.toggle("has", !!searchQ);
  $("searchWrap").hidden = isNarrow() && !searchQ && document.activeElement!==$("guestSearch") && un.length<8;   // phones: search only once the list needs it; PC: always
  if(ids.length===0){
    const msg = searchQ ? escapeHtml(tr("noMatch")) : (state.activeGroupId&&un.length) ? escapeHtml(tr("poolEmptyGroup")) : (Object.keys(state.guests).length ? escapeHtml(tr("poolEmpty")) : tr("poolEmptyNew"));
    pool.innerHTML=`<div class="empty-note">${msg}</div>`;
    if(!Object.keys(state.guests).length) $("addNames").open=true;
    return;
  }
  const byParty=new Map(), singles=[];
  ids.forEach(id=>{ const p=partyOf(id); if(p){ if(!byParty.has(p.id)) byParty.set(p.id,{p,members:[]}); byParty.get(p.id).members.push(id); } else singles.push(id); });
  [...byParty.values()].sort((a,b)=>a.p.name.localeCompare(b.p.name)).forEach(({p,members})=>{ pool.appendChild(partyHeader(p, members, partyUnseated(p.id).length)); members.forEach(id=>pool.appendChild(makeChip(id, true))); });
  singles.forEach(id=>pool.appendChild(makeChip(id, false)));
}
function partyHeader(p, members, total){
  const h=document.createElement("div"); h.className="pparty"; h.draggable=true; h.dataset.pid=p.id;
  const cnt=(total&&total!==members.length)?`${members.length} / ${total}`:String(members.length);   // a colour / search filter hides some: say so — the gesture seats all of them
  h.innerHTML=`<span class="grip" title="${escapeHtml(tr("gripParty"))}">${ICON("grip")}</span><b>${escapeHtml(caseName(p.name))}</b><span class="n">${cnt}</span><button class="pedit" title="${escapeHtml(tr("partyRename"))}">${ICON("edit")}</button>`;
  if(pick&&pick.type==="party"&&pick.partyId===p.id) h.classList.add("picked");
  h.addEventListener("dragstart",e=>{ dragData={type:"party",partyId:p.id}; e.dataTransfer.effectAllowed="move"; });
  h.querySelector(".grip").addEventListener("click",e=>{ e.stopPropagation(); openPlaceMenu(null, anchorOf(e.currentTarget), null, p.id); });
  h.querySelector(".pedit").addEventListener("click",e=>{ e.stopPropagation(); const nm=prompt(tr("partyRenamePrompt"), p.name); if(nm===null) return;
    const v=nm.trim();
    if(!v){ partyMembers(p.id).forEach(id=>state.guests[id].partyId=null); if(pick&&pick.type==="party"&&pick.partyId===p.id) setPick(null); }
    else { const dup=(state.parties||[]).find(x=>x!==p&&norm(x.name)===norm(v));   // same name as another invitation = merge into it
      if(dup){ partyMembers(p.id).forEach(id=>state.guests[id].partyId=dup.id); if(pick&&pick.type==="party"&&pick.partyId===p.id) setPick({type:"party",partyId:dup.id}); }
      else p.name=v.slice(0,80); }
    pruneParties(); save(); renderPool(); });
  h.addEventListener("click",()=>{ const same=pick&&pick.type==="party"&&pick.partyId===p.id; setPick(same?null:{type:"party",partyId:p.id}); });
  return h;
}
function makeChip(id, inParty){
    const col=guestColor(id);
    const chip=document.createElement("div");
    chip.className="gchip"+(inParty?" inparty":""); chip.draggable=true; chip.dataset.guestId=id;
    chip.style.borderLeftColor=col; chip.style.background=hexTint(col);
    chip.title=(guestGroup(id)?guestGroup(id).name:"")+statusTitle(id);
    chip.innerHTML=`<span class="grip" title="${escapeHtml(tr("gripTitle"))}">${ICON("grip")}</span><span class="nm">${escapeHtml(guestName(id))}${statusTag(id)}</span><span class="acts"><button class="edit" title="${escapeHtml(tr("chipEdit"))}">${ICON("edit")}</button><button class="x" title="${escapeHtml(tr("chipRemove"))}">✕</button></span>`;
    if(pick && pick.from==="pool" && pick.guestId===id) chip.classList.add("picked");
    chip.addEventListener("dragstart",e=>{ dragData={type:"guest",guestId:id,from:"pool"}; e.dataTransfer.effectAllowed="move"; });
    chip.addEventListener("contextmenu",e=>{ e.preventDefault(); openGuestEditor(id,e); });
    chip.querySelector(".grip").addEventListener("click",e=>{ e.stopPropagation(); openPlaceMenu(id, anchorOf(e.currentTarget), null); });
    chip.addEventListener("click",e=>{
      if(e.target.closest(".acts")) return;
      const same = pick && pick.from==="pool" && pick.guestId===id;
      setPick(same ? null : {type:"guest",guestId:id,from:"pool"});
    });
    chip.querySelector(".edit").addEventListener("click",e=>{ e.stopPropagation(); openGuestEditor(id,e); });
    chip.querySelector(".x").addEventListener("click",e=>{ e.stopPropagation(); if(pick&&pick.guestId===id) setPick(null); delete state.guests[id]; pruneParties(); save(); renderPool(); renderGroups(); updateStats(); toast(tr("tGuestRemoved")); });
    return chip;
}
function updateStats(){
  const totalSeats=state.tables.reduce((s,t)=>s+t.capacity,0);
  const seated=assignedGuestIds().size, total=Object.keys(state.guests).length;
  $("statLine").textContent=tr("stats",{t:state.tables.length, s:seated, g:total, c:totalSeats});
  renderStrip(seated,total);
}
// Phone: the table chooser under the canvas — tap a chip to glide onto that table; "⤢ Όλα" comes back to the overview.
function renderStrip(seated,total){
  const grid=$("tsGrid"); if(!grid) return;
  $("tsCount").textContent=`${state.tables.length} · ${seated}/${total}`;
  grid.innerHTML=state.tables.map(t=>{ const occ=t.seats.filter(Boolean).length, full=occ>=t.capacity;
    return `<div class="ts-chip${full?" full":""}" data-id="${t.id}"><div class="lbl">${t.shape==="head"?ICON("heart"):escapeHtml(t.label)}</div><div class="occ">${occ}/${t.capacity}</div><div class="bar"><i style="width:${Math.round(100*occ/Math.max(1,t.capacity))}%"></i></div></div>`; }).join("");
}
function overview(){ unfocusTable(); setPick(null); requestAnimationFrame(()=>{ layoutCanvas(true); zoom=clamp(fitZoom(),0.1,2.5); applyZoom(); stagewrap.scrollTop=0; stagewrap.scrollLeft=0; }); }
// Phone overview: make the canvas exactly as tall as the floor fitted to the screen width, so the table list
// gets the rest instead of dead space. Once the user zooms in (>1.25× fit) the canvas takes over and the list shrinks.
function layoutCanvas(forceOverview){
  if(!isNarrow() || document.body.classList.contains("focused")){ stagewrap.style.height=""; stagewrap.style.flex=""; document.body.classList.remove("zoomed"); return; }
  const m=12, zf=Math.max(0.1,(stagewrap.clientWidth-2*m)/state.stage.w);
  const zoomedIn=!forceOverview && zoom>zf*1.25;
  document.body.classList.toggle("zoomed", zoomedIn);
  if(zoomedIn){ stagewrap.style.height=""; stagewrap.style.flex=""; return; }
  const avail=window.innerHeight-52;
  stagewrap.style.flex="none"; stagewrap.style.height=clamp(Math.round(state.stage.h*zf+2*m+10), 200, Math.round(avail*0.62))+"px";
}

function addGroup(){
  const name=prompt(tr("promptNewGroup"), tr("groupN",{n:state.groups.length+1})); if(!name)return;
  const color=GROUP_PALETTE[state.groups.length % GROUP_PALETTE.length];
  const g={id:"grp"+nextId(), name:name.trim(), color};
  state.groups.push(g); state.activeGroupId=g.id; save(); renderGroups(); renderPool();
}
function renameGroup(id){ const g=state.groups.find(x=>x.id===id); if(!g)return; const nm=prompt(tr("promptRenameGroup"),g.name); if(nm&&nm.trim()){ g.name=nm.trim(); save(); renderGroups(); } }
function recolorGroup(id){
  const g=state.groups.find(x=>x.id===id); if(!g)return;
  const inp=document.createElement("input"); inp.type="color"; inp.value=g.color;
  inp.style.position="fixed"; inp.style.left="-9999px"; document.body.appendChild(inp);
  inp.addEventListener("input",()=>{ g.color=inp.value; save(); renderGroups(); renderTables(); renderPool(); });
  inp.addEventListener("change",()=>inp.remove()); inp.click();
}
function editGroup(id,evt){
  const g=state.groups.find(x=>x.id===id); if(!g)return;
  const menu=$("groupmenu"); menu.dataset.fromSheet="";
  menu.innerHTML=`
    <div class="gm-item" data-act="rename"><span class="dot" style="background:${g.color}"></span>${escapeHtml(tr("gmRename",{n:g.name}))}</div>
    <div class="gm-item" data-act="recolor">${ICON("palette")}${escapeHtml(tr("gmRecolor"))}</div>
    <div class="gm-sep"></div>
    <div class="gm-item danger" data-act="delete">${ICON("trash")}${escapeHtml(tr("gmDelete"))}</div>`;
  menu.querySelector('[data-act="rename"]').onclick=()=>{ closeGroupMenu(); renameGroup(id); };
  menu.querySelector('[data-act="recolor"]').onclick=e=>{ closeGroupMenu(); openPalette(g, e.currentTarget); };
  menu.querySelector('[data-act="delete"]').onclick=()=>{
    closeGroupMenu();
    if(!confirm(tr("confirmDeleteGroup",{n:g.name})))return;
    Object.values(state.guests).forEach(gu=>{ if(gu.groupId===id) gu.groupId=null; });
    state.groups=state.groups.filter(x=>x.id!==id);
    if(state.activeGroupId===id) state.activeGroupId=null;
    save(); renderGroups(); renderTables(); renderPool();
  };
  showPopover(menu,evt);
}
function showPopover(menu,evt){
  menu.style.display="block";
  const x=Math.max(6, Math.min(evt.clientX, window.innerWidth - menu.offsetWidth - 8));
  const y=Math.max(6, Math.min(evt.clientY, window.innerHeight - menu.offsetHeight - 8));
  menu.style.left=x+"px"; menu.style.top=y+"px";
}
function anchorOf(el){ const r=el.getBoundingClientRect(); return {clientX:r.left, clientY:r.bottom+4}; }
function closeGroupMenu(){ $("groupmenu").style.display="none"; }
function groupRowsHtml(selId){
  return [`<div class="gm-item${selId==null?" on":""}" data-gid=""><span class="dot" style="background:#ccc"></span>${escapeHtml(tr("noGroup"))}</div>`]
    .concat(state.groups.map(g=>`<div class="gm-item${selId===g.id?" on":""}" data-gid="${escapeHtml(g.id)}"><span class="dot" style="background:${safeColor(g.color)}"></span>${escapeHtml(g.name)}</div>`))
    .concat([`<div class="gm-sep"></div><div class="gm-item" data-act="manage">${ICON("gear")}${escapeHtml(tr("gmManage"))}</div>`]).join("");
}
// Change a guest's group (from a seat row's dot, a chip, the pick bar…)
function openGroupMenu(guestId, evt){
  closePlaceMenu();
  const menu=$("groupmenu"); const g=state.guests[guestId]; if(!g) return;
  menu.dataset.fromSheet=""; menu.innerHTML=`<div class="gm-cap">${escapeHtml(tr("rowGroup"))}</div>`+groupRowsHtml(g.groupId||null);
  menu.querySelectorAll(".gm-item[data-gid]").forEach(it=>{ it.onclick=()=>{ g.groupId=it.dataset.gid||null; save(); renderTables(); renderPool(); renderGroups(); closeGroupMenu(); }; });
  menu.querySelector('[data-act="manage"]').onclick=()=>{ closeGroupMenu(); openGroupsModal(); };
  showPopover(menu,evt);
}
// Everyone at a table → one group (gear menu, sheet footer). Pick a group or type a new one; one save, one undo step.
function tableSeated(t){ return t.seats.filter(id=>id&&state.guests[id]); }
function openTableGroupMenu(t, anc){
  closePlaceMenu();
  const ids=tableSeated(t); if(!ids.length){ toast(tr("tgEmpty",{n:t.label}),2500); return; }
  const per={}; ids.forEach(id=>{ const g=state.guests[id].groupId||""; per[g]=(per[g]||0)+1; });
  const common=Object.keys(per).length===1 ? Object.keys(per)[0] : null;   // all already in one group → that row is "on"
  const row=(gid,name,color)=>`<div class="gm-item${common===gid?" on":""}" data-gid="${escapeHtml(gid)}"><span class="dot" style="background:${color}"></span>${escapeHtml(name)}<span class="n">${per[gid]||""}</span></div>`;
  const menu=$("groupmenu");
  menu.innerHTML=`<div class="gm-cap">${escapeHtml(tr("tgCap",{n:t.label}))}</div>`
    +state.groups.map(g=>row(g.id,g.name,safeColor(g.color))).join("")
    +`<div class="gm-item gm-new"><input class="gnew" placeholder="${escapeHtml(tr("groupsNewPh"))}" maxlength="40" autocomplete="off"><button class="ibtn" data-act="new" title="${escapeHtml(tr("groupsAdd"))}">＋</button></div>`
    +row("",tr("noGroup"),"#ccc")
    +`<div class="gm-sep"></div><div class="gm-item" data-act="manage">${ICON("gear")}${escapeHtml(tr("gmManage"))}</div>`;
  menu.querySelectorAll(".gm-item[data-gid]").forEach(it=>{ it.onclick=()=>setTableGroup(t, it.dataset.gid||null); });
  const inp=menu.querySelector(".gnew"), mk=()=>{ if(!state.tables.some(x=>x.id===t.id)){ closeGroupMenu(); return; }   // table gone meanwhile (Delete key, undo, a pull): no unsaved group
    const v=inp.value.trim(); if(!v){ inp.focus(); return; }
    const color=[...GROUP_PALETTE,...EXTRA_PALETTE].find(c=>!state.groups.some(g=>g.color===c))||GROUP_PALETTE[state.groups.length%GROUP_PALETTE.length];
    const g={id:"grp"+nextId(), name:v, color}; state.groups.push(g);   // not the pool filter (activeGroupId): everyone in this group is seated, the list would go empty
    setTableGroup(t, g.id); };
  menu.querySelector('[data-act="new"]').onclick=mk;
  inp.addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Enter"){ e.preventDefault(); mk(); } if(e.key==="Escape"){ e.preventDefault(); closeGroupMenu(); } });
  menu.querySelector('[data-act="manage"]').onclick=()=>{ closeGroupMenu(); openGroupsModal(); };
  menu.dataset.fromSheet=(isNarrow() && t.id===focusId)?"1":"";   // phone: came from the sheet's ⚙ → re-anchor there if the sheet moves
  showPopover(menu, anc);
}
function setTableGroup(t, gid){
  const cur=state.tables.find(x=>x.id===t.id); if(!cur){ closeGroupMenu(); return; }
  if(gid && !state.groups.some(g=>g.id===gid)) gid=null;
  const ids=tableSeated(cur); ids.forEach(id=>{ state.guests[id].groupId=gid; });
  save(); renderTables(); renderPool(); renderGroups(); if(focusId===cur.id) renderFocus(); closeGroupMenu();
  if(focusId===cur.id){ const back=isNarrow()?$("fSettings"):$("fGroup"); if(back) try{ back.focus({preventScroll:true}); }catch(e){} }   // the popover had focus; back in the panel a stray Backspace stays harmless
  const g=gid?state.groups.find(x=>x.id===gid):null;
  toast(g?tr("tGrouped",{g:g.name,n:cur.label,k:ids.length}):tr("tUngrouped",{n:cur.label,k:ids.length}),3000);
}
// ---- Προσκλητήριο from the sheet: tick the names that share one invitation, name it, done (one save) ----
let partySel=null;   // {tableId, ids:Set} while picking
function startPartySelect(t){
  if(!t) return;
  if(partySel&&partySel.tableId===t.id){ try{ $("psName").focus({preventScroll:true}); }catch(e){} return; }   // pressed again: keep the ticks, go to the name
  if(focusId!==t.id) focusTable(t.id,{});
  if(!tableSeated(t).length){ toast(tr("tgEmpty",{n:t.label}),2500); return; }
  closeMenu(); closeGroupMenu(); closePlaceMenu(); hideSug();
  partySel={tableId:t.id, ids:new Set()}; document.body.classList.add("partysel");
  $("psList").innerHTML=(state.parties||[]).map(p=>`<option value="${escapeHtml(p.name)}">`).join("");
  const inp=$("psName"); inp.value=""; inp.dataset.auto="1"; $("partysel").hidden=false; updatePartyBar(); renderFocus();
}
function endPartySelect(){ if(!partySel) return; partySel=null; document.body.classList.remove("partysel"); $("partysel").hidden=true; if(focusId!=null) renderFocus(); }
function togglePartySel(gid){ if(!partySel) return; if(partySel.ids.has(gid)) partySel.ids.delete(gid); else partySel.ids.add(gid); updatePartyBar(); renderFocus(); }
function suggestPartyName(ids){   // an existing invitation among the picked names, else the surname most of them share — stored spelling (the Aa mode is applied on display)
  for(const id of ids){ const p=partyOf(id); if(p) return p.name; }
  const perStem={}, perTok={};
  for(const id of ids){ const nm=rawName(id), st=surnameStems(nm)[0]; if(!st) continue;
    perStem[st]=(perStem[st]||0)+1;
    const tok=nm.split(/\s*[+&]\s*/)[0].split(/[^\p{L}\p{M}]+/u).find(w=>upperGreek(w).startsWith(st));
    if(tok){ const k=st+"|"+tok; perTok[k]=(perTok[k]||0)+1; } }
  const top=Object.keys(perStem).sort((a,b)=>perStem[b]-perStem[a])[0];
  if(top){ const best=Object.keys(perTok).filter(k=>k.startsWith(top+"|")).sort((a,b)=>perTok[b]-perTok[a]||b.length-a.length)[0]; if(best) return best.slice(top.length+1); }
  for(const id of ids){ const t=surnameToken(rawName(id)); if(t) return t; } return "";
}
function partySelIds(){   // only names still seated at the picked table — ×, undo or a grip move may have taken one away
  const t=state.tables.find(x=>x.id===partySel.tableId);
  partySel.ids.forEach(id=>{ if(!t||!state.guests[id]||!t.seats.includes(id)) partySel.ids.delete(id); });
  return [...partySel.ids];
}
function updatePartyBar(){ if(!partySel) return; const ids=partySelIds(); $("psCount").textContent=tr("psCount",{n:ids.length}); const inp=$("psName"); if(inp.dataset.auto==="1") inp.value=suggestPartyName(ids); }
function makePartyFromSelection(){
  if(!partySel) return; const ids=partySelIds();
  if(!ids.length){ toast(tr("tPartyNone")); return; }
  const nm=$("psName").value.trim()||suggestPartyName(ids)||tr("partyN",{n:(state.parties||[]).length+1});
  const p=ensureParty(nm); ids.forEach(id=>{ state.guests[id].partyId=p.id; }); pruneParties();
  save(); renderPool(); endPartySelect(); toast(tr("tPartyMade",{n:caseName(p.name),k:ids.length}),3000);
}
$("psOk").addEventListener("click",makePartyFromSelection);
$("psCancel").addEventListener("click",endPartySelect);
$("psName").addEventListener("input",()=>{ $("psName").dataset.auto=""; });
$("psName").addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Enter"){ e.preventDefault(); makePartyFromSelection(); } else if(e.key==="Escape"){ e.preventDefault(); endPartySelect(); } });
$("fParty").addEventListener("click",()=>startPartySelect(focusedTable()));
$("menuParty").addEventListener("click",()=>{ const t=state.tables.find(x=>x.id===activeMenuTableId); closeMenu(); if(t) startPartySelect(t); });
$("menuGroup").addEventListener("click",e=>{ const t=state.tables.find(x=>x.id===activeMenuTableId), anc=anchorOf(e.currentTarget); closeMenu(); if(t) openTableGroupMenu(t, anc); });   // the click bubbles to the closer, which exempts these two openers
$("fGroup").addEventListener("click",e=>{ const t=focusedTable(); if(t) openTableGroupMenu(t, anchorOf(e.currentTarget)); });

// ---- groups manager: rename · recolour (palette) · delete · add ----
const EXTRA_PALETTE=["#d94f4f","#e8843a","#c9a227","#5aa64c","#2f8f8f","#3b6fd6","#7a5cd6","#c04f9a","#8b6a4e","#607080"];
function renderGroupsModal(){
  const body=$("groupsBody"); const counts={}; Object.values(state.guests).forEach(gu=>{ if(gu.groupId) counts[gu.groupId]=(counts[gu.groupId]||0)+1; });
  body.innerHTML=state.groups.map(g=>`<div class="grow" data-id="${escapeHtml(g.id)}"><button class="sw" data-act="color" title="${escapeHtml(tr("gmRecolor"))}" style="background:${safeColor(g.color)}"></button><input class="gname" value="${escapeHtml(g.name)}" maxlength="40"><span class="n">${counts[g.id]||0}</span><button class="ibtn danger" data-act="del" title="${escapeHtml(tr("gmDelete"))}">${ICON("trash")}</button></div>`).join("")
    +`<div class="grow add"><input class="gname" id="gNewName" placeholder="${escapeHtml(tr("groupsNewPh"))}" maxlength="40"><button class="ibtn primary" id="gAdd">${escapeHtml(tr("groupsAdd"))}</button></div>`;
  body.querySelectorAll(".grow[data-id]").forEach(row=>{
    const g=state.groups.find(x=>x.id===row.dataset.id); if(!g) return;
    const inp=row.querySelector(".gname");
    const commit=()=>{ const v=inp.value.trim(); if(v&&v!==g.name){ g.name=v; save(); renderGroups(); renderPool(); renderTables(); } };
    inp.addEventListener("change",commit); inp.addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Enter"){ e.preventDefault(); commit(); inp.blur(); } });

// Apply what was typed/chosen for seat i. Returns true if the plan changed.

    if(cur){ if(state.guests[cur].name!==v && guestName(cur)!==v){ state.guests[cur].name=v; changed=true; } }   // the row shows the cased form: same text = no rename

function autoSeat(){   // whole invitations first, then families (names sharing a surname inside one colour group), then singles — each chunk goes to the table with its own kind, else the first table with room
  const un=unseatedIds(); if(!un.length){ toast(tr("tNoSeats")); return; }
  const stemsOf={}; const stems=id=>stemsOf[id]||(stemsOf[id]=surnameStems(rawName(id)));
  const chunks=[], seenP=new Set(), rest=[];
  un.forEach(id=>{ const p=state.guests[id].partyId; if(p){ if(!seenP.has(p)){ seenP.add(p); chunks.push({ids:un.filter(x=>state.guests[x].partyId===p), pid:p}); } } else rest.push(id); });
  const parent={}; const find=x=>parent[x]===x?x:(parent[x]=find(parent[x])); rest.forEach(id=>{ parent[id]=id; });
  const byKey={}; rest.forEach(id=>{ const g=state.guests[id].groupId||""; stems(id).forEach(st=>{ const k=g+"|"+st; if(byKey[k]) parent[find(id)]=find(byKey[k]); else byKey[k]=id; }); });
  const fam={}; rest.forEach(id=>{ const r=find(id); (fam[r]=fam[r]||[]).push(id); }); Object.values(fam).forEach(ids=>chunks.push({ids}));
  const tables=state.tables.filter(t=>t.shape!=="head"), freeIdx=t=>t.seats.map((x,i)=>x?null:i).filter(i=>i!=null);
  const seatedP=new Set(); tables.forEach(t=>t.seats.forEach(id=>{ const p=id&&state.guests[id]&&state.guests[id].partyId; if(p) seatedP.add(p); }));
  const home=c=>(c.pid&&seatedP.has(c.pid))?0:1, gkey=c=>String(state.guests[c.ids[0]].groupId||"\uffff");
  chunks.sort((a,b)=>home(a)-home(b)||(b.ids.length-a.ids.length)||gkey(a).localeCompare(gkey(b)));   // the rest of a seated invitation first (its table still has the room), then the bigger chunks (a family needs a whole block), then colour group
  const affinity=(t,c)=>{ const here=t.seats.filter(id=>id&&state.guests[id]); if(!here.length) return 0;
    const g=state.guests[c.ids[0]].groupId||null, cst=new Set(c.ids.flatMap(stems)); let sc=0;
    if(c.pid&&here.some(id=>state.guests[id].partyId===c.pid)) sc+=8;          // the rest of the invitation sits here
    if(here.some(id=>stems(id).some(x=>cst.has(x)))) sc+=4;                       // same surname at this table
    sc+=here.some(id=>(state.guests[id].groupId||null)===g)?2:-3;                 // own colour group here / only strangers

  save(); renderTables(); renderPool(); toast(placed?tr("tAutoSeated",{n:placed}):tr("tNoSeats"));

function mergePlanInto(src, mode){

async function doRecover(st){

  try{ const r=await fetch(SYNC_URL+"/recover/couple",{method:"POST",headers:{"Content-Type":"application/json","X-Client":"2"},body:JSON.stringify({token:st.token, nonce:st.nonce})}); status=r.status; d=await r.json().catch(()=>null); }catch(e){}
  const plans=(d&&Array.isArray(d.plans))?d.plans.filter(x=>x&&PLAN_ID_RE.test(String(x.id))&&x.editKey):[];

  const ro=$("accRotate"); if(ro) ro.onclick=async()=>{ if(!confirm(tr("accRotateConfirm"))) return;
    try{ const r=await fetch(planPath(cur.cloudId)+"/rotate",{method:"POST",headers:authHeaders(cur)}); if(!r.ok) throw 0; const d=await r.json();
      cur.editKey=d.editKey; cur.viewKey=d.readKey; cur.legacyOpenUntil=0; cur.codeOff=true; saveProfilesIdx();
      if(pendingSnap&&pendingSnap.profId===cur.id){ pendingSnap.editKey=cur.editKey; pendingSnap.headers=authHeaders(cur); }
      if(getSyncCode()){ try{ await fetch(codeUrl(),{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:cur.cloudId})}); }catch(x){} }
      await refreshAccess();
      $("accessModal").classList.remove("open"); openCloud(); toast(tr("tRotated"),6000); }
    catch(e){ toast(tr("accFail")); } };
  const es=$("accEmailSave"); if(es) es.onclick=async()=>{ const email=$("accEmailIn").value.trim();
    if(!EMAIL_OK(email)){ toast(tr("recBad")); return; }
    if(email.toLowerCase()===(cur.recEmail||"").toLowerCase()){ toast(tr("accEmailSame")); return; }
    es.disabled=true;
    try{ const r=await fetch(planPath(cur.cloudId)+"/email",{method:"POST",headers:authHeaders(cur),body:JSON.stringify({email, lang:LANG})});
      if(r.status===429||r.status===400){ toast(tr(r.status===429?"recRate":"recBad")); es.disabled=false; return; }
      if(!r.ok){ const d=await r.json().catch(()=>({})); if(d.error==="mail_off"){ toast(tr("recOff"),8000); es.disabled=false; return; } throw 0; }
      const d=await r.json(); toast(tr("tEmailSent",{e:d.pending||email}),8000); }
    catch(e){ toast(tr("accFail")); }
    es.disabled=false; };
  const pv=$("accPreview"); if(pv) pv.onchange=()=>{ cur.previewCouple=pv.checked; saveProfilesIdx(); applyAccess(); renderAll(); toast(pv.checked?tr("tPreviewOn"):tr("tPreviewOff"),3000); };
  const inv=$("accInvite"); if(inv) inv.onclick=async()=>{ inv.disabled=true;
    try{ const r=await fetch(planPath(cur.cloudId)+"/support",{method:"POST",headers:authHeaders(cur),body:JSON.stringify({hours:+$("accHours").value, message:$("accMsg").value.trim()})});
      if(!r.ok) throw 0; const d=await r.json(); cur.supportInfo={expires:d.expires, message:$("accMsg").value.trim()}; saveProfilesIdx(); await refreshAccess(); renderAccessBody(); renderRoleBadge(); toast(tr("tSupportInvited"),5000); }
    catch(e){ inv.disabled=false; toast(tr("accFail")); } };
  const rv=$("accRevoke"); if(rv) rv.onclick=async()=>{ if(!confirm(tr("accRevokeConfirm"))) return;
    try{ const r=await fetch(planPath(cur.cloudId)+"/support",{method:"DELETE",headers:authHeaders(cur)}); if(!r.ok) throw 0;
      cur.supportInfo=null; saveProfilesIdx(); await refreshAccess(); renderAccessBody(); renderRoleBadge(); toast(tr("tSupportEnded")); }
    catch(e){ toast(tr("accFail")); } };
  const ml=$("accMail"); if(ml) ml.href="mailto:info@takeaseat.gr?subject="+encodeURIComponent(tr("accMailSubject",{n:(cur.name||"").replace(/^🛟 /,"")}))+"&body="+encodeURIComponent(tr("accMailBody",{t:fmtTime(cur.supportInfo&&cur.supportInfo.expires)}));
}
$("cloudBtn").addEventListener("click",openCloud);
$("cloudClose").addEventListener("click",()=>$("cloudModal").classList.remove("open"));
$("cloudModal").addEventListener("click",e=>{ if(e.target.id==="cloudModal") e.currentTarget.classList.remove("open"); });

// ============================================================
//  PRINT
// ============================================================
$("printBtn").addEventListener("click",openPrint);
function openPrint(){
  const m=$("printModal"), mode=state.printMode==="parties"?"parties":"names";
  m.querySelectorAll('input[name="pmode"]').forEach(r=>{ r.checked=r.value===mode; }); m.classList.add("open");
}
$("printGo").addEventListener("click",()=>{ const m=$("printModal"); const r=m.querySelector('input[name="pmode"]:checked'); const mode=(r&&r.value==="parties")?"parties":"names";
  if(state.printMode!==mode){ state.printMode=mode; save({noHistory:true}); } m.classList.remove("open"); buildAndPrint(mode); });
$("printClose").addEventListener("click",()=>$("printModal").classList.remove("open"));
function buildAndPrint(mode){
  const area=$("printarea"); const byParties=mode==="parties";
  const legend=state.groups.map(g=>`<span><span class="dot" style="background:${g.color}"></span>${escapeHtml(g.name)}</span>`).join("");
  const cards=state.tables.map(t=>{
    if(byParties){   // one line per invitation at this table (how many of its people sit here), singles by name
      const byP=new Map(), singles=[];
      t.seats.forEach(gid=>{ if(!gid||!state.guests[gid]) return; const p=partyOf(gid); if(p){ if(!byP.has(p.id)) byP.set(p.id,{p,ids:[]}); byP.get(p.id).ids.push(gid); } else singles.push(gid); });
      const lines=[...byP.values()].map(({p,ids})=>{ const tot=partyMembers(p.id).length; return `<li><span class="gdot" style="background:${guestColor(ids[0])}"></span><b>${escapeHtml(caseName(p.name))}</b> <span class="pn">${ids.length}${tot!==ids.length?" / "+tot:""}</span></li>`; })
        .concat(singles.map(gid=>`<li><span class="gdot" style="background:${guestColor(gid)}"></span>${escapeHtml(guestName(gid))} <span class="pn">1</span></li>`));
      const occ=t.seats.filter(Boolean).length;
      return `<div class="pcard"><h3>${escapeHtml(t.label)} <span style="font-weight:400;color:#888;font-size:12px">(${occ}/${t.capacity})</span></h3><ul class="pinvl">${lines.join("")||`<li class="empty">—</li>`}</ul></div>`;
    }
    const rows=t.seats.map(gid=> gid?`<li><span class="gdot" style="background:${guestColor(gid)}"></span>${escapeHtml(guestName(gid))}${STATUS_TXT(gStatus(gid))?` <span style="color:#a00">(${STATUS_TXT(gStatus(gid))})</span>`:""}</li>`:`<li class="empty">${escapeHtml(tr("printEmpty"))}</li>`).join("");
    const occ=t.seats.filter(Boolean).length;
    return `<div class="pcard"><h3>${escapeHtml(t.label)} <span style="font-weight:400;color:#888;font-size:12px">(${occ}/${t.capacity})</span></h3><ol>${rows}</ol></div>`;
  }).join("");
  const un=unseatedIds();
  const unHtml=un.length?`<div class="punassigned"><strong>${escapeHtml(tr("printUnassigned",{n:un.length}))}</strong> ${un.map(id=>escapeHtml(guestName(id))).join(", ")}</div>`:"";
  const tableOf={}; state.tables.forEach(t=>t.seats.forEach(gid=>{ if(gid) tableOf[gid]=t.label; }));
  const parties=(state.parties||[]).map(p=>({p, m:partyMembers(p.id)})).filter(x=>x.m.length).sort((a,b)=>a.p.name.localeCompare(b.p.name));
  const invHtml=(parties.length&&!byParties)?`<h3 class="pinvh">${escapeHtml(tr("printInvites"))}</h3><div class="pinvs">${parties.map(({p,m})=>`<div class="pinv"><b>${escapeHtml(caseName(p.name))}</b> <span class="n">(${m.length})</span><ul>${m.map(id=>`<li>${escapeHtml(guestName(id))}${tableOf[id]?` <span class="ptag">— ${escapeHtml(tableOf[id])}</span>`:` <span class="ptag">— ${escapeHtml(tr("printNoSeat"))}</span>`}</li>`).join("")}</ul></div>`).join("")}</div>`:"";
  const seated=assignedGuestIds().size, totalSeats=state.tables.reduce((s,t)=>s+t.capacity,0);
  area.innerHTML=`<h2>${escapeHtml(tr("printTitle"))}</h2>
    <div class="psub">${escapeHtml(tr("printSub",{t:state.tables.length, s:seated, c:totalSeats}))}</div>
    ${legend?`<div class="plegend">${legend}</div>`:""}
    <div class="ptables">${cards}</div>${unHtml}${invHtml}`;
  window.print();
}

// ============================================================
//  TEXT SIZE + ZOOM
// ============================================================
function setFontScale(v){ fontScale=clamp(v,0.6,2.0); state.seatFontScale=fontScale; save(); renderTables(); toast(tr("tFont",{n:Math.round(fontScale*100)})); }
function setTableFontScale(v){ state.tableFontScale=clamp(v,0.6,2.4); save(); renderTables(); toast(tr("tNumSize",{n:Math.round(state.tableFontScale*100)})); }
function setNameMode(m){ if(!["full","short","initials"].includes(m)) return; state.nameMode=m; save(); renderTables(); }
function setNameCase(m){ if(!["asis","upper","lower"].includes(m)||m===(state.nameCase||"asis")) return; state.nameCase=m; save(); renderTables(); renderPool(); if(focusId!=null) renderFocus(); if(m==="lower") toast(tr("tLowerHint"),4500); }
// The "Aa" view menu: name display · name size · table-number size · zoom — same on PC and phone.
function renderViewMenu(){
  const m=$("viewmenu"); const mode=state.nameMode||"full"; const tfs=state.tableFontScale||1;
  m.innerHTML=`<div class="gm-cap">${escapeHtml(tr("names"))}</div>
    <div class="vrow"><div class="seg" id="vmNames">${["full","short","initials"].map(k=>`<button data-m="${k}" class="${mode===k?"on":""}">${escapeHtml(tr({full:"nm_full",short:"nm_short",initials:"nm_initials"}[k]))}</button>`).join("")}</div></div>
    <div class="gm-cap">${escapeHtml(tr("nameCase"))}</div>
    <div class="vrow"><div class="seg" id="vmCase">${["asis","upper","lower"].map(k=>`<button data-c="${k}" class="${(state.nameCase||"asis")===k?"on":""}">${escapeHtml(tr({asis:"nc_asis",upper:"nc_upper",lower:"nc_lower"}[k]))}</button>`).join("")}</div></div>
    <div class="gm-cap">${escapeHtml(tr("nameSize"))}</div>
    <div class="vrow"><button class="ibtn" data-a="fdown">A−</button><span class="pct">${Math.round(fontScale*100)}%</span><button class="ibtn" data-a="fup">A＋</button></div>
    <div class="gm-cap">${escapeHtml(tr("numSize"))}</div>
    <div class="vrow"><button class="ibtn" data-a="ndown">1−</button><span class="pct">${Math.round(tfs*100)}%</span><button class="ibtn" data-a="nup">1＋</button></div>
    <div class="gm-cap">${escapeHtml(tr("zoomLbl"))}</div>
    <div class="vrow"><button class="ibtn" data-a="zout">−</button><span class="pct">${Math.round(zoom*100)}%</span><button class="ibtn" data-a="zin">＋</button><button class="ibtn" data-a="fit">${escapeHtml(tr("fit"))}</button></div>`;
  m.querySelectorAll("#vmNames button").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); setNameMode(b.dataset.m); renderViewMenu(); });
  m.querySelectorAll("#vmCase button").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); setNameCase(b.dataset.c); renderViewMenu(); });
  m.querySelectorAll("[data-a]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); const a=b.dataset.a;
    if(a==="fdown") setFontScale(fontScale-0.15); else if(a==="fup") setFontScale(fontScale+0.15);
    else if(a==="ndown") setTableFontScale((state.tableFontScale||1)-0.2); else if(a==="nup") setTableFontScale((state.tableFontScale||1)+0.2);
    else if(a==="zout") zoomBy(1/1.2); else if(a==="zin") zoomBy(1.2); else if(a==="fit"){ zoom=clamp(fitZoom(),0.2,2.5); applyZoom(); }
    renderViewMenu(); });
}
function openViewMenu(anchorEl){ const m=$("viewmenu"); if(m.style.display==="block"){ m.style.display="none"; return; } renderViewMenu(); showPopover(m, anchorOf(anchorEl)); }
function fitZoom(){ const b=visibleBox(), n=isNarrow(); return Math.min(1,(b.w-(n?24:60))/state.stage.w,(b.h-(n?34:80))/state.stage.h); }
// Opening view: the 0.5 floor keeps names readable on a desktop; a phone fits the whole space instead.
function initialZoom(){ if(isNarrow()) layoutCanvas(true); return Math.min(1, Math.max(fitZoom(), isNarrow()?0.1:0.5)); }
function applyZoom(){
  layoutCanvas();
  // far view (phones only, overview zoom): one big number per table instead of counters/gear/'+' nobody can read at 16 % — hysteresis so a pinch at the edge doesn't flicker
  const far=document.body.classList.contains("far"); document.body.classList.toggle("far", isNarrow() && (far ? zoom<0.50 : zoom<0.40));
  stage.style.transform=`scale(${zoom})`;
  const m=isNarrow()?12:24, w=(state.stage&&state.stage.w)||1700, h=(state.stage&&state.stage.h)||1360;
  stage.style.margin=`${m}px ${Math.round(m+w*(zoom-1))}px ${Math.round(m+h*(zoom-1))}px ${m}px`;
  $("zoomLabel").textContent=Math.round(zoom*100)+"%";
}
$("zoomIn").addEventListener("click",()=>zoomBy(1.15));
$("zoomOut").addEventListener("click",()=>zoomBy(1/1.15));
$("zoomFit").addEventListener("click",()=>{ zoom=clamp(fitZoom(),0.2,2.5); applyZoom(); });

// ============================================================
//  INIT
// ============================================================
function renderAll(){ renderFeatures(); renderTables(); renderGroups(); renderPool(); updateStats(); }
if(!state.stage) state.stage={w:2100,h:1400};
if(!state.stageMaterial) state.stageMaterial="grass";
applyStage();
const _stageResize=document.createElement("div"); _stageResize.id="stageResize"; _stageResize.title=tr("stageResizeTip");
stage.appendChild(_stageResize); makeStageResizable(_stageResize);
initFloorSelect(); initDecor(); renderProfiles();
applyAccess(); renderAll(); resetHistory();
setTimeout(()=>{ zoom=initialZoom(); applyZoom(); },50);
// Turn each SVG texture into a plain bitmap once (canvas → JPEG data URI). Browsers re-render the SVG noise
// filters at every zoom step, which is what made pinch-zoom crawl on phones; a bitmap just gets resampled.
function rasterizeMaterials(){
  const dpr=Math.min(2, window.devicePixelRatio||1); let pending=0;
  const done=()=>{ if(--pending===0){ applyStage(); renderFeatures(); } };
  Object.keys(MATERIALS).forEach(k=>{
    const m=MATERIALS[k]; const uri=m.img.slice(5,-2); const [w,h]=m.size.split(" ").map(parseFloat);
    const img=new Image(); pending++;
    img.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); m.img='url("'+c.toDataURL("image/jpeg",0.86)+'")'; }catch(e){} done(); };
    img.onerror=done; img.src=uri;
  });
}
setTimeout(rasterizeMaterials, 0);
// ☁ open a shared link if present, otherwise refresh the active profile from the cloud (the lab never talks to the cloud)
if(!IS_LAB){ const p0=currentProfile(); if(loadError && p0 && p0.cloudId) toast(tr("cLocalErr",{e:loadError}),7000); }
if(!IS_LAB) (async()=>{ if(!(await openSharedFromURL())) await pullIfNewer(); if(getSyncCode()) await syncFromCode(); startCloudPoll(); maybeWelcome(); })();
else maybeWelcome();
</script>
