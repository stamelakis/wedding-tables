<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<script>
// Access gate: on the live domain the planner isn't a free public tool. Allow only an
// invite/plan link (?plan=), a signed-in venue, or a returning couple (a cloud-linked
// local profile). Everyone else is sent to the marketing home page. Runs before render.
// The lab build (lab.html) is a sandbox and is never gated.
(function(){
  if("lab"==="lab") return;
  if(location.hostname.endsWith("github.io")){ location.replace("https://takeaseat.gr"+location.pathname+location.search+location.hash); return; }
  if(!/(^|\.)takeaseat\.gr$/i.test(location.hostname)) return;   // only gate the live product
  try{
    if(new URLSearchParams(location.search).get("plan")) return;              // has a plan/couple link
    if(localStorage.getItem("weddingVenueKey")) return;                       // signed-in venue
    var idx=JSON.parse(localStorage.getItem("weddingSeatingPlanner.profiles")||"null");
    if(idx&&idx.profiles&&idx.profiles.some(function(x){return x.cloudId;})) return;  // returning couple
  }catch(e){ return; }
  location.replace("/");
})();
</script>
<title>TakeaSeat Lab 🧪</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --paper:#f6f2ec; --paper-2:#ece6dc; --card:#fffdfa; --ink:#241f1a; --soft:#6b6259; --faint:#9a9084;
    --line:#e6ddd2; --line-2:#d5cabc;
    --accent:#7d5a8c; --accent-ink:#5c3f68; --accent-soft:#efe6f2; --gold:#b58a3c;
    --danger:#c0392b; --good:#3f7a52; --seat-neutral:#7e6d5f;
    --shadow-1:0 1px 2px rgba(40,30,20,.06),0 6px 18px rgba(40,30,20,.08);
    --shadow-2:0 10px 30px rgba(40,30,20,.2);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --appbar-h:52px; --sidebar-w:316px; --focus-w:330px; --sheet-h:46vh;
  }
  html,body{ height:100%; }
  body{ font-family:var(--sans); color:var(--ink); background:var(--paper-2); height:100vh; overflow:hidden; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  input,textarea,select{ background:var(--card); }

  /* ---------- App bar ---------- */
  #appbar{ height:var(--appbar-h); flex:none; display:flex; align-items:center; gap:8px; padding:0 12px; background:rgba(255,253,250,.97); border-bottom:1px solid var(--line); z-index:30; position:relative; }
  .brand{ font-family:var(--serif); font-weight:700; font-size:19px; letter-spacing:-.01em; white-space:nowrap; }
  .brand em{ color:var(--accent); font-style:normal; }
  .planpick{ display:flex; gap:4px; align-items:center; min-width:0; }
  .planpick select{ max-width:220px; min-width:110px; height:32px; padding:0 8px; border:1px solid var(--line); border-radius:9px; font-weight:600; font-size:13px; }
  body.mode-lab #cloudBtn{ display:none; }   /* the lab is local-only: no cloud, no share links */
  .ibtn{ height:32px; min-width:32px; padding:0 9px; border:1px solid var(--line); background:var(--card); border-radius:9px; cursor:pointer; font-size:14px; line-height:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; transition:background .12s,border-color .12s,color .12s; }
  .ibtn:hover{ background:var(--paper); border-color:var(--line-2); }
  .ibtn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .ibtn.primary:hover{ background:var(--accent-ink); border-color:var(--accent-ink); }
  .ibtn.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
  .ibtn.danger{ color:var(--danger); }
  .ibtn:disabled{ opacity:.5; cursor:default; }
  .stat{ font-size:12.5px; color:var(--faint); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .spacer{ flex:1; }
  .ctl{ display:inline-flex; align-items:center; gap:3px; }
  .ctl .lbl{ font-size:11px; color:var(--faint); padding:0 4px; min-width:38px; text-align:center; }
  .langsel{ display:inline-flex; gap:2px; }
  .langsel a{ font-size:11px; font-weight:700; color:var(--faint); text-decoration:none; padding:4px 6px; border-radius:6px; }
  .langsel a:hover{ background:var(--paper); color:var(--ink); }
  .langsel a.on{ color:var(--accent-ink); background:var(--accent-soft); }
  #labBadge{ display:none; font-size:11px; font-weight:700; background:#fff3c4; color:#7a5a00; border:1px solid #f0d78a; border-radius:20px; padding:3px 9px; white-space:nowrap; cursor:help; }
  body.mode-lab #labBadge{ display:inline-block; }
  body.mode-lab #langsel{ display:none; }
  #navBtn{ display:none; }

  /* ---------- Main layout ---------- */
  #main{ flex:1; display:flex; min-height:0; position:relative; }
  #sidebar{ width:var(--sidebar-w); flex:none; background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .side-scroll{ flex:1; overflow-y:auto; min-height:0; overscroll-behavior:contain; }
  .sec{ padding:12px 14px 12px; border-bottom:1px solid var(--line); }
  .sec:last-child{ border-bottom:none; }
  .sec-title{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .sec-title .cnt{ font-weight:600; color:var(--soft); text-transform:none; letter-spacing:0; margin-left:auto; }
  .tools{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .tools .ibtn{ height:36px; font-size:12.5px; justify-content:flex-start; padding:0 10px; }
  .floorrow{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--soft); }
  .floorrow select{ flex:1; height:32px; padding:0 8px; border:1px solid var(--line); border-radius:8px; font-size:12.5px; }
  .search{ position:relative; margin-bottom:8px; }
  .search input{ width:100%; height:36px; padding:0 30px 0 32px; border:1px solid var(--line); border-radius:10px; background:var(--paper); font-size:13.5px; }
  .search input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:#fff; }
  .search .ico{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:13px; pointer-events:none; }
  .search .clr{ position:absolute; right:4px; top:50%; transform:translateY(-50%); border:none; background:none; color:var(--faint); cursor:pointer; font-size:14px; padding:6px; display:none; }
  .search.has .clr{ display:block; }
  .chips{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
  .chip{ display:inline-flex; align-items:center; gap:5px; padding:4px 9px 4px 7px; border-radius:20px; border:1.5px solid var(--line); background:var(--card); cursor:pointer; font-size:12px; user-select:none; touch-action:manipulation; transition:background .1s,border-color .1s; }
  .chip:hover{ background:var(--paper); }
  .chip.active{ border-color:var(--ink); background:var(--paper); }
  .chip .dot{ width:11px; height:11px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); }
  .chip .n{ color:var(--faint); font-size:11px; }
  .chip.add{ border-style:dashed; color:var(--soft); }
  .chip .gmore{ margin-left:2px; color:var(--faint); font-weight:700; padding:0 2px; }
  #pool{ display:flex; flex-direction:column; gap:5px; min-height:44px; }
  #pool.dragover{ outline:2px dashed var(--accent); outline-offset:-4px; border-radius:10px; background:var(--accent-soft); }
  .gchip{ display:flex; align-items:center; gap:8px; padding:7px 6px 7px 10px; border-radius:10px; background:var(--paper); border:1px solid var(--line); border-left:5px solid #ccc; cursor:grab; user-select:none; font-size:13px; transition:box-shadow .12s,background .12s; }
  .gchip:hover{ box-shadow:var(--shadow-1); background:#fff; }
  .gchip:active{ cursor:grabbing; }
  .gchip .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gchip .acts{ display:flex; gap:0; opacity:0; transition:opacity .12s; }
  .gchip:hover .acts, .gchip.picked .acts, body.touch .gchip .acts{ opacity:1; }
  .gchip .acts button{ border:none; background:none; color:var(--faint); cursor:pointer; font-size:13px; padding:4px 6px; border-radius:6px; line-height:1; }
  .gchip .acts button:hover{ background:var(--card); color:var(--ink); }
  .gchip .acts .x:hover{ color:var(--danger); }
  .gchip.picked{ outline:2px solid var(--accent); outline-offset:1px; background:var(--accent-soft); }
  .stag{ font-size:9.5px; color:#a0692b; background:#fff4e6; border:1px solid #f0d9bf; border-radius:6px; padding:0 4px; margin-left:5px; vertical-align:middle; }
  .stag.cut{ color:#b03535; background:#fdeaea; border-color:#f2c7c7; }
  .empty-note{ font-size:12.5px; color:var(--faint); padding:14px 6px; text-align:center; line-height:1.5; }
  details.addnames{ margin-top:10px; }
  details.addnames summary{ cursor:pointer; font-size:12.5px; font-weight:700; color:var(--accent-ink); list-style:none; display:flex; align-items:center; gap:6px; padding:6px 0; }
  details.addnames summary::-webkit-details-marker{ display:none; }
  details.addnames summary::before{ content:"▸"; font-size:11px; transition:transform .15s; }
  details.addnames[open] summary::before{ transform:rotate(90deg); }
  details.addnames textarea{ width:100%; height:74px; resize:vertical; padding:8px 10px; font-size:13px; border:1px solid var(--line); border-radius:9px; margin-top:4px; background:var(--paper); line-height:1.4; }
  details.addnames textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:#fff; }
  details.addnames .hint{ font-size:11px; color:var(--faint); margin:4px 0 7px; }

  /* ---------- Stage ---------- */
  #stagewrap{ flex:1; position:relative; overflow:auto; background:var(--paper-2); background-image:radial-gradient(rgba(60,40,20,.09) 1px,transparent 1.2px); background-size:22px 22px; touch-action:pan-x pan-y; }
  #stage{ position:relative; width:1700px; height:1360px; margin:24px; border-radius:14px; transform-origin:top left; box-shadow:0 2px 4px rgba(0,0,0,.12),0 24px 60px rgba(40,30,20,.22),inset 0 0 0 1px rgba(0,0,0,.14); }
  #stage::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:2; background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(20,20,10,.16) 100%); }
  .feature.k-prop, .feature.k-marker, .feature.k-label{ z-index:3; }   /* cards float above the vignette; floor zones sit under it like the ground */

  .feature{ position:absolute; font-size:12px; color:#fff; font-weight:600; display:flex; align-items:center; justify-content:center; text-align:center; transform:translate(-50%,-50%); border-radius:8px; padding:2px 4px; line-height:1.15; cursor:grab; user-select:none; z-index:1; }
  .feature:active{ cursor:grabbing; }
  .feature .rz{ position:absolute; right:-6px; bottom:-6px; width:16px; height:16px; background:#fff; border:1px solid #8a7f72; border-radius:4px; cursor:nwse-resize; display:none; z-index:3; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .feature:hover .rz{ display:block; }
  .rot-h{ position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; border:1px solid #8a7f72; cursor:grab; display:none; z-index:4; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .rot-h:active{ cursor:grabbing; }
  .rot-h::after{ content:"⟳"; font-size:12px; color:#666; display:flex; align-items:center; justify-content:center; height:100%; }
  .feature:hover .rot-h, .table:hover .rot-h, .table.focused .rot-h{ display:block; }
  .feature.k-zone{ border-radius:10px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),inset 0 0 40px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.14); }
  .feature.k-zone .zlabel{ font-family:var(--serif); font-size:16px; letter-spacing:.04em; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.6); background:rgba(0,0,0,.24); padding:3px 11px; border-radius:20px; pointer-events:none; }
  .feature.k-marker{ background:#2a2622; color:#fff; box-shadow:0 3px 8px rgba(0,0,0,.3); border-radius:8px; letter-spacing:.04em; }
  .feature.k-label{ background:rgba(255,253,250,.93); color:var(--ink); font-family:var(--serif); font-weight:600; font-size:13px; letter-spacing:.02em; box-shadow:0 2px 6px rgba(0,0,0,.16); border-radius:20px; }
  .feature.k-prop{ background:linear-gradient(180deg,#fffdf9,#f3ece2); color:var(--ink); border:1px solid rgba(120,90,60,.3); box-shadow:0 4px 10px rgba(0,0,0,.18),inset 0 1px 0 #fff; flex-direction:column; gap:2px; padding:4px; border-radius:10px; }
  .feature.k-prop .picon{ font-size:24px; line-height:1; pointer-events:none; filter:drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
  .feature.k-prop .plabel{ font-size:11px; color:var(--soft); font-weight:600; pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .feat-gear{ position:absolute; left:-9px; top:-9px; width:22px; height:22px; border-radius:50%; background:#fff; border:1px solid var(--line-2); box-shadow:0 1px 4px rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; z-index:3; touch-action:manipulation; }

  /* ---------- Tables & seats ---------- */
  .table{ position:absolute; z-index:5; }
  .table-disc{ position:absolute; left:0; top:0; border-radius:50%; background:radial-gradient(circle at 38% 32%,#fffefc 0%,#f6f1e9 55%,#e8e0d3 100%); border:1px solid rgba(110,85,60,.3); box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 18px rgba(30,20,10,.22),0 2px 4px rgba(30,20,10,.12); display:flex; align-items:center; justify-content:center; flex-direction:column; transform:translate(-50%,-50%); cursor:grab; transition:box-shadow .15s; }
  .table-disc::before{ content:""; position:absolute; inset:-5px; border-radius:inherit; border:1px solid rgba(255,255,255,.6); box-shadow:0 0 0 4px rgba(255,255,255,.2); pointer-events:none; }
  .table-disc.head{ border-radius:14px; background:linear-gradient(180deg,#fffaf1 0%,#f6ecd9 100%); border:1.5px solid #cdb07a; }
  .table-disc:active{ cursor:grabbing; }
  .table:hover .table-disc{ box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 26px rgba(30,20,10,.28),0 2px 4px rgba(30,20,10,.12); }
  .table.focused .table-disc{ box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 26px rgba(30,20,10,.3); }
  /* focus ring drawn around the WHOLE table (seats included) — --frx/--fry are set per table in renderTables */
  .table.focused::before{ content:""; position:absolute; left:calc(-1*var(--frx,120px)); top:calc(-1*var(--fry,90px)); width:calc(2*var(--frx,120px)); height:calc(2*var(--fry,90px)); border-radius:50%; border:2px solid var(--accent); box-shadow:0 0 0 5px rgba(125,90,140,.16), inset 0 0 0 60px rgba(255,255,255,.08); pointer-events:none; z-index:0; }
  .table-disc .tnum{ font-family:var(--serif); font-size:17px; font-weight:700; color:var(--accent-ink); text-align:center; padding:0 6px; line-height:1.1; }
  .table-disc.head .tnum{ font-size:14px; }
  .table-disc .tcount{ font-size:10px; color:var(--faint); margin-top:2px; font-weight:600; letter-spacing:.02em; }
  .table-disc .tgear{ position:absolute; top:2px; right:6px; font-size:12px; color:var(--faint); cursor:pointer; display:none; padding:2px; }
  .table:hover .tgear, .table.focused .tgear{ display:block; }
  .seat{ position:absolute; transform:translate(-50%,-50%); border:1.5px dashed rgba(90,70,50,.5); background:rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center; color:rgba(90,70,50,.75); text-align:center; overflow:hidden; cursor:pointer; user-select:none; transition:background .1s,border-color .1s; box-shadow:0 1px 2px rgba(0,0,0,.1); }
  .seat:hover{ background:rgba(255,255,255,.95); border-color:var(--accent); }
  .seat.occupied{ border-style:solid; border-color:transparent; color:#fff; font-weight:700; cursor:grab; box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.12),0 3px 7px rgba(0,0,0,.25); text-shadow:0 1px 1px rgba(0,0,0,.25); }
  .seat.occupied:active{ cursor:grabbing; }
  .seat.dragover{ background:#fff !important; border-color:var(--accent) !important; border-style:solid !important; color:var(--accent-ink) !important; }
  .seat .nm{ padding:0 5px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .table.focused .seat.sel{ box-shadow:0 0 0 3px #fff,0 0 0 5px var(--accent); }
  body.picking .seat:not(.occupied){ border-color:var(--accent); border-style:solid; background:rgba(255,255,255,.92); animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(125,90,140,.55); } 50%{ box-shadow:0 0 0 7px rgba(125,90,140,0); } }
  #stageResize{ position:absolute; right:-4px; bottom:-4px; width:26px; height:26px; background:var(--accent); border:2px solid #fff; border-radius:7px; cursor:nwse-resize; z-index:8; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  #stageResize::after{ content:"⤡"; color:#fff; font-size:15px; display:flex; align-items:center; justify-content:center; height:100%; }

  /* ---------- Focus panel (table sheet) ---------- */
  #focus{ width:var(--focus-w); flex:none; background:var(--card); border-left:1px solid var(--line); display:none; flex-direction:column; min-height:0; }
  body.focused #focus{ display:flex; }
  .fhandle{ display:none; width:100%; height:24px; padding:9px 0 0; cursor:pointer; flex:none; touch-action:manipulation; }
  .fhandle::before{ content:""; display:block; width:44px; height:5px; border-radius:3px; background:var(--line-2); margin:0 auto; }
  .fhead{ display:flex; align-items:center; gap:5px; padding:10px 10px 8px; border-bottom:1px solid var(--line); flex:none; }
  .fhead .ftitle{ flex:1; min-width:0; padding:0 2px; }
  .fhead .ftitle b{ font-family:var(--serif); font-size:18px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.35; cursor:pointer; }
  .fhead .ftitle span{ font-size:12px; color:var(--faint); }
  .fhint{ font-size:12px; color:var(--faint); padding:8px 14px 4px; line-height:1.4; flex:none; }
  #fSeats{ flex:1; overflow-y:auto; padding:6px 10px 10px; min-height:0; overscroll-behavior:contain; }
  .frow{ display:flex; align-items:center; gap:6px; padding:3px 0; }
  .frow .fn{ width:22px; text-align:right; font-size:11px; color:var(--faint); font-weight:700; flex:none; }
  .frow .fdot{ width:24px; height:24px; padding:4px; border:none; border-radius:50%; flex:none; background:#e2ddd5; background-clip:content-box; cursor:pointer; box-shadow:none; position:relative; }
  .frow .fdot::after{ content:""; position:absolute; inset:4px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
  .frow .fdot.empty{ opacity:.45; }
  .frow .fdot:hover{ transform:scale(1.1); }
  /* groups manager */
  .grow{ display:flex; align-items:center; gap:8px; padding:5px 0; }
  .grow .sw{ width:32px; height:32px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line-2); cursor:pointer; flex:none; padding:0; }
  .grow .gname{ flex:1; min-width:0; height:36px; padding:0 10px; border:1px solid var(--line); border-radius:9px; font-size:14px; }
  .grow .n{ font-size:12px; color:var(--faint); min-width:26px; text-align:right; font-variant-numeric:tabular-nums; }
  .grow.add{ border-top:1px solid var(--line); margin-top:8px; padding-top:12px; }
  #palette, #groupmenu{ z-index:320; }   /* may open from inside a modal (300) — must sit above it */
  #palette{ width:auto; padding:6px; }
  .pal{ display:grid; grid-template-columns:repeat(5,34px); gap:6px; padding:4px; }
  .psw{ width:34px; height:34px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line-2); cursor:pointer; padding:0; }
  .psw.on{ box-shadow:0 0 0 2px var(--accent); }
  .frow input{ flex:1; min-width:0; height:36px; padding:0 10px; border:1px solid var(--line); border-radius:9px; background:var(--paper); font-size:13.5px; }
  .frow input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:#fff; }
  .frow.occ input{ background:#fff; font-weight:600; }
  .frow .fx{ border:none; background:none; color:var(--faint); cursor:pointer; font-size:14px; padding:4px; border-radius:6px; width:26px; flex:none; visibility:hidden; }
  .frow.occ .fx{ visibility:visible; }
  .frow .fx:hover{ color:var(--danger); background:var(--paper); }
  .fsug{ margin:2px 0 6px 40px; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-1); overflow:hidden; }
  .fsug div{ padding:8px 10px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .fsug div .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .fsug div:hover, .fsug div.sel{ background:var(--accent-soft); }
  .fsug div.new{ color:var(--accent-ink); font-weight:600; }
  .fsug div.more{ color:var(--faint); font-size:11.5px; cursor:default; padding-top:4px; }
  .ffoot{ padding:8px 10px; border-top:1px solid var(--line); display:flex; gap:6px; flex:none; }
  .ffoot .ibtn{ flex:1; height:36px; font-size:12.5px; }

  /* ---------- Mobile bar · pick bar · drawer ---------- */
  #mobilebar{ display:none; position:fixed; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom)); z-index:120; gap:5px; }
  #mobilebar .ibtn{ height:46px; flex:1; background:rgba(255,253,250,.97); box-shadow:var(--shadow-2); font-size:13.5px; font-weight:600; border-radius:14px; }
  #mobilebar .ibtn.sq{ flex:0 0 44px; font-size:18px; padding:0; }
  #mobilebar .ibtn b{ background:var(--accent); color:#fff; border-radius:20px; padding:2px 8px; font-size:11px; }
  @media (max-width:430px){ #mobilebar #mbGuests span{ display:none; } }
  #navScrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:140; }
  #pickbar{ display:none; position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:210; background:#2a2622; color:#fff; border-radius:999px; padding:6px 7px 6px 16px; font-size:13px; align-items:center; gap:8px; box-shadow:0 8px 26px rgba(0,0,0,.35); max-width:95vw; }
  body.picking #pickbar{ display:flex; }
  body.picking .toast{ bottom:70px; }
  #pickbar .pbname{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:36vw; }
  #pickbar .pbhint{ color:#c9c2b8; white-space:nowrap; }
  #pickbar button{ border:none; background:rgba(255,255,255,.14); color:#fff; border-radius:999px; padding:7px 12px; font-size:12px; cursor:pointer; white-space:nowrap; }
  #pickbar button:hover{ background:rgba(255,255,255,.28); }
  .gchip, .seat, .chip, button, .fsug div, .frow, .gm-item, #pickbar, #focus, .fhead{ touch-action:manipulation; }
  .table-disc, .feature, .rz, .rot-h, #stageResize{ touch-action:none; }
  /* touch: a finger on a table or decor PANS the floor; a HELD finger (long-press) lifts it to move — see makeDraggable */
  body.touch .table-disc, body.touch .feature{ touch-action:pan-x pan-y; }
  /* touch: cheaper paint — no soft shadows on 300 pills, no drape ring, no dotted paper */
  body.touch .seat.occupied{ box-shadow:0 1px 3px rgba(0,0,0,.28); text-shadow:none; }
  body.touch .table-disc{ box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 3px 8px rgba(30,20,10,.22); }
  body.touch .table-disc::before{ display:none; }
  body.touch #stage{ box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 8px 24px rgba(40,30,20,.2); }
  body.touch #stagewrap{ background-image:none; }
  .table-disc .tnum{ font-size:calc(17px * var(--tfs,1)); }
  .table-disc.head .tnum{ font-size:calc(14px * var(--tfs,1)); }

  /* ---------- Popovers & modals ---------- */
  .popover{ position:fixed; z-index:250; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-2); padding:8px; font-size:13px; display:none; }
  .gm-item{ display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .gm-item:hover{ background:var(--paper); }
  .gm-item .dot{ width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); flex:none; }
  .gm-item.danger{ color:var(--danger); }
  .gm-item.on{ background:var(--accent-soft); color:var(--accent-ink); font-weight:600; }
  /* view menu (names · sizes · zoom) */
  #viewmenu{ width:256px; padding:8px; }
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button{ height:32px; padding:0 11px; border:none; background:var(--card); cursor:pointer; font-size:12.5px; border-left:1px solid var(--line); }
  .seg button:first-child{ border-left:none; }
  .seg button.on{ background:var(--accent); color:#fff; }
  .vrow{ display:flex; align-items:center; gap:6px; padding:2px 6px 8px; }
  .vrow .pct{ min-width:44px; text-align:center; font-size:12px; color:var(--soft); font-variant-numeric:tabular-nums; }
  /* an object lifted by a long-press (touch) or grabbed with the mouse */
  .lifted{ z-index:9 !important; }
  .table.lifted .table-disc{ box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent),0 18px 40px rgba(30,20,10,.38); }
  .feature.lifted{ outline:3px solid var(--accent); box-shadow:0 18px 40px rgba(30,20,10,.38); }
  body.zooming #stage{ will-change:transform; }
  .gm-item .n{ margin-left:auto; color:var(--faint); font-size:11.5px; padding-left:10px; }
  .gm-sep{ height:1px; background:var(--line); margin:4px 2px; }
  .gm-cap{ font-size:11px; color:var(--faint); padding:4px 9px 6px; letter-spacing:.04em; text-transform:uppercase; font-weight:700; }
  #tablemenu{ width:236px; padding:12px; }
  #tablemenu h3{ font-size:13.5px; margin-bottom:8px; font-family:var(--serif); }
  #tablemenu .row{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  #tablemenu label{ font-size:11.5px; color:var(--soft); }
  #tablemenu input[type=text]{ width:100%; height:34px; padding:0 9px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  #tablemenu .caps{ display:flex; gap:5px; flex-wrap:wrap; }
  #tablemenu .caps button{ height:30px; padding:0 10px; border:1px solid var(--line); background:var(--card); border-radius:7px; cursor:pointer; font-size:12.5px; }
  #tablemenu .caps button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  #tablemenu input[type=number]{ width:58px; height:30px; padding:0 6px; border:1px solid var(--line); border-radius:7px; }
  #tablemenu .menu-actions{ display:flex; gap:6px; margin-top:6px; }
  #tablemenu .menu-actions .ibtn{ flex:1; height:34px; font-size:12.5px; }
  #groupmenu, #profilemenu, #moremenu, #fillmenu{ min-width:190px; padding:6px; }
  #guesteditor{ width:236px; padding:10px; }
  #guesteditor .ge-name{ width:100%; height:36px; padding:0 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; font-size:14px; }
  #guesteditor .ge-lab{ font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin:0 2px 5px; font-weight:700; }
  #guesteditor .ge-types{ display:flex; flex-direction:column; gap:2px; max-height:220px; overflow:auto; }
  #guesteditor .ge-type{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  #guesteditor .ge-type:hover{ background:var(--paper); }
  #guesteditor .ge-type.sel{ background:var(--accent-soft); font-weight:600; }
  #guesteditor .ge-type .dot{ width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); flex:none; }
  #guesteditor .ge-type .chk{ margin-left:auto; color:var(--good); font-weight:700; }
  #featuremenu{ width:230px; padding:8px; }
  #featuremenu .fm-mats{ display:flex; flex-wrap:wrap; gap:6px; margin:0 6px 8px; }
  #featuremenu .fm-mat{ cursor:pointer; border-radius:7px; padding:2px; border:2px solid transparent; }
  #featuremenu .fm-mat:hover, #featuremenu .fm-mat.on{ border-color:var(--accent); }
  #featuremenu .fm-mat .sw{ display:block; width:32px; height:24px; border-radius:4px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.2); }
  .modal-back{ position:fixed; inset:0; background:rgba(30,20,10,.45); display:none; align-items:center; justify-content:center; z-index:300; backdrop-filter:blur(2px); }
  .modal-back.open{ display:flex; }
  .modal{ background:var(--card); border-radius:16px; width:min(620px,94vw); max-height:84vh; overflow:auto; box-shadow:0 30px 80px rgba(0,0,0,.35); }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card); z-index:1; }
  .modal-head strong{ font-size:15px; font-family:var(--serif); }
  .modal-head .mx{ border:none; background:none; font-size:20px; cursor:pointer; color:var(--faint); line-height:1; }
  .modal .mhint{ padding:10px 16px 0; font-size:12.5px; color:var(--soft); line-height:1.45; }
  .modal .mbody{ padding:12px 16px 16px; }
  .modal textarea, .modal input[type=text], .modal input:not([type]){ width:100%; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--paper); }
  .modal textarea{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; resize:vertical; }
  .mrow{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .mrow .ibtn{ flex:1; min-width:120px; height:38px; }
  .hist{ display:flex; flex-direction:column; gap:6px; padding:10px 16px 16px; }
  .hrow{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; }
  .hrow>div{ flex:1; min-width:0; }
  .hrow .muted{ font-size:12px; color:var(--faint); }
  .decor-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px; padding:16px; }
  .decor-item{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 8px; border:1px solid var(--line); border-radius:12px; cursor:pointer; text-align:center; font-size:12px; background:var(--card); transition:.1s; }
  .decor-item:hover{ background:var(--paper); border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-1); }
  .decor-item .di{ font-size:28px; line-height:1; }
  /* ---------- Guided tour ---------- */
  #tour{ position:fixed; inset:0; z-index:500; }
  #tour[hidden]{ display:none; }
  #tourBack{ position:absolute; inset:0; }
  #tourSpot{ position:fixed; border-radius:12px; box-shadow:0 0 0 9999px rgba(20,14,10,.62); outline:2px solid rgba(255,255,255,.95); pointer-events:none; transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease; z-index:1; }
  #tourCard{ position:fixed; z-index:2; background:var(--card); border-radius:16px; padding:16px 18px 14px; box-shadow:0 20px 60px rgba(0,0,0,.45); max-width:400px; }
  #tourCard .tour-step{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:700; }
  #tourCard h3{ font-family:var(--serif); font-size:20px; margin:4px 0 8px; line-height:1.2; }
  #tourCard p{ font-size:14px; line-height:1.5; color:var(--soft); margin:0 0 14px; }
  #tourCard p b{ color:var(--ink); }
  .tour-btns{ display:flex; gap:8px; align-items:center; }
  .tour-btns .ibtn{ height:38px; }
  .tour-btns .spacer{ flex:1; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2a2622; color:#fff; padding:9px 16px; border-radius:10px; font-size:13px; opacity:0; transition:.3s; z-index:400; pointer-events:none; max-width:92vw; text-align:center; }
  .toast.show{ opacity:.96; }

  /* ---------- Mobile ---------- */
  @media (max-width:1180px){ #appbar .stat{ display:none; } }
  @supports (height:1dvh){ :root{ --sheet-h:46dvh; } }
  @media (max-width:900px){
    body{ height:100dvh; }
    #appbar{ padding:0 8px; gap:6px; }
    #appbar .brand, #appbar .stat, #appbar .ctl.font, #appbar #printBtn, #appbar .langsel{ display:none; }
    #appbar .ctl.zoom .lbl, #appbar #zoomIn, #appbar #zoomOut{ display:none; }
    #labBadge{ font-size:10px; padding:2px 7px; }
    #navBtn{ display:inline-flex; }
    .planpick{ flex:1; }
    .planpick select{ max-width:none; width:100%; min-width:90px; }
    #profNew, #profMore, #zoomFit{ display:none; }
    /* iOS zooms the page when a focused field is under 16px — keep every field at 16px on phones */
    input, select, textarea{ font-size:16px !important; }
    /* the guest drawer must sit above the seat sheet (160) so the pool stays reachable while a table is open */
    #sidebar{ position:fixed; left:0; top:0; bottom:0; width:88vw; max-width:360px; z-index:180; transform:translateX(-100%); transition:transform .22s ease; box-shadow:0 0 40px rgba(0,0,0,.3); }
    #navScrim{ z-index:170; }
    body.nav-open #sidebar{ transform:none; }
    body.nav-open #navScrim{ display:block; }
    .side-scroll{ padding-bottom:env(safe-area-inset-bottom); }
    #stagewrap{ padding-bottom:calc(90px + env(safe-area-inset-bottom)); }
    body.focused #stagewrap{ padding-bottom:calc(var(--sheet-h) + 60px); }   /* room to scroll a low table above the sheet */
    #stage{ margin:12px; }
    #mobilebar{ display:flex; }
    body.focused #mobilebar, body.picking #mobilebar{ display:none; }
    #focus{ position:fixed; left:0; right:0; bottom:0; height:var(--sheet-h); width:auto; border-left:none; border-top:1px solid var(--line); border-radius:18px 18px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.25); z-index:160; transition:height .2s; padding-bottom:env(safe-area-inset-bottom); }
    #focus.tall{ height:88vh; height:min(88dvh, calc(100dvh - var(--appbar-h))); }
    .fhandle{ display:block; }
    .fhint{ display:none; }
    .modal{ width:96vw; max-height:88vh; }
    .decor-grid{ grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; padding:12px; }
    #pickbar{ bottom:calc(14px + env(safe-area-inset-bottom)); }
    #pickbar .pbhint{ display:none; }
    #pickbar .pbname{ max-width:none; flex:1; }
    body.focused #pickbar{ bottom:calc(var(--sheet-h) + 10px); }
    .toast{ bottom:calc(70px + env(safe-area-inset-bottom)); }
    body.focused .toast, body.picking .toast{ bottom:calc(var(--sheet-h) + 12px); }
    body.touch .feature .rz, body.touch .feature .rot-h{ display:block; }   /* no hover on touch — show decor handles */
    .ibtn{ height:36px; min-width:36px; }
    .tools .ibtn{ height:40px; }
    .gchip{ padding:9px 6px 9px 10px; }
  }
  @media (max-width:420px){ #zoomFit{ padding:0 7px; font-size:12px; } }

  /* ---------- Table chooser (overview ⇄ one table): a column right of the floor on PC, under the floor on phones.
     The right side is always "tables": this list when nothing is selected, the seat list when a table is. ---------- */
  #tablestrip{ display:flex; flex-direction:column; flex:none; width:176px; min-height:0; background:var(--card); border-left:1px solid var(--line); }
  body.focused #tablestrip{ display:none; }
  body.strip-collapsed .ts-grid{ display:none; }
  body.strip-collapsed #tablestrip{ width:auto; }
  .ts-head{ display:flex; align-items:center; gap:6px; padding:8px 10px; flex:none; flex-wrap:wrap; }
  .ts-head .ts-title{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); }
  .ts-head .ts-cnt{ font-size:12px; color:var(--soft); margin-right:auto; font-variant-numeric:tabular-nums; }
  .ts-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:6px; padding:0 10px 10px; overflow-y:auto; overscroll-behavior:contain; }
  .ts-chip{ border:1px solid var(--line); border-radius:10px; padding:6px 4px 5px; text-align:center; background:var(--paper); cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; transition:background .1s,border-color .1s; }
  .ts-chip:hover{ border-color:var(--accent); background:#fff; }
  .ts-chip:active{ background:var(--accent-soft); }
  .ts-chip .lbl{ font-family:var(--serif); font-weight:700; font-size:16px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ts-chip .occ{ font-size:10.5px; color:var(--faint); margin-top:1px; font-variant-numeric:tabular-nums; }
  .ts-chip .bar{ height:3px; border-radius:2px; background:var(--line); margin-top:4px; overflow:hidden; }
  .ts-chip .bar i{ display:block; height:100%; background:var(--accent); }
  .ts-chip.full .bar i{ background:var(--good); }
  @media (max-width:900px){
    #main{ flex-direction:column; }
    /* overview: the canvas is sized to the fitted floor (layoutCanvas) and the list takes the rest;
       zoomed in: the canvas grows and the list shrinks to a strip */
    #tablestrip{ flex:1 1 auto; width:auto; border-left:none; border-top:1px solid var(--line); padding-bottom:calc(58px + env(safe-area-inset-bottom)); }
    body.strip-collapsed #tablestrip{ width:auto; }
    body.zoomed #tablestrip{ flex:0 1 auto; max-height:26vh; }
    body.zoomed #stagewrap{ flex:1 1 auto; }
    body.picking #tablestrip{ display:none; }
    #stagewrap{ padding-bottom:0; }
    #appbar #viewBtn, #appbar #undoBtn, #appbar #redoBtn, #appbar #helpBtn{ display:none; }   /* they live in the bottom bar / ⋯ on phones */
  }

  /* ---------- Print ---------- */
  #printarea{ display:none; }
  @media print{
    html, body{ height:auto !important; overflow:visible !important; display:block !important; }
    #appbar, #main, #mobilebar, #pickbar, .toast, .popover, .modal-back, #navScrim{ display:none !important; }
    #printarea{ display:block; position:static; width:100%; padding:0 10px; }
  }
  #printarea h2{ font-size:22px; margin:0 0 2px; font-family:var(--serif); }
  #printarea .psub{ color:#666; margin-bottom:14px; font-size:13px; }
  #printarea .plegend{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; font-size:12px; }
  #printarea .plegend span{ display:flex; align-items:center; gap:5px; }
  #printarea .plegend .dot{ width:12px; height:12px; border-radius:50%; display:inline-block; }
  #printarea .ptables{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  #printarea .pcard{ border:1px solid #ccc; border-radius:8px; padding:10px 12px; break-inside:avoid; }
  #printarea .pcard h3{ font-size:15px; margin-bottom:6px; border-bottom:1px solid #eee; padding-bottom:4px; font-family:var(--serif); }
  #printarea .pcard ol{ margin-left:18px; font-size:12.5px; line-height:1.55; }
  #printarea .pcard li .gdot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
  #printarea .pcard .empty{ color:#bbb; }
  #printarea .punassigned{ margin-top:18px; font-size:12.5px; }
</style>
</head>
<body>

<header id="appbar">
  <button id="navBtn" class="ibtn" data-t-title="guestsTools">☰</button>
  <span class="brand">Take<em>a</em>Seat</span>
  <span id="labBadge" data-t="labBadge" data-t-title="labHint"></span>
  <div class="planpick">
    <select id="profileSelect" data-t-title="switchPlan"></select>
    <button class="ibtn" id="profNew" data-t-title="newPlan">＋</button>
    <button class="ibtn" id="profMore" data-t-title="planMore">⋯</button>
  </div>
  <button class="ibtn" id="undoBtn" data-t-title="undo" disabled>↶</button>
  <button class="ibtn" id="redoBtn" data-t-title="redo" disabled>↷</button>
  <span id="statLine" class="stat"></span>
  <span class="spacer"></span>
  <button class="ibtn" id="cloudBtn" data-t-title="shareTitle">☁</button>
  <span class="langsel" id="langsel">
    <a href="seating-planner-el.html" data-lang="el" lang="el">ΕΛ</a><a href="seating-planner.html" data-lang="en">EN</a><a href="seating-planner-de.html" data-lang="de" lang="de">DE</a>
  </span>
  <button class="ibtn" id="viewBtn" data-t-title="view">Aa</button>
  <span class="ctl zoom"><button class="ibtn" id="zoomOut" data-t-title="zoomOut">−</button><span class="lbl" id="zoomLabel">100%</span><button class="ibtn" id="zoomIn" data-t-title="zoomIn">＋</button><button class="ibtn" id="zoomFit" data-t="fit"></button></span>
  <button class="ibtn" id="printBtn" data-t-title="print">🖨</button>
  <button class="ibtn" id="helpBtn" data-t-title="helpTitle">?</button>
  <button class="ibtn" id="moreBtn" data-t-title="more">⋯</button>
</header>

<div id="main">
  <aside id="sidebar">
    <div class="side-scroll">
      <div class="sec">
        <div class="sec-title" data-t="tools"></div>
        <div class="tools">
          <button class="ibtn primary" id="addTableBtn" data-t="addRound"></button>
          <button class="ibtn" id="addHeadBtn" data-t="addHead"></button>
          <button class="ibtn" id="decorBtn" data-t="decor"></button>
          <button class="ibtn" id="autoSeatBtn" data-t="autoSeat"></button>
        </div>
        <div class="floorrow"><span data-t="floor"></span><select id="stageFloor"></select></div>
      </div>
      <div class="sec">
        <div class="sec-title"><span data-t="guests"></span><span class="cnt" id="poolCount"></span></div>
        <div class="search" id="searchWrap"><span class="ico">🔍</span><input id="guestSearch" data-t-ph="searchPh" autocomplete="off" spellcheck="false"><button class="clr" id="searchClear" type="button">✕</button></div>
        <div class="chips" id="groupList"></div>
        <div id="pool"></div>
        <details class="addnames" id="addNames">
          <summary data-t="addNames"></summary>
          <textarea id="guestInput" data-t-ph="namesPh"></textarea>
          <div class="hint" id="namesHint" data-t="namesHint"></div>
          <button class="ibtn primary" id="addGuestBtn" style="width:100%;height:36px" data-t="addToList"></button>
        </details>
      </div>
    </div>
  </aside>

  <div id="stagewrap"><div id="stage"></div></div>

  <div id="tablestrip">
    <div class="ts-head"><span class="ts-title" data-t="tsTitle"></span><span class="ts-cnt" id="tsCount"></span><button class="ibtn" id="tsAll" data-t-title="fit">⤢ <span data-t="tsAll"></span></button><button class="ibtn sq" id="tsToggle" data-t-title="tsToggle">⌄</button></div>
    <div class="ts-grid" id="tsGrid"></div>
  </div>

  <aside id="focus">
    <div class="fhandle" id="fHandle"></div>
    <div class="fhead">

// Garden features — movable & resizable. kind: "zone" (a floor/surface area), "prop" (an item card),
// "marker" (dark box), "label" (text badge). Zones carry a material; props carry an icon.
function defaultFeatures(){ return [
  {id:"f-ent",   kind:"label",  x:870, y:70,   w:190,h:28, label:tr("featEntrance")},
  {id:"f-kiosk", kind:"prop",   x:1150,y:80,   w:150,h:70, label:tr("featDrinks"), icon:"🍹"},
  {id:"f-floor", kind:"zone",   x:870, y:960,  w:460,h:340,label:tr("featFloor"), material:"parquet"},
  {id:"f-dj",    kind:"marker", x:1210,y:960,  w:78, h:34, label:tr("featDJ")},
]; }
// Convert an old (cls/text) feature to the new model, preserving position & size.
function upgradeFeature(f){
  if(f.kind) return f;
  const kindMap={ box:"marker", "label-plain":"label", kiosk:"prop", lake:"zone", deck:"zone", dancefloor:"zone" };
  const matMap={ lake:"water", deck:"wood", dancefloor:"parquet" };
  return { id:f.id, kind:kindMap[f.cls]||"marker", x:f.x, y:f.y, w:f.w, h:f.h,
           label:(f.text!==undefined?f.text:f.label)||"", icon:(f.id==="f-kiosk"?"🍹":null), material:matMap[f.cls]||null };
}

// ============================================================
//  Procedural floor textures — small SVG tiles with fractal-noise filters, inlined as data
//  URIs (the site CSP allows img-src data:). No external assets, sharp at any zoom.
// ============================================================
const SVG_NS='xmlns="http://www.w3.org/2000/svg"';
function svgUri(s){ return 'url("data:image/svg+xml,'+encodeURIComponent(s.replace(/\s{2,}/g," ").trim())+'")'; }
function noise(id,freq,oct,seed,rgb,alpha){
  return `<filter id="${id}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${oct}" seed="${seed}" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 ${rgb[0]} 0 0 0 0 ${rgb[1]} 0 0 0 0 ${rgb[2]} 0 0 0 ${alpha} 0"/></filter>`;
}
function veins(id,freq,oct,seed,rgb){   // marble: narrow bands of a noise field become dark veins
  return `<filter id="${id}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${oct}" seed="${seed}" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 ${rgb[0]} 0 0 0 0 ${rgb[1]} 0 0 0 0 ${rgb[2]} 0 0 0 1 0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0 0 0.05 0.55 0.05 0 0 0"/></feComponentTransfer></filter>`;
}
function tileSvg(w,h,defs,body){ return `<svg ${SVG_NS} width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${defs}</defs>${body}</svg>`; }
const RECT=(x,y,w,h,f,extra="")=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${extra}/>`;
const FILL=(id,w,h)=>`<rect width="${w}" height="${h}" filter="url(#${id})"/>`;
function texGrass(){ return tileSvg(256,256, noise("a","0.018",2,3,[0.62,0.82,0.36],0.55)+noise("b","0.9",3,7,[0.16,0.35,0.1],0.5), RECT(0,0,256,256,"#5f9e3c")+FILL("a",256,256)+FILL("b",256,256)); }
function texParquet(){
  const cols=["#d09f66","#c48f55","#cc9a60","#c8945a"]; let b=RECT(0,0,128,128,"#a4713f");
  for(let by=0;by<2;by++) for(let bx=0;bx<2;bx++){ const horiz=(bx+by)%2===0;
    for(let i=0;i<4;i++){ const c=cols[(i+bx+by)%4]; b+= horiz? RECT(bx*64+1, by*64+i*16+1, 62, 14, c) : RECT(bx*64+i*16+1, by*64+1, 14, 62, c); } }
  return tileSvg(128,128, noise("g","0.08 0.5",2,4,[0.3,0.17,0.06],0.22), b+FILL("g",128,128));
}
function texWood(){
  const cols=["#b07b4c","#a87447","#b5804f","#a3703f"]; let b=RECT(0,0,256,128,"#8b5e38");
  for(let i=0;i<4;i++){ const off=(i%2)*96, y=i*32+2;
    b+=RECT(off-158, y, 156, 28, cols[i])+RECT(off+2, y, 156, 28, cols[(i+1)%4])+RECT(off+162, y, 156, 28, cols[(i+2)%4]); }
  return tileSvg(256,128, noise("w","0.006 0.45",2,2,[0.25,0.13,0.05],0.35), b+FILL("w",256,128));
}
function texStone(){
  const cols=["#bdb9b0","#b0aca3","#c6c2b9","#b8b3aa","#aba79e","#c0bcb3"]; let b=RECT(0,0,256,256,"#8d8a82"), k=0;
  const rows=[[4,58,[[4,76],[84,100],[188,64]]],[66,70,[[4,110],[118,60],[182,70]]],[140,54,[[4,60],[68,90],[162,90]]],[198,54,[[4,120],[128,124]]]];
  rows.forEach(([y,h,st])=>st.forEach(([x,w])=>{ b+=RECT(x,y,w,h,cols[k++%cols.length],'rx="7"'); }));
  return tileSvg(256,256, noise("s","0.6",2,5,[0.35,0.33,0.3],0.3)+noise("s2","0.02",2,8,[1,1,0.95],0.22), b+FILL("s",256,256)+FILL("s2",256,256));
}
function texTile(){ const b=RECT(0,0,64,64,"#cfcbc3")+RECT(1,1,30,30,"#f1efeb")+RECT(33,1,30,30,"#e4e1db")+RECT(1,33,30,30,"#e4e1db")+RECT(33,33,30,30,"#f1efeb"); return tileSvg(64,64, noise("t","0.9",1,2,[0.5,0.48,0.45],0.12), b+FILL("t",64,64)); }

    const s=JSON.parse(raw);
    if(s&&s.tables){ sanitizePlan(s); if(s.layoutVersion!==LAYOUT_VERSION) migrateLayout(s); loadError=""; return s; }

// ---------- save + undo / redo (one snapshot per saved change; the stacks reset when another plan is loaded) ----------
let undoStack=[], redoStack=[], lastJSON=null;
function save(opts){
  const now=JSON.stringify(state);
  if(lastJSON!==null && now!==lastJSON && !(opts&&opts.noHistory)){ undoStack.push(lastJSON); if(undoStack.length>60) undoStack.shift(); redoStack.length=0; }
  lastJSON=now;
  try{ localStorage.setItem(planKey(profiles.activeId), now); }catch(e){}
  scheduleCloudPush(); updateUndoButtons();
}
function resetHistory(){ undoStack=[]; redoStack=[]; lastJSON=JSON.stringify(state); updateUndoButtons(); }
function updateUndoButtons(){
  ["undoBtn","mbUndo"].forEach(id=>{ const b=$(id); if(b) b.disabled=!undoStack.length; });
  ["redoBtn","mbRedo"].forEach(id=>{ const b=$(id); if(b) b.disabled=!redoStack.length; });
}
function restoreSnapshot(json){
  const s=sanitizePlan(JSON.parse(json)); if(s.layoutVersion!==LAYOUT_VERSION) migrateLayout(s);
  setPick(null); dragData=null; hideSug();
  state=s; uid=Math.max(uid, state._uid||0); fontScale=state.seatFontScale||1;
  applyStage(); $("stageFloor").value=state.stageMaterial||"grass";
  if(focusId!=null && !state.tables.some(t=>t.id===focusId)) unfocusTable();
  renderAll();
}
function undo(){ if(!undoStack.length) return; const cur=JSON.stringify(state); const j=undoStack.pop(); redoStack.push(cur); restoreSnapshot(j); lastJSON=j; wipeAllowedUntil=Date.now()+15000; save({noHistory:true}); toast(tr("tUndo")); }
function redo(){ if(!redoStack.length) return; const cur=JSON.stringify(state); const j=redoStack.pop(); undoStack.push(cur); restoreSnapshot(j); lastJSON=j; wipeAllowedUntil=Date.now()+15000; save({noHistory:true}); toast(tr("tRedo")); }
// Version-aware migration — keeps guests / groups / seat assignments (and, from v4 on, table positions).
function migrateLayout(s){
  const from=s.layoutVersion||0;
  if(from<4){
    let ri=0;
    s.tables.forEach(t=>{ if(t.shape!=="head"){ t.shape="round"; if(DEFAULT_POSITIONS[ri]){ t.x=DEFAULT_POSITIONS[ri][0]; t.y=DEFAULT_POSITIONS[ri][1]; } ri++; } });
    if(!s.tables.some(t=>t.shape==="head")){ s._uid=(s._uid||2001)+1; s.tables.push(makeHeadTable(s._uid)); }
    s.features = defaultFeatures();
    if(typeof s.seatFontScale!=="number") s.seatFontScale=1;
  }
  if(from<5){
    if(!s.stage) s.stage={ w:2100, h:1400 };
    if(!s.stageMaterial) s.stageMaterial="grass";
    s.features=(s.features||defaultFeatures()).map(upgradeFeature);
  }
  s.layoutVersion=LAYOUT_VERSION;
}

// How a name shows on the seat pill: full «Ανδρέας Σταμελάκης», short «Ανδρέας Σ.», initials «Α.Σ.» (colours stay).
function initialOf(w){ const c=[...w][0]; return c? c.toUpperCase()+"." : ""; }
function displayName(id){
  const n=guestName(id), mode=state.nameMode||"full"; if(mode==="full") return n;
  const parts=n.trim().split(/\s+/).filter(Boolean); if(parts.length<2) return n;
  return mode==="short" ? parts[0]+" "+initialOf(parts[1]) : parts.map(initialOf).join("");

function hexTint(hex){ return hex+"1f"; }
function toast(msg,ms){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._to); t._to=setTimeout(()=>t.classList.remove("show"),ms||1700); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }
// Colours and icons from cloud/imported plans are interpolated into HTML, so clamp them to safe shapes
// on ingest (a shared plan is attacker-controlled): colours to a hex literal, icons to a short markup-free string.
function safeColor(c){ return (typeof c==="string" && /^#[0-9a-fA-F]{3,8}$/.test(c)) ? c : "#7e6d5f"; }
function safeIcon(s){ s=String(s==null?"📦":s).replace(/[<>&"'`]/g,""); return s.slice(0,4)||"📦"; }
const FEATURE_KINDS=["zone","prop","marker","label"];
const isNum=v=>typeof v==="number"&&isFinite(v);
// A plan from a shared link / imported file is attacker-controlled: every field that reaches the DOM,
// a CSS class, an attribute or a render loop is clamped here, on ingest.
function sanitizePlan(s){ if(!s||typeof s!=="object") return s;
    if(!Array.isArray(s.tables)) s.tables=[];
    if(!s.guests||typeof s.guests!=="object"||Array.isArray(s.guests)) s.guests={};
    if(!Array.isArray(s.groups)) s.groups=[];
    if(!Array.isArray(s.features)) s.features=defaultFeatures();
    s.tables=s.tables.filter(t=>t&&typeof t==="object");
    s.groups=s.groups.filter(g=>g&&typeof g==="object"&&(typeof g.id==="string"||typeof g.id==="number")).map(g=>{ g.id=String(g.id).replace(/[^\w-]/g,"").slice(0,40)||("grp"+Math.floor(Math.random()*1e6)); g.name=String(g.name??"").slice(0,80); g.color=safeColor(g.color); return g; });
    s.features=s.features.filter(f=>f&&typeof f==="object");
    for(const k of Object.keys(s.guests)){ const g=s.guests[k]; if(!g||typeof g!=="object"){ delete s.guests[k]; continue; }
      g.name=String(g.name??"").slice(0,80); if(g.groupId!=null&&typeof g.groupId!=="string") g.groupId=null; if(g.note!=null) g.note=String(g.note).slice(0,200); }
    s.tables.forEach(t=>{
      t.capacity=clamp(Math.floor(+t.capacity)||10,1,30);
      t.label=String(t.label??"").slice(0,60); t.shape=(t.shape==="head")?"head":"round";
      if(!isNum(t.x)) t.x=200; if(!isNum(t.y)) t.y=200; if(t.rot!=null&&!isNum(t.rot)) t.rot=0;
      if(!Array.isArray(t.seats)) t.seats=[];
      t.seats=t.seats.slice(0,t.capacity).map(x=>(typeof x==="string"&&s.guests[x])?x:null);   // drop dangling guest ids
      while(t.seats.length<t.capacity) t.seats.push(null);
    });
    s.features.forEach(f=>{
      if("kind" in f && !FEATURE_KINDS.includes(f.kind)) f.kind="marker";
      if("icon" in f) f.icon=safeIcon(f.icon);
      if(f.label!=null) f.label=String(f.label).slice(0,80);
      if(f.material!=null && !isMaterial(f.material)) f.material=null;
      ["x","y","w","h"].forEach(k=>{ if(!isNum(f[k])) f[k]=(k==="w"||k==="h")?100:200; }); f.w=clamp(f.w,8,20000); f.h=clamp(f.h,8,20000);
    });
    if(!s.stage||typeof s.stage!=="object"||!isNum(s.stage.w)||!isNum(s.stage.h)) s.stage={w:2100,h:1400};
    s.stage.w=clamp(Math.round(s.stage.w),700,20000); s.stage.h=clamp(Math.round(s.stage.h),600,20000);
    if(!isMaterial(s.stageMaterial)) s.stageMaterial="grass";
    if(!(s.seatFontScale>=0.6&&s.seatFontScale<=2)) s.seatFontScale=1;
    if(!(s.tableFontScale>=0.6&&s.tableFontScale<=2.4)) s.tableFontScale=1;
    if(!["full","short","initials"].includes(s.nameMode)) s.nameMode="full";
    if(s.activeGroupId!=null && !s.groups.some(g=>g.id===s.activeGroupId)) s.activeGroupId=null;
  return s; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function gNote(id){ return state.guests[id]?.note || ""; }

function statusTag(id){ const s=gStatus(id); return STATUS_TXT(s)?`<span class="stag${s==="cut"?" cut":""}">${STATUS_TXT(s)}</span>`:""; }

const BASE_SLOT=46; // reference seat spacing — table size depends on this + seat count, NOT on name length
function roundGeom(t){
  const n=t.capacity;
  const fs=Math.round(11*fontScale);
  const seatH=fs+11;
  const need = n<2 ? BASE_SLOT : BASE_SLOT/(2*Math.sin(Math.PI/n));
  const ringR=Math.max(need, 46, seatH*1.2);
  const discR=Math.max(24, ringR - seatH/2 - 7);
  return {n,fs,seatH,ringR,discR};
}
function buildSeat(t,i,relx,rely,fs,seatH){
  const seat=document.createElement("div");
  const gid=t.seats[i];
  seat.className="seat"+(gid?" occupied":"");
  seat.style.left=relx+"px"; seat.style.top=rely+"px";
  seat.style.height=seatH+"px"; seat.style.borderRadius=(seatH/2)+"px"; seat.style.fontSize=fs+"px";
  seat.dataset.tableId=t.id; seat.dataset.seatIndex=i;
  if(gid){
    const col=guestColor(gid);
    const shown=displayName(gid);
    seat.style.background=col; seat.style.width=seatWidthFor(shown,fs)+"px";
    if(gStatus(gid)!=="confirmed"){ seat.style.borderStyle="dashed"; seat.style.borderColor="rgba(255,255,255,.9)"; seat.style.backgroundClip="padding-box"; }   // not-yet-confirmed: white dashes inside the pill, visible on any floor
    seat.innerHTML=`<span class="nm">${escapeHtml(shown)}</span>`;
    seat.title=guestName(gid)+(guestGroup(gid)?` · ${guestGroup(gid).name}`:"")+statusTitle(gid);
    seat.draggable=true; seat.dataset.guestId=gid;
  }else{
    seat.style.width="42px";
    seat.innerHTML=`<span class="nm" style="opacity:.6">+</span>`;
  }
  wireSeat(seat);
  return seat;
}
function tableExtent(t){   // half-size of a table incl. its seats — used to zoom onto it
  if(t.shape==="head"){ const g=headGeom(t); return { rx:g.tableW/2+30+100, ry:g.tableH/2+g.seatH+40 }; }
  const g=roundGeom(t); return { rx:g.ringR+100, ry:g.ringR+40 };
}
function renderRoundTable(t, wrap){
  const g=roundGeom(t);
  const disc=document.createElement("div");
  disc.className="table-disc";
  disc.style.width=(g.discR*2)+"px"; disc.style.height=(g.discR*2)+"px";
  const occ=t.seats.filter(Boolean).length;
  disc.innerHTML=`<span class="tgear" title="${escapeHtml(tr("tableSettings"))}">⚙</span><span class="tnum">${escapeHtml(t.label)}</span><span class="tcount">${occ}/${t.capacity}</span>`;
  disc.title=tr("tableTip");
  disc.querySelector(".tgear").addEventListener("click",e=>{ e.stopPropagation(); openMenu(t.id,e); });
  disc.addEventListener("contextmenu",e=>{ e.preventDefault(); openMenu(t.id,e); });
  makeDraggable(disc, wrap, t, ()=>renderTables([t.id]), ()=>{ focusTable(t.id); hintHold(); });
  wrap.appendChild(disc);
  for(let i=0;i<t.capacity;i++){
    const a=(i/t.capacity)*2*Math.PI - Math.PI/2;
    wrap.appendChild(buildSeat(t,i, g.ringR*Math.cos(a), g.ringR*Math.sin(a), g.fs, g.seatH));
  }
  addTableRotateHandle(wrap, t, g.ringR+30);
}
function headGeom(t){
  const n=t.capacity;
  const top=Math.max(1,n-2);
  const fs=Math.round(11*fontScale);
  const seatH=fs+11;
  const slot=Math.round(64*fontScale);
  const innerW=top*slot;
  const tableW=innerW+34;
  const tableH=seatH+50;
  return {n,top,fs,seatH,slot,innerW,tableW,tableH};
}
function renderHeadTable(t, wrap){
  const g=headGeom(t);
  const disc=document.createElement("div");
  disc.className="table-disc head";
  disc.style.width=g.tableW+"px"; disc.style.height=g.tableH+"px";
  const occ=t.seats.filter(Boolean).length;
  disc.innerHTML=`<span class="tgear" title="${escapeHtml(tr("tableSettings"))}">⚙</span><span class="tnum">${escapeHtml(t.label)}</span><span class="tcount">${occ}/${t.capacity} · ${escapeHtml(tr("headFacing"))}</span>`;
  disc.title=tr("tableTip");
  disc.querySelector(".tgear").addEventListener("click",e=>{ e.stopPropagation(); openMenu(t.id,e); });
  disc.addEventListener("contextmenu",e=>{ e.preventDefault(); openMenu(t.id,e); });
  makeDraggable(disc, wrap, t, ()=>renderTables([t.id]), ()=>{ focusTable(t.id); hintHold(); });
  wrap.appendChild(disc);
  // main row on the FAR side of the table, so the couple sits behind the table facing the dance floor
  for(let i=0;i<g.top;i++){
    const relx = -g.innerW/2 + g.slot/2 + i*g.slot;
    const rely = (g.tableH/2) + g.seatH/2 + 6;
    wrap.appendChild(buildSeat(t,i, relx, rely, g.fs, g.seatH));
  }
  const li=g.top, ri=g.top+1, endGap=30;
  if(li<t.capacity) wrap.appendChild(buildSeat(t,li, -(g.tableW/2)-endGap, 0, g.fs, g.seatH));
  if(ri<t.capacity) wrap.appendChild(buildSeat(t,ri,  (g.tableW/2)+endGap, 0, g.fs, g.seatH));
  addTableRotateHandle(wrap, t, g.tableH/2 + g.seatH + 30);
}
function buildTableWrap(t){
  const wrap=document.createElement("div");
  wrap.className="table"+(t.id===focusId?" focused":""); wrap.style.left=t.x+"px"; wrap.style.top=t.y+"px"; wrap.dataset.tableId=t.id;
  wrap.style.setProperty("--tfs", String(state.tableFontScale||1));
  if(t.shape==="head") renderHeadTable(t,wrap); else renderRoundTable(t,wrap);
  const ext=tableExtent(t); wrap.style.setProperty("--frx", Math.round(ext.rx+4)+"px"); wrap.style.setProperty("--fry", Math.round(ext.ry+4)+"px");
  return wrap;
}
// Re-render every table, or only the ids in `only` (a seat change touches one or two tables — not 300 pills).
function renderTables(only){
  if(only){
    only.forEach(id=>{ const t=state.tables.find(x=>x.id===id); const old=stage.querySelector(`.table[data-table-id="${id}"]`);
      if(!t){ if(old) old.remove(); return; } const wrap=buildTableWrap(t); if(old) old.replaceWith(wrap); else stage.appendChild(wrap); });
  } else {
    stage.querySelectorAll(".table").forEach(e=>e.remove());
    state.tables.forEach(t=>stage.appendChild(buildTableWrap(t)));
  }
  updateStats();
  if(focusId!=null) renderFocus();
}

// Group chips: the active chip filters the guest list AND is the group new names join.
function renderGroups(){

function makeGroupChip(g, count, isAll){

let searchQ="";
function unseatedIds(){ const assigned=assignedGuestIds(); return Object.keys(state.guests).filter(id=>!assigned.has(id)); }
function visiblePoolIds(){
  const q=norm(searchQ); let ids=unseatedIds();
  if(q) return ids.filter(id=>norm(guestName(id)).includes(q));              // a search looks across all groups
  if(state.activeGroupId) ids=ids.filter(id=>state.guests[id].groupId===state.activeGroupId);
  return ids;
}
function renderPool(){

    chip.querySelector(".x").addEventListener("click",e=>{ e.stopPropagation(); if(pick&&pick.guestId===id) setPick(null); delete state.guests[id]; save(); renderPool(); renderGroups(); updateStats(); toast(tr("tGuestRemoved")); });

function updateStats(){

// Phone: the table chooser under the canvas — tap a chip to glide onto that table; "⤢ Όλα" comes back to the overview.
function renderStrip(seated,total){
  const grid=$("tsGrid"); if(!grid) return;
  $("tsCount").textContent=`${state.tables.length} · ${seated}/${total}`;
  grid.innerHTML=state.tables.map(t=>{ const occ=t.seats.filter(Boolean).length, full=occ>=t.capacity;
    return `<div class="ts-chip${full?" full":""}" data-id="${t.id}"><div class="lbl">${t.shape==="head"?"💑":escapeHtml(t.label)}</div><div class="occ">${occ}/${t.capacity}</div><div class="bar"><i style="width:${Math.round(100*occ/Math.max(1,t.capacity))}%"></i></div></div>`; }).join("");

function overview(){ unfocusTable(); setPick(null); requestAnimationFrame(()=>{ layoutCanvas(true); zoom=clamp(fitZoom(),0.1,2.5); applyZoom(); stagewrap.scrollTop=0; stagewrap.scrollLeft=0; }); }
// Phone overview: make the canvas exactly as tall as the floor fitted to the screen width, so the table list
// gets the rest instead of dead space. Once the user zooms in (>1.25× fit) the canvas takes over and the list shrinks.
function layoutCanvas(forceOverview){
  if(!isNarrow() || document.body.classList.contains("focused")){ stagewrap.style.height=""; stagewrap.style.flex=""; document.body.classList.remove("zoomed"); return; }
  const m=12, zf=Math.max(0.1,(stagewrap.clientWidth-2*m)/state.stage.w);
  const zoomedIn=!forceOverview && zoom>zf*1.25;
  document.body.classList.toggle("zoomed", zoomedIn);
  if(zoomedIn){ stagewrap.style.height=""; stagewrap.style.flex=""; return; }
  const avail=window.innerHeight-52;
  stagewrap.style.flex="none"; stagewrap.style.height=clamp(Math.round(state.stage.h*zf+2*m+10), 200, Math.round(avail*0.62))+"px";
}

function editGroup(id,evt){

const EXTRA_PALETTE=["#d94f4f","#e8843a","#c9a227","#5aa64c","#2f8f8f","#3b6fd6","#7a5cd6","#c04f9a","#8b6a4e","#607080"];

  const body=$("groupsBody"); const counts={}; Object.values(state.guests).forEach(gu=>{ if(gu.groupId) counts[gu.groupId]=(counts[gu.groupId]||0)+1; });
  body.innerHTML=state.groups.map(g=>`<div class="grow" data-id="${escapeHtml(g.id)}"><button class="sw" data-act="color" title="${escapeHtml(tr("gmRecolor"))}" style="background:${safeColor(g.color)}"></button><input class="gname" value="${escapeHtml(g.name)}" maxlength="40"><span class="n">${counts[g.id]||0}</span><button class="ibtn danger" data-act="del" title="${escapeHtml(tr("gmDelete"))}">🗑</button></div>`).join("")

  body.querySelectorAll(".grow[data-id]").forEach(row=>{
    const g=state.groups.find(x=>x.id===row.dataset.id); if(!g) return;
    const inp=row.querySelector(".gname");
    const commit=()=>{ const v=inp.value.trim(); if(v&&v!==g.name){ g.name=v; save(); renderGroups(); renderPool(); renderTables(); } };
    inp.addEventListener("change",commit); inp.addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Enter"){ e.preventDefault(); commit(); inp.blur(); } });

      Object.values(state.guests).forEach(gu=>{ if(gu.groupId===g.id) gu.groupId=null; }); state.groups=state.groups.filter(x=>x.id!==g.id); if(state.activeGroupId===g.id) state.activeGroupId=null;
      save(); renderGroups(); renderTables(); renderPool(); renderGroupsModal(); };
  });

// Re-order a feature within the stack (array order = paint order; first = back, last = front).
function moveFeature(f, dir){
  const arr=state.features, i=arr.indexOf(f); if(i<0) return;
  arr.splice(i,1);
  const j = dir==="back"?0 : dir==="front"?arr.length : dir==="backward"?Math.max(0,i-1) : Math.min(arr.length,i+1);
  arr.splice(j,0,f); save(); renderFeatures();
}
function openFeatureMenu(f, evt){
  const menu=$("featuremenu");
  let html="";
  if(f.kind==="zone") html+=`<div class="gm-cap">${escapeHtml(tr("fmSurface"))}</div>`+matSwatchesHtml(f.material||"grass");
  html+=`<div class="gm-cap">${escapeHtml(tr("fmLayer"))}</div>`;
  html+=`<div class="gm-item" data-act="back">${escapeHtml(tr("fmBack"))}</div><div class="gm-item" data-act="backward">${escapeHtml(tr("fmBackward"))}</div>`;
  html+=`<div class="gm-item" data-act="forward">${escapeHtml(tr("fmForward"))}</div><div class="gm-item" data-act="front">${escapeHtml(tr("fmFront"))}</div>`;
  html+=`<div class="gm-sep"></div><div class="gm-item" data-act="rename">${escapeHtml(tr("fmRename"))}</div><div class="gm-item danger" data-act="delete">${escapeHtml(tr("fmDelete"))}</div>`;
  menu.innerHTML=html; paintSwatches(menu);
  menu.querySelectorAll(".fm-mat").forEach(m=>m.onclick=()=>{ f.material=m.dataset.mat; save(); renderFeatures(); closeFeatureMenu(); });
  ["back","backward","forward","front"].forEach(dir=>{ const el=menu.querySelector(`[data-act="${dir}"]`); if(el) el.onclick=()=>{ moveFeature(f,dir); closeFeatureMenu(); }; });
  menu.querySelector('[data-act="rename"]').onclick=()=>{ const nm=prompt(tr("fmLabelPrompt"), f.label||""); if(nm!==null){ f.label=nm; save(); renderFeatures(); } closeFeatureMenu(); };

// ---- pinch to zoom on the canvas (two fingers) ----
// While a zoom gesture runs, the stage gets will-change:transform so the compositor scales a cached layer
// instead of re-painting 2100×1400 px of floor on every frame.
let zoomingTimer=null;
function markZooming(){ document.body.classList.add("zooming"); clearTimeout(zoomingTimer); zoomingTimer=setTimeout(()=>document.body.classList.remove("zooming"),450); }
(function(){
  const wrap=stagewrap;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const mid =t=>({ x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 });
  let base=null, pending=null, raf=null;
  wrap.addEventListener("touchstart",e=>{
    if(e.touches.length!==2){ base=null; return; }
    if(activeDragCancel && !pointerGesture) activeDragCancel();   // a second finger cancels a pending long-press
    if(pointerGesture){ base=null; return; }
    const m=mid(e.touches), r=wrap.getBoundingClientRect();
    base={ d:dist(e.touches)||1, z:zoom, cx:(wrap.scrollLeft+m.x-r.left)/zoom, cy:(wrap.scrollTop+m.y-r.top)/zoom };
    markZooming();
  },{passive:true});
  wrap.addEventListener("touchmove",e=>{
    if(!base||e.touches.length!==2) return;
    e.preventDefault();
    const m=mid(e.touches), r=wrap.getBoundingClientRect();
    pending={ z:clamp(base.z*dist(e.touches)/base.d, 0.2, 2.5), mx:m.x-r.left, my:m.y-r.top };
    if(!raf) raf=requestAnimationFrame(()=>{ raf=null; const p=pending; if(!p||!base) return; markZooming();   // one layout per frame, not per touch event
      zoom=p.z; applyZoom(); wrap.scrollLeft=base.cx*zoom-p.mx; wrap.scrollTop=base.cy*zoom-p.my; });
  },{passive:false});
  const end=e=>{ if(e.touches.length<2) base=null; };
  wrap.addEventListener("touchend",end,{passive:true});
  wrap.addEventListener("touchcancel",end,{passive:true});
})();
// ---- ctrl/⌘ + wheel zooms around the cursor (desktop) ----
stagewrap.addEventListener("wheel",e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  e.preventDefault(); markZooming();
  const r=stagewrap.getBoundingClientRect(), m=isNarrow()?12:24;
  const cx=(stagewrap.scrollLeft+e.clientX-r.left-m)/zoom, cy=(stagewrap.scrollTop+e.clientY-r.top-m)/zoom;
  zoom=clamp(zoom*(e.deltaY<0?1.1:0.9), 0.2, 2.5); applyZoom();
  stagewrap.scrollLeft=m+cx*zoom-(e.clientX-r.left); stagewrap.scrollTop=m+cy*zoom-(e.clientY-r.top);
},{passive:false});
// Zoom buttons keep the centre of the visible floor where it is.
function zoomBy(f){ const c=visibleCenter(); markZooming(); viewTo(c.x, c.y, clamp(zoom*f, 0.2, 2.5), false); }

function placeGuestInSeat(drag, tableId, seatIndex){

    if(src && drag.seatIndex<src.seats.length) src.seats[drag.seatIndex]=occupant;
    table.seats[seatIndex]=drag.guestId;

  }

// ============================================================
//  MOVE (smooth pointer dragging — moves the element, no rebuild until done)
// ============================================================
// Mouse: grab and drag at once. Touch: a finger on an object PANS the floor (touch-action pan-x pan-y);
// holding still for ~⅓ s "lifts" the object (haptic tick + glow) and only then does the finger move it.
let activeDragCancel=null;   // cancels a pending hold / active drag (a second finger = pinch)
function makeDraggable(handleEl, moveEl, obj, onEnd, onTap){
  handleEl.addEventListener("pointerdown",e=>{
    if(e.target.closest(".tgear")||e.target.closest(".rz")||e.target.closest(".rot-h")) return;
    if(e.button!==0) return;
    const touch=e.pointerType==="touch";
    e.stopPropagation(); if(!touch) e.preventDefault();
    const sx=e.clientX, sy=e.clientY, ox=obj.x, oy=obj.y, t0=performance.now();
    let moved=false, lifted=false, done=false, holdTimer=null;
    const slop=touch?10:4;
    const maxX=(state.stage?state.stage.w:1700)-20, maxY=(state.stage?state.stage.h:1360)-20;
    function lift(){ if(done||lifted) return; lifted=true; pointerGesture=true; try{ handleEl.setPointerCapture(e.pointerId); }catch(x){} moveEl.classList.add("lifted");
      if(touch&&navigator.vibrate){ try{ navigator.vibrate(12); }catch(x){} } }
    function mv(ev){
      const ddx=ev.clientX-sx, ddy=ev.clientY-sy;
      if(!lifted){ if(Math.abs(ddx)>slop||Math.abs(ddy)>slop){ moved=true; clearTimeout(holdTimer); } return; }   // not lifted: the finger is panning the floor, not us
      if(Math.abs(ddx)>slop||Math.abs(ddy)>slop) moved=true;
      if(!moved) return;
      obj.x=clamp(ox+ddx/zoom, 20, maxX); obj.y=clamp(oy+ddy/zoom, 20, maxY);
      moveEl.style.left=obj.x+"px"; moveEl.style.top=obj.y+"px";
    }
    function tm(ev){ if(lifted) ev.preventDefault(); }   // once lifted, the finger must not scroll the floor
    function finish(ev, cancelled){
      if(done) return; done=true; clearTimeout(holdTimer); pointerGesture=false; activeDragCancel=null; moveEl.classList.remove("lifted");
      try{ handleEl.releasePointerCapture(e.pointerId); }catch(x){}
      handleEl.removeEventListener("pointermove",mv); handleEl.removeEventListener("pointerup",up); handleEl.removeEventListener("pointercancel",up); handleEl.removeEventListener("touchmove",tm);
      if(cancelled){ if(lifted&&moved){ obj.x=ox; obj.y=oy; moveEl.style.left=ox+"px"; moveEl.style.top=oy+"px"; } return; }
      if(lifted&&moved){ save(); if(onEnd)onEnd(); }
      else if(!moved && onTap && ev && ev.type!=="pointercancel") onTap();
    }
    function up(ev){ finish(ev,false); }
    activeDragCancel=()=>finish(null,true);
    handleEl.addEventListener("pointermove",mv); handleEl.addEventListener("pointerup",up); handleEl.addEventListener("pointercancel",up); handleEl.addEventListener("touchmove",tm,{passive:false});
    if(touch) holdTimer=setTimeout(lift, 320); else lift();
  });
}
// Resize a feature from its bottom-right corner, keeping the top-left corner fixed (x/y are the centre).
function makeResizable(handle, el, f){
  handle.addEventListener("pointerdown",e=>{
    if(e.button!==0) return;
    e.preventDefault(); e.stopPropagation();
    handle.setPointerCapture(e.pointerId); pointerGesture=true;
    const sx=e.clientX, sy=e.clientY, ow=f.w, oh=f.h, ox=f.x, oy=f.y;
    function mv(ev){
      const nw=Math.max(24, ow+(ev.clientX-sx)/zoom), nh=Math.max(18, oh+(ev.clientY-sy)/zoom);
      f.w=nw; f.h=nh; f.x=ox+(nw-ow)/2; f.y=oy+(nh-oh)/2;
      el.style.width=nw+"px"; el.style.height=nh+"px"; el.style.left=f.x+"px"; el.style.top=f.y+"px";
    }
    function up(){ pointerGesture=false; try{ handle.releasePointerCapture(e.pointerId); }catch(x){} handle.removeEventListener("pointermove",mv); handle.removeEventListener("pointerup",up); save(); }
    handle.addEventListener("pointermove",mv); handle.addEventListener("pointerup",up);
  });
}
// Rotate any object by dragging its ⟳ handle around the object centre.
function makeRotatable(handle, centerEl, obj, applyFn){
  handle.addEventListener("pointerdown",e=>{
    if(e.button!==0) return;
    e.preventDefault(); e.stopPropagation(); handle.setPointerCapture(e.pointerId); pointerGesture=true;
    function mv(ev){
      const r=centerEl.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
      let ang=Math.atan2(ev.clientY-cy, ev.clientX-cx)*180/Math.PI + 90;
      if(ev.shiftKey) ang=Math.round(ang/15)*15;
      obj.rot=Math.round(ang); applyFn();
    }
    function up(){ pointerGesture=false; try{ handle.releasePointerCapture(e.pointerId); }catch(x){} handle.removeEventListener("pointermove",mv); handle.removeEventListener("pointerup",up); save(); }
    handle.addEventListener("pointermove",mv); handle.addEventListener("pointerup",up);
  });
}
// Add a rotate handle to a table; keeps the number & names upright while the table spins.
function addTableRotateHandle(wrap, t, offset){
  const h=document.createElement("div"); h.className="rot-h";
  h.style.left="0"; h.style.top=(-offset)+"px"; h.style.transform="translate(-50%,-50%)";
  wrap.appendChild(h);
  const apply=()=>{
    wrap.style.transform=`rotate(${t.rot||0}deg)`;
    // counter-rotate the whole seat pill (not just its text) so names stay upright AND unclipped
    wrap.querySelectorAll(".seat").forEach(s=>{ s.style.transform=`translate(-50%,-50%) rotate(${-(t.rot||0)}deg)`; });
    wrap.querySelectorAll(".tnum,.tcount").forEach(x=>{ x.style.display="inline-block"; x.style.transform=`rotate(${-(t.rot||0)}deg)`; });
  };
  apply();
  makeRotatable(h, wrap, t, apply);
}
// The whole space: size + floor material, plus a drag-to-resize corner handle.
function applyStage(){
  stage.style.width=state.stage.w+"px"; stage.style.height=state.stage.h+"px";
  applyMaterial(stage, state.stageMaterial||"grass");
}
function makeStageResizable(h){
  h.addEventListener("pointerdown",e=>{
    if(e.button!==0) return;
    e.preventDefault(); e.stopPropagation(); h.setPointerCapture(e.pointerId); pointerGesture=true;
    const sx=e.clientX, sy=e.clientY, ow=state.stage.w, oh=state.stage.h;
    function mv(ev){ state.stage.w=Math.max(700,Math.round(ow+(ev.clientX-sx)/zoom)); state.stage.h=Math.max(600,Math.round(oh+(ev.clientY-sy)/zoom)); stage.style.width=state.stage.w+"px"; stage.style.height=state.stage.h+"px"; }
    function up(){ pointerGesture=false; try{ h.releasePointerCapture(e.pointerId); }catch(x){} h.removeEventListener("pointermove",mv); h.removeEventListener("pointerup",up); applyZoom(); save(); }
    h.addEventListener("pointermove",mv); h.addEventListener("pointerup",up);
  });
}
