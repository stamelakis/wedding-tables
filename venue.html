<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if(location.hostname.endsWith("github.io"))location.replace("https://takeaseat.gr"+location.pathname+location.search+location.hash);</script>
<title>Κονσόλα Κτήματος — Εκδηλώσεις</title>
<style>
  :root{ --paper:#f7f4f1; --card:#fffdfb; --ink:#2a2620; --soft:#6a6157; --faint:#9a8f7f;
         --line:#e7dfd7; --accent:#7d5a8c; --accent-ink:#5c3f68; --accent-soft:#efe6f2;
         --good:#3f7a52; --good-soft:#e4efe6; --danger:#c0392b; --shadow:0 1px 2px rgba(40,30,20,.05),0 6px 20px rgba(40,30,20,.06); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.55; }
  .wrap{ max-width:1040px; margin:0 auto; padding:24px 18px 40px; }
  h1{ font-family:"Iowan Old Style",Palatino,Georgia,serif; font-weight:600; font-size:26px; margin:0; overflow-wrap:anywhere; }
  h2,h3{ font-family:"Iowan Old Style",Palatino,Georgia,serif; font-weight:600; margin:0; }
  h2{ font-size:19px; } h3{ font-size:18px; }
  a{ color:var(--accent-ink); }
  .btn{ font:inherit; font-size:14px; font-weight:600; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:9px 14px; border-radius:9px; cursor:pointer; text-decoration:none; display:inline-block; text-align:center; }
  .btn:hover{ background:#f2ece6; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.05); }
  .btn.danger{ color:var(--danger); border-color:#e3b4ac; background:#fbeeec; }
  .btn.quiet{ border-color:transparent; background:transparent; color:var(--accent-ink); padding-left:8px; padding-right:8px; }
  .btn.quiet:hover{ background:var(--accent-soft); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  input,textarea,select{ font:inherit; font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; width:100%; background:var(--card); color:var(--ink); }
  textarea{ resize:vertical; min-height:74px; }
  input[type=checkbox],input[type=radio]{ width:auto; padding:0; margin:0; accent-color:var(--accent); flex:none; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
  /* login */
  .login{ max-width:440px; margin:8vh auto 0; padding:28px; text-align:center; }
  .login h1{ margin-bottom:6px; }
  .login p{ color:var(--soft); margin:0 0 18px; font-size:14px; }
  .login .row{ display:flex; gap:8px; margin-top:8px; }
  /* dashboard */
  header.top{ display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
  header.top .meta{ flex:1; min-width:200px; }
  header.top .sub{ color:var(--soft); font-size:14px; margin-top:2px; }
  .badge{ display:inline-block; font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px; }
  .badge.season{ background:var(--accent-soft); color:var(--accent-ink); }
  .badge.per{ background:var(--good-soft); color:var(--good); }
  .badge.warn{ background:#fbeeec; color:var(--danger); }
  .badge.sup{ background:#e3eef8; color:#285d8a; }
  .badge.own{ background:#f3ece3; color:#7a5a2e; }
  .banner{ display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; background:#fff5e2; border:1px solid #efd7a6; color:#5e4613; border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:14px; }
  .banner .txt{ flex:1 1 240px; }
  .grid2{ display:grid; grid-template-columns:minmax(0,1fr); gap:14px; margin-bottom:26px; }
  @media (min-width:780px){ .grid2{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start; } }
  .sec{ padding:18px; min-width:0; }
  .sec-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sec .sub{ color:var(--soft); font-size:13px; margin-top:2px; }
  .sec p{ margin:8px 0 14px; font-size:14px; color:var(--soft); }
  .note{ font-size:12.5px; color:var(--soft); background:#f6f1ec; border-radius:8px; padding:8px 10px; margin:12px 0 14px; }
  .warnline{ font-size:13px; color:#7a5a2e; margin:10px 0 0; }
  .btns{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btns.end{ justify-content:flex-end; margin-top:14px; }
  .chk{ display:flex; align-items:flex-start; gap:9px; font-size:13.5px; color:var(--soft); margin-top:14px; cursor:pointer; }
  .chk input{ margin-top:3px; }
  .list-h{ display:flex; align-items:baseline; gap:8px; margin:0 0 12px; }
  .list-h .n{ color:var(--faint); font-size:14px; }
  .toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  .newform{ display:flex; gap:8px; flex:1 1 100%; min-width:0; flex-wrap:wrap; }
  .newform input{ min-width:0; }
  .newform #newlabel{ flex:1 1 160px; }
  .newform .btn{ flex:none; }
  .datefld{ display:flex; align-items:center; border:1px solid var(--line); border-radius:9px; background:var(--card); padding-left:11px; flex:0 1 auto; min-width:0; cursor:text; }
  .datefld > span{ font-size:12.5px; color:var(--faint); white-space:nowrap; }
  .datefld input{ border:0; background:transparent; width:auto; min-width:0; padding:9px 10px 9px 6px; }
  .datefld.off{ opacity:.5; }
  .kindfld{ display:flex; align-items:center; border:1px solid var(--line); border-radius:9px; background:var(--card); padding-left:11px; flex:0 0 auto; }
  .kindfld > span{ font-size:12.5px; color:var(--faint); white-space:nowrap; }
  .kindfld select{ border:0; background:transparent; padding:9px 8px 9px 6px; font:inherit; }
  .kindfld.off{ opacity:.5; }
  .badge.kind{ background:#e7eef6; color:#3a5a7a; margin-left:8px; font-size:11.5px; vertical-align:middle; }
  .langsel{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--soft); }
  .langsel select{ width:auto; padding:7px 9px; font-size:13px; }
  .under{ font-size:12.5px; color:var(--soft); margin:4px 0 0; }
  .under.bad{ color:var(--danger); }
  .setdate{ font:inherit; font-size:13px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); border:1px dashed #cdb8d6; border-radius:8px; padding:3px 10px; cursor:pointer; white-space:nowrap; }
  .setdate:hover{ border-style:solid; }
  .bar{ display:inline-block; vertical-align:middle; width:64px; height:5px; margin:0 6px 2px 0; border-radius:3px; background:#ece4db; overflow:hidden; }
  .bar i{ display:block; height:100%; background:var(--good); border-radius:3px; }
  .badge.lock{ background:#ece7e1; color:#5a5046; border-radius:8px; }
  /* «Εκδηλώσεις»: the sheet (phase 3) — one row per event, the venue's own client beside it */
  .sheetbar{ display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; margin:18px 0 10px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; flex:1 1 auto; }
  .chip{ font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--card); color:var(--soft); padding:5px 11px; border-radius:20px; cursor:pointer; white-space:nowrap; }
  .chip:hover{ background:#f2ece6; }
  .chip.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.hot:not(.on){ border-color:#efd7a6; color:#7a5a2e; background:#fff5e2; }
  .chip small{ font-size:12px; font-weight:700; opacity:.75; margin-left:3px; }
  .sheettools{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sheettools input{ width:220px; padding:7px 11px; font-size:14px; }
  .sheettools select{ width:auto; padding:7px 9px; font-size:13.5px; }
  .btn.sm{ padding:6px 11px; font-size:13px; }
  .sheetcard{ overflow:hidden; }
  table.sheet{ width:100%; border-collapse:collapse; font-size:14px; }
  table.sheet th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); font-weight:700; padding:12px 10px 8px; border-bottom:1px solid var(--line); vertical-align:bottom; }
  table.sheet td{ padding:11px 10px; border-top:1px solid var(--line); vertical-align:top; }
  table.sheet tbody tr:first-child td{ border-top:0; }
  table.sheet th:first-child, table.sheet td:first-child{ padding-left:16px; }
  table.sheet th:last-child, table.sheet td:last-child{ padding-right:16px; }
  table.sheet tr.row{ cursor:pointer; }
  table.sheet tr.row:hover td{ background:#faf6f2; }
  table.sheet tr.row:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .sheet .nm{ font-weight:700; font-size:15px; overflow-wrap:anywhere; }
  .sheet .nm2{ font-weight:600; overflow-wrap:anywhere; }
  .sheet .sm2{ font-size:12.5px; color:var(--faint); margin-top:1px; overflow-wrap:anywhere; }
  .sheet .sm2.due{ color:#7a5a2e; font-weight:600; }
  .sheet tr.past .nm{ color:var(--soft); }
  .sheet .rel.soon{ color:var(--accent-ink); font-weight:600; }
  .nw{ white-space:nowrap; }
  .flags{ display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .flags .badge{ font-size:11px; font-weight:600; }
  .badge.flag{ background:#fff5e2; color:#7a5a2e; }
  .badge.st{ background:#ece7e1; color:#5a5046; font-weight:600; }
  .badge.st.seating{ background:var(--accent-soft); color:var(--accent-ink); }
  .badge.st.ready{ background:var(--good-soft); color:var(--good); }
  .badge.st.hot{ background:#fff5e2; color:#7a5a2e; }
  .reach{ display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
  .reach .btn{ padding:4px 8px; font-size:12px; font-weight:600; }
  .muted{ color:var(--faint); }
  td.acts{ white-space:nowrap; text-align:right; }
  td.acts .btn{ padding:6px 10px; font-size:13px; }
  .memset{ margin-top:22px; padding:14px 16px; font-size:13.5px; color:var(--soft); }
  .memset select{ width:auto; display:inline-block; padding:4px 8px; font-size:13.5px; margin:0 2px; }
  details.trash{ margin-top:22px; padding:12px 16px; }
  details.trash summary{ cursor:pointer; font-size:14px; font-weight:600; color:var(--soft); }
  details.trash .tr{ padding:9px 0; border-top:1px solid var(--line); font-size:14px; }
  details.trash .tr small{ display:block; color:var(--faint); font-size:12.5px; }
  .lic{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px; }
  .renew{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--soft); cursor:pointer; }
  .lic .ended{ font-size:13px; color:#7a5a2e; }
  .help-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .help-grid .wide{ grid-column:1 / -1; }
  footer.legal{ text-align:center; font-size:12.5px; color:var(--faint); padding:0 16px 56px; }
  footer.legal a{ color:var(--soft); }
  .empty{ text-align:center; color:var(--faint); padding:40px 10px; }
  .hint{ font-size:12.5px; color:var(--faint); margin-top:4px; }
  /* permissions editor */
  .pe{ margin-top:12px; }
  .pe .always{ color:var(--good); font-size:13.5px; font-weight:600; margin-bottom:8px; }
  .opt{ display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; margin-top:6px; cursor:pointer; font-size:14.5px; background:var(--card); }
  .opt.on{ border-color:var(--accent); background:var(--accent-soft); }
  .opt span{ min-width:0; overflow-wrap:anywhere; }
  .opt small{ display:block; color:var(--faint); font-size:12px; font-weight:400; }
  .pe .maxnote{ font-size:12.5px; color:var(--soft); margin:6px 2px 0; }
  .sws{ margin-top:8px; border:1px solid var(--line); border-radius:10px; padding:2px 12px; }
  .sw{ display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); cursor:pointer; font-size:14px; }
  .sws > .sw:first-child{ border-top:0; }
  .sw > span{ flex:1; min-width:0; }
  .sw small{ display:block; color:var(--faint); font-size:12px; }
  input.tog[type=checkbox]{ -webkit-appearance:none; appearance:none; width:40px; height:24px; border-radius:12px; background:#d6ccc2; position:relative; flex:none; cursor:pointer; transition:background .15s; border:0; }
  input.tog[type=checkbox]::after{ content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:left .15s; }
  input.tog[type=checkbox]:checked{ background:var(--accent); }
  input.tog[type=checkbox]:checked::after{ left:19px; }
  .tog:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  input.tog.sm[type=checkbox]{ width:34px; height:20px; border-radius:10px; }
  input.tog.sm[type=checkbox]::after{ width:14px; height:14px; }
  input.tog.sm[type=checkbox]:checked::after{ left:17px; }
  .maxrow{ display:flex; align-items:center; gap:6px 8px; flex-wrap:wrap; font-size:13px; color:var(--soft); padding:0 0 10px; }
  .maxrow input{ width:68px; padding:6px 8px; font-size:14px; }
  .maxrow input:disabled{ opacity:.5; }
  /* dialogs */
  #modal{ position:fixed; inset:0; background:rgba(30,22,15,.4); display:none; align-items:center; justify-content:center; padding:12px; z-index:20; }
  #modal.show{ display:flex; }
  .dlg{ background:var(--card); border-radius:14px; box-shadow:0 20px 60px rgba(30,20,10,.3); width:100%; max-width:480px; max-height:calc(100vh - 24px); max-height:calc(100dvh - 24px); overflow:auto; padding:20px; }
  .dlg.wide{ max-width:680px; }
  .dlg .msub{ color:var(--soft); font-size:13.5px; margin-top:2px; overflow-wrap:anywhere; }
  .dlg .lead{ font-size:14px; color:var(--ink); margin:14px 0; }
  .dlg .foot{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:18px; }
  .dlg .fld{ margin-top:14px; }
  .dlg input:disabled{ background:#f6f1ec; color:var(--soft); cursor:not-allowed; }
  .dlg .lbl{ display:block; font-size:13px; font-weight:600; color:var(--soft); margin-bottom:6px; }
  .info{ font-size:13px; background:#fff5e2; border:1px solid #efd7a6; color:#5e4613; border-radius:10px; padding:9px 12px; margin-top:12px; }
  .okbox{ font-size:14px; background:var(--good-soft); border:1px solid #bcdcc6; border-radius:10px; padding:11px 13px; margin-top:14px; }
  .seg{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg .opt{ margin-top:0; flex:1 1 auto; justify-content:center; padding:8px 10px; font-size:14px; }
  .picklist{ max-height:46vh; overflow:auto; margin-top:10px; padding-right:2px; }
  .prev{ margin-top:14px; font-size:14px; }
  .fset{ text-align:left; margin-top:6px; }
  .fset .fl{ display:block; font-size:12.5px; font-weight:600; color:var(--soft); margin:12px 0 4px; }
  .fset .chk{ display:flex; gap:10px; align-items:flex-start; font-size:13.5px; line-height:1.45; margin-top:16px; cursor:pointer; }
  .fset .chk input{ margin-top:3px; }
  .fset .hint{ margin-top:5px; }
  /* the event card: its buttons, the client, the venue's notes, the next step, the timeline */
  .cstage{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-top:10px; font-size:13px; color:var(--soft); }
  .cacts{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .cacts .btn{ padding:7px 11px; font-size:13px; }
  .cbox{ background:#f6f1ec; border-radius:10px; padding:11px 13px; margin-top:12px; }
  .clbl{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 8px; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:7px; }
  .clbl .hint{ display:inline; margin:0; font-weight:400; }
  .saved{ font-weight:500; color:var(--faint); font-size:12.5px; }
  .saved.err{ color:var(--danger); }
  .cgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px; }
  .cgrid input, .steprow input, .cbox textarea{ font-size:14.5px; padding:8px 10px; }
  .crow{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
  .steprow{ display:flex; flex-wrap:wrap; gap:8px; }
  .steprow input[type=text]{ flex:1 1 220px; }
  .steprow input[type=date]{ flex:0 1 170px; }
  .match{ background:#fff5e2; border:1px solid #efd7a6; border-radius:10px; padding:9px 12px; margin-top:10px; font-size:13.5px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
  .match span{ min-width:0; overflow-wrap:anywhere; }
  .subh{ font-weight:700; font-size:14px; margin:18px 0 2px; }
  .tl{ list-style:none; margin:4px 0 0; padding:0; font-size:13.5px; }
  .tl li{ display:flex; gap:10px; align-items:baseline; padding:5px 0; border-top:1px dashed var(--line); }
  .tl li:first-child{ border-top:none; }
  .tl time{ flex:0 0 132px; color:var(--faint); font-size:12px; }
  .tl .tw{ flex:1; min-width:0; overflow-wrap:anywhere; color:var(--soft); }
  .linkbtn{ font:inherit; font-size:13px; background:none; border:0; color:var(--accent-ink); cursor:pointer; padding:4px 0; text-decoration:underline; }
  #toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#2a2620; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; max-width:calc(100vw - 32px); text-align:center; }
  #toast.show{ opacity:1; }
  /* on a phone the sheet's rows become cards: a label before each field, thumbs for buttons */
  @media (max-width:700px){
    .chip{ padding:9px 13px; }
    table.sheet thead{ display:none; }
    table.sheet, table.sheet tbody, table.sheet tr, table.sheet td{ display:block; width:100%; }
    table.sheet tr{ padding:12px 14px; border-top:1px solid var(--line); }
    table.sheet tbody tr:first-child{ border-top:0; }
    table.sheet td, table.sheet td:first-child, table.sheet td:last-child{ border:0; padding:2px 0; }
    table.sheet td[data-l]{ display:flex; gap:10px; align-items:baseline; }
    table.sheet td[data-l]::before{ content:attr(data-l); flex:0 0 88px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); font-weight:700; }
    table.sheet td[data-l] > div{ flex:1; min-width:0; }
    table.sheet td.ce{ display:none; }   /* an empty field only lengthens the card */
    table.sheet tr.row:hover td{ background:none; }
    table.sheet td.acts{ display:flex; gap:8px; text-align:left; padding-top:8px; }
    table.sheet td.acts .btn{ flex:1 1 auto; min-height:40px; font-size:14px; }
    .reach{ gap:8px; }
    .reach .btn{ min-height:40px; min-width:44px; padding:8px 12px; font-size:14px; }   /* a thumb, not a cursor */
    .sheettools{ flex:1 1 100%; }
    .sheettools input{ flex:1 1 100%; width:auto; }
    .cacts .btn, .cbox .btn{ min-height:40px; padding:8px 12px; font-size:14px; }
    .tl li{ flex-wrap:wrap; gap:0 10px; } .tl time{ flex-basis:100%; }
  }
  @media (max-width:560px){
    .wrap{ padding:18px 14px 36px; }
    .list-h{ flex-wrap:wrap; }
    .datefld{ flex:1 1 auto; }
    .datefld input{ flex:1; }
    .sec{ padding:16px 14px; }
    .dlg{ padding:18px 16px; }
  }
</style>
</head>

<div class="wrap" id="app"></div>
<footer class="legal"><a href="#help" data-help>Βοήθεια</a> · <a href="/privacy.html" target="_blank" rel="noopener">Πολιτική απορρήτου</a> · <a href="/terms.html" target="_blank" rel="noopener">Όροι χρήσης</a> · <a href="/dpa.html" target="_blank" rel="noopener">Σύμβαση επεξεργασίας (DPA)</a></footer>
<div id="modal" role="presentation"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mTitle"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const SYNC_URL = "";   // same-origin (self-hosted takeaseat.gr). The Cloudflare-worker fallback is retired.
const KEY_STORE="weddingVenueKey", LANG_STORE="weddingVenueLinkLang";
const app=document.getElementById("app");
const getKey=()=>{ try{ return localStorage.getItem(KEY_STORE)||""; }catch(e){ return ""; } };
const setKey=k=>{ try{ k?localStorage.setItem(KEY_STORE,k):localStorage.removeItem(KEY_STORE); }catch(e){} };
const vidOf=k=>(k||"").split(".")[0];
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(m,ms){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),ms||1800); }
function fmtDate(ms){ try{ return new Date(ms).toLocaleDateString("el-GR",{day:"2-digit",month:"short",year:"numeric"}); }catch(e){ return ""; } }
function fmtDT(ms,withYear){ try{ return new Date(ms).toLocaleString("el-GR",{day:"numeric",month:"short",...(withYear?{year:"numeric"}:{}),hour:"2-digit",minute:"2-digit",hourCycle:"h23"}); }catch(e){ return ""; } }
// Wedding dates are "YYYY-MM-DD" in Athens; lock/delete times are Athens midnights (ms) — shown as Athens days everywhere.
const DAY=86400000, DATE_AHEAD=730;
function ymdDate(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3],12)):null; }
function fmtYMD(s,wd){ const d=ymdDate(s); if(!d) return ""; try{ return d.toLocaleDateString("el-GR",{timeZone:"UTC",...(wd?{weekday:"short"}:{}),day:"numeric",month:"short",year:"numeric"}); }catch(e){ return s; } }
function fmtAth(ms){ try{ return new Date(ms).toLocaleDateString("el-GR",{timeZone:"Europe/Athens",day:"numeric",month:"short",year:"numeric"}); }catch(e){ return fmtDate(ms); } }
function todayAthens(){ try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Athens",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }catch(e){ return new Date().toISOString().slice(0,10); } }
function addDays(s,n){ const d=ymdDate(s); if(!d) return ""; d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
const ymdOk=s=>typeof s==="string" && !!ymdDate(s) && addDays(s,0)===s;   // a real calendar day, not e.g. 2026-02-30
const dayDiff=(a,b)=>Math.round((ymdDate(b)-ymdDate(a))/DAY);
const RTF=(()=>{ try{ return new Intl.RelativeTimeFormat("el",{numeric:"auto"}); }catch(e){ return null; } })();
function untilText(s){ const n=dayDiff(todayAthens(),s); if(!RTF||!Number.isFinite(n)) return ""; return n<=60?RTF.format(n,"day"):RTF.format(Math.round(n/30.44),"month"); }
function agoText(ms){ const s=(Date.now()-ms)/1000; if(s<60) return "μόλις τώρα"; if(!RTF) return fmtDT(ms);
  if(s<3600) return RTF.format(-Math.floor(s/60),"minute"); if(s<DAY/1000) return RTF.format(-Math.floor(s/3600),"hour");
  if(s<7*DAY/1000) return RTF.format(-Math.floor(s*1000/DAY),"day"); return "στις "+fmtDate(ms); }
const timesText=n=>n===1?"1 φορά":`${n} φορές`;

// ---- API ----
async function api(path, opts={}){
  return fetch(SYNC_URL+path, { ...opts, headers:{ "Content-Type":"application/json", "X-Venue-Key":getKey(), ...(opts.headers||{}) } });
}
// → {ok, status, d, gone}. gone = our venue key no longer works (rotated elsewhere or reset by TakeaSeat): back to login.
async function call(method, path, body){
  let r; try{ r=await api(path,{ method, ...(body===undefined?{}:{ body:JSON.stringify(body) }) }); }
  catch(e){ toast("Σφάλμα σύνδεσης — δοκιμάστε ξανά."); return { ok:false, status:0, d:{}, net:true }; }
  const d=await r.json().catch(()=>({}));
  if(r.status===403 && d.error==="unauthorized" && path.startsWith("/venues/")){ signedOut("Ο κωδικός δεν ισχύει πλέον — συνδεθείτε με τον νέο σας κωδικό."); return { ok:false, status:403, d, gone:true }; }
  return { ok:r.ok, status:r.status, d };
}
// The public e-mail routes (/recover, /verify): no venue key is sent. → {ok, status, d}; status 0 = no connection.
async function pub(path, body){
  let r; try{ r=await fetch(SYNC_URL+path,{ method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) }); }
  catch(e){ return { ok:false, status:0, d:{} }; }
  return { ok:r.ok, status:r.status, d:await r.json().catch(()=>({})) };
}

function licenseBadge(v){
  const L=v.license||{};
  if(L.type==="per_wedding"){ const left=(L.quota||0)-(v.used||0);
    return `<span class="badge ${left<=0?'warn':'per'}">Ανά εκδήλωση · ${v.used||0}/${L.quota||"∞"} · απομένουν ${Math.max(0,left)}</span>`; }
  const s=ymdOk(L.seasonStart)?fmtYMD(L.seasonStart):"", e=ymdOk(L.seasonEnd)?fmtYMD(L.seasonEnd):"";
  // The free first year does not renew itself, so there is no switch to show — only when it ends and what then.
  if(v.trial && v.trial.inForce){
    const over=ymdOk(L.seasonEnd) && todayAthens()>L.seasonEnd;
    return `<span class="badge season">Δωρεάν πρώτος χρόνος${e?" έως "+esc(e):""}</span>`
      +`<span class="ended">${helpify(over
        ? "Ο δωρεάν χρόνος έληξε — τίποτα δεν διαγράφηκε· για νέες εκδηλώσεις επικοινωνήστε μαζί μας"
        : "Στη λήξη δεν διαγράφεται τίποτα· για νέες εκδηλώσεις μετά από τότε χρειάζεται συνδρομή — επικοινωνήστε μαζί μας")}</span>`;
  }
  const badge=`<span class="badge season">Σεζόν${s&&e?" "+esc(s)+" – "+esc(e):e?" έως "+esc(e):s?" από "+esc(s):""}${L.cap?` · μέχρι ${L.cap} ταυτόχρονα`:""}</span>`;
  // The season ended without a renewal (no reminder went out for it): only TakeaSeat renews now.
  if(L.renewSkipped) return badge+`<span class="ended">${helpify(`Η σεζόν έληξε στις ${ymdOk(L.renewSkipped)?fmtYMD(L.renewSkipped):e||"—"} — για ανανέωση επικοινωνήστε μαζί μας`)}</span>`;
  if(!e) return badge;
  // Seasonal licences renew by themselves (same dates next year, the day after seasonEnd) unless the venue turns it off.
  const on=L.autoRenew!==false, ended=todayAthens()>L.seasonEnd;
  return badge+`<label class="renew" title="Αυτόματη ανανέωση της συνδρομής"><input type="checkbox" class="tog sm" role="switch" id="autoRenew" aria-label="Αυτόματη ανανέωση" ${on?"checked":""}>
    <span>${on?`Ανανεώνεται αυτόματα στις ${esc(fmtYMD(addDays(L.seasonEnd,1)))}`:`Η συνδρομή ${ended?"έληξε":"λήγει"} στις ${esc(e)}`}</span></label>`;
}
// Why a new wedding can't be made — "επικοινωνήστε μαζί μας" becomes a link to the help panel (helpify).

  const L=(DATA&&DATA.venue.license)||{};

// ---- couple permissions (true = the couple may change it; maxSeats 0 = no limit) ----
const PERM_KEYS=["floor","decor","layout","tables","seats","labels"];
const ALL_OPEN={ floor:true, decor:true, layout:true, tables:true, seats:true, labels:true, maxSeats:0 };
const PERM_ROWS=[
  ["floor","Δάπεδο & μέγεθος χώρου"],
  ["decor","Στοιχεία του κτήματος (πίστα, μπαρ, μπουφέδες, WC…)","Τα δικά τους στοιχεία (photo booth, candy bar…) τα προσθέτουν πάντα."],
  ["layout","Θέσεις τραπεζιών"],
  ["tables","Προσθήκη / διαγραφή τραπεζιών"],
  ["seats","Αριθμός θέσεων ανά τραπέζι"],
  ["labels","Ονόματα τραπεζιών"] ];
const PRESETS=[
  ["guests","Μόνο καλεσμένους & θέσεις",{ floor:false, decor:false, layout:false, tables:false, seats:true, labels:false }],
  ["labels","+ ονόματα τραπεζιών",      { floor:false, decor:false, layout:false, tables:false, seats:true, labels:true }],
  ["free","Ελεύθερα",                   { floor:true, decor:true, layout:true, tables:true, seats:true, labels:true }] ];
const SUMMARY={ guests:"καλεσμένοι & θέσεις", labels:"καλεσμένοι, θέσεις & ονόματα τραπεζιών", free:"ελεύθερα" };
function normP(p){
  const o={}; for(const k of PERM_KEYS) o[k]=(p && typeof p[k]==="boolean")?p[k]:ALL_OPEN[k];
  const m=(p && p.maxSeats!=null && Number.isFinite(+p.maxSeats))?Math.round(+p.maxSeats):0;
  o.maxSeats=Math.max(0,Math.min(30,m||0)); return o;
}
const samePerms=(a,b)=>PERM_KEYS.every(k=>a[k]===b[k]) && a.maxSeats===b.maxSeats;
const matchPreset=p=>{ const m=PRESETS.find(([,,q])=>PERM_KEYS.every(k=>q[k]===p[k])); return m?m[0]:null; };   // maxSeats ignored
function permsSummary(p){ p=normP(p); const m=matchPreset(p); return (m?SUMMARY[m]:"προσαρμοσμένα")+(p.seats&&p.maxSeats?` · έως ${p.maxSeats} καρέκλες`:""); }
function peState(p){ const perms=normP(p); return { orig:{...perms}, perms, mode:matchPreset(perms)||"custom" }; }
function peHTML(pfx, st){
  const p=st.perms;
  const opt=(id,label)=>`<label class="opt ${st.mode===id?"on":""}"><input type="radio" name="${pfx}-mode" value="${id}" ${st.mode===id?"checked":""}><span>${esc(label)}</span></label>`;
  const sws=st.mode!=="custom"?"":`<div class="sws">${PERM_ROWS.map(([k,label,hint])=>`
      <label class="sw"><span>${esc(label)}${hint?`<small>${esc(hint)}</small>`:""}</span><input type="checkbox" class="tog" role="switch" data-k="${k}" ${p[k]?"checked":""}></label>
      ${k==="seats"?`<div class="maxrow"><span>Έως</span><input type="number" min="0" max="30" step="1" inputmode="numeric" data-max value="${p.maxSeats}" ${p.seats?"":"disabled"} aria-label="Μέγιστες καρέκλες ανά τραπέζι"><span>καρέκλες ανά τραπέζι (0 = χωρίς όριο)</span></div>`:""}`).join("")}</div>`;
  return `<div class="always">✓ Καλεσμένοι, ποιος κάθεται πού, ομάδες, προσκλητήρια, εκτύπωση</div>
    ${PRESETS.map(([id,label])=>opt(id,label)).join("")}${opt("custom","Προσαρμογή…")}
    ${st.mode!=="custom"&&p.seats&&p.maxSeats?`<div class="maxnote">Έως ${p.maxSeats} καρέκλες ανά τραπέζι</div>`:""}${sws}`;
}
function bindPE(root, pfx, st, onChange){
  const redraw=focusSel=>{ root.innerHTML=peHTML(pfx,st); onChange(); if(focusSel){ const el=root.querySelector(focusSel); if(el) el.focus(); } };
  const clampMax=v=>Math.max(0,Math.min(30,Math.round(+v)||0));
  root.onchange=e=>{
    const t=e.target;
    if(t.type==="radio"){
      const id=t.value, pr=PRESETS.find(x=>x[0]===id);
      if(pr){ Object.assign(st.perms, pr[2]); if(id==="free") st.perms.maxSeats=0; }
      st.mode=id; redraw(`input[value="${id}"]`);
    } else if(t.dataset.k){ st.perms[t.dataset.k]=t.checked; redraw(`input[data-k="${t.dataset.k}"]`); }
    else if(t.hasAttribute("data-max")){ st.perms.maxSeats=clampMax(t.value); t.value=st.perms.maxSeats; onChange(); }
  };
  root.oninput=e=>{ if(e.target.hasAttribute("data-max")){ st.perms.maxSeats=clampMax(e.target.value); onChange(); } };
}

  document.getElementById("key").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  document.getElementById("forgot").onclick=()=>renderForgot({});
  document.getElementById("signup").onclick=()=>renderSignup({});
}

// ---- signed-out screens (the login card): a forgotten key, and the links we e-mail ----
// venue.html#recover=<token> sets a new key (it is also the 7-day setup link of a new venue) · #verify=<token> confirms
// a new recovery email · #recover alone opens "send me a link". The token leaves the address at once and is only used
// on an explicit press (mail scanners open links).
const EMAIL_OK=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e) && e.length<=200;
const RATE_MSG="Πολλές αιτήσεις — δοκιμάστε ξανά σε λίγο.";
function screen(html){ loadSeq++; DATA=null; app.innerHTML=`<div class="card login">${html}</div>`; }   // also drops a console load in flight
const busy=()=>app.querySelectorAll("button").forEach(b=>b.disabled=true);
// Back to the console when this device is signed in, else to sign-in.
const backHTML=()=>`<button class="btn quiet" id="back" style="margin-top:10px">${getKey()?"← Στην κονσόλα":"← Σύνδεση με κωδικό"}</button>`;
function bindBack(){ const b=document.getElementById("back"); if(b) b.onclick=()=>{ if(getKey()) load(); else renderLogin(); }; }
// One nonce per link and tab: a retry after a lost answer is recognised as the same device.
function tokenNonce(kind, token){
  const nk="weddingVenue."+kind+"Nonce."+String(token).slice(0,10), fresh=()=>{ const a=new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,"0")).join(""); };
  let n=""; try{ n=sessionStorage.getItem(nk)||""; if(!n){ n=fresh(); sessionStorage.setItem(nk,n); } }catch(e){ n=n||fresh(); }
  return n;
}
function linkFromHash(){
  const h=location.hash, get=k=>{ const m=h.match(new RegExp("(?:^#|&)"+k+"=([^&]+)")); if(!m) return ""; try{ return decodeURIComponent(m[1]); }catch(e){ return m[1]; } };
  const rtok=get("recover"), vtok=get("verify"), ask=/(?:^#|&)recover(?:&|$)/.test(h), sign=/(?:^#|&)signup(?:&|$)/.test(h);
  if(!rtok && !vtok && !ask && !sign) return false;
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  closeModal();
  if(rtok) renderRecoverKey({ token:rtok, nonce:tokenNonce("rec",rtok) });
  else if(vtok) renderVerify({ token:vtok, nonce:tokenNonce("ver",vtok) });
  else if(sign) renderSignup({});
  else renderForgot({});
  return true;
}
// A message about a link, with "try again" (same nonce) or "send me a new link" when they help.
function linkMsg(title, text, o){
  screen(`<h1>${esc(title)}</h1><p>${esc(text)}</p>
    ${o.retry?`<div class="row"><button class="btn primary" id="lRetry" style="flex:1">Ξανά</button></div>`:""}
    ${o.again?`<div class="row"><button class="btn primary" id="lAgain" style="flex:1">Στείλτε μου νέο σύνδεσμο</button></div>`:""}${backHTML()}`);
  bindBack();
  if(o.retry) document.getElementById("lRetry").onclick=o.retry;
  if(o.again) document.getElementById("lAgain").onclick=()=>renderForgot({});
}
// What went wrong with a link → the message (null = no answer / server trouble: worth another try).
function linkErr(r){
  if(r.d.error==="token_used") return "Αυτός ο σύνδεσμος έχει ήδη χρησιμοποιηθεί"+(r.d.at?` (${fmtDT(r.d.at)})`:"")+".";
  if(r.d.error==="token_expired") return "Ο σύνδεσμος έληξε.";
  if(r.d.error==="token_invalid"||r.status===404) return "Ο σύνδεσμος δεν είναι έγκυρος — ίσως αντιγράφηκε μισός.";
  return null;
}

function renderForgot(st){
  if(st.step==="sent"){
    screen(`<h1>Ελέγξτε το email σας</h1>
      <p>Αν το email είναι καταχωρημένο, θα λάβετε σύνδεσμο σε λίγα λεπτά (δείτε και τα ανεπιθύμητα). Ισχύει μία ώρα.</p>${backHTML()}`);
    bindBack(); return;
  }
  if(st.step==="off"){   // no mail on this server: a person sends the new key
    const body=`Γεια σας,\n\nΧρειάζομαι νέο κωδικό για την κονσόλα του κτήματος${st.email?` (email: ${st.email})`:""}.\n\nΕυχαριστώ`;
    const href="mailto:info@takeaseat.gr?subject="+encodeURIComponent("Νέος κωδικός κονσόλας")+"&body="+encodeURIComponent(body.replace(/\n/g,"\r\n"));
    screen(`<h1>Ξεχάσατε τον κωδικό;</h1>
      <p>Η αποστολή email δεν είναι διαθέσιμη αυτή τη στιγμή. Γράψτε μας στο <a href="${esc(href)}">info@takeaseat.gr</a> και θα σας στείλουμε νέο κωδικό.</p>
      <div class="row"><a class="btn primary" href="${esc(href)}" style="flex:1">✉️ Email στην TakeaSeat</a></div>${backHTML()}`);
    bindBack(); return;
  }
  screen(`<h1>Ξεχάσατε τον κωδικό;</h1>
    <p>Γράψτε το email του κτήματος. Θα σας στείλουμε σύνδεσμο για να ορίσετε νέο κωδικό.</p>
    <input id="remail" type="email" autocomplete="email" inputmode="email" maxlength="200" placeholder="Email κτήματος" value="${esc(st.email||"")}">
    ${st.err?`<div class="hint" style="color:var(--danger);margin-top:8px">${esc(st.err)}</div>`:""}
    <div class="row"><button class="btn primary" id="rSend" style="flex:1">Στείλτε μου σύνδεσμο</button></div>${backHTML()}`);
  bindBack();
  const inp=document.getElementById("remail"), btn=document.getElementById("rSend");
  inp.focus(); if(inp.value){ const t=inp.value; inp.value=""; inp.value=t; }   // caret at the end (type=email has no setSelectionRange)
  const go=async()=>{
    if(btn.disabled) return;
    const email=inp.value.trim(); if(!EMAIL_OK(email)){ renderForgot({ email, err:"Ελέγξτε το email." }); return; }
    busy(); const my=loadSeq;
    const r=await pub("/recover",{ email, lang:"el" });
    if(my!==loadSeq) return;
    if(r.ok) renderForgot({ step:"sent" });
    else if(r.status===503) renderForgot({ step:"off", email });
    else renderForgot({ email, err:r.status===429?RATE_MSG:r.status===400?"Ελέγξτε το email.":r.status?"Κάτι πήγε στραβά — δοκιμάστε ξανά.":"Σφάλμα σύνδεσης — δοκιμάστε ξανά." });
  };
  btn.onclick=go;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
}

// ---- signup: a venue gives itself a console (index.html's venue CTA lands on venue.html#signup) ----
// The ΑΦΜ is checked here, properly, so a malformed one never becomes a request: nine digits whose last one is a
// check digit — the sum of d(i)·2^(9-i) over the first eight, mod 11, mod 10. The server checks it again.
const AFM_OK=x=>{ const s=String(x||"").replace(/[\s.\-]/g,""); if(!/^\d{9}$/.test(s)||s==="000000000") return "";
  let n=0; for(let i=0;i<8;i++) n+=Number(s[i])*(1<<(8-i));
  return (n%11)%10===Number(s[8])?s:""; };
const PHONE_OK=x=>{ const s=String(x||"").trim(), d=s.replace(/\D/g,"");
  return (s.length<=30 && /^[+(\d][\d\s()./+-]*$/.test(s) && d.length>=10 && d.length<=15)?s:""; };
const SIGNUP_FIELDS=[["suName","name"],["suAfm","afm"],["suEmail","email"],["suPhone","phone"]];
function readSignup(f){
  const o={ ...f };
  for(const [id,k] of SIGNUP_FIELDS){ const el=document.getElementById(id); if(el) o[k]=el.value.trim(); }
  const t=document.getElementById("suTerms"); if(t) o.terms=t.checked;
  return o;
}
function renderSignup(st){
  st=st||{}; const f=Object.assign({ name:"", afm:"", email:"", phone:"", terms:false }, st.f||{});
  if(st.step==="sent"){
    // The API answers the same thing whatever happened, so this screen must not promise what only one branch does.
    // In two of them the explanation goes to the address already on file — not to the one just typed here.
    screen(`<h1>Ελέγξτε το email σας</h1>
      <p>Αν η διεύθυνση <b style="overflow-wrap:anywhere">${esc(f.email)}</b> είναι σωστή, ο σύνδεσμος είναι ήδη καθ' οδόν. Ανοίξτε τον για να ορίσετε τον κωδικό της κονσόλας — ισχύει 7 ημέρες, και ο δωρεάν χρόνος μετράει από εκεί. Δείτε και τα ανεπιθύμητα.</p>
      <div class="note" style="text-align:left">Αν η επιχείρηση ή η διεύθυνση είναι ήδη καταχωρημένη, δεύτερος λογαριασμός δεν δημιουργείται: η εξήγηση πηγαίνει στη διεύθυνση που την καταχώρησε, όχι απαραίτητα σε αυτή. Αν δεν έρθει τίποτα, ή αν γράψατε λάθος ΑΦΜ, γράψτε μας στο <a href="mailto:info@takeaseat.gr">info@takeaseat.gr</a>.</div>
      ${backHTML()}`);
    bindBack(); return;
  }
  screen(`<h1>Εγγραφή κτήματος</h1>
    <p>Ο πρώτος χρόνος δωρεάν, μία φορά ανά επιχείρηση. Δεν ζητάμε στοιχεία πληρωμής.</p>
    <p class="note" style="text-align:left">365 ημέρες από τη στιγμή που θα ανοίξετε τον σύνδεσμο, για τις εκδηλώσεις — γάμους, βαπτίσεις και γιορτές — που <b>γίνονται</b> μέσα σε αυτές· εκδήλωση με ημερομηνία μετά τη λήξη δεν τη δημιουργείτε και δεν τη μεταφέρετε εκεί.<br>
      Στη λήξη δεν χρεώνεστε και δεν διαγράφεται τίποτα: η κονσόλα ανοίγει, οι εκδηλώσεις σας συνεχίζουν ως την ημερομηνία τους, για νέες χρειάζεται συνδρομή. Ειδοποίηση 60, 30 και 7 ημέρες πριν.</p>
    <div class="fset">
      <label class="fl" for="suName">Επωνυμία</label>
      <input id="suName" maxlength="120" autocomplete="organization" placeholder="π.χ. Κτήμα Ηλιοβασίλεμα" value="${esc(f.name)}">
      <label class="fl" for="suAfm">ΑΦΜ</label>
      <input id="suAfm" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="9 ψηφία" value="${esc(f.afm)}">
      <div class="hint">Δύο λόγοι: ο δωρεάν χρόνος δίνεται μία φορά ανά επιχείρηση, και σε αυτό εκδίδεται το τιμολόγιο.</div>
      <label class="fl" for="suEmail">Email</label>
      <input id="suEmail" type="email" inputmode="email" maxlength="200" autocomplete="email" placeholder="εκεί πάει ο σύνδεσμος" value="${esc(f.email)}">
      <label class="fl" for="suPhone">Τηλέφωνο</label>
      <input id="suPhone" type="tel" inputmode="tel" maxlength="30" autocomplete="tel" placeholder="π.χ. 210 987 6543" value="${esc(f.phone)}">
      <label class="chk" for="suTerms"><input type="checkbox" id="suTerms" ${f.terms?"checked":""}>
        <span>Αποδέχομαι τους <a href="/terms.html" target="_blank" rel="noopener">Όρους</a> και την <a href="/privacy.html" target="_blank" rel="noopener">Πολιτική απορρήτου</a>.</span></label>
    </div>
    ${st.err?`<div class="hint" style="color:var(--danger);margin-top:10px;text-align:left">${esc(st.err)}</div>`:""}
    <div class="row"><button class="btn primary" id="suGo" style="flex:1">Εγγραφή</button></div>${backHTML()}`);
  bindBack();
  const go=()=>doSignup(readSignup(f));
  document.getElementById("suGo").onclick=go;
  for(const [id] of SIGNUP_FIELDS) document.getElementById(id).addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  const first=document.getElementById(st.focus||"suName"); if(first) first.focus();
}
async function doSignup(f){
  if(!f.name){ renderSignup({ f, err:"Γράψτε την επωνυμία του κτήματος.", focus:"suName" }); return; }
  if(!AFM_OK(f.afm)){ renderSignup({ f, err:"Το ΑΦΜ δεν είναι σωστό — εννέα ψηφία, με σωστό ψηφίο ελέγχου.", focus:"suAfm" }); return; }
  if(!EMAIL_OK(f.email)){ renderSignup({ f, err:"Ελέγξτε το email.", focus:"suEmail" }); return; }
  if(!PHONE_OK(f.phone)){ renderSignup({ f, err:"Ελέγξτε το τηλέφωνο — 10 ψηφία, ή με κωδικό χώρας.", focus:"suPhone" }); return; }
  if(!f.terms){ renderSignup({ f, err:"Χρειάζεται να αποδεχθείτε τους Όρους.", focus:"suTerms" }); return; }
  busy(); const my=loadSeq;
  const r=await pub("/signup/venue",{ name:f.name, afm:AFM_OK(f.afm), email:f.email, phone:f.phone, terms:true, lang:"el" });
  if(my!==loadSeq) return;
  if(r.ok){ renderSignup({ f, step:"sent" }); return; }
  const err=r.d&&r.d.error;
  renderSignup({ f, err:
      r.status===429 ? RATE_MSG
    : r.status===503 ? "Η εγγραφή δεν είναι διαθέσιμη αυτή τη στιγμή. Γράψτε μας στο info@takeaseat.gr."
    : err==="bad_afm" ? "Το ΑΦΜ δεν είναι σωστό."
    : err==="bad_email" ? "Ελέγξτε το email."
    : err==="bad_phone" ? "Ελέγξτε το τηλέφωνο."
    : err==="bad_name" ? "Γράψτε την επωνυμία του κτήματος."
    : err==="terms_required" ? "Χρειάζεται να αποδεχθείτε τους Όρους."
    : r.status ? "Κάτι πήγε στραβά — δοκιμάστε ξανά." : "Σφάλμα σύνδεσης — δοκιμάστε ξανά." });
}

// #recover=<token>: a new random key for the console (the old one stops working). Shown once, then the console.
function renderRecoverKey(st){
  screen(`<h1>Νέος κωδικός κονσόλας</h1>
    <p>Πατήστε «Δημιουργία κωδικού»: θα δημιουργηθεί ένας νέος, τυχαίος κωδικός για την κονσόλα σας και θα συνδεθείτε αμέσως. Αν είχατε ήδη κωδικό, ο παλιός παύει να ισχύει.</p>
    <div class="row"><button class="btn primary" id="rGo" style="flex:1">Δημιουργία κωδικού</button></div>${backHTML()}`);
  bindBack();
  document.getElementById("rGo").onclick=()=>doRecoverKey(st);
}
async function doRecoverKey(st){
  busy(); const my=loadSeq;
  const r=await pub("/recover/venue",{ token:st.token, nonce:st.nonce });
  const key=r.ok && typeof r.d.key==="string" ? r.d.key : "";
  if(key){ setKey(key); resetUI(); showNewKey(key); return; }   // always, even if the page moved on: the old key no longer works
  if(my!==loadSeq) return;
  const err=linkErr(r);
  if(err) linkMsg("Νέος κωδικός κονσόλας", err+" Ζητήστε νέο με το email σας.", { again:true });
  else linkMsg("Νέος κωδικός κονσόλας", r.status===429?RATE_MSG:"Δεν ήταν δυνατή η σύνδεση — δοκιμάστε ξανά.", { retry:()=>doRecoverKey(st) });
}
function showNewKey(key){

// #verify=<token>: the venue confirms a new recovery email (asked for in the console).
function renderVerify(st){
  screen(`<h1>Επιβεβαίωση email</h1>

async function doVerify(st){
  busy(); const my=loadSeq;
  const r=await pub("/verify",{ token:st.token, nonce:st.nonce });
  if(my!==loadSeq) return;
  if(r.ok && r.d.email){
    const signed=!!getKey();
    screen(`<h1>Επιβεβαίωση email</h1>

}

// From 30 days before the wedding (life.fullAt, an Athens midnight) the couple may also move/add tables, floor and decor —
// within the wedding's permissions. Before that: names and seats on the existing tables only. The venue always edits everything.
const arranges=w=>{ const p=normP(w.perms); return !w.layoutSet || p.floor || p.decor || p.layout || p.tables; };   // no saved space yet: no limits apply
const fmtAt=x=>typeof x==="number"?fmtAth(x):ymdOk(x)?fmtYMD(x):"";
function fullLine(w){

  const d=UI.def, save=$("saveDef");

  bindPE($("defPE"),"def",d,refresh); refresh();
  if($("applyAll")) $("applyAll").onchange=e=>{ d.applyAll=e.target.checked; refresh(); };
  save.onclick=async()=>{
    const n=(DATA.weddings||[]).length, all=!!(d.applyAll&&n);
    if(all && !confirm(n===1?"Τα δικαιώματα θα αλλάξουν και στην υπάρχουσα εκδήλωση. Συνέχεια;":`Τα δικαιώματα θα αλλάξουν και στις ${n} υπάρχουσες εκδηλώσεις — και σε όσες είχατε ρυθμίσει ξεχωριστά. Συνέχεια;`)) return;
    save.disabled=true;
    const r=await call("PUT","/venues/"+v.id+"/defaults",{ perms:d.perms, applyToAll:all });
    if(r.gone) return;
    if(!r.ok){ toast("Αποτυχία αποθήκευσης"); refresh(); return; }
    UI.def=null; DATA.defaultPerms=r.d.defaultPerms;
    toast(!all?"Αποθηκεύτηκε — ισχύει για τις νέες εκδηλώσεις":r.d.applied===1?"Αποθηκεύτηκε — ισχύει για τις νέες εκδηλώσεις και για την υπάρχουσα":`Αποθηκεύτηκε — ισχύει για τις νέες εκδηλώσεις και για ${r.d.applied} υπάρχουσες`,2600);

  // new wedding

  const pickedKind=()=>(newkind && EVW[newkind.value])?newkind.value:"wedding";
  if(newkind) newkind.onchange=()=>{   // the form says what it is about to make, before it makes it

    if(date<newdate.min || date>newdate.max){ toast(DATE_ERR.bad_date,3000); newdate.focus(); return; }
    create.disabled=true;
    const r=await call("POST","/venues/"+v.id+"/weddings",{ label, date, kind });
    if(r.gone) return;
    if(r.ok){ newlabel.value=""; newdate.value=""; toast(K.created+(r.d.fromTemplate?" από τον χώρο σας":"")); load(); }
    else{ if(!r.net) toast(DATE_ERR[r.d.error]||reasonText(r.d.error)||"Αποτυχία δημιουργίας",3200); create.disabled=false;
      if(DATE_ERR[r.d.error]) newdate.focus(); if(r.status===403) load(); }
  };
  create.onclick=doCreate;
  newlabel.addEventListener("keydown",e=>{ if(e.key==="Enter") doCreate(); });
  newdate.addEventListener("keydown",e=>{ if(e.key==="Enter") doCreate(); });

  // the sheet's rows: a tap opens the event card (or a past client's card); a call, Viber or mail link does its own thing
  const list=$("list");
  list.addEventListener("click",e=>{
    if(e.target.closest("a")) return;
    const tr=e.target.closest("tr.row"); if(!tr) return;
    if(tr.dataset.cid){ clientCard(tr.dataset.cid); return; }
    const w=findW(tr.dataset.id); if(!w) return;
    const b=e.target.closest("button[data-a]");
    if(b) rowAction(w, b.dataset.a); else eventCard(w.planId);
  });
  list.addEventListener("keydown",e=>{ if((e.key==="Enter" || e.key===" ") && e.target.matches("tr.row")){ e.preventDefault(); e.target.click(); } });
}

// The event's timeline in words. The server sends codes and times, never a device and never a guest.
function tlWords(e, w){
  const K=EV(w), by=who=>who==="venue"?" — από εσάς":who==="couple"?" — από "+K.custA:who==="support"?" — από την υποστήριξη TakeaSeat":who==="admin"?" — από την TakeaSeat":"";
  const times=e.n>1?` (${e.n} φορές)`:"";
  switch(e.code){
    case "created": return "Δημιουργήθηκε η εκδήλωση";
    case "sent": return "Αντιγράψατε τον σύνδεσμο για "+K.custA;
    case "seen": return "Πρώτο άνοιγμα του συνδέσμου από "+K.custA;
    case "saved": return "Τελευταία αλλαγή από "+K.custA;
    case "notes_gone": return "Οι σημειώσεις των καλεσμένων σβήστηκαν, την επομένη της εκδήλωσης";
    case "audit": switch(e.what){
      case "date": return "Ημερομηνία: "+(e.d?fmtYMD(e.d):"—")+by(e.who);
      case "rotate": return "Νέος σύνδεσμος πελάτη"+by(e.who);
      case "invite": return "Πρόσβαση στην υποστήριξη TakeaSeat"+(e.h?" για "+(e.h>24 && e.h%24===0?e.h/24+" ημέρες":e.h+" ώρες"):"")+by(e.who);
      case "revoke": return "Τέλος της πρόσβασης της υποστήριξης"+by(e.who);
      case "open": return "Η υποστήριξη TakeaSeat άνοιξε το σχέδιο"+times;
      case "save": return "Η υποστήριξη TakeaSeat έκανε αλλαγές"+times;
      case "restore": return "Η υποστήριξη TakeaSeat επανέφερε παλιότερη έκδοση";
      case "locked": return "Η εκδήλωση πέρασε — το σχέδιο έμεινε μόνο για ανάγνωση";
      case "amelie": return "Σύνδεση με την Amelie"+by(e.who);
      case "amelie_off": return "Αποσύνδεση από την Amelie"+by(e.who);
      case "find_on": return "Άνοιξε το QR «Βρες το τραπέζι σου»"+by(e.who);
      case "find_off": return "Έκλεισε το QR «Βρες το τραπέζι σου»"+by(e.who);
    }
  }
  return "";

        +(shown.length<tl.length?`<button class="linkbtn" data-k="tl_all">Όλο το ιστορικό (${tl.length})</button>`:""):`<div class="muted">Τίποτα ακόμη.</div>`);
  } else if(c){

    h+=`<div class="note">Τα στοιχεία κρατιούνται ${yearsText(m.years||5)} μετά την τελευταία εκδήλωση του πελάτη και διαγράφονται αυτόματα στις <b>${esc(fmtYMD(m.forgetAt))}</b>. Αυτό αλλάζει από τη «Μνήμη πελατών», κάτω από τις εκδηλώσεις.</div>`;

const footHTML=(st,w)=>(st.client?`<button class="btn danger" data-k="forget" style="margin-right:auto">${w?"Διαγραφή στοιχείων πελάτη…":"Διαγραφή πελάτη τώρα…"}</button>`:"")+`<button class="btn" data-close>Κλείσιμο</button>`;

function drawCard(st){
  const w=st.planId?findW(st.planId):null;
  if(st.planId && !w){ closeModal(); return; }
  const box=openModal(cardHTML(st,w), true);
  CARD={ ...st, tlAll:false, chain:Promise.resolve() };
  const el=box.querySelector("#cNotes");
  CARD.notes={ card:CARD, el, st:box.querySelector("#cNotesSt"), last:el.value, timer:null, busy:null, pending:null };
  el.oninput=()=>{ const n=CARD && CARD.notes; if(!n) return; clearTimeout(n.timer); n.timer=setTimeout(()=>saveNotes(n),900); };
  el.onblur=()=>{ if(CARD && CARD.notes) saveNotes(CARD.notes); };
  box.querySelector("#card").onclick=onCardClick;
  bindCardInputs();
}
// Redraw parts of the card after a save, never the notes: they may be mid-sentence.
function redrawCard(parts){
  if(!CARD) return;
  const w=CARD.planId?findW(CARD.planId):null; if(CARD.planId && !w) return;
  const P=parts||["head","client","step","more","foot"], set=(id,h)=>{ const el=dlgBox.querySelector(id); if(el) el.innerHTML=h; };
  if(P.includes("head")) set("#cHead",cardHeadHTML(CARD,w));
  if(P.includes("client")) set("#cClient",clientBoxHTML(CARD,w));
  if(P.includes("step")) set("#cStep",stepBoxHTML(CARD));
  if(P.includes("more")) set("#cMore",moreHTML(CARD,w));
  if(P.includes("foot")) set("#cFoot",footHTML(CARD,w));
  bindCardInputs();
}
function bindCardInputs(){
  const q=s=>dlgBox.querySelector(s), save=q('[data-k="cli_save"]');
  ["#cName","#cPhone","#cEmail"].forEach(id=>{ const i=q(id); if(!i) return;
    i.oninput=()=>{ if(save) save.disabled=false; };
    i.onkeydown=e=>{ if(e.key==="Enter" && save && !save.disabled) save.click(); }; });
  ["#cStepText","#cStepDue"].forEach(id=>{ const i=q(id); if(i) i.onkeydown=e=>{ if(e.key==="Enter"){ const b=q('[data-k="step_save"]'); if(b) b.click(); } }; });
}
// The card's writes go one at a time: the first may create the card, the next must find it.
function cardWrite(C, method, path, body){
  const p=C.chain.then(()=>call(method, path, body));
  C.chain=p.catch(()=>{});
  return p;
}
const clientPath=C=>C.planId?"/venues/"+DATA.venue.id+"/weddings/"+encodeURIComponent(C.planId)+"/client":"/venues/"+DATA.venue.id+"/clients/"+encodeURIComponent(C.cid);
async function putClient(C, body){
  const r=await cardWrite(C, "PUT", clientPath(C), body);
  if(r.ok && r.d.client){ C.client=r.d.client; syncRowClient(C); }
  return r;
}
// The sheet's row follows the card at once, without reloading everything.
function syncRowClient(C){
  if(!DATA) return;
  const c=C.client, row=c?{ id:c.id, name:c.name, phone:c.phone, email:c.email, next:c.next }:null;
  if(C.planId){ const w=findW(C.planId); if(w) w.client=row; }
  else { const i=(DATA.clients||[]).findIndex(x=>x.id===C.cid); if(i>=0){ if(row) Object.assign(DATA.clients[i], row); else DATA.clients.splice(i,1); } }
  redrawSheet();
}
function saveNotes(n){
  clearTimeout(n.timer); n.timer=null;
  const val=n.el.value;
  if(val===n.last) return Promise.resolve();
  if(n.busy && n.pending===val) return n.busy;
  n.pending=val; n.st.textContent="αποθηκεύεται…"; n.st.classList.remove("err");
  const p=n.busy=putClient(n.card, { notes:val }).then(r=>{
    if(n.busy===p) n.busy=null;
    if(r.ok){ n.last=val; if(n.el.value===val) n.st.textContent="αποθηκεύτηκε ✓"; if(CARD===n.card) redrawCard(["foot"]); }
    else { n.st.textContent="δεν αποθηκεύτηκε — γράψτε κάτι για να ξαναδοκιμάσει"; n.st.classList.add("err"); if(!r.net && !r.gone) toast("Οι σημειώσεις δεν αποθηκεύτηκαν"); }
  });
  return p;
}
function flushCardNotes(){ const n=CARD && CARD.notes; if(n && n.el.value!==n.last) saveNotes(n); }
async function onCardClick(e){
  const C=CARD; if(!C) return;
  const b=e.target.closest("button[data-a],button[data-k]"); if(!b || b.disabled) return;
  const q=s=>dlgBox.querySelector(s);
  if(b.dataset.a){ const w=findW(C.planId); if(w) rowAction(w, b.dataset.a); return; }
  const k=b.dataset.k;
  if(k==="tl_all"){ C.tlAll=true; redrawCard(["more"]); return; }
  if(k==="goto"){ eventCard(b.dataset.id); return; }
  if(k==="cli_save"){
    const st=q("#cCliSt"), body={ name:q("#cName").value.trim(), phone:q("#cPhone").value.trim(), email:q("#cEmail").value.trim() };
    const bad=(msg,id)=>{ st.textContent=msg; st.classList.add("err"); q(id).focus(); };
    if(body.phone && !PHONE_OK(body.phone)) return bad("Ελέγξτε το τηλέφωνο — 10 ψηφία, ή με κωδικό χώρας.","#cPhone");
    if(body.email && !EMAIL_OK(body.email)) return bad("Ελέγξτε το email.","#cEmail");
    b.disabled=true; st.textContent="αποθηκεύεται…"; st.classList.remove("err");
    const r=await putClient(C, body);
    if(CARD!==C) return;
    if(!r.ok){ b.disabled=false; if(r.d.error==="bad_phone") return bad("Ελέγξτε το τηλέφωνο — 10 ψηφία, ή με κωδικό χώρας.","#cPhone");
      if(r.d.error==="bad_email") return bad("Ελέγξτε το email.","#cEmail");
      st.textContent=r.d.error==="too_many"?"Έχετε φτάσει το όριο των καρτελών πελατών — επικοινωνήστε μαζί μας.":"δεν αποθηκεύτηκε — δοκιμάστε ξανά"; st.classList.add("err"); return; }
    redrawCard(["head","client","more","foot"]);
    const s2=q("#cCliSt"); if(s2) s2.textContent="αποθηκεύτηκε ✓";
    return;
  }
  if(k==="step_save" || k==="step_done"){
    let next=null;
    if(k==="step_save"){
      const t=q("#cStepText"), d=q("#cStepDue"), text=t.value.trim();
      if(!text){ toast("Γράψτε ποιο είναι το επόμενο βήμα"); t.focus(); return; }
      if(d.validity && d.validity.badInput){ toast("Η ημερομηνία δεν είναι ολόκληρη"); d.focus(); return; }
      next={ text, due:d.value||null };
    }
    b.disabled=true;
    const r=await putClient(C, { next });
    if(CARD!==C) return;
    b.disabled=false;
    if(!r.ok){ if(!r.net) toast("Δεν αποθηκεύτηκε — δοκιμάστε ξανά."); return; }
    redrawCard(["head","step","foot"]); toast(next?"Αποθηκεύτηκε":"Έγινε");
    return;
  }
  if(k==="join"){
    const from=b.dataset.from, m=((C.client||{}).matches||[]).find(x=>x.id===from); if(!m || !C.client) return;
    if(!confirm(`Να γίνουν οι δύο καρτέλες μία;\n\nΟι εκδηλώσεις και οι σημειώσεις της καρτέλας «${m.name||m.phone||m.email}» περνούν σε αυτή. Στο όνομα, στο τηλέφωνο, στο email και στο επόμενο βήμα μένουν όσα γράφτηκαν πιο πρόσφατα.`)) return;
    if(C.notes) await saveNotes(C.notes);
    b.disabled=true;
    const r=await cardWrite(C, "POST", "/venues/"+DATA.venue.id+"/clients/"+encodeURIComponent(C.client.id)+"/join", { from });
    if(CARD!==C) return;
    if(!r.ok){ b.disabled=false; if(!r.net) toast(r.status===404?"Η άλλη καρτέλα δεν υπάρχει πια":"Δεν έγινε — δοκιμάστε ξανά."); return; }
    C.client=r.d.client;
    if(C.notes){ C.notes.el.value=C.client.notes||""; C.notes.last=C.notes.el.value; C.notes.st.textContent=""; }
    redrawCard(); toast("Οι καρτέλες έγιναν μία"); load();
    return;
  }
  if(k==="forget"){
    const c=C.client; if(!c) return;
    const nm=c.name||c.phone||c.email, others=c.events.filter(e=>e.planId!==C.planId).length+c.past.length;
    if(!confirm(`Να διαγραφούν τα στοιχεία του πελάτη${nm?` «${nm}»`:""};\n\nΣβήνονται το όνομα, το τηλέφωνο, το email, οι σημειώσεις σας και το επόμενο βήμα${others?", καθώς και το ποιες άλλες εκδηλώσεις έκανε εδώ":""}.${C.planId?" Η εκδήλωση και το σχέδιό της μένουν ως έχουν.":""}\n\nΔεν αναιρείται.`)) return;
    if(C.notes){ clearTimeout(C.notes.timer); C.notes.last=C.notes.el.value; }   // nothing left to save for someone erased
    b.disabled=true;
    const r=await cardWrite(C, "DELETE", "/venues/"+DATA.venue.id+"/clients/"+encodeURIComponent(c.id));
    if(CARD!==C) return;
    if(!r.ok && r.status!==404){ b.disabled=false; if(!r.net) toast("Δεν έγινε — δοκιμάστε ξανά."); return; }
    toast("Τα στοιχεία του πελάτη διαγράφηκαν");
    if(!C.planId){ C.notes=null; closeModal(); load(); return; }
    C.client=null; syncRowClient(C);
    if(C.notes){ C.notes.el.value=""; C.notes.last=""; C.notes.st.textContent=""; }
    redrawCard(); load();
  }
}

// ---- the wedding's name & date. The date decides when the plan locks and is deleted, so the server limits it:
// today … +2 years, the first date free then 3 changes, never removed, fixed once the wedding is over. ----
// On the free year the server refuses any date after its end — on a new wedding and on a change alike. The picker
// stops there too, so the dialog does not have to explain a refusal that could be avoided.
const trialEndYmd=()=>{ const t=DATA&&DATA.venue&&DATA.venue.trial, L=(DATA&&DATA.venue.license)||{};
  return (t&&t.inForce&&ymdOk(L.seasonEnd))?L.seasonEnd:""; };
const maxWeddingDate=(today,have)=>{ let m=addDays(today,DATE_AHEAD); const te=trialEndYmd();
  if(te&&te<m) m=te; if(have&&have>m) m=have; return m; };
const DATE_ERR={ bad_date:"Η ημερομηνία πρέπει να είναι από σήμερα έως δύο χρόνια μπροστά.",
  missing_date:"Ορίστε την ημερομηνία — χωρίς αυτήν δεν δημιουργείται εκδήλωση.",
  no_more_changes:"Η ημερομηνία έχει ήδη αλλάξει όσες φορές επιτρέπεται. Για νέα αλλαγή, γράψτε μας ή τηλεφωνήστε.",
  locked:"Η εκδήλωση έχει ολοκληρωθεί — δεν αλλάζει πια." };   // the server refuses name, perms and date once the wedding is over
function detailsDialog(w, focusDate){
  const L=w.life||{}, left=Math.max(0,w.dateChangesLeft|0), today=todayAthens(), max=maxWeddingDate(today,w.date);
  const dateOn=!L.locked && !isPast(w) && (!w.date || left>0);
  const keepDays=L.deleteAt&&L.lockAt?Math.round((L.deleteAt-L.lockAt)/DAY):null;
  let pickedKind=evKind(w);   // what the «Είδος» select shows now — the words follow it, not what is stored
  const EVp=()=>EVW[pickedKind];
  const leftText=d=>isPast(w)?EVp().made+" — η ημερομηνία δεν αλλάζει πλέον."
    :!w.date?"Η πρώτη ημερομηνία ορίζεται ελεύθερα· μετά αλλάζει έως 3 φορές."
    :!left?"Η ημερομηνία δεν αλλάζει άλλο από εδώ — για αλλαγή, γράψτε μας ή τηλεφωνήστε."
    :d&&d!==w.date?(left>1?`Μετά από αυτή την αλλαγή θα μπορείτε να την αλλάξετε ακόμη ${timesText(left-1)}.`:"Αυτή είναι η τελευταία αλλαγή που μπορείτε να κάνετε από εδώ.")
    :`Μπορείτε να την αλλάξετε ακόμη ${timesText(left)}.`;
  // What the date means, for the date on screen (keepDays from the server's own lock/delete times).
  const lifeText=d=>{
    if(isPast(w)) return (L.locked?"Το σχέδιο είναι πλέον μόνο για ανάγνωση":EVp().isOver.slice(0,-1))+(L.keep||!L.deleteAt?" και φυλάσσεται.":` και διαγράφεται στις ${fmtAth(L.deleteAt)} — ως τότε μπορείτε να κατεβάσετε τα PDF.`);
    const why="Η ημερομηνία ορίζει πότε κλειδώνει και πότε διαγράφεται το σχέδιο: ";
    if(!d) return why+`χωρίς ημερομηνία, κλειδώνει στις ${L.lockAt?fmtAth(L.lockAt):"—"}.`;
    const lock=addDays(d,1), full=addDays(d,-30);   // the server's fullAt: 00:00 Athens, 30 days before
    return why+`από τις ${fmtYMD(lock)} γίνεται μόνο για ανάγνωση${L.keep||keepDays==null?".":` και διαγράφεται στις ${fmtYMD(addDays(lock,keepDays))}.`}`
      +(arranges(w)&&full>today?` Διάταξη τραπεζιών για ${EVp().custA} από ${fmtYMD(full)}.`:"");
  };
  const dlg=openModal(`<h3 id="mTitle">${EVp().details}</h3><div class="msub">${esc(w.label)}</div>
    <div class="fld"><label class="lbl" for="mKind">Είδος εκδήλωσης</label>
      <select id="mKind" ${L.locked?"disabled":""}>${kindOptions(evKind(w))}</select>
      <div class="hint">Αν το καταχωρήσατε λάθος, διορθώστε το εδώ — αλλάζουν μόνο οι λέξεις, όχι οι ημερομηνίες.</div></div>
    <div class="fld"><label class="lbl" for="mName">${EVp().nameLbl}</label><input id="mName" maxlength="120" value="${esc(w.label)}" ${focusDate&&dateOn?"":"data-focus"}></div>
    <div class="fld"><label class="lbl" for="mDate">${EVp().dateLbl}</label>
      <input id="mDate" type="date" min="${today}" max="${max}" value="${esc(w.date||"")}" ${dateOn?"":"disabled"} ${focusDate&&dateOn?"data-focus":""}>
      <div class="hint" id="mLeft">${helpify(leftText(w.date))}</div></div>
    <div class="note" id="mLife">${esc(lifeText(w.date))}</div>
    <div class="under bad" id="mErr" role="alert"></div>
    <div class="foot"><button class="btn" data-close>Άκυρο</button><button class="btn primary" id="mSave">Αποθήκευση</button></div>`);
  const nameI=dlg.querySelector("#mName"), dateI=dlg.querySelector("#mDate"), kindI=dlg.querySelector("#mKind"), save=dlg.querySelector("#mSave"), errBox=dlg.querySelector("#mErr");
  const err=t=>{ errBox.innerHTML=helpify(t||""); };
  dateI.oninput=()=>{ const d=dateI.value; dlg.querySelector("#mLeft").innerHTML=helpify(leftText(d)); dlg.querySelector("#mLife").textContent=lifeText(d||w.date); err(""); };
  const go=async()=>{
    if(save.disabled) return;
    const label=nameI.value.trim(), date=dateI.value, body={};
    if(!label){ err(EVp().nameAsk+"."); nameI.focus(); return; }
    if(label!==w.label) body.label=label;
    if(kindI && kindI.value!==evKind(w)) body.kind=kindI.value;
    if(dateOn){
      if(!date && w.date){ err("Η ημερομηνία δεν αφαιρείται — διαλέξτε νέα ή πατήστε «Άκυρο»."); dateI.focus(); return; }
      if(date && date!==w.date){ if(date<today||date>max){ err(trialEndYmd()&&date>trialEndYmd()?reasonText("after_trial"):DATE_ERR.bad_date); dateI.focus(); return; } body.date=date; }
    }
    if(!Object.keys(body).length){ closeModal(); return; }
    save.disabled=true; err("");
    const r=await call("PATCH","/venues/"+DATA.venue.id+"/weddings/"+encodeURIComponent(w.planId),body);
    if(r.gone) return;
    if(!r.ok){ save.disabled=false; if(!r.net) err(DATE_ERR[r.d.error]||reasonText(r.d.error)||(r.d.error==="missing label"?EVp().nameAsk+".":"Αποτυχία αποθήκευσης — δοκιμάστε ξανά."));
      if(r.d.error==="locked"){ nameI.disabled=dateI.disabled=save.disabled=true; dlg.querySelector("#mLeft").textContent=""; load(); return; }
      if(r.d.error==="no_more_changes"){ dateI.value=w.date||""; dateI.disabled=true; dlg.querySelector("#mLeft").textContent="";   // the date is fixed now: the name can still be saved
        load().then(()=>{ const f=findW(w.planId); if(f && f.date){ w.date=f.date; dateI.value=f.date; dlg.querySelector("#mLife").textContent=lifeText(f.date); } }); }
      return; }
    toast(body.date?(w.date?"Η ημερομηνία άλλαξε":"Η ημερομηνία ορίστηκε"):"Αποθηκεύτηκε"); closeModal(); load();
  };
  save.onclick=go;
  [nameI,dateI].forEach(i=>i.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); }));
  if(kindI) kindI.onchange=()=>{ pickedKind=EVW[kindI.value]?kindI.value:"wedding";   // the words follow the pick, before it is even saved
    const K=EVp();
    dlg.querySelector("#mTitle").textContent=K.details;
    dlg.querySelector('label[for="mName"]').textContent=K.nameLbl; dlg.querySelector('label[for="mDate"]').textContent=K.dateLbl;
    dlg.querySelector("#mLeft").innerHTML=helpify(leftText(dateI.value)); dlg.querySelector("#mLife").textContent=lifeText(dateI.value||w.date); err(""); };
}

// ---- a new couple link: the old one (and every device that opened it) stops at once; the server logs it in the plan ----
function newLinkDialog(w){
  const head=`<h3 id="mTitle">Νέος σύνδεσμος ${EV(w).custG}</h3><div class="msub">${esc(w.label)}</div>`;
  const dlg=openModal(`${head}
    <div class="lead">Ο παλιός σύνδεσμος και όσες συσκευές τον χρησιμοποιούν σταματούν αμέσως να έχουν πρόσβαση. Συνέχεια;</div>
    <div class="foot"><button class="btn" data-close>Άκυρο</button><button class="btn danger" id="mNew">Νέος σύνδεσμος</button></div>`);
  dlg.querySelector("#mNew").onclick=async e=>{
    const b=e.currentTarget; b.disabled=true;
    const r=await call("POST","/venues/"+DATA.venue.id+"/weddings/"+encodeURIComponent(w.planId)+"/couple-link",{});
    if(r.gone) return;
    if(!r.ok || typeof r.d.editKey!=="string" || !r.d.editKey){ b.disabled=false; if(r.net) return;
      const gone=r.status===404, over=r.d.error==="locked";
      toast(gone?EV(w).notFound:over?EV(w).isOver:"Αποτυχία — δοκιμάστε ξανά.",2600);
      if(gone||over){ closeModal(); load(); } return; }
    w.editKey=r.d.editKey; w.linkAt=null; w.seenAt=null;   // a new link: nobody has been sent or opened it yet
    const link=coupleLink(w);
    openModal(`${head}
      <div class="okbox"><div style="font-weight:700;margin-bottom:6px">✅ Ο νέος σύνδεσμος — στείλτε τον ${EV(w).custTo}:</div>
        <div style="font-family:ui-monospace,monospace;font-size:13px;word-break:break-all">${esc(link)}</div>
        <button class="btn" id="mCopy" data-focus style="margin-top:10px;padding:6px 12px;font-size:13px">📋 Αντιγραφή</button></div>
      <div class="hint">Ο παλιός σύνδεσμος δεν λειτουργεί πλέον. Τον νέο τον βρίσκετε και στο «Σύνδεσμος ${EV(w).custG}».</div>
      <div class="foot"><button class="btn" data-close>Κλείσιμο</button></div>`);
    dlgBox.querySelector("#mCopy").onclick=()=>copyClientLink(findW(w.planId)||w);
    load();
  };
}

// ---- delete: 14 days in the trash; only TakeaSeat brings it back ----
function deleteDialog(w){
  const dlg=openModal(`<h3 id="mTitle">${EV(w).del}</h3><div class="msub">${esc(w.label)}</div>
    <div class="lead">${EV(w).nomA.charAt(0).toUpperCase()+EV(w).nomA.slice(1)} και το τραπεζολόγιό ${EV(w).poss} μεταφέρονται στις διαγραμμένες εκδηλώσεις για 14 ημέρες και μετά διαγράφονται οριστικά. Ο σύνδεσμος ${EV(w).custG} σταματά να λειτουργεί αμέσως.</div>
    <div class="info">Επαναφορά μπορεί να κάνει μόνο η TakeaSeat, αν μας το ζητήσετε μέσα σε αυτές τις 14 ημέρες — ${helpify("γράψτε μας ή τηλεφωνήστε")}.</div>
    <div class="foot"><button class="btn" data-close>Άκυρο</button><button class="btn danger" id="mDel">Διαγραφή</button></div>`);
  dlg.querySelector("#mDel").onclick=async e=>{
    const b=e.currentTarget; b.disabled=true;
    const r=await call("DELETE","/venues/"+DATA.venue.id+"/weddings/"+encodeURIComponent(w.planId));
    if(r.gone) return;
    if(!r.ok){ b.disabled=false; if(!r.net) toast("Αποτυχία διαγραφής — δοκιμάστε ξανά."); return; }
    closeModal(); toast(r.d.purgeAt?EV(w).deleted+" — οριστική διαγραφή στις "+fmtAth(r.d.purgeAt):EV(w).deleted,3200); load();
  };
}

// ---- PDF of a wedding (floor plan / keepsake), rendered by the server — also while the plan is locked ----
let pdfBusy=false;
async function downloadPdf(w, mode){
  if(pdfBusy) return;
  pdfBusy=true; toast("Ετοιμάζουμε το PDF…",8000);
  try{
    let r; try{ r=await fetch(SYNC_URL+"/plans/"+encodeURIComponent(w.planId)+"/pdf?mode="+mode+"&lang=el",{ headers:{ "X-Venue-Key":getKey() } }); }
    catch(e){ toast("Σφάλμα σύνδεσης — δοκιμάστε ξανά."); return; }
    if(!r.ok){ const d=await r.json().catch(()=>({}));
      toast(d.error==="pdf_off"||r.status===503?"Η εξαγωγή PDF δεν είναι διαθέσιμη αυτή τη στιγμή.":r.status===429?"Πολλές λήψεις — δοκιμάστε ξανά σε ένα λεπτό."
        :r.status===404||r.status===410?"Η εκδήλωση δεν βρέθηκε.":"Αποτυχία λήψης PDF — δοκιμάστε ξανά.",3000); return; }
    const blob=await r.blob(), cd=r.headers.get("Content-Disposition")||"", m=/filename\*=UTF-8''([^;]+)/i.exec(cd);
    let name=`${w.label} — ${mode==="keepsake"?"αναμνηστικό":"κάτοψη"}.pdf`; if(m) try{ name=decodeURIComponent(m[1]); }catch(e){}
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    toast("Το PDF κατέβηκε");
  } finally{ pdfBusy=false; }
}

// ---- automatic renewal of a seasonal licence ----
async function setRenewal(on){
  const r=await call("POST","/venues/"+DATA.venue.id+"/renewal",{ autoRenew:on });
  if(r.gone || !DATA) return;
  if(!r.ok){ if(!r.net) toast("Αποτυχία — δοκιμάστε ξανά."); return; }
  closeModal();
  DATA.venue.license=r.d.license||{ ...DATA.venue.license, autoRenew:on };
  const L=DATA.venue.license;
  toast(on?"Η αυτόματη ανανέωση ενεργοποιήθηκε":"Η αυτόματη ανανέωση σταμάτησε"+(ymdOk(L.seasonEnd)?" — η συνδρομή λήγει στις "+fmtYMD(L.seasonEnd):""),2800);
  renderDashboard();
}

// Venue sets its own key (custom passphrase, or random) — the old one stops working immediately, and every
// per-wedding venue link is renewed, so the dashboard reloads its data.
let rotating=false;   // one key change at a time: a double click must not sign the venue out with the new key lost
async function rotateKey(vid, secret){
  if(rotating) return;
  if(secret && secret.replace(/[^A-Za-z0-9]/g,"").length<12){ toast("Τουλάχ. 12 γράμματα/αριθμοί"); return; }
  rotating=true; let r;
  try{ r=await call("POST","/venues/"+vid+"/rotate",secret?{secret}:{}); } finally{ rotating=false; }
  if(r.gone) return;
  if(!r.ok){ if(!r.net) toast(r.d.error==="too_short"?"Τουλάχ. 12 χαρακτήρες":"Αποτυχία αλλαγής"); return; }
  setKey(r.d.key);
  UI.keyOpen=true; UI.newKey=r.d.key;
  const inp=document.getElementById("newkeyinput"); if(inp) inp.value="";
  toast("Ο κωδικός άλλαξε");
  await load();
}

// A new recovery email: nothing changes until the venue opens the confirmation link we send to it.
let mailing=false;
async function changeEmail(vid){
  if(mailing) return;
  const inp=document.getElementById("newmailinput"), email=inp?inp.value.trim():"";
  if(!EMAIL_OK(email)){ toast("Ελέγξτε το email"); if(inp) inp.focus(); return; }
  mailing=true; let r;
  try{ const b=document.getElementById("setMailBtn"); if(b) b.disabled=true;
    r=await call("POST","/venues/"+vid+"/email",{ email, lang:"el" }); }
  finally{ mailing=false; const b=document.getElementById("setMailBtn"); if(b) b.disabled=false; }
  if(r.gone || !DATA) return;
  if(!r.ok){ if(!r.net) toast(r.status===429?RATE_MSG:r.status===400?"Ελέγξτε το email":r.status===503?"Η αποστολή email δεν είναι διαθέσιμη αυτή τη στιγμή.":"Αποτυχία — δοκιμάστε ξανά.",2600);
    if(r.status===503) load(); return; }
  const v=DATA.venue; UI.mailPending={ to:r.d.pending||email, was:v.email, wasV:v.emailVerified };
  const cur=document.getElementById("newmailinput"); if(cur) cur.value="";
  toast("Στείλαμε σύνδεσμο επιβεβαίωσης",2200);
  renderDashboard();
}

async function load(){
  const key=getKey(); if(!key){ renderLogin(); return; }
  const my=++loadSeq, had=!!DATA;
  if(!had) app.innerHTML=`<div class="empty">Φόρτωση…</div>`;
  let r; try{ r=await api("/venues/"+encodeURIComponent(vidOf(key))); }
  catch(e){ if(my!==loadSeq) return; if(had) toast("Σφάλμα σύνδεσης — δοκιμάστε ξανά."); else renderLogin("Σφάλμα σύνδεσης — δοκιμάστε ξανά."); return; }
  if(my!==loadSeq) return;
  if(r.status===403||r.status===404){ signedOut("Ο κωδικός δεν είναι έγκυρος."); return; }
  if(!r.ok){ if(had) toast("Κάτι πήγε στραβά — δοκιμάστε ξανά."); else renderLogin("Κάτι πήγε στραβά — δοκιμάστε ξανά."); return; }
  const d=await r.json().catch(()=>null);
  if(my!==loadSeq) return;
  if(!d||!d.venue){ if(!had) renderLogin("Κάτι πήγε στραβά — δοκιμάστε ξανά."); return; }
  DATA=d; lastLoad=Date.now();
  syncDefEditor();
  renderDashboard();
}
// Back from the planner tab (the space or a wedding was edited there): refresh quietly.
function refreshOnReturn(){
  if(!DATA || document.hidden || Date.now()-lastLoad<5000) return;
  if(modal.classList.contains("show")) return;
  load();
}
window.addEventListener("focus",refreshOnReturn);
document.addEventListener("visibilitychange",refreshOnReturn);
window.addEventListener("hashchange",()=>linkFromHash());   // a link pasted into an open console
if(!linkFromHash()) load();
