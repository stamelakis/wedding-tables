name: takeaseat

# Runs alongside the existing edu-admin stack and is reverse-proxied by ITS Caddy.
# The api container joins the edu-admin internal network so Caddy can reach it by name.
services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: takeaseat-api
    container_name: takeaseat-api
    restart: unless-stopped
    # hardening: no extra Linux capabilities, no privilege escalation, bounded resources
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
    env_file:
      - server.env          # OWNER_KEY=... (kept out of git)
    volumes:
      - tas_data:/data      # the SQLite database lives here
    expose:
      - "8080"
    networks:
      - edu

networks:
  edu:
    external: true
    name: edu-admin_internal   # the network the edu-admin Caddy is on

volumes:
  tas_data:
