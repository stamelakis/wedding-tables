<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --paper:#f6f2ec; --paper-2:#ece6dc; --card:#fffdfa; --ink:#241f1a; --soft:#6b6259; --faint:#9a9084;
    --line:#e6ddd2; --line-2:#d5cabc;
    --accent:#7d5a8c; --accent-ink:#5c3f68; --accent-soft:#efe6f2; --gold:#b58a3c;
    --danger:#c0392b; --good:#3f7a52; --seat-neutral:#7e6d5f;
    --shadow-1:0 1px 2px rgba(40,30,20,.06),0 6px 18px rgba(40,30,20,.08);
    --shadow-2:0 10px 30px rgba(40,30,20,.2);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --appbar-h:52px; --sidebar-w:316px; --focus-w:330px; --sheet-h:46vh;
  }
  html,body{ height:100%; }
  body{ font-family:var(--sans); color:var(--ink); background:var(--paper-2); height:100vh; overflow:hidden; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  input,textarea,select{ background:var(--card); }

  /* ---------- App bar ---------- */
  #appbar{ height:var(--appbar-h); flex:none; display:flex; align-items:center; gap:8px; padding:0 12px; background:rgba(255,253,250,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); z-index:30; position:relative; }
  .brand{ font-family:var(--serif); font-weight:700; font-size:19px; letter-spacing:-.01em; white-space:nowrap; }
  .brand em{ color:var(--accent); font-style:normal; }
  .planpick{ display:flex; gap:4px; align-items:center; min-width:0; }
  .planpick select{ max-width:220px; min-width:0; height:32px; padding:0 8px; border:1px solid var(--line); border-radius:9px; font-weight:600; font-size:13px; }
  .ibtn{ height:32px; min-width:32px; padding:0 9px; border:1px solid var(--line); background:var(--card); border-radius:9px; cursor:pointer; font-size:14px; line-height:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; transition:background .12s,border-color .12s,color .12s; }
  .ibtn:hover{ background:var(--paper); border-color:var(--line-2); }
  .ibtn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .ibtn.primary:hover{ background:var(--accent-ink); border-color:var(--accent-ink); }
  .ibtn.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
  .ibtn.danger{ color:var(--danger); }
  .ibtn:disabled{ opacity:.5; cursor:default; }
  .stat{ font-size:12.5px; color:var(--faint); white-space:nowrap; }
  .spacer{ flex:1; }
  .ctl{ display:inline-flex; align-items:center; gap:3px; }
  .ctl .lbl{ font-size:11px; color:var(--faint); padding:0 4px; min-width:38px; text-align:center; }
  .langsel{ display:inline-flex; gap:2px; }
  .langsel a{ font-size:11px; font-weight:700; color:var(--faint); text-decoration:none; padding:4px 6px; border-radius:6px; }
  .langsel a:hover{ background:var(--paper); color:var(--ink); }
  .langsel a.on{ color:var(--accent-ink); background:var(--accent-soft); }
  #labBadge{ display:none; font-size:11px; font-weight:700; background:#fff3c4; color:#7a5a00; border:1px solid #f0d78a; border-radius:20px; padding:3px 9px; white-space:nowrap; cursor:help; }
  body.mode-lab #labBadge{ display:inline-block; }
  body.mode-lab #langsel{ display:none; }
  #navBtn{ display:none; }

  /* ---------- Main layout ---------- */
  #main{ flex:1; display:flex; min-height:0; position:relative; }
  #sidebar{ width:var(--sidebar-w); flex:none; background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .side-scroll{ flex:1; overflow-y:auto; min-height:0; overscroll-behavior:contain; }
  .sec{ padding:12px 14px 12px; border-bottom:1px solid var(--line); }
  .sec:last-child{ border-bottom:none; }
  .sec-title{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .sec-title .cnt{ font-weight:600; color:var(--soft); text-transform:none; letter-spacing:0; margin-left:auto; }
  .tools{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .tools .ibtn{ height:36px; font-size:12.5px; justify-content:flex-start; padding:0 10px; }
  .floorrow{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--soft); }
  .floorrow select{ flex:1; height:32px; padding:0 8px; border:1px solid var(--line); border-radius:8px; font-size:12.5px; }
  .search{ position:relative; margin-bottom:8px; }
  .search input{ width:100%; height:36px; padding:0 30px 0 32px; border:1px solid var(--line); border-radius:10px; background:var(--paper); font-size:13.5px; }
  .search input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:#fff; }
  .search .ico{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:13px; pointer-events:none; }
  .search .clr{ position:absolute; right:4px; top:50%; transform:translateY(-50%); border:none; background:none; color:var(--faint); cursor:pointer; font-size:14px; padding:6px; display:none; }
  .search.has .clr{ display:block; }
  .chips{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
  .chip{ display:inline-flex; align-items:center; gap:5px; padding:4px 9px 4px 7px; border-radius:20px; border:1.5px solid var(--line); background:var(--card); cursor:pointer; font-size:12px; user-select:none; touch-action:manipulation; transition:background .1s,border-color .1s; }
  .chip:hover{ background:var(--paper); }
  .chip.active{ border-color:var(--ink); background:var(--paper); }
  .chip .dot{ width:11px; height:11px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); }
  .chip .n{ color:var(--faint); font-size:11px; }
  .chip.add{ border-style:dashed; color:var(--soft); }
  .chip .gmore{ margin-left:2px; color:var(--faint); font-weight:700; padding:0 2px; }
  #pool{ display:flex; flex-direction:column; gap:5px; min-height:44px; }
  #pool.dragover{ outline:2px dashed var(--accent); outline-offset:-4px; border-radius:10px; background:var(--accent-soft); }
  .gchip{ display:flex; align-items:center; gap:8px; padding:7px 6px 7px 10px; border-radius:10px; background:var(--paper); border:1px solid var(--line); border-left:5px solid #ccc; cursor:grab; user-select:none; font-size:13px; transition:box-shadow .12s,background .12s; }
  .gchip:hover{ box-shadow:var(--shadow-1); background:#fff; }
  .gchip:active{ cursor:grabbing; }
  .gchip .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gchip .acts{ display:flex; gap:0; opacity:0; transition:opacity .12s; }
  .gchip:hover .acts, .gchip.picked .acts, body.touch .gchip .acts{ opacity:1; }
  .gchip .acts button{ border:none; background:none; color:var(--faint); cursor:pointer; font-size:13px; padding:4px 6px; border-radius:6px; line-height:1; }
  .gchip .acts button:hover{ background:var(--card); color:var(--ink); }
  .gchip .acts .x:hover{ color:var(--danger); }
  .gchip.picked{ outline:2px solid var(--accent); outline-offset:1px; background:var(--accent-soft); }
  .stag{ font-size:9.5px; color:#a0692b; background:#fff4e6; border:1px solid #f0d9bf; border-radius:6px; padding:0 4px; margin-left:5px; vertical-align:middle; }
  .stag.cut{ color:#b03535; background:#fdeaea; border-color:#f2c7c7; }
  .empty-note{ font-size:12.5px; color:var(--faint); padding:14px 6px; text-align:center; line-height:1.5; }
  details.addnames{ margin-top:10px; }
  details.addnames summary{ cursor:pointer; font-size:12.5px; font-weight:700; color:var(--accent-ink); list-style:none; display:flex; align-items:center; gap:6px; padding:6px 0; }
  details.addnames summary::-webkit-details-marker{ display:none; }
  details.addnames summary::before{ content:"▸"; font-size:11px; transition:transform .15s; }
  details.addnames[open] summary::before{ transform:rotate(90deg); }
  details.addnames textarea{ width:100%; height:74px; resize:vertical; padding:8px 10px; font-size:13px; border:1px solid var(--line); border-radius:9px; margin-top:4px; background:var(--paper); line-height:1.4; }
  details.addnames textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:#fff; }
  details.addnames .hint{ font-size:11px; color:var(--faint); margin:4px 0 7px; }

  /* ---------- Stage ---------- */
  #stagewrap{ flex:1; position:relative; overflow:auto; background:var(--paper-2); background-image:radial-gradient(rgba(60,40,20,.09) 1px,transparent 1.2px); background-size:22px 22px; touch-action:pan-x pan-y; }
  #stage{ position:relative; width:1700px; height:1360px; margin:24px; border-radius:14px; transform-origin:top left; box-shadow:0 2px 4px rgba(0,0,0,.12),0 24px 60px rgba(40,30,20,.22),inset 0 0 0 1px rgba(0,0,0,.14); }
  #stage::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:0; background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(20,20,10,.16) 100%); }

  .feature{ position:absolute; font-size:12px; color:#fff; font-weight:600; display:flex; align-items:center; justify-content:center; text-align:center; transform:translate(-50%,-50%); border-radius:8px; padding:2px 4px; line-height:1.15; cursor:grab; user-select:none; z-index:1; }
  .feature:active{ cursor:grabbing; }
  .feature .rz{ position:absolute; right:-6px; bottom:-6px; width:16px; height:16px; background:#fff; border:1px solid #8a7f72; border-radius:4px; cursor:nwse-resize; display:none; z-index:3; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .feature:hover .rz{ display:block; }
  .rot-h{ position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; border:1px solid #8a7f72; cursor:grab; display:none; z-index:4; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .rot-h:active{ cursor:grabbing; }
  .rot-h::after{ content:"⟳"; font-size:12px; color:#666; display:flex; align-items:center; justify-content:center; height:100%; }
  .feature:hover .rot-h, .table:hover .rot-h, .table.focused .rot-h{ display:block; }
  .feature.k-zone{ border-radius:10px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),inset 0 0 40px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.14); }
  .feature.k-zone .zlabel{ font-family:var(--serif); font-size:16px; letter-spacing:.04em; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.6); background:rgba(0,0,0,.24); padding:3px 11px; border-radius:20px; pointer-events:none; }
  .feature.k-marker{ background:#2a2622; color:#fff; box-shadow:0 3px 8px rgba(0,0,0,.3); border-radius:8px; letter-spacing:.04em; }
  .feature.k-label{ background:rgba(255,253,250,.93); color:var(--ink); font-family:var(--serif); font-weight:600; font-size:13px; letter-spacing:.02em; box-shadow:0 2px 6px rgba(0,0,0,.16); border-radius:20px; }
  .feature.k-prop{ background:linear-gradient(180deg,#fffdf9,#f3ece2); color:var(--ink); border:1px solid rgba(120,90,60,.3); box-shadow:0 4px 10px rgba(0,0,0,.18),inset 0 1px 0 #fff; flex-direction:column; gap:2px; padding:4px; border-radius:10px; }
  .feature.k-prop .picon{ font-size:24px; line-height:1; pointer-events:none; filter:drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
  .feature.k-prop .plabel{ font-size:11px; color:var(--soft); font-weight:600; pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .feat-gear{ position:absolute; left:-9px; top:-9px; width:22px; height:22px; border-radius:50%; background:#fff; border:1px solid var(--line-2); box-shadow:0 1px 4px rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; z-index:3; touch-action:manipulation; }

  /* ---------- Tables & seats ---------- */
  .table{ position:absolute; z-index:5; }
  .table-disc{ position:absolute; left:0; top:0; border-radius:50%; background:radial-gradient(circle at 38% 32%,#fffefc 0%,#f6f1e9 55%,#e8e0d3 100%); border:1px solid rgba(110,85,60,.3); box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 18px rgba(30,20,10,.22),0 2px 4px rgba(30,20,10,.12); display:flex; align-items:center; justify-content:center; flex-direction:column; transform:translate(-50%,-50%); cursor:grab; transition:box-shadow .15s; }
  .table-disc::before{ content:""; position:absolute; inset:-5px; border-radius:inherit; border:1px solid rgba(255,255,255,.6); box-shadow:0 0 0 4px rgba(255,255,255,.2); pointer-events:none; }
  .table-disc.head{ border-radius:14px; background:linear-gradient(180deg,#fffaf1 0%,#f6ecd9 100%); border:1.5px solid #cdb07a; }
  .table-disc:active{ cursor:grabbing; }
  .table:hover .table-disc{ box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 26px rgba(30,20,10,.28),0 2px 4px rgba(30,20,10,.12); }
  .table.focused .table-disc{ box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent),0 12px 26px rgba(30,20,10,.3); }
  .table-disc .tnum{ font-family:var(--serif); font-size:17px; font-weight:700; color:var(--accent-ink); text-align:center; padding:0 6px; line-height:1.1; }
  .table-disc.head .tnum{ font-size:14px; }
  .table-disc .tcount{ font-size:10px; color:var(--faint); margin-top:2px; font-weight:600; letter-spacing:.02em; }
  .table-disc .tgear{ position:absolute; top:2px; right:6px; font-size:12px; color:var(--faint); cursor:pointer; display:none; padding:2px; }
  .table:hover .tgear, .table.focused .tgear{ display:block; }
  .seat{ position:absolute; transform:translate(-50%,-50%); border:1.5px dashed rgba(90,70,50,.5); background:rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center; color:rgba(90,70,50,.75); text-align:center; overflow:hidden; cursor:pointer; user-select:none; transition:background .1s,border-color .1s; box-shadow:0 1px 2px rgba(0,0,0,.1); }
  .seat:hover{ background:rgba(255,255,255,.95); border-color:var(--accent); }
  .seat.occupied{ border-style:solid; border-color:transparent; color:#fff; font-weight:700; cursor:grab; box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.12),0 3px 7px rgba(0,0,0,.25); text-shadow:0 1px 1px rgba(0,0,0,.25); }
  .seat.occupied:active{ cursor:grabbing; }
  .seat.dragover{ background:#fff !important; border-color:var(--accent) !important; border-style:solid !important; color:var(--accent-ink) !important; }
  .seat .nm{ padding:0 5px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .table.focused .seat.sel{ box-shadow:0 0 0 3px #fff,0 0 0 5px var(--accent); }
  body.picking .seat:not(.occupied){ border-color:var(--accent); border-style:solid; background:rgba(255,255,255,.92); animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(125,90,140,.55); } 50%{ box-shadow:0 0 0 7px rgba(125,90,140,0); } }
  #stageResize{ position:absolute; right:-4px; bottom:-4px; width:26px; height:26px; background:var(--accent); border:2px solid #fff; border-radius:7px; cursor:nwse-resize; z-index:8; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  #stageResize::after{ content:"⤡"; color:#fff; font-size:15px; display:flex; align-items:center; justify-content:center; height:100%; }

  /* ---------- Focus panel (table sheet) ---------- */
  #focus{ width:var(--focus-w); flex:none; background:var(--card); border-left:1px solid var(--line); display:none; flex-direction:column; min-height:0; }
  body.focused #focus{ display:flex; }
  .fhandle{ display:none; width:44px; height:5px; border-radius:3px; background:var(--line-2); margin:8px auto 0; cursor:pointer; flex:none; }
  .fhead{ display:flex; align-items:center; gap:5px; padding:10px 10px 8px; border-bottom:1px solid var(--line); flex:none; }
  .fhead .ftitle{ flex:1; min-width:0; padding:0 2px; }
  .fhead .ftitle b{ font-family:var(--serif); font-size:18px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.15; }
  .fhead .ftitle span{ font-size:12px; color:var(--faint); }
  .fhint{ font-size:12px; color:var(--faint); padding:8px 14px 4px; line-height:1.4; flex:none; }
  #fSeats{ flex:1; overflow-y:auto; padding:6px 10px 10px; min-height:0; overscroll-behavior:contain; }
  .frow{ display:flex; align-items:center; gap:6px; padding:3px 0; }
  .frow .fn{ width:22px; text-align:right; font-size:11px; color:var(--faint); font-weight:700; flex:none; }
  .frow .fdot{ width:10px; height:10px; border-radius:50%; flex:none; background:#e2ddd5; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); }
  .frow input{ flex:1; min-width:0; height:36px; padding:0 10px; border:1px solid var(--line); border-radius:9px; background:var(--paper); font-size:13.5px; }
  .frow input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:#fff; }
  .frow.occ input{ background:#fff; font-weight:600; }
  .frow .fx{ border:none; background:none; color:var(--faint); cursor:pointer; font-size:14px; padding:4px; border-radius:6px; width:26px; flex:none; visibility:hidden; }
  .frow.occ .fx{ visibility:visible; }
  .frow .fx:hover{ color:var(--danger); background:var(--paper); }
  .fsug{ margin:2px 0 6px 40px; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-1); overflow:hidden; }
  .fsug div{ padding:8px 10px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .fsug div .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .fsug div:hover, .fsug div.sel{ background:var(--accent-soft); }
  .fsug div.new{ color:var(--accent-ink); font-weight:600; }
  .fsug div.more{ color:var(--faint); font-size:11.5px; cursor:default; padding-top:4px; }
  .ffoot{ padding:8px 10px; border-top:1px solid var(--line); display:flex; gap:6px; flex:none; }
  .ffoot .ibtn{ flex:1; height:36px; font-size:12.5px; }

  /* ---------- Mobile bar · pick bar · drawer ---------- */
  #mobilebar{ display:none; position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:120; gap:6px; }
  #mobilebar .ibtn{ height:46px; flex:1; background:rgba(255,253,250,.97); box-shadow:var(--shadow-2); font-size:13.5px; font-weight:600; border-radius:14px; }
  #mobilebar .ibtn.sq{ flex:0 0 48px; font-size:18px; }
  #mobilebar .ibtn b{ background:var(--accent); color:#fff; border-radius:20px; padding:2px 8px; font-size:11px; }
  #navScrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:140; }
  #pickbar{ display:none; position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:210; background:#2a2622; color:#fff; border-radius:999px; padding:6px 7px 6px 16px; font-size:13px; align-items:center; gap:8px; box-shadow:0 8px 26px rgba(0,0,0,.35); max-width:95vw; }
  body.picking #pickbar{ display:flex; }
  body.picking .toast{ bottom:70px; }
  #pickbar .pbname{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:36vw; }
  #pickbar .pbhint{ color:#c9c2b8; white-space:nowrap; }
  #pickbar button{ border:none; background:rgba(255,255,255,.14); color:#fff; border-radius:999px; padding:7px 12px; font-size:12px; cursor:pointer; white-space:nowrap; }
  #pickbar button:hover{ background:rgba(255,255,255,.28); }
  .gchip, .seat, .chip{ touch-action:manipulation; }
  .table-disc, .feature, .rz, .rot-h, #stageResize{ touch-action:none; }

  /* ---------- Popovers & modals ---------- */
  .popover{ position:fixed; z-index:250; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-2); padding:8px; font-size:13px; display:none; }
  .gm-item{ display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .gm-item:hover{ background:var(--paper); }
  .gm-item .dot{ width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); flex:none; }
  .gm-item.danger{ color:var(--danger); }
  .gm-item .n{ margin-left:auto; color:var(--faint); font-size:11.5px; padding-left:10px; }
  .gm-sep{ height:1px; background:var(--line); margin:4px 2px; }
  .gm-cap{ font-size:11px; color:var(--faint); padding:4px 9px 6px; letter-spacing:.04em; text-transform:uppercase; font-weight:700; }
  #tablemenu{ width:236px; padding:12px; }
  #tablemenu h3{ font-size:13.5px; margin-bottom:8px; font-family:var(--serif); }
  #tablemenu .row{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  #tablemenu label{ font-size:11.5px; color:var(--soft); }
  #tablemenu input[type=text]{ width:100%; height:34px; padding:0 9px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  #tablemenu .caps{ display:flex; gap:5px; flex-wrap:wrap; }
  #tablemenu .caps button{ height:30px; padding:0 10px; border:1px solid var(--line); background:var(--card); border-radius:7px; cursor:pointer; font-size:12.5px; }
  #tablemenu .caps button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

// Convert an old (cls/text) feature to the new model, preserving position & size.
function upgradeFeature(f){
  if(f.kind) return f;
  const kindMap={ box:"marker", "label-plain":"label", kiosk:"prop", lake:"zone", deck:"zone", dancefloor:"zone" };
  const matMap={ lake:"water", deck:"wood", dancefloor:"parquet" };
  return { id:f.id, kind:kindMap[f.cls]||"marker", x:f.x, y:f.y, w:f.w, h:f.h,

}

// ============================================================
//  Procedural floor textures — small SVG tiles with fractal-noise filters, inlined as data
//  URIs (the site CSP allows img-src data:). No external assets, sharp at any zoom.
// ============================================================
const SVG_NS='xmlns="http://www.w3.org/2000/svg"';
function svgUri(s){ return 'url("data:image/svg+xml,'+encodeURIComponent(s.replace(/\s{2,}/g," ").trim())+'")'; }
function noise(id,freq,oct,seed,rgb,alpha){
  return `<filter id="${id}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${oct}" seed="${seed}" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 ${rgb[0]} 0 0 0 0 ${rgb[1]} 0 0 0 0 ${rgb[2]} 0 0 0 ${alpha} 0"/></filter>`;
}
function veins(id,freq,oct,seed,rgb){   // marble: narrow bands of a noise field become dark veins
  return `<filter id="${id}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${oct}" seed="${seed}" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 ${rgb[0]} 0 0 0 0 ${rgb[1]} 0 0 0 0 ${rgb[2]} 0 0 0 1 0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0 0 0.05 0.55 0.05 0 0 0"/></feComponentTransfer></filter>`;
}
function tileSvg(w,h,defs,body){ return `<svg ${SVG_NS} width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${defs}</defs>${body}</svg>`; }
const RECT=(x,y,w,h,f,extra="")=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${extra}/>`;
const FILL=(id,w,h)=>`<rect width="${w}" height="${h}" filter="url(#${id})"/>`;
function texGrass(){ return tileSvg(256,256, noise("a","0.018",2,3,[0.62,0.82,0.36],0.55)+noise("b","0.9",3,7,[0.16,0.35,0.1],0.5), RECT(0,0,256,256,"#5f9e3c")+FILL("a",256,256)+FILL("b",256,256)); }
function texParquet(){
  const cols=["#d09f66","#c48f55","#cc9a60","#c8945a"]; let b=RECT(0,0,128,128,"#a4713f");
  for(let by=0;by<2;by++) for(let bx=0;bx<2;bx++){ const horiz=(bx+by)%2===0;
    for(let i=0;i<4;i++){ const c=cols[(i+bx+by)%4]; b+= horiz? RECT(bx*64+1, by*64+i*16+1, 62, 14, c) : RECT(bx*64+i*16+1, by*64+1, 14, 62, c); } }
  return tileSvg(128,128, noise("g","0.08 0.5",2,4,[0.3,0.17,0.06],0.22), b+FILL("g",128,128));
}
function texWood(){
  const cols=["#b07b4c","#a87447","#b5804f","#a3703f"]; let b=RECT(0,0,256,128,"#8b5e38");
  for(let i=0;i<4;i++){ const off=(i%2)*96, y=i*32+2;
    b+=RECT(off-158, y, 156, 28, cols[i])+RECT(off+2, y, 156, 28, cols[(i+1)%4])+RECT(off+162, y, 156, 28, cols[(i+2)%4]); }
  return tileSvg(256,128, noise("w","0.006 0.45",2,2,[0.25,0.13,0.05],0.35), b+FILL("w",256,128));
}
function texStone(){
  const cols=["#bdb9b0","#b0aca3","#c6c2b9","#b8b3aa","#aba79e","#c0bcb3"]; let b=RECT(0,0,256,256,"#8d8a82"), k=0;
  const rows=[[4,58,[[4,76],[84,100],[188,64]]],[66,70,[[4,110],[118,60],[182,70]]],[140,54,[[4,60],[68,90],[162,90]]],[198,54,[[4,120],[128,124]]]];
  rows.forEach(([y,h,st])=>st.forEach(([x,w])=>{ b+=RECT(x,y,w,h,cols[k++%cols.length],'rx="7"'); }));
  return tileSvg(256,256, noise("s","0.6",2,5,[0.35,0.33,0.3],0.3)+noise("s2","0.02",2,8,[1,1,0.95],0.22), b+FILL("s",256,256)+FILL("s2",256,256));
}
function texTile(){ const b=RECT(0,0,64,64,"#cfcbc3")+RECT(1,1,30,30,"#f1efeb")+RECT(33,1,30,30,"#e4e1db")+RECT(1,33,30,30,"#e4e1db")+RECT(33,33,30,30,"#f1efeb"); return tileSvg(64,64, noise("t","0.9",1,2,[0.5,0.48,0.45],0.12), b+FILL("t",64,64)); }
function texMarble(){ return tileSvg(256,256, veins("v","0.012",4,5,[0.42,0.42,0.48])+noise("m","0.05",2,9,[0.55,0.55,0.6],0.12), RECT(0,0,256,256,"#f1efeb")+FILL("m",256,256)+FILL("v",256,256)); }
function texSand(){ return tileSvg(128,128, noise("sa","1.3",1,9,[0.72,0.6,0.36],0.45)+noise("sb","1.0",1,4,[1,0.98,0.88],0.35), RECT(0,0,128,128,"#e3d3a6")+FILL("sa",128,128)+FILL("sb",128,128)); }
function texWater(){ return tileSvg(256,256, noise("wa","0.012 0.045",3,3,[0.78,0.9,1],0.45)+noise("wb","0.02 0.07",2,11,[0.08,0.28,0.6],0.35), RECT(0,0,256,256,"#3b82d6")+FILL("wb",256,256)+FILL("wa",256,256)); }
function texCarpet(){ return tileSvg(128,128, noise("ca","1.2",2,6,[0.32,0.06,0.1],0.45)+noise("cb","0.9",1,2,[1,0.55,0.6],0.14), RECT(0,0,128,128,"#8e2c39")+FILL("ca",128,128)+FILL("cb",128,128)); }
function texConcrete(){ return tileSvg(256,256, noise("co","1.0",2,3,[0.45,0.45,0.43],0.38)+noise("cp","0.02",2,7,[0.75,0.75,0.72],0.35), RECT(0,0,256,256,"#c9c8c2")+FILL("cp",256,256)+FILL("co",256,256)); }

// ---------- persistence (multiple named profiles / couples) ----------
function planKey(id){ return PBASE+".plan."+id; }
function newProfileId(){ return "prof"+Date.now()+Math.floor(Math.random()*1000); }
function loadProfilesIdx(){ try{ const p=JSON.parse(localStorage.getItem(PROFILES_KEY)); if(p&&Array.isArray(p.profiles)&&p.profiles.length) return p; }catch(e){} return null; }
function saveProfilesIdx(){ try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles)); }catch(e){} }
function loadPlan(id){
  try{ const s=JSON.parse(localStorage.getItem(planKey(id)));
    if(s&&s.tables){ sanitizePlan(s); if(s.layoutVersion!==LAYOUT_VERSION) migrateLayout(s); return s; }
  }catch(e){}
  return null;
}
// First run: adopt any pre-profiles single-plan save into an initial "Our wedding" profile (lab: a demo plan).
function ensureProfiles(){
  const existing=loadProfilesIdx();
  if(existing) return existing;
  const id=newProfileId();
  let migrated=null;
  if(!IS_LAB){ try{ const old=JSON.parse(localStorage.getItem(STORE_KEY)); if(old&&old.tables) migrated=old; }catch(e){} }
  try{ localStorage.setItem(planKey(id), JSON.stringify(migrated||(IS_LAB?labState():defaultState()))); }catch(e){}
  const p={ activeId:id, profiles:[{id, name:IS_LAB?tr("labPlan"):tr("ourWedding")}] };
  try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(p)); }catch(e){}  // persist so we don't re-migrate on next load
  return p;
}
function save(){ try{ localStorage.setItem(planKey(profiles.activeId), JSON.stringify(state)); }catch(e){} scheduleCloudPush(); }
// Version-aware migration — keeps guests / groups / seat assignments (and, from v4 on, table positions).
function migrateLayout(s){
  const from=s.layoutVersion||0;
  if(from<4){
    let ri=0;
    s.tables.forEach(t=>{ if(t.shape!=="head"){ t.shape="round"; if(DEFAULT_POSITIONS[ri]){ t.x=DEFAULT_POSITIONS[ri][0]; t.y=DEFAULT_POSITIONS[ri][1]; } ri++; } });
    if(!s.tables.some(t=>t.shape==="head")){ s._uid=(s._uid||2001)+1; s.tables.push(makeHeadTable(s._uid)); }
    s.features = defaultFeatures();
    if(typeof s.seatFontScale!=="number") s.seatFontScale=1;
  }
  if(from<5){
    if(!s.stage) s.stage={ w:2100, h:1400 };
    if(!s.stageMaterial) s.stageMaterial="grass";
    s.features=(s.features||defaultFeatures()).map(upgradeFeature);
  }
  s.layoutVersion=LAYOUT_VERSION;
}

// ---------- helpers ----------
function assignedGuestIds(){ const set=new Set(); state.tables.forEach(t=>t.seats.forEach(g=>{ if(g)set.add(g); })); return set; }
function guestName(id){ return state.guests[id]?.name ?? "?"; }
function guestGroup(id){ const gid=state.guests[id]?.groupId; return gid? state.groups.find(g=>g.id===gid) : null; }
function guestColor(id){ const g=guestGroup(id); return g? g.color : "#7e6d5f"; }
function hexTint(hex){ return hex+"1f"; }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._to); t._to=setTimeout(()=>t.classList.remove("show"),1700); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }
// Colours and icons from cloud/imported plans are interpolated into HTML, so clamp them to safe shapes
// on ingest (a shared plan is attacker-controlled): colours to a hex literal, icons to a short markup-free string.
function safeColor(c){ return (typeof c==="string" && /^#[0-9a-fA-F]{3,8}$/.test(c)) ? c : "#7e6d5f"; }
function safeIcon(s){ s=String(s==null?"📦":s).replace(/[<>&"'`]/g,""); return s.slice(0,4)||"📦"; }
function sanitizePlan(s){ if(!s||typeof s!=="object") return s;
    if(Array.isArray(s.groups)) s.groups.forEach(g=>{ if(g&&typeof g==="object") g.color=safeColor(g.color); });
    if(Array.isArray(s.features)) s.features.forEach(f=>{ if(f&&typeof f==="object"&&"icon" in f) f.icon=safeIcon(f.icon); });
    if(!Array.isArray(s.tables)) s.tables=[];
    if(!s.guests||typeof s.guests!=="object"||Array.isArray(s.guests)) s.guests={};
    if(!Array.isArray(s.groups)) s.groups=[];
    if(!Array.isArray(s.features)) s.features=defaultFeatures();
    if(!s.stage||typeof s.stage!=="object"||typeof s.stage.w!=="number"||typeof s.stage.h!=="number") s.stage={w:2100,h:1400};
    if(typeof s.stageMaterial!=="string") s.stageMaterial="grass";
  return s; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
// guest status + free-text note (e.g. city · age)
function STATUS_TXT(s){ return s==="probable"?tr("stProbable"):s==="cut"?tr("stCut"):""; }
function gStatus(id){ return state.guests[id]?.status || "confirmed"; }
function gNote(id){ return state.guests[id]?.note || ""; }
function statusTitle(id){ const s=gStatus(id); const n=gNote(id); return (STATUS_TXT(s)?` · ⚠ ${STATUS_TXT(s)}`:"") + (n?` · ${n}`:""); }
function statusTag(id){ const s=gStatus(id); return STATUS_TXT(s)?`<span class="stag${s==="cut"?" cut":""}">${STATUS_TXT(s)}</span>`:""; }

// ---------- text measuring (so seats grow to fit the name) ----------
const _measureCtx = document.createElement("canvas").getContext("2d");
function textWidth(txt, fs){ _measureCtx.font = `700 ${fs}px ${FONT_FAMILY}`; return _measureCtx.measureText(txt).width; }
function seatWidthFor(name, fs){ return Math.round(clamp(textWidth(name,fs)+20, 46, 190)); }

const BASE_SLOT=46; // reference seat spacing — table size depends on this + seat count, NOT on name length
function roundGeom(t){
  const n=t.capacity;
  const fs=Math.round(11*fontScale);
  const seatH=fs+11;
  const need = n<2 ? BASE_SLOT : BASE_SLOT/(2*Math.sin(Math.PI/n));
  const ringR=Math.max(need, 46, seatH*1.2);
  const discR=Math.max(24, ringR - seatH/2 - 7);
  return {n,fs,seatH,ringR,discR};
}
function buildSeat(t,i,relx,rely,fs,seatH){
  const seat=document.createElement("div");
  const gid=t.seats[i];
  seat.className="seat"+(gid?" occupied":"");
  seat.style.left=relx+"px"; seat.style.top=rely+"px";
  seat.style.height=seatH+"px"; seat.style.borderRadius=(seatH/2)+"px"; seat.style.fontSize=fs+"px";
  seat.dataset.tableId=t.id; seat.dataset.seatIndex=i;
  if(gid){
    const col=guestColor(gid);
    seat.style.background=col; seat.style.width=seatWidthFor(guestName(gid),fs)+"px";
    if(gStatus(gid)!=="confirmed") seat.style.outline="2px dashed rgba(255,255,255,.7)";
    seat.innerHTML=`<span class="nm">${escapeHtml(guestName(gid))}</span>`;
    seat.title=guestName(gid)+(guestGroup(gid)?` · ${guestGroup(gid).name}`:"")+statusTitle(gid);
    seat.draggable=true; seat.dataset.guestId=gid;
  }else{
    seat.style.width="42px";
    seat.innerHTML=`<span class="nm" style="opacity:.6">+</span>`;
  }
  wireSeat(seat);
  return seat;
}
function tableExtent(t){   // half-size of a table incl. its seats — used to zoom onto it
  if(t.shape==="head"){ const g=headGeom(t); return { rx:g.tableW/2+30+100, ry:g.tableH/2+g.seatH+40 }; }
  const g=roundGeom(t); return { rx:g.ringR+100, ry:g.ringR+40 };
}
function renderRoundTable(t, wrap){
  const g=roundGeom(t);
  const disc=document.createElement("div");
  disc.className="table-disc";
  disc.style.width=(g.discR*2)+"px"; disc.style.height=(g.discR*2)+"px";
  const occ=t.seats.filter(Boolean).length;
  disc.innerHTML=`<span class="tgear" title="${escapeHtml(tr("tableSettings"))}">⚙</span><span class="tnum">${escapeHtml(t.label)}</span><span class="tcount">${occ}/${t.capacity}</span>`;
  disc.title=tr("tableTip");
  disc.querySelector(".tgear").addEventListener("click",e=>{ e.stopPropagation(); openMenu(t.id,e); });
  disc.addEventListener("contextmenu",e=>{ e.preventDefault(); openMenu(t.id,e); });
  makeDraggable(disc, wrap, t, ()=>renderTables(), ()=>focusTable(t.id));
  wrap.appendChild(disc);
  for(let i=0;i<t.capacity;i++){
    const a=(i/t.capacity)*2*Math.PI - Math.PI/2;
    wrap.appendChild(buildSeat(t,i, g.ringR*Math.cos(a), g.ringR*Math.sin(a), g.fs, g.seatH));
  }
  addTableRotateHandle(wrap, t, g.ringR+30);
}
function headGeom(t){
  const n=t.capacity;
  const top=Math.max(1,n-2);
  const fs=Math.round(11*fontScale);
  const seatH=fs+11;
  const slot=Math.round(64*fontScale);
  const innerW=top*slot;
  const tableW=innerW+34;
  const tableH=seatH+50;
  return {n,top,fs,seatH,slot,innerW,tableW,tableH};
}
function renderHeadTable(t, wrap){
  const g=headGeom(t);
  const disc=document.createElement("div");
  disc.className="table-disc head";
  disc.style.width=g.tableW+"px"; disc.style.height=g.tableH+"px";
  const occ=t.seats.filter(Boolean).length;
  disc.innerHTML=`<span class="tgear" title="${escapeHtml(tr("tableSettings"))}">⚙</span><span class="tnum">${escapeHtml(t.label)}</span><span class="tcount">${occ}/${t.capacity} · ${escapeHtml(tr("headFacing"))}</span>`;
  disc.title=tr("tableTip");
  disc.querySelector(".tgear").addEventListener("click",e=>{ e.stopPropagation(); openMenu(t.id,e); });
  disc.addEventListener("contextmenu",e=>{ e.preventDefault(); openMenu(t.id,e); });
  makeDraggable(disc, wrap, t, ()=>renderTables(), ()=>focusTable(t.id));
  wrap.appendChild(disc);
  // main row on the FAR side of the table, so the couple sits behind the table facing the dance floor
  for(let i=0;i<g.top;i++){
    const relx = -g.innerW/2 + g.slot/2 + i*g.slot;
    const rely = (g.tableH/2) + g.seatH/2 + 6;
    wrap.appendChild(buildSeat(t,i, relx, rely, g.fs, g.seatH));
  }
  const li=g.top, ri=g.top+1, endGap=30;
  if(li<t.capacity) wrap.appendChild(buildSeat(t,li, -(g.tableW/2)-endGap, 0, g.fs, g.seatH));
  if(ri<t.capacity) wrap.appendChild(buildSeat(t,ri,  (g.tableW/2)+endGap, 0, g.fs, g.seatH));
  addTableRotateHandle(wrap, t, g.tableH/2 + g.seatH + 30);
}
function renderTables(){
  stage.querySelectorAll(".table").forEach(e=>e.remove());
  state.tables.forEach(t=>{
    const wrap=document.createElement("div");
    wrap.className="table"+(t.id===focusId?" focused":""); wrap.style.left=t.x+"px"; wrap.style.top=t.y+"px"; wrap.dataset.tableId=t.id;
    if(t.shape==="head") renderHeadTable(t,wrap); else renderRoundTable(t,wrap);
    stage.appendChild(wrap);
  });
  updateStats();
  if(focusId!=null) renderFocus();
}

// Group chips: the active chip filters the guest list AND is the group new names join.
function renderGroups(){

function makeGroupChip(g, count, isAll){

let searchQ="";
function unseatedIds(){ const assigned=assignedGuestIds(); return Object.keys(state.guests).filter(id=>!assigned.has(id)); }
function visiblePoolIds(){
  const q=norm(searchQ); let ids=unseatedIds();
  if(q) return ids.filter(id=>norm(guestName(id)).includes(q));              // a search looks across all groups
  if(state.activeGroupId) ids=ids.filter(id=>state.guests[id].groupId===state.activeGroupId);

}
function renderPool(){

function updateStats(){

function addGroup(){
  const name=prompt(tr("promptNewGroup"), tr("groupN",{n:state.groups.length+1})); if(!name)return;
  const color=GROUP_PALETTE[state.groups.length % GROUP_PALETTE.length];
  const g={id:"grp"+nextId(), name:name.trim(), color};
  state.groups.push(g); state.activeGroupId=g.id; save(); renderGroups(); renderPool();
}
function renameGroup(id){ const g=state.groups.find(x=>x.id===id); if(!g)return; const nm=prompt(tr("promptRenameGroup"),g.name); if(nm&&nm.trim()){ g.name=nm.trim(); save(); renderGroups(); } }
function recolorGroup(id){
  const g=state.groups.find(x=>x.id===id); if(!g)return;
  const inp=document.createElement("input"); inp.type="color"; inp.value=g.color;
  inp.style.position="fixed"; inp.style.left="-9999px"; document.body.appendChild(inp);
  inp.addEventListener("input",()=>{ g.color=inp.value; save(); renderGroups(); renderTables(); renderPool(); });
  inp.addEventListener("change",()=>inp.remove()); inp.click();
}
function editGroup(id,evt){
  const g=state.groups.find(x=>x.id===id); if(!g)return;
  const menu=$("groupmenu");
  menu.innerHTML=`
    <div class="gm-item" data-act="rename"><span class="dot" style="background:${g.color}"></span>${escapeHtml(tr("gmRename",{n:g.name}))}</div>
    <div class="gm-item" data-act="recolor">${escapeHtml(tr("gmRecolor"))}</div>
    <div class="gm-sep"></div>
    <div class="gm-item danger" data-act="delete">${escapeHtml(tr("gmDelete"))}</div>`;
  menu.querySelector('[data-act="rename"]').onclick=()=>{ closeGroupMenu(); renameGroup(id); };
  menu.querySelector('[data-act="recolor"]').onclick=()=>{ closeGroupMenu(); recolorGroup(id); };
  menu.querySelector('[data-act="delete"]').onclick=()=>{
    closeGroupMenu();
    if(!confirm(tr("confirmDeleteGroup",{n:g.name})))return;
    Object.values(state.guests).forEach(gu=>{ if(gu.groupId===id) gu.groupId=null; });
    state.groups=state.groups.filter(x=>x.id!==id);
    if(state.activeGroupId===id) state.activeGroupId=null;
    save(); renderGroups(); renderTables(); renderPool();
  };
  showPopover(menu,evt);
}
function showPopover(menu,evt){
  menu.style.display="block";
  const x=Math.max(6, Math.min(evt.clientX, window.innerWidth - menu.offsetWidth - 8));
  const y=Math.max(6, Math.min(evt.clientY, window.innerHeight - menu.offsetHeight - 8));
  menu.style.left=x+"px"; menu.style.top=y+"px";
}
function anchorOf(el){ const r=el.getBoundingClientRect(); return {clientX:r.left, clientY:r.bottom+4}; }
function closeGroupMenu(){ $("groupmenu").style.display="none"; }
// Combined name + group editor (from a pool chip ✎ / right-click, a placed guest, or the pick bar).
function openGuestEditor(guestId, evt){
  const g=state.guests[guestId]; if(!g) return;
  const menu=$("guesteditor");
  const opts=[{id:"",name:tr("noGroup"),color:"#d8d2c8"}].concat(state.groups.map(gr=>({id:gr.id,name:gr.name,color:gr.color})));
  const rows=opts.map(o=>{ const on=((g.groupId||"")===o.id);
    return `<div class="ge-type${on?' sel':''}" data-gid="${o.id}"><span class="dot" style="background:${o.color}"></span>${escapeHtml(o.name)}${on?'<span class="chk">✓</span>':''}</div>`; }).join("");

  nameInp.addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Enter"){ e.preventDefault(); commitName(); closeGuestEditor(); } else if(e.key==="Escape"){ cancelled=true; closeGuestEditor(); } });

function matSwatchesHtml(current){ return `<div class="fm-mats">`+Object.keys(MATERIALS).map(k=>`<div class="fm-mat${k===current?' on':''}" data-mat="${k}" title="${escapeHtml(matName(k))}"><span class="sw" data-mat="${k}"></span></div>`).join("")+`</div>`; }

function closeFeatureMenu(){ $("featuremenu").style.display="none"; }
// Re-order a feature within the stack (array order = paint order; first = back, last = front).
function moveFeature(f, dir){
  const arr=state.features, i=arr.indexOf(f); if(i<0) return;
  arr.splice(i,1);
  const j = dir==="back"?0 : dir==="front"?arr.length : dir==="backward"?Math.max(0,i-1) : Math.min(arr.length,i+1);
  arr.splice(j,0,f); save(); renderFeatures();
}
function openFeatureMenu(f, evt){
  const menu=$("featuremenu");
  let html="";
  if(f.kind==="zone") html+=`<div class="gm-cap">${escapeHtml(tr("fmSurface"))}</div>`+matSwatchesHtml(f.material||"grass");
  html+=`<div class="gm-cap">${escapeHtml(tr("fmLayer"))}</div>`;
  html+=`<div class="gm-item" data-act="back">${escapeHtml(tr("fmBack"))}</div><div class="gm-item" data-act="backward">${escapeHtml(tr("fmBackward"))}</div>`;
  html+=`<div class="gm-item" data-act="forward">${escapeHtml(tr("fmForward"))}</div><div class="gm-item" data-act="front">${escapeHtml(tr("fmFront"))}</div>`;
  html+=`<div class="gm-sep"></div><div class="gm-item" data-act="rename">${escapeHtml(tr("fmRename"))}</div><div class="gm-item danger" data-act="delete">${escapeHtml(tr("fmDelete"))}</div>`;
  menu.innerHTML=html; paintSwatches(menu);
  menu.querySelectorAll(".fm-mat").forEach(m=>m.onclick=()=>{ f.material=m.dataset.mat; save(); renderFeatures(); closeFeatureMenu(); });
  ["back","backward","forward","front"].forEach(dir=>{ const el=menu.querySelector(`[data-act="${dir}"]`); if(el) el.onclick=()=>{ moveFeature(f,dir); closeFeatureMenu(); }; });
  menu.querySelector('[data-act="rename"]').onclick=()=>{ const nm=prompt(tr("fmLabelPrompt"), f.label||""); if(nm!==null){ f.label=nm; save(); renderFeatures(); } closeFeatureMenu(); };
  menu.querySelector('[data-act="delete"]').onclick=()=>{ state.features=state.features.filter(x=>x.id!==f.id); save(); renderFeatures(); closeFeatureMenu(); };
  showPopover(menu,evt);
}

// ---- pinch to zoom on the canvas (two fingers) ----
(function(){
  const wrap=stagewrap;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const mid =t=>({ x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 });
  let base=null;
  wrap.addEventListener("touchstart",e=>{
    if(e.touches.length!==2){ base=null; return; }
    if(pointerGesture){ base=null; return; }
    const m=mid(e.touches), r=wrap.getBoundingClientRect();
    base={ d:dist(e.touches)||1, z:zoom, cx:(wrap.scrollLeft+m.x-r.left)/zoom, cy:(wrap.scrollTop+m.y-r.top)/zoom };
  },{passive:true});
  wrap.addEventListener("touchmove",e=>{
    if(!base||e.touches.length!==2) return;
    e.preventDefault();
    zoom=clamp(base.z*dist(e.touches)/base.d, 0.2, 2.5);
    applyZoom();
    const m=mid(e.touches), r=wrap.getBoundingClientRect();
    wrap.scrollLeft=base.cx*zoom-(m.x-r.left);
    wrap.scrollTop =base.cy*zoom-(m.y-r.top);
  },{passive:false});
  const end=e=>{ if(e.touches.length<2) base=null; };
  wrap.addEventListener("touchend",end,{passive:true});
  wrap.addEventListener("touchcancel",end,{passive:true});
})();
// ---- ctrl/⌘ + wheel zooms around the cursor (desktop) ----
stagewrap.addEventListener("wheel",e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  e.preventDefault();
  const r=stagewrap.getBoundingClientRect(), m=isNarrow()?12:24;
  const cx=(stagewrap.scrollLeft+e.clientX-r.left-m)/zoom, cy=(stagewrap.scrollTop+e.clientY-r.top-m)/zoom;
  zoom=clamp(zoom*(e.deltaY<0?1.1:0.9), 0.2, 2.5); applyZoom();
  stagewrap.scrollLeft=m+cx*zoom-(e.clientX-r.left); stagewrap.scrollTop=m+cy*zoom-(e.clientY-r.top);
},{passive:false});
window.addEventListener("resize",()=>applyZoom());

function placeGuestInSeat(drag, tableId, seatIndex){

// ============================================================
//  MOVE (smooth pointer dragging — moves the element, no rebuild until done)
// ============================================================
function makeDraggable(handleEl, moveEl, obj, onEnd, onTap){
  handleEl.addEventListener("pointerdown",e=>{
    if(e.target.closest(".tgear")||e.target.closest(".rz")||e.target.closest(".rot-h")) return;
    if(e.button!==0) return;
    e.preventDefault(); e.stopPropagation();
    handleEl.setPointerCapture(e.pointerId); pointerGesture=true;
    const sx=e.clientX, sy=e.clientY, ox=obj.x, oy=obj.y; let moved=false;
    const maxX=(state.stage?state.stage.w:1700)-20, maxY=(state.stage?state.stage.h:1360)-20;
    function mv(ev){
      const dx=(ev.clientX-sx)/zoom, dy=(ev.clientY-sy)/zoom;
      if(Math.abs(ev.clientX-sx)>4||Math.abs(ev.clientY-sy)>4) moved=true;
      if(!moved) return;
      obj.x=clamp(ox+dx, 20, maxX); obj.y=clamp(oy+dy, 20, maxY);
      moveEl.style.left=obj.x+"px"; moveEl.style.top=obj.y+"px";
    }
    function up(){ pointerGesture=false; try{ handleEl.releasePointerCapture(e.pointerId); }catch(x){} handleEl.removeEventListener("pointermove",mv); handleEl.removeEventListener("pointerup",up); handleEl.removeEventListener("pointercancel",up);
      if(moved){ save(); if(onEnd)onEnd(); } else if(onTap) onTap(); }
    handleEl.addEventListener("pointermove",mv); handleEl.addEventListener("pointerup",up); handleEl.addEventListener("pointercancel",up);
  });
}
// Resize a feature from its bottom-right corner, keeping the top-left corner fixed (x/y are the centre).
function makeResizable(handle, el, f){
  handle.addEventListener("pointerdown",e=>{
    if(e.button!==0) return;
    e.preventDefault(); e.stopPropagation();
    handle.setPointerCapture(e.pointerId); pointerGesture=true;
    const sx=e.clientX, sy=e.clientY, ow=f.w, oh=f.h, ox=f.x, oy=f.y;
    function mv(ev){
      const nw=Math.max(24, ow+(ev.clientX-sx)/zoom), nh=Math.max(18, oh+(ev.clientY-sy)/zoom);
      f.w=nw; f.h=nh; f.x=ox+(nw-ow)/2; f.y=oy+(nh-oh)/2;
      el.style.width=nw+"px"; el.style.height=nh+"px"; el.style.left=f.x+"px"; el.style.top=f.y+"px";
    }
    function up(){ pointerGesture=false; try{ handle.releasePointerCapture(e.pointerId); }catch(x){} handle.removeEventListener("pointermove",mv); handle.removeEventListener("pointerup",up); save(); }
    handle.addEventListener("pointermove",mv); handle.addEventListener("pointerup",up);
  });
}
// Rotate any object by dragging its ⟳ handle around the object centre.
function makeRotatable(handle, centerEl, obj, applyFn){
  handle.addEventListener("pointerdown",e=>{
    if(e.button!==0) return;
    e.preventDefault(); e.stopPropagation(); handle.setPointerCapture(e.pointerId); pointerGesture=true;
    function mv(ev){
      const r=centerEl.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
      let ang=Math.atan2(ev.clientY-cy, ev.clientX-cx)*180/Math.PI + 90;
      if(ev.shiftKey) ang=Math.round(ang/15)*15;
      obj.rot=Math.round(ang); applyFn();
    }
    function up(){ pointerGesture=false; try{ handle.releasePointerCapture(e.pointerId); }catch(x){} handle.removeEventListener("pointermove",mv); handle.removeEventListener("pointerup",up); save(); }
    handle.addEventListener("pointermove",mv); handle.addEventListener("pointerup",up);
  });
}
// Add a rotate handle to a table; keeps the number & names upright while the table spins.
function addTableRotateHandle(wrap, t, offset){
  const h=document.createElement("div"); h.className="rot-h";
  h.style.left="0"; h.style.top=(-offset)+"px"; h.style.transform="translate(-50%,-50%)";
  wrap.appendChild(h);

    wrap.style.transform=`rotate(${t.rot||0}deg)`;
    wrap.querySelectorAll(".nm,.tnum,.tcount").forEach(x=>{ x.style.display="inline-block"; x.style.transform=`rotate(${-(t.rot||0)}deg)`; });
  };
  apply();
  makeRotatable(h, wrap, t, apply);
}
// The whole space: size + floor material, plus a drag-to-resize corner handle.
function applyStage(){

function makeStageResizable(h){
  h.addEventListener("pointerdown",e=>{
    if(e.button!==0) return;
    e.preventDefault(); e.stopPropagation(); h.setPointerCapture(e.pointerId); pointerGesture=true;
    const sx=e.clientX, sy=e.clientY, ow=state.stage.w, oh=state.stage.h;

    function up(){ pointerGesture=false; try{ h.releasePointerCapture(e.pointerId); }catch(x){} h.removeEventListener("pointermove",mv); h.removeEventListener("pointerup",up); applyZoom(); save(); }
    h.addEventListener("pointermove",mv); h.addEventListener("pointerup",up);
  });
}

// ============================================================
//  TABLE FOCUS — tap a table: the canvas glides onto it and a seat list opens
//  (right panel on a PC, bottom sheet on a phone). Type a name, Enter → next seat.
// ============================================================
const focusEl=$("focus"), fSeats=$("fSeats");
let sug=null, viewAnim=null;
function focusedTable(){ return state.tables.find(t=>t.id===focusId)||null; }
function visibleBox(){
  let w=stagewrap.clientWidth, h=stagewrap.clientHeight;
  if(isNarrow() && document.body.classList.contains("focused")) h=Math.max(140, h-focusEl.getBoundingClientRect().height);
  return {w,h};
}
// Glide the view so stage point (cx,cy) sits at the visible centre at zoom z.
function viewTo(cx,cy,z,animate){
  const m=isNarrow()?12:24, wrap=stagewrap;
  if(viewAnim){ cancelAnimationFrame(viewAnim); viewAnim=null; }
  const place=(zz,x,y)=>{ zoom=zz; applyZoom(); const b=visibleBox(); wrap.scrollLeft=m+x*zoom-b.w/2; wrap.scrollTop=m+y*zoom-b.h/2; };
  if(!animate){ place(z,cx,cy); return; }
  const b0=visibleBox(), z0=zoom, cx0=(wrap.scrollLeft+b0.w/2-m)/z0, cy0=(wrap.scrollTop+b0.h/2-m)/z0, t0=performance.now(), dur=280;
  const step=now=>{ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
    place(z0+(z-z0)*e, cx0+(cx-cx0)*e, cy0+(cy-cy0)*e);
    viewAnim = p<1 ? requestAnimationFrame(step) : null; };
  viewAnim=requestAnimationFrame(step);
}
function focusTable(id, opts={}){
  const t=state.tables.find(x=>x.id===id); if(!t) return;
  const wasOpen=document.body.classList.contains("focused");
  focusId=id; focusRowWanted=(opts.row!=null)?opts.row:null;
  document.body.classList.add("focused"); setNav(false); hideSug();
  stage.querySelectorAll(".table").forEach(w=>w.classList.toggle("focused", +w.dataset.tableId===id));
  renderFocus();
  // zoom onto the table once the panel has taken its space (layout changes on open)
  requestAnimationFrame(()=>{
    const ext=tableExtent(t), b=visibleBox();
    const z=clamp(Math.min(b.w*0.82/(ext.rx*2), b.h*0.82/(ext.ry*2)), 0.5, 1.6);
    viewTo(t.x, t.y, z, wasOpen || !isNarrow());
    if(focusRowWanted!=null){ const i=focusRowWanted; focusRowWanted=null; setTimeout(()=>focusRow(i),60); }
  });
}
function unfocusTable(){
  if(focusId==null && !document.body.classList.contains("focused")) return;
  focusId=null; hideSug(); document.body.classList.remove("focused"); focusEl.classList.remove("tall");
  stage.querySelectorAll(".table.focused").forEach(w=>w.classList.remove("focused"));
}
function renderFocus(){
  const t=focusedTable(); if(!t){ unfocusTable(); return; }
  const occ=t.seats.filter(Boolean).length;
  $("fName").textContent=t.label; $("fCount").textContent=`${occ}/${t.capacity}`;
  // keep a live (uncommitted) input alive across re-renders
  const ae=document.activeElement; let keep=null;
  if(ae && ae.tagName==="INPUT" && ae.closest("#fSeats") && !ae.dataset.done){ keep={ i:+ae.closest(".frow").dataset.i, v:ae.value, s:ae.selectionStart }; }
  fSeats.innerHTML="";
  for(let i=0;i<t.capacity;i++){
    const gid=t.seats[i];
    const row=document.createElement("div"); row.className="frow"+(gid?" occ":""); row.dataset.i=i;
    row.innerHTML=`<span class="fn">${i+1}</span><span class="fdot"${gid?` style="background:${guestColor(gid)}"`:""}></span><input type="text" maxlength="40" autocomplete="off" spellcheck="false" placeholder="${escapeHtml(tr("seatPh"))}" value="${gid?escapeHtml(guestName(gid)):""}"><button class="fx" title="${escapeHtml(tr("unseat"))}" tabindex="-1">✕</button>`;
    const inp=row.querySelector("input");
    inp.addEventListener("focus",()=>{ markSeat(i); showSug(i,inp.value); });
    inp.addEventListener("input",()=>showSug(i,inp.value));
    inp.addEventListener("keydown",e=>onRowKey(e,i,inp));
    inp.addEventListener("blur",()=>{ setTimeout(()=>{ if(!inp.isConnected||inp.dataset.done) return; const tb=focusedTable(); if(!tb) return; hideSug();
      if(!inp.value.trim() && tb.seats[i]){ inp.value=guestName(tb.seats[i]); return; }   // blurring an emptied seat just restores it (× or Enter unseat)
      commitRow(tb,i,inp.value,null); },120); });
    row.querySelector(".fx").addEventListener("click",()=>{ const tb=focusedTable(); if(tb&&tb.seats[i]){ tb.seats[i]=null; save(); renderTables(); renderPool(); } });
    fSeats.appendChild(row);
  }
  if(keep){ const inp=rowInput(keep.i); if(inp){ inp.value=keep.v; inp.focus({preventScroll:true}); try{ inp.setSelectionRange(keep.s,keep.s); }catch(e){} } }
}
function rowInput(i){ return fSeats.querySelector(`.frow[data-i="${i}"] input`); }
function focusRow(i){ const inp=rowInput(i); if(!inp) return; inp.focus(); inp.select(); inp.scrollIntoView({block:"nearest"}); }
function markSeat(i){ stage.querySelectorAll(".table.focused .seat").forEach(s=>s.classList.toggle("sel", +s.dataset.seatIndex===i)); }
function onRowKey(e,i,inp){
  e.stopPropagation();
  const tb=focusedTable(); if(!tb) return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    if(sug&&sug.i===i&&sug.items.length){ e.preventDefault(); sug.sel=(sug.sel+(e.key==="ArrowDown"?1:-1)+sug.items.length)%sug.items.length; paintSug(); }
    return;
  }
  if(e.key==="Escape"){ e.preventDefault(); if(sug){ hideSug(); } else { inp.dataset.done="1"; inp.blur(); unfocusTable(); } return; }
  if(e.key==="Enter"||e.key==="Tab"){
    e.preventDefault(); inp.dataset.done="1";
    const choice=(sug&&sug.i===i&&sug.items.length)?sug.items[sug.sel]:null; hideSug();
    const v=inp.value.trim();
    if(choice&&choice.id!=="__new") commitRow(tb,i,"",choice.id);
    else if(!v && tb.seats[i]){ tb.seats[i]=null; save(); renderTables(); renderPool(); }   // Enter on an emptied seat = unseat
    else commitRow(tb,i,v,null);
    renderFocus();
    const next=e.shiftKey? i-1 : i+1;
    if(next>=0 && next<tb.capacity) focusRow(next);
  }
}
// Apply what was typed/chosen for seat i. Returns true if the plan changed.
function commitRow(tb,i,text,chosenId){
  const cur=tb.seats[i]; const v=(text||"").trim(); let changed=false;
  if(chosenId && state.guests[chosenId]){ if(cur!==chosenId){ tb.seats[i]=chosenId; changed=true; } }
  else if(v){
    if(cur){ if(state.guests[cur].name!==v){ state.guests[cur].name=v; changed=true; } }
    else { const id="g"+nextId(); state.guests[id]={ name:v, groupId:state.activeGroupId||null }; tb.seats[i]=id; changed=true; }
  }
  if(changed){ save(); renderTables(); renderPool(); renderGroups(); }
  return changed;
}
// Suggestions under the active row: unseated guests matching the text (active group first when empty).
function showSug(i,q){
  const tb=focusedTable(); if(!tb) return;
  const nq=norm(q); const cur=tb.seats[i];
  if(cur && nq===norm(guestName(cur))){ hideSug(); return; }
  let pool=unseatedIds();
  if(nq) pool=pool.filter(id=>norm(guestName(id)).includes(nq));
  else if(state.activeGroupId){ const g=pool.filter(id=>state.guests[id].groupId===state.activeGroupId); if(g.length) pool=g; }
  const items=pool.slice(0,5).map(id=>({id, name:guestName(id), color:guestColor(id)}));
  const exact=nq && items.some(it=>norm(it.name)===nq);
  if(nq && !exact) items.push({ id:"__new", name:cur? tr("renameTo",{n:q.trim()}) : tr("createNew",{n:q.trim()}) });
  if(!items.length){ hideSug(); return; }
  sug={ i, items, sel:0, more:Math.max(0,pool.length-5) };
  paintSug();
}
function paintSug(){
  fSeats.querySelectorAll(".fsug").forEach(e=>e.remove());
  if(!sug) return;
  const row=fSeats.querySelector(`.frow[data-i="${sug.i}"]`); if(!row) return;
  const box=document.createElement("div"); box.className="fsug";
  box.innerHTML=sug.items.map((it,k)=>`<div class="${it.id==="__new"?"new":""}${k===sug.sel?" sel":""}" data-k="${k}">${it.color?`<span class="dot" style="background:${it.color}"></span>`:""}${escapeHtml(it.name)}</div>`).join("")
    +(sug.more?`<div class="more">${escapeHtml(tr("moreMatches",{n:sug.more}))}</div>`:"");
  box.querySelectorAll("[data-k]").forEach(el=>{
    el.addEventListener("pointerdown",e=>e.preventDefault());     // keep the input focused (no blur commit)
    el.addEventListener("click",()=>chooseSug(+el.dataset.k));
  });
  row.after(box);
  const sel=box.querySelector(".sel"); if(sel) sel.scrollIntoView({block:"nearest"});
}
function hideSug(){ sug=null; fSeats.querySelectorAll(".fsug").forEach(e=>e.remove()); }
function chooseSug(k){
  if(!sug) return; const it=sug.items[k], i=sug.i, tb=focusedTable(); if(!tb) return;
  const inp=rowInput(i); if(inp) inp.dataset.done="1";
  hideSug();
  if(it.id==="__new") commitRow(tb,i,inp?inp.value:"",null); else commitRow(tb,i,"",it.id);
  renderFocus(); if(i+1<tb.capacity) focusRow(i+1);
}
function stepTable(dir){
  const t=focusedTable(); if(!t) return;
  const i=state.tables.indexOf(t); const n=state.tables.length;
  focusTable(state.tables[(i+dir+n)%n].id);
}

function fillFrom(t, gid){
  let ids=unseatedIds(); if(gid) ids=ids.filter(id=>state.guests[id].groupId===gid);
  if(!ids.length){ toast(tr("fillNone")); return; }
  let k=0; for(let i=0;i<t.capacity&&k<ids.length;i++){ if(!t.seats[i]) t.seats[i]=ids[k++]; }
  save(); renderTables(); renderPool(); renderGroups(); toast(tr("filled",{n:k}));
}

function importGuestList(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.importGuests) mergeGuestList(d); else if(d.tables) toast(tr("tFullPlan")); else toast(tr("tNotGuestList")); }catch(e){ toast(tr("tInvalidFile")); } };
    r.readAsText(f); };
  inp.click();
}
function mergeGuestList(data){
  const nameToId={}; state.groups.forEach(g=>nameToId[g.name]=g.id);
  (data.importGroups||[]).forEach(g=>{
    if(!nameToId[g.name]){ const id="grp"+nextId(); state.groups.push({id,name:g.name,color:(g.color?safeColor(g.color):GROUP_PALETTE[state.groups.length%GROUP_PALETTE.length])}); nameToId[g.name]=id; }
  });
  const seenSrc=new Set(Object.values(state.guests).map(g=>g.srcId).filter(Boolean));
  let added=0, skipped=0;
  (data.importGuests||[]).forEach(gi=>{
    const nm=(gi.name||"").trim(); if(!nm) return;
    if(gi.srcId && seenSrc.has(gi.srcId)){ skipped++; return; }
    const id="g"+nextId();
    state.guests[id]={ name:nm, groupId: gi.group? (nameToId[gi.group]||null):null, status: gi.status||"confirmed", note: gi.note||"", srcId: gi.srcId||null };
    if(gi.srcId) seenSrc.add(gi.srcId);
    added++;
  });
  save(); renderAll();
  toast(tr("tMerged",{a:added})+(skipped?tr("tMergedSkipped",{s:skipped}):""));
}

let cloudTimer=null, pushInFlight=false, pendingSnap=null, pointerGesture=false;
function planPayload(){ const cur=currentProfile(); return { name:cur.name, plan:{...state, _profileName:cur.name} }; }
// Edit key rides in the URL #fragment (never sent to servers / logs); omit it for a view-only link.
function shareLink(cur, viewOnly){ const base=location.origin+location.pathname+"?plan="+cur.cloudId;
  return (viewOnly||!cur.editKey)? base : base+"#key="+cur.editKey; }
function setCloudDot(st){ const b=$("cloudBtn"); if(!b) return;
  b.textContent={ok:tr("cloudOk"),pending:tr("cloudPending"),err:tr("cloudErr")}[st]||tr("cloudIdle"); b.classList.toggle("on", st==="ok"); }
function fmtTime(ms){ try{ return ms? new Date(ms).toLocaleString():"—"; }catch(e){ return "—"; } }
function canPush(prof){ return !!(prof && prof.cloudId && !prof.readonly && (prof.editKey || getSyncCode())); }
function authHeaders(prof){ const h={"Content-Type":"application/json"};
  if(prof.editKey) h["X-Edit-Key"]=prof.editKey; else if(getSyncCode()) h["X-Sync-Code"]=getSyncCode(); return h; }
// True while the user is mid-interaction — used to defer a cloud pull so it can't clobber live edits.
function interactionBusy(){
  if(dragData||pick||pointerGesture||viewAnim) return true;
  const ae=document.activeElement;
  if(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.isContentEditable)) return true;
  if(document.querySelector(".modal-back.open")) return true;
  for(const id of ["groupmenu","guesteditor","tablemenu","featuremenu","profilemenu","moremenu","fillmenu"]){ const el=$(id); if(el && el.style.display==="block") return true; }
  return false;
}
async function cloudCreate(){
  const r=await fetch(SYNC_URL+"/plans",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(planPayload())});
  const d=await r.json(); if(!r.ok||!d.id) throw new Error(d.error||"upload failed");
  const cur=currentProfile(); cur.cloudId=d.id; cur.editKey=d.editKey; cur.cloudUpdated=d.updated; cur.readonly=false; saveProfilesIdx(); registerUnderCode(cur); return d;
}
function snapshotFor(prof){ return { profId:prof.id, cloudId:prof.cloudId, editKey:prof.editKey||"", name:prof.name,
  planJSON:JSON.stringify({...state, _profileName:prof.name}), baseUpdated:prof.cloudUpdated||0 }; }
async function cloudPush(snap){
  const prof=profiles.profiles.find(p=>p.id===snap.profId); if(!prof||!prof.cloudId) return;
  const headers={"Content-Type":"application/json"};
  if(snap.editKey) headers["X-Edit-Key"]=snap.editKey; else if(getSyncCode()) headers["X-Sync-Code"]=getSyncCode();
  const r=await fetch(SYNC_URL+"/plans/"+snap.cloudId,{method:"PUT",headers,
    body:JSON.stringify({ name:snap.name, plan:JSON.parse(snap.planJSON), baseUpdated:snap.baseUpdated })});
  if(r.status===409){
    const d=await r.json().catch(()=>({}));
    prof.cloudUpdated=d.updated||prof.cloudUpdated; saveProfilesIdx();
    if(prof.id===profiles.activeId && d.plan && !interactionBusy()){ applyPulledPlan(prof,d); toast(tr("cNewer")); }
    return;
  }
  const d=await r.json(); if(!r.ok) throw new Error(d.error||"update failed");
  prof.cloudUpdated=d.updated; saveProfilesIdx(); registerUnderCode(prof); return d;
}
async function cloudFetch(id){ const r=await fetch(SYNC_URL+"/plans/"+id); const d=await r.json(); if(!r.ok) throw new Error(d.error||"not found"); return d; }
async function cloudDelete(prof){
  if(!prof||!prof.cloudId) return;
  try{ await fetch(SYNC_URL+"/plans/"+prof.cloudId,{method:"DELETE",headers:authHeaders(prof)}); }catch(e){}
  const code=getSyncCode(); if(code){ try{ await fetch(codeUrl(),{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:prof.cloudId})}); }catch(e){} }
  prof.cloudId=""; prof.editKey=""; prof.cloudUpdated=0; prof.readonly=false; saveProfilesIdx();
}
// ---- sync code: link all my devices under one shared code ----
const SYNC_CODE_KEY=PBASE+".syncCode";
function getSyncCode(){ try{ return localStorage.getItem(SYNC_CODE_KEY)||""; }catch(e){ return ""; } }
function setSyncCode(c){ try{ if(c) localStorage.setItem(SYNC_CODE_KEY,c); else localStorage.removeItem(SYNC_CODE_KEY); }catch(e){} }
function randCode(){ const c="abcdefghijkmnpqrstuvwxyz23456789"; let s="";
  const a=(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(new Uint8Array(16)):null;
  for(let i=0;i<16;i++) s+=c[(a?a[i]:Math.floor(Math.random()*256))%c.length]; return s; }
function codeUrl(){ return SYNC_URL+"/codes/"+encodeURIComponent(getSyncCode()); }
async function registerUnderCode(prof){ const code=getSyncCode(); prof=prof||currentProfile(); if(!code||!prof||!prof.cloudId) return;
  const headers={"Content-Type":"application/json"}; if(prof.editKey) headers["X-Edit-Key"]=prof.editKey;
  try{ await fetch(codeUrl(),{method:"POST",headers,body:JSON.stringify({id:prof.cloudId,name:prof.name,updated:prof.cloudUpdated})}); }catch(e){} }
async function registerAllUnderCode(){ const code=getSyncCode(); if(!code) return; for(const p of profiles.profiles){ if(p.cloudId) await registerUnderCode(p); } }
async function syncFromCode(){ const code=getSyncCode(); if(!code) return 0;
  let plans; try{ const r=await fetch(codeUrl()); plans=(await r.json()).plans||[]; }catch(e){ return 0; }
  let added=0;
  for(const p of plans){ if(profiles.profiles.some(x=>x.cloudId===p.id)) continue;
    try{ const d=await cloudFetch(p.id); const s=d.plan||{}; if(!s.tables) continue; delete s._profileName;
      sanitizePlan(s); if(s.layoutVersion!==LAYOUT_VERSION) migrateLayout(s);
      const pid=newProfileId();
      let stored=true; try{ localStorage.setItem(planKey(pid), JSON.stringify(s)); }catch(e){ stored=false; }
      if(!stored) continue;
      profiles.profiles.push({ id:pid, name:d.name||p.name||tr("sharedPlan"), cloudId:p.id, editKey:p.editKey||"", cloudUpdated:d.updated }); added++;
    }catch(e){}
  }
  if(added){ saveProfilesIdx(); renderProfiles(); }
  return added;
}
let cloudPoll=null;
function startCloudPoll(){ if(cloudPoll) return;
  cloudPoll=setInterval(async()=>{
    if(pushInFlight||cloudTimer||pendingSnap) return;
    if(interactionBusy()) return;
    if(getSyncCode()) await syncFromCode();
    const cur=currentProfile(); if(cur&&cur.cloudId){
      try{ const d=await cloudFetch(cur.cloudId);
        if(d.updated && (!cur.cloudUpdated||d.updated>cur.cloudUpdated) && !interactionBusy() && !cloudTimer){ applyPulledPlan(cur,d); toast(tr("cUpdated")); }
      }catch(e){}
    }
  }, 15000);
}
function scheduleCloudPush(){
  const cur=(profiles&&profiles.profiles)?currentProfile():null; if(!canPush(cur)) return;
  pendingSnap=snapshotFor(cur);
  clearTimeout(cloudTimer); setCloudDot("pending");
  cloudTimer=setTimeout(runPush, 2500);
}
async function runPush(){
  cloudTimer=null; const snap=pendingSnap; if(!snap) return;
  pushInFlight=true;
  try{ await cloudPush(snap); pendingSnap=null; setCloudDot("ok"); }
  catch(e){ setCloudDot("err"); if(navigator.onLine!==false){ clearTimeout(cloudTimer); cloudTimer=setTimeout(runPush, 8000); } }
  finally{ pushInFlight=false; }
}
function flushCloudPush(){
  if(cloudTimer){ clearTimeout(cloudTimer); cloudTimer=null; }
  const snap=pendingSnap; if(!snap) return; pendingSnap=null;
  try{
    const headers={"Content-Type":"application/json"};
    if(snap.editKey) headers["X-Edit-Key"]=snap.editKey; else if(getSyncCode()) headers["X-Sync-Code"]=getSyncCode();
    fetch(SYNC_URL+"/plans/"+snap.cloudId,{method:"PUT",headers,keepalive:true,
      body:JSON.stringify({ name:snap.name, plan:JSON.parse(snap.planJSON), baseUpdated:snap.baseUpdated })});
  }catch(e){}
}
window.addEventListener("pagehide",flushCloudPush);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushCloudPush(); });
function applyPulledPlan(cur, d){
  const s=d.plan||{}; delete s._profileName;
  if(!s.tables){ cur.cloudUpdated=d.updated; saveProfilesIdx(); return; }
  sanitizePlan(s); if(s.layoutVersion!==LAYOUT_VERSION) migrateLayout(s);
  setPick(null); dragData=null;
  state=s; uid=state._uid||2001; fontScale=state.seatFontScale||1;
  if(d.name) cur.name=d.name; cur.cloudUpdated=d.updated; saveProfilesIdx();
  try{ localStorage.setItem(planKey(cur.id), JSON.stringify(state)); }catch(e){}
  applyStage(); $("stageFloor").value=state.stageMaterial||"grass";
  renderProfiles(); renderAll();
  setTimeout(()=>{ zoom=initialZoom(); applyZoom(); },30);
}
function renderCloudBody(){
  const cur=currentProfile(); const body=$("cloudBody"); const code=getSyncCode();
  const inputStyle='style="flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)"';
  const codeHtml = code
    ? `<div style="border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px">
         <div class="mhint" style="padding:0 0 8px">${tr("cCodeHas")}</div>
         <div style="display:flex;gap:8px"><input id="syncCodeShow" readonly value="${escapeHtml(code)}" ${inputStyle}><button class="ibtn primary" id="syncCodeCopy" title="${escapeHtml(tr("cCodeCopy"))}">📋</button></div>
         <div class="mhint" style="padding:6px 0 0"><a href="#" id="syncCodeRefresh">${escapeHtml(tr("cRefresh"))}</a> · <a href="#" id="syncCodeDisconnect">${escapeHtml(tr("cDisconnect"))}</a></div>
       </div>`
    : `<div style="border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px">
         <div class="mhint" style="padding:0 0 8px">${tr("cCodeNone")}</div>
         <button class="ibtn primary" id="syncCodeGen" style="width:100%;height:38px;margin-bottom:8px">${escapeHtml(tr("cCodeGen"))}</button>
         <div style="display:flex;gap:8px"><input id="syncCodeInput" placeholder="${escapeHtml(tr("cCodePh"))}" ${inputStyle}><button class="ibtn" id="syncCodeJoin">${escapeHtml(tr("cJoin"))}</button></div>
       </div>`;
  const wire=()=>{
    const gen=$("syncCodeGen");
    if(gen) gen.onclick=async()=>{ setSyncCode(randCode()); await registerAllUnderCode(); await syncFromCode(); toast(tr("cCodeCreated")); renderCloudBody(); };
    const join=$("syncCodeJoin");
    if(join) join.onclick=async()=>{ const v=$("syncCodeInput").value.trim().toLowerCase().replace(/\s+/g,"");
      if(v.length<12){ toast(tr("cCodeShort")); return; } setSyncCode(v); await registerAllUnderCode(); const n=await syncFromCode(); toast(n?tr("cJoined",{n}):tr("cJoinedSynced")); renderCloudBody(); };
    const cp=$("syncCodeCopy"); if(cp) cp.onclick=()=>copyText($("syncCodeShow"));
    const rf=$("syncCodeRefresh"); if(rf) rf.onclick=async(e)=>{ e.preventDefault(); const n=await syncFromCode(); toast(n?tr("cAdded",{n}):tr("cUpToDate")); };
    const dc=$("syncCodeDisconnect"); if(dc) dc.onclick=(e)=>{ e.preventDefault(); if(!confirm(tr("cDisconnectConfirm"))) return; setSyncCode(""); toast(tr("cDisconnected")); renderCloudBody(); };
  };
  if(!cur.cloudId){
    body.innerHTML=codeHtml+`<div class="mhint" style="padding:0 0 8px">${escapeHtml(tr("cUploadHint"))}</div>
      <button class="ibtn primary" id="cloudUpload" style="width:100%;height:40px">${escapeHtml(tr("cUpload"))}</button>`;
    wire();
    $("cloudUpload").onclick=async()=>{ const b=$("cloudUpload"); b.disabled=true; b.textContent=tr("cUploading");
      try{ await cloudCreate(); setCloudDot("ok"); renderCloudBody(); toast(tr("cOnline")); }
      catch(e){ b.disabled=false; b.textContent=tr("cUpload"); toast(tr("cUploadFail")); } };
  } else {
    const editLink=shareLink(cur,false), viewLink=shareLink(cur,true), canEdit=canPush(cur)||!!cur.editKey;
    const linkStyle='style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)"';
    body.innerHTML=codeHtml+`
      ${cur.editKey?`<div class="mhint" style="padding:0 0 4px;font-weight:600">${escapeHtml(tr("cEditLink"))}</div><input id="cloudLink" readonly value="${escapeHtml(editLink)}" ${linkStyle}>`:""}
      <div class="mhint" style="padding:8px 0 4px;font-weight:600">${escapeHtml(tr("cViewLink"))}</div><input id="cloudViewLink" readonly value="${escapeHtml(viewLink)}" ${linkStyle}>
      <div class="mrow">${cur.editKey?`<button class="ibtn primary" id="cloudCopy">${escapeHtml(tr("cCopyEdit"))}</button>`:""}<button class="ibtn" id="cloudCopyView">${escapeHtml(tr("cCopyView"))}</button></div>
      <div class="mrow"><button class="ibtn" id="cloudPushNow">${escapeHtml(tr("cPushNow"))}</button><button class="ibtn" id="cloudPullNow">${escapeHtml(tr("cPullNow"))}</button><button class="ibtn danger" id="cloudRemove">${escapeHtml(tr("cRemove"))}</button></div>
      <div class="mhint" style="padding:8px 0 0">${escapeHtml(tr("cLast",{t:fmtTime(cur.cloudUpdated)}))}${canEdit?"":tr("cViewOnlyHere")}</div>`;
    wire();
    const cc=$("cloudCopy"); if(cc) cc.onclick=()=>copyText($("cloudLink"));
    $("cloudCopyView").onclick=()=>copyText($("cloudViewLink"));
    $("cloudPushNow").onclick=async()=>{ const c2=currentProfile(); if(!canPush(c2)){ toast(tr("cViewOnly")); return; }
      try{ await cloudPush(snapshotFor(c2)); setCloudDot("ok"); renderCloudBody(); toast(tr("cPushed")); }catch(e){ toast(tr("cPushFail")); } };
    $("cloudPullNow").onclick=async()=>{ if(!confirm(tr("cPullConfirm"))) return;
      try{ const d=await cloudFetch(cur.cloudId); applyPulledPlan(cur,d); renderCloudBody(); toast(tr("cPulled")); }catch(e){ toast(tr("cPullFail")); } };
    $("cloudRemove").onclick=async()=>{ if(!confirm(tr("cRemoveConfirm"))) return;
      await cloudDelete(currentProfile()); setCloudDot(); renderCloudBody(); toast(tr("cRemoved")); };
  }
}
// Open a ?plan=<id>#key=<editKey> link: fetch it and load as (or into) a profile.
async function openSharedFromURL(){
  const params=new URLSearchParams(location.search); const id=params.get("plan"); if(!id) return false;
  const key=(location.hash.match(/(?:^#|&)key=([^&]+)/)||[])[1] || "";
  try{ history.replaceState(null,"",location.origin+location.pathname); }catch(e){}
  try{
    const d=await cloudFetch(id);
    let prof=profiles.profiles.find(p=>p.cloudId===id);
    if(prof){ profiles.activeId=prof.id; if(key&&!prof.editKey){ prof.editKey=key; prof.readonly=false; } saveProfilesIdx();
      applyPulledPlan(prof,d); setCloudDot("ok"); toast((prof.editKey||key)?tr("cOpenedSync"):tr("cOpenedView")); }
    else{ const pid=newProfileId(); prof={ id:pid, name:d.name||tr("sharedPlan"), cloudId:id, editKey:key, cloudUpdated:d.updated, readonly:!key };
      profiles.profiles.push(prof); profiles.activeId=pid; saveProfilesIdx();
      applyPulledPlan(prof,d); setCloudDot("ok"); toast(key?tr("cOpenedNamed",{n:d.name||""}):tr("cOpenedNamedView",{n:d.name||""})); }
  }catch(e){ toast(tr("cOpenFail")); }
  return true;
}
async function pullIfNewer(){
  const cur=currentProfile(); if(!cur||!cur.cloudId){ setCloudDot(); return; }
  try{ const d=await cloudFetch(cur.cloudId);
    if(d.updated && (!cur.cloudUpdated || d.updated>cur.cloudUpdated)){ applyPulledPlan(cur,d); toast(tr("cUpdated")); }
    setCloudDot("ok");
  }catch(e){ setCloudDot("err"); }
}
function openCloud(){ renderCloudBody(); $("cloudModal").classList.add("open"); }
$("cloudBtn").addEventListener("click",openCloud);
$("cloudClose").addEventListener("click",()=>$("cloudModal").classList.remove("open"));
$("cloudModal").addEventListener("click",e=>{ if(e.target.id==="cloudModal") e.currentTarget.classList.remove("open"); });

// ============================================================
//  PRINT
// ============================================================
$("printBtn").addEventListener("click",buildAndPrint);
function buildAndPrint(){
  const area=$("printarea");
  const legend=state.groups.map(g=>`<span><span class="dot" style="background:${g.color}"></span>${escapeHtml(g.name)}</span>`).join("");
  const cards=state.tables.map(t=>{
    const rows=t.seats.map(gid=> gid?`<li><span class="gdot" style="background:${guestColor(gid)}"></span>${escapeHtml(guestName(gid))}${STATUS_TXT(gStatus(gid))?` <span style="color:#a00">(${STATUS_TXT(gStatus(gid))})</span>`:""}</li>`:`<li class="empty">${escapeHtml(tr("printEmpty"))}</li>`).join("");
    const occ=t.seats.filter(Boolean).length;
    return `<div class="pcard"><h3>${escapeHtml(t.label)} <span style="font-weight:400;color:#888;font-size:12px">(${occ}/${t.capacity})</span></h3><ol>${rows}</ol></div>`;
  }).join("");
  const un=unseatedIds();
  const unHtml=un.length?`<div class="punassigned"><strong>${escapeHtml(tr("printUnassigned",{n:un.length}))}</strong> ${un.map(id=>escapeHtml(guestName(id))).join(", ")}</div>`:"";
  const seated=assignedGuestIds().size, totalSeats=state.tables.reduce((s,t)=>s+t.capacity,0);
  area.innerHTML=`<h2>${escapeHtml(tr("printTitle"))}</h2>
    <div class="psub">${escapeHtml(tr("printSub",{t:state.tables.length, s:seated, c:totalSeats}))}</div>
    ${legend?`<div class="plegend">${legend}</div>`:""}
    <div class="ptables">${cards}</div>${unHtml}`;
  window.print();
}

// ============================================================
//  TEXT SIZE + ZOOM
// ============================================================
function setFontScale(v){ fontScale=clamp(v,0.6,2.0); state.seatFontScale=fontScale; save(); renderTables(); toast(tr("tFont",{n:Math.round(fontScale*100)})); }
$("fontUp").addEventListener("click",()=>setFontScale(fontScale+0.15));
$("fontDown").addEventListener("click",()=>setFontScale(fontScale-0.15));
function fitZoom(){ const b=visibleBox(); return Math.min(1,(b.w-60)/state.stage.w,(b.h-80)/state.stage.h); }
// Opening view: the 0.5 floor keeps names readable on a desktop; a phone fits the whole space instead.
function initialZoom(){ return Math.min(1, Math.max(fitZoom(), isNarrow()?0.2:0.5)); }
function applyZoom(){
  stage.style.transform=`scale(${zoom})`;
  const m=isNarrow()?12:24, w=(state.stage&&state.stage.w)||1700, h=(state.stage&&state.stage.h)||1360;
  stage.style.margin=`${m}px ${Math.round(m+w*(zoom-1))}px ${Math.round(m+h*(zoom-1))}px ${m}px`;
  $("zoomLabel").textContent=Math.round(zoom*100)+"%";
}
$("zoomIn").addEventListener("click",()=>{ zoom=Math.min(2.5,zoom+0.1); applyZoom(); });
$("zoomOut").addEventListener("click",()=>{ zoom=Math.max(0.2,zoom-0.05); applyZoom(); });
$("zoomFit").addEventListener("click",()=>{ zoom=clamp(fitZoom(),0.2,2.5); applyZoom(); });

// ============================================================
//  INIT
// ============================================================
function renderAll(){ renderFeatures(); renderTables(); renderGroups(); renderPool(); updateStats(); }
if(!state.stage) state.stage={w:2100,h:1400};
if(!state.stageMaterial) state.stageMaterial="grass";
applyStage();
const _stageResize=document.createElement("div"); _stageResize.id="stageResize"; _stageResize.title=tr("stageResizeTip");
stage.appendChild(_stageResize); makeStageResizable(_stageResize);
initFloorSelect(); initDecor(); renderProfiles();
renderAll();
setTimeout(()=>{ zoom=initialZoom(); applyZoom(); },50);
// ☁ open a shared link if present, otherwise refresh the active profile from the cloud
(async()=>{ if(!(await openSharedFromURL())) await pullIfNewer(); if(getSyncCode()) await syncFromCode(); startCloudPoll(); })();
</script>
