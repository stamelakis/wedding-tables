<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if(location.hostname.endsWith("github.io"))location.replace("https://takeaseat.gr"+location.pathname+location.search+location.hash);</script>
<title>Owner Admin — TakeaSeat</title>
<style>
  :root{ --paper:#f6f4f1; --card:#fffdfb; --card2:#f2ece6; --ink:#25211c; --soft:#655c52; --faint:#968c7d;
         --line:#e5ddd4; --accent:#7d5a8c; --accent-ink:#5c3f68; --accent-soft:#efe6f2;
         --good:#3f7a52; --good-soft:#e4efe6; --danger:#c0392b; --amber:#8a5a00; --amber-soft:#fbf0dc;
         --sup:#1f5f7f; --sup-soft:#e2eff6; --shadow:0 1px 2px rgba(40,30,20,.05),0 6px 20px rgba(40,30,20,.06); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
  .wrap{ max-width:920px; margin:0 auto; padding:24px 18px 80px; }
  h1{ font-family:"Iowan Old Style",Palatino,Georgia,serif; font-weight:600; font-size:25px; margin:0; }
  h2{ font-size:16px; margin:0 0 12px; }
  a{ color:var(--accent-ink); }
  .btn{ font:inherit; font-size:14px; font-weight:600; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 13px; border-radius:9px; cursor:pointer; text-decoration:none; display:inline-block; white-space:nowrap; }
  .btn:hover{ background:#f2ece6; } .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.05); }
  .btn.danger{ color:var(--danger); border-color:#e3b4ac; background:#fbeeec; } .btn.sm{ padding:5px 9px; font-size:12.5px; }
  .btn.ghost{ border-color:transparent; background:transparent; color:var(--soft); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  input,select,textarea{ font:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink); width:100%; }
  textarea{ resize:vertical; min-height:64px; }
  input:disabled{ opacity:.55; }
  [aria-invalid="true"]{ border-color:var(--danger); outline-color:var(--danger); }
  label{ font-size:12px; font-weight:700; color:var(--soft); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:4px; }
  label .hint{ text-transform:none; letter-spacing:0; font-weight:500; color:var(--faint); }
  /* a checkbox with its text */
  label.chk{ display:flex; align-items:flex-start; gap:8px; text-transform:none; letter-spacing:0; font-size:14px; font-weight:500; color:var(--ink); margin:0; cursor:pointer; }
  label.chk input{ width:auto; margin:3px 0 0; flex:none; }
  label.chk.sm{ font-size:13px; color:var(--soft); margin-top:6px; }
  .inl{ display:inline-block; width:88px; padding:6px 9px; }
  .subh{ font-size:14px; font-weight:700; margin:18px 0 10px; padding-top:14px; border-top:1px solid var(--line); }
  .subh .muted{ font-weight:500; }
  /* dialogs (venue / customer edit, deleted events) */
  dialog.dlg{ border:none; padding:0; border-radius:14px; background:var(--card); color:var(--ink); width:min(640px, calc(100% - 24px)); max-height:calc(100% - 24px); overflow:auto; box-shadow:0 20px 60px rgba(40,30,20,.28); }
  dialog.dlg::backdrop{ background:rgba(37,33,28,.42); }
  .dlg .dhead{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card); z-index:1; }
  .dlg .dhead h2{ margin:0; }
  .dlg .dbody{ padding:16px 18px; }
  .dlg .dfoot{ display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--line); position:sticky; bottom:0; background:var(--card); }
  .titem{ display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line); }
  .titem:first-child{ border-top:none; padding-top:0; }
  .titem .grow{ flex:1; min-width:0; }
  .linkbtn{ font:inherit; font-size:12.5px; font-weight:600; background:none; border:none; padding:0; color:var(--accent-ink); text-decoration:underline; cursor:pointer; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:18px; }
  .login{ max-width:420px; margin:8vh auto 0; text-align:center; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .full{ grid-column:1/-1; }
  .row{ display:flex; gap:8px; align-items:center; }
  .row.between{ justify-content:space-between; }
  .row.fw{ flex-wrap:wrap; }
  .mono{ font-family:ui-monospace,Menlo,Consolas,monospace; }
  .keybox{ background:var(--good-soft); border:1px solid #bcdcc6; border-radius:10px; padding:12px 14px; margin-top:12px; }
  .keybox.note{ background:var(--card2); border-color:var(--line); }
  .keybox .k{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; word-break:break-all; color:var(--ink); font-weight:700; }
  .keybox select{ width:auto; padding:5px 8px; font-size:13px; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th,td{ text-align:left; padding:10px 8px; border-top:1px solid var(--line); vertical-align:middle; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); border-top:none; }
  .badge{ display:inline-block; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .badge.season{ background:var(--accent-soft); color:var(--accent-ink); } .badge.per{ background:var(--good-soft); color:var(--good); }
  .badge.off{ background:#eee; color:#888; }
  .badge.wait{ background:var(--accent-soft); color:var(--accent-ink); }
  .badge.warn{ background:var(--amber-soft); color:var(--amber); }
  .badge.sup{ background:var(--sup-soft); color:var(--sup); white-space:normal; }
  .badge.tpl{ background:var(--card2); color:var(--soft); }
  .badge.long{ white-space:normal; }
  .mark{ font-size:12px; cursor:help; }
  .vok{ color:var(--good); font-weight:700; cursor:help; }
  .mailbar{ margin-top:14px; padding:8px 12px; border-radius:10px; font-size:13.5px; background:var(--card2); color:var(--soft); border:1px solid var(--line); }
  .mailbar.on{ background:var(--good-soft); color:var(--good); border-color:#bcdcc6; }
  .muted{ color:var(--faint); font-size:12.5px; }
  .lead{ color:var(--soft); font-size:14px; margin:4px 0 0; }
  .section{ margin-top:30px; }
  .section > h2{ display:flex; align-items:baseline; gap:6px; }
  .sechead{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
  .sechead h2{ margin:0; }
  .acts{ gap:6px; flex-wrap:wrap; }
  .empty{ color:var(--faint); font-size:14px; text-align:center; padding:18px 8px; }
  /* support requests */
  .sreq{ display:flex; gap:14px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line); }
  .sreq:first-child{ border-top:none; padding-top:0; } .sreq:last-child{ padding-bottom:0; }
  .sreq .grow{ flex:1; min-width:0; }
  .sreq .who{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .sreq .msg{ white-space:pre-wrap; overflow-wrap:anywhere; background:var(--card2); border-radius:8px; padding:7px 10px; margin:6px 0 4px; font-size:14px; }
  #toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#25211c; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:10; max-width:calc(100% - 32px); }
  #toast.show{ opacity:1; }
  .tablewrap{ overflow-x:auto; }
  .stack{ display:flex; flex-direction:column; gap:12px; }
  /* Εργαλεία: δοκιμές & υποστήριξη */
  .lk{ display:flex; gap:8px; align-items:center; padding:7px 0; border-top:1px dashed var(--line); }
  .lk:first-child{ border-top:none; padding-top:0; }
  .lk .grow{ flex:1; min-width:0; }
  .lk .w{ font-size:13px; font-weight:600; }
  .lk .u{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; word-break:break-all; color:var(--faint); }
  .kv{ display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:8px; }
  .kv > div{ background:var(--card2); border-radius:9px; padding:8px 10px; }
  .kv b{ display:block; font-size:19px; line-height:1.2; }
  .kv span{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); font-weight:700; }
  .kv > div.hot{ background:var(--amber-soft); } .kv > div.hot b{ color:var(--amber); }
  .fields{ font-size:13.5px; }
  .fields > div{ display:flex; gap:10px; padding:3px 0; align-items:baseline; }
  .fields i{ flex:0 0 128px; font-style:normal; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); font-weight:700; }
  .fields em{ flex:1; min-width:0; font-style:normal; overflow-wrap:anywhere; }
  .log{ font-size:12.5px; color:var(--soft); margin-top:4px; }
  .log > div{ padding:2px 0; display:flex; gap:8px; }
  .log span{ color:var(--faint); flex:0 0 auto; }
  .guest{ border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--card2); text-align:center; }
  .guest .big{ font-size:21px; font-weight:700; margin-top:2px; }
  .guest .err{ color:var(--danger); font-weight:700; }
  .badge.tmark{ background:var(--amber-soft); color:var(--amber); }
  /* where an action fired from the support card puts its answer — on the card, not in a panel seven screens down */
  .cardpanel:empty{ display:none; }
  .cardpanel{ margin-top:10px; }
  .ccard{ border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
  .ccard:first-child{ border-top:none; padding-top:0; margin-top:0; }
  /* «Πελάτες»: the first screen */
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip{ font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--card); color:var(--soft); padding:5px 11px; border-radius:20px; cursor:pointer; white-space:nowrap; }
  .chip:hover{ background:var(--card2); }
  .chip.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.hot:not(.on){ border-color:#e7c98f; color:var(--amber); background:var(--amber-soft); }
  .chip small{ font-size:12px; font-weight:700; opacity:.75; margin-left:3px; }
  .custbar{ display:flex; gap:8px; align-items:center; }
  .custbar input{ flex:1; min-width:0; }
  .phoneonly{ display:none; }
  #custTable table{ font-size:13.5px; }
  #custTable th{ vertical-align:bottom; }
  .nw{ white-space:nowrap; }
  #custTable th[data-sort]{ cursor:pointer; user-select:none; }
  #custTable th[data-sort]:hover{ color:var(--soft); }
  #custTable tr.crow{ cursor:pointer; }
  #custTable tr.crow:hover td{ background:var(--card2); }
  #custTable tr.crow:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  #custTable td{ padding:9px 7px; }
  .cname{ font-weight:700; overflow-wrap:anywhere; }
  .cflags{ display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; }
  .cflags .badge{ font-size:11px; }
  .reach{ display:flex; gap:4px; }
  #custTable .reach .btn.sm{ padding:4px 7px; font-size:12px; }
  .reach a{ text-decoration:none; }
  .badge.st4{ background:var(--accent-soft); color:var(--accent-ink); } .badge.st5{ background:var(--good-soft); color:var(--good); }
  .badge.st6{ background:var(--amber-soft); color:var(--amber); } .badge.st7{ background:#eee; color:#777; }
  .badge.st1{ background:var(--sup-soft); color:var(--sup); } .badge.st2{ background:var(--card2); color:var(--soft); box-shadow:inset 0 0 0 1px var(--line); }
  .badge.st3{ background:var(--amber-soft); color:var(--amber); } .badge.st8{ background:#eee; color:#777; }
  /* «+ Νέα επαφή» (phase 4): chips to tap instead of menus, «Γνωστός πελάτης» under the fields, the ready replies */
  .pick{ display:flex; flex-wrap:wrap; gap:6px; }
  .known{ border:1px solid #e7c98f; background:var(--amber-soft); border-radius:10px; padding:10px 12px; margin-top:4px; }
  .known .kc{ border-top:1px dashed #e7c98f; padding-top:8px; margin-top:8px; }
  .known .tl li{ border-top-color:#e7c98f; }
  .fromlead{ background:var(--sup-soft); color:var(--sup); border-radius:10px; padding:8px 12px; margin-bottom:12px; font-size:13.5px; }
  .tplbox textarea{ min-height:220px; font-size:13.5px; }
  .flaglist{ margin:0; padding:0 0 0 2px; list-style:none; font-size:13.5px; }
  .flaglist li{ padding:3px 0; color:var(--amber); }
  .cstep{ overflow-wrap:anywhere; } .cstep.due{ color:var(--amber); font-weight:600; }
  /* the customer card is where he works (phase 2): its buttons, his notes, the next step, the timeline */
  .cacts{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .cbox{ background:var(--card2); border-radius:10px; padding:10px 12px; margin-top:12px; }
  .cbox label{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 8px; }
  .cbox .saved{ text-transform:none; letter-spacing:0; font-weight:500; color:var(--faint); }
  .cbox .saved.err{ color:var(--danger); }
  .steprow{ display:flex; flex-wrap:wrap; gap:8px; }
  .steprow input[type=text]{ flex:1 1 220px; } .steprow input[type=date]{ flex:0 1 170px; }
  .tlbtns{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .tl{ list-style:none; margin:10px 0 0; padding:0; font-size:13.5px; }
  .tl li{ display:flex; gap:10px; align-items:baseline; padding:5px 0; border-top:1px dashed var(--line); }
  .tl li:first-child{ border-top:none; }
  .tl time{ flex:0 0 132px; color:var(--faint); font-size:12px; }
  .tl .w{ flex:1; min-width:0; overflow-wrap:anywhere; color:var(--soft); white-space:pre-line; }   /* a message from the site's form keeps its lines */
  .tl li.mine .w{ color:var(--ink); font-weight:600; }
  .tl .x{ flex:none; padding:0 6px; }
  /* «Πληρωμές» (phase 5): what is expected and what came in, on the card and on its own screen */
  .badge.pay-late{ background:#f8e1de; color:var(--danger); } .badge.pay-due{ background:var(--amber-soft); color:var(--amber); }
  .badge.pay-paid{ background:var(--good-soft); color:var(--good); } .badge.pay-trial{ background:var(--accent-soft); color:var(--accent-ink); }
  .plist{ list-style:none; margin:6px 0 0; padding:0; font-size:13.5px; }
  .plist li{ padding:8px 0; border-top:1px dashed var(--line); }
  .plist li:first-child{ border-top:none; }
  .plist .top{ display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline; }
  .amt{ font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .amt.neg{ color:var(--danger); }
  .plist li.off .top, .plist li.off .amt, tr.off td{ color:var(--faint); } .plist li.off .amt, tr.off .amt{ text-decoration:line-through; }
  .plist .sub{ color:var(--soft); font-size:12.5px; margin-top:2px; overflow-wrap:anywhere; }
  .plist .btns{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .payform{ border:1px solid var(--line); }
  .payform .grid{ margin-top:8px; }
  .ptitle{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); margin-top:10px; }
  .ytd{ display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; font-size:13.5px; }
  .ytd b{ font-size:20px; font-variant-numeric:tabular-nums; }
  .meter{ height:8px; border-radius:6px; background:var(--card2); box-shadow:inset 0 0 0 1px var(--line); overflow:hidden; margin:8px 0 4px; }
  .meter i{ display:block; height:100%; background:var(--good); }
  .meter.near i{ background:var(--amber); } .meter.over i{ background:var(--danger); }
  .payfilters{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:14px 0 6px; }
  .payfilters select{ width:auto; flex:0 1 auto; }
  .ptotals{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:10px 0 4px; }
  .ptotals table{ font-size:13px; } .ptotals td, .ptotals th{ padding:5px 6px; }
  td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #payTable tr[data-key]{ cursor:pointer; } #payTable tr[data-key]:hover td{ background:var(--card2); }
  @media (max-width:620px){ .fields > div{ flex-direction:column; gap:0; } .fields i{ flex:none; } }
  @media (max-width:620px){
    .grid{ grid-template-columns:1fr; }
    .card{ padding:14px; }
    /* tables become stacked cards on a phone */
    table.cards thead{ display:none; }
    table.cards, table.cards tbody, table.cards tr, table.cards td{ display:block; width:100%; }
    table.cards tr{ border-top:1px solid var(--line); padding:10px 0; }
    table.cards tr:first-child{ border-top:none; padding-top:0; } table.cards tr:last-child{ padding-bottom:0; }
    table.cards td{ border:none; padding:3px 0; }
    table.cards td[data-l]{ display:flex; gap:10px; align-items:baseline; }
    table.cards td[data-l]::before{ content:attr(data-l); flex:0 0 76px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); font-weight:700; }
    table.cards td.acts-cell{ padding-top:8px; }
    .sreq, .titem{ flex-direction:column; gap:8px; }
    .phoneonly{ display:block; }
    .custbar{ flex-wrap:wrap; }
    .custbar select{ flex:1 1 100%; }
    #custTable td{ padding:3px 0; }
    #custTable td.ce{ display:none; }   /* an empty field only lengthens the card */
    #custTable .reach{ gap:8px; }
    #custTable .reach .btn.sm{ min-height:40px; min-width:44px; padding:8px 12px; font-size:14px; justify-content:center; }   /* a thumb, not a cursor */
    .dlg .dhead, .dlg .dbody, .dlg .dfoot{ padding-left:14px; padding-right:14px; }
    .cacts .btn.sm, .tlbtns .btn.sm, .cbox .btn.sm{ min-height:40px; padding:8px 12px; font-size:14px; }   /* thumbs, as on the sheet */
    .tl .x{ min-width:40px; min-height:36px; }
    .pick .chip{ min-height:40px; padding:8px 13px; font-size:14px; }
    .known .btn.sm{ min-height:40px; padding:8px 12px; font-size:14px; }
    .tl li{ flex-wrap:wrap; gap:0 10px; } .tl time{ flex-basis:100%; }
    .plist .btn.sm, .payform .btn.sm{ min-height:40px; padding:8px 12px; font-size:14px; }
    .ptotals{ grid-template-columns:1fr; }
    .payfilters select{ flex:1 1 140px; }
    #payTable td.num{ text-align:left; } #payTable td{ padding:3px 0; } #payTable td.ce{ display:none; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script>
const SYNC_URL = "";   // same-origin (self-hosted takeaseat.gr). The Cloudflare-worker fallback is retired.
const KEY_STORE="weddingOwnerKey";
const LANG_STORE="tasCoupleLinkLang";   // this browser remembers the link language chosen per couple (a convenience only)
const PLANNER_FILE={ el:"seating-planner-el.html", en:"seating-planner.html", de:"seating-planner-de.html" };
const LANG_NAME={ el:"Ελληνικά", en:"English", de:"Deutsch" };
const CLAIM_DAYS=30;    // the server's CLAIM_TTL: an unused claim link expires 30 days after it was issued
const CLAIM_NOTE=`Ανοίγει μία φορά· μετά ο πελάτης παίρνει τον δικό του προσωπικό σύνδεσμο. Αν δεν χρησιμοποιηθεί, λήγει ${CLAIM_DAYS} μέρες αφότου φτιάχτηκε.`;
const RESET_NOTE=" Οι παλιοί σύνδεσμοι και οι συσκευές του πελάτη έχουν ήδη σταματήσει να δουλεύουν.";
const app=document.getElementById("app");
let venuesCache=[], couplesCache=[], supportCache=[];
// GET /admin/mail: with mail on, claim links and venue keys go to the customer's address and the API never returns them.
let mailInfo=null;   // {enabled, from} · null = could not check
const mailOn=()=>!!(mailInfo && mailInfo.enabled);
const getKey=()=>{ try{ return sessionStorage.getItem(KEY_STORE)||""; }catch(e){ return ""; } };
const setKey=k=>{ try{ k?sessionStorage.setItem(KEY_STORE,k):sessionStorage.removeItem(KEY_STORE); }catch(e){} };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// A modal dialog sits in the top layer, above everything on the page: while one is open the toast lives inside it.
function toast(m){ const d=document.getElementById("dlg"), host=(d && d.open) ? d : document.body;
  let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; }
  if(t.parentNode!==host) host.appendChild(t);
  t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400); }
function fmtDate(iso){ if(!iso) return "—"; try{ return new Date(iso).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); }catch(e){ return String(iso); } }
function fmtDateTime(t){ if(!t) return "—"; try{ return new Date(t).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return String(t); } }
function relTime(t){ const d=t-Date.now(); if(d<=0) return "expired";
  const m=Math.round(d/60000); if(m<60) return `in ${Math.max(1,m)} min`;
  const h=Math.round(d/3600000); if(h<48) return `in ${h} h`; return `in ${Math.round(h/24)} days`; }
function venueConsoleLink(){ return new URL("venue.html", location.href).href; }
function plannerUrl(lang){ return new URL(PLANNER_FILE[lang]||PLANNER_FILE.el, location.href).href; }

// The message behind «Αντιγραφή μηνύματος». The customer reads it, so it speaks the link's language with the planner's

function langMap(){ try{ const m=JSON.parse(localStorage.getItem(LANG_STORE)||"{}"); return m&&typeof m==="object"?m:{}; }catch(e){ return {}; } }

  const c=couplesCache.find(x=>x.id===cid); return c&&PLANNER_FILE[c.lang]?c.lang:"el"; }
function rememberLang(cid, lang){ try{ const m=langMap(); m[cid]=lang; localStorage.setItem(LANG_STORE, JSON.stringify(m)); }catch(e){} }
function forgetLang(cid){ try{ const m=langMap(); if(cid in m){ delete m[cid]; localStorage.setItem(LANG_STORE, JSON.stringify(m)); } }catch(e){} }
function langOptions(sel){ return Object.keys(PLANNER_FILE).map(l=>`<option value="${l}"${l===sel?" selected":""}>${esc(LANG_NAME[l])}</option>`).join(""); }
async function api(path, opts={}){ return fetch(SYNC_URL+path,{ ...opts, headers:{ "Content-Type":"application/json", "X-Owner-Key":getKey(), ...(opts.headers||{}) } }); }
// api() + JSON; only the admin gate's own refusal ({error:"unauthorized"}) means the owner key is wrong → back to the
// sign-in screen. Any other 403 is the route saying no to the ACTION, and throwing the console out on one of those
// would lose the key and show "Wrong owner key." for something the key had nothing to do with.
const authFail=d=>!d || d.error==="unauthorized";
async function req(path, opts){
  let r; try{ r=await api(path, opts); }catch(e){ return { ok:false, status:0, d:null }; }
  let d=null; try{ d=await r.json(); }catch(e){}
  if(r.status===403 && authFail(d)){ setKey(""); renderLogin("Wrong owner key."); }
  return { ok:r.ok, status:r.status, d };
}
function failToast(res, msg){ if(res.status===403 && authFail(res.d)) return; toast(res.status===0?"Δεν υπάρχει σύνδεση — δοκίμασε ξανά":msg); }
const badEmail=res=>res.status===400 && !!res.d && res.d.error==="bad_email";

const byNewest=(a,b)=>(b.createdAt||0)-(a.createdAt||0);

// "YYYY-MM-DD" (a calendar day, no time zone) → "01 Nov 2026"
function fmtYmd(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||"")); if(!m) return s?String(s):"—";
  return new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); }
function ymdPlus(s, n){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||"")); if(!m) return null;
  const d=new Date(Date.UTC(+m[1], +m[2]-1, +m[3]+n)); return d.toISOString().slice(0,10); }
const isYmd=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||""));
// Today in Athens (the server's calendar), "YYYY-MM-DD"; the browser's own day if the time zone is unknown.
const todayYmd=()=>{ try{ const s=new Intl.DateTimeFormat("en-CA",{ timeZone:"Europe/Athens", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date()); if(isYmd(s)) return s; }catch(e){}
  const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; };
const MAX_KEEP_DAYS=3650;   // the server's limit for "delete N days after the event"
// ---- what a customer bought for: a wedding, a baptism or a γιορτή. One field (`kind`) on the plan; everything else
// about the sale — the price, the 14-day wait, the phases, the retention — is identical, so only labels read it.
const EVW={ wedding:{ date:"Ημερομηνία γάμου",    name:"Όνομα ζευγαριού",   ph:"π.χ. Μαρία & Νίκος",     askName:"Γράψε το όνομα του ζευγαριού" },
            baptism:{ date:"Ημερομηνία βάπτισης", name:"Όνομα παιδιού",     ph:"π.χ. Ελένη",             askName:"Γράψε το όνομα του παιδιού" },
            party:{   date:"Ημερομηνία γιορτής",  name:"Όνομα της γιορτής", ph:"π.χ. 40ά γενέθλια Κώστα", askName:"Γράψε το όνομα της γιορτής" } };
const kindOptions=sel=>[["wedding","Γάμος"],["baptism","Βάπτιση"],["party","Γιορτή"]]
  .map(([k,l])=>`<option value="${k}"${k===sel?" selected":""}>${l}</option>`).join("");
const evKind=x=>(x && EVW[x.kind]) ? x.kind : "wedding";   // anything we do not know is a wedding
const EV=x=>EVW[evKind(x)];

// Seasonal licences renew by themselves at seasonEnd + 1 day unless automatic renewal is off — but only for an active venue
// whose renewal reminder e-mail actually went out; otherwise the server skips it and sets license.renewSkipped = that seasonEnd.
function renewalHtml(v){ const L=(v&&v.license)||{};
  if(L.type==="per_wedding") return "";
  if(v&&v.trial&&v.trial.inForce) return "";   // a free year never renews itself; its own line says what happens instead
  if(L.renewSkipped) return `<div style="margin-top:4px"><span class="badge warn long">Η σεζόν έληξε ${esc(gYmd(L.renewSkipped))} — δεν ανανεώθηκε αυτόματα (δεν στάλθηκε υπενθύμιση). Ανανέωσέ την αλλάζοντας την άδεια.</span></div>`;
  if(!isYmd(L.seasonEnd)) return "";
  if(L.autoRenew===false) return `<div class="muted">η αυτόματη ανανέωση είναι κλειστή</div>`;
  const at=ymdPlus(L.seasonEnd,1), when=esc(gYmd(at));
  if(!v.active) return `<div class="muted">ανανεώνεται αυτόματα στις ${when} — όχι όσο το κτήμα είναι απενεργοποιημένο</div>`;
  if(!v.email) return `<div class="muted">ανανεώνεται αυτόματα στις ${when} — μόνο αφού σταλεί υπενθύμιση με email: πρόσθεσε το email του κτήματος</div>`;
  if(mailInfo && !mailInfo.enabled) return `<div class="muted">ανανεώνεται αυτόματα στις ${when} — μόνο αφού σταλεί υπενθύμιση με email: η αποστολή email είναι κλειστή</div>`;
  return at<todayYmd() ? `<div class="muted">η σεζόν έληξε — η ανανέωση ελέγχεται μέσα στην ώρα</div>` : `<div class="muted">ανανεώνεται αυτόματα στις ${when}</div>`; }

// ---------------------------------------------------------------- after the event (retention)
let settingsCache=null;   // GET /admin/settings → {retention:{keepDays, lockAfter}, coupleRetention:{…}, planExceptions:[…]}
// Two rules: `retention` for venue weddings (the venue's instruction to us, dpa.html §4), `coupleRetention` for a
// couple's own plan. Both a year by default; the fallbacks are the server's defaults.
const retOf=(r, days)=>{ r=r||{}; return { keepDays:Number.isFinite(+r.keepDays)&&r.keepDays!=null?+r.keepDays:days, lockAfter:r.lockAfter!==false }; };
const globalRet=()=>retOf(settingsCache&&settingsCache.retention, 365);
const coupleRet=()=>retOf(settingsCache&&settingsCache.coupleRetention, 365);
const daysText=n=>`${n} day${n===1?"":"s"}`;
// A retention override ({keepDays?, lockAfter?, keep?}) in words; "" when there is none.
function retentionText(r){ if(!r) return "";
  const p=[];
  if(r.keep===true) p.push("kept forever"); else if(r.keepDays!=null) p.push(`deleted ${daysText(+r.keepDays)} after`);
  if(r.keep===false && r.keepDays==null) p.push("deleted as usual");
  if(r.lockAfter===false) p.push("stays editable"); else if(r.lockAfter===true) p.push("view-only after");
  return p.join(" · "); }
// Two choices, each "same as everyone" or its own value: view-only after the event, and when the plan is deleted.
// Greek, like every dialog: «Επεξεργασία…» of a customer or a venue, and the support card's «Διατήρηση…».
function retentionFields(p, r, couple){ r=r||{}; const g=couple?coupleRet():globalRet();
  const lock=r.lockAfter===true?"1":r.lockAfter===false?"0":"";
  const del=r.keep===true?"keep":r.keepDays!=null?"days":"";
  const W={ after:"Μετά την εκδήλωση", defLock:`Ως συνήθως (${g.lockAfter?"μόνο προβολή":"μένει ανοιχτό"})`, lockOn:"Μόνο προβολή από την επομένη", lockOff:"Μένει ανοιχτό",
    del:"Διαγραφή", defDel:`Ως συνήθως (${gN(g.keepDays,"μέρα","μέρες")} μετά την εκδήλωση)`, days:"Μετά από τόσες μέρες…", keep:"Δεν σβήνεται ποτέ", unit:"μέρες μετά την εκδήλωση" };
  return `<div class="grid">
    <div><label for="${p}lock">${esc(W.after)}</label>
      <select id="${p}lock">
        <option value=""${lock===""?" selected":""}>${esc(W.defLock)}</option>
        <option value="1"${lock==="1"?" selected":""}>${esc(W.lockOn)}</option>
        <option value="0"${lock==="0"?" selected":""}>${esc(W.lockOff)}</option>
      </select></div>
    <div><label for="${p}del">${esc(W.del)}</label>
      <select id="${p}del">
        <option value=""${del===""?" selected":""}>${esc(W.defDel)}</option>
        <option value="days"${del==="days"?" selected":""}>${esc(W.days)}</option>
        <option value="keep"${del==="keep"?" selected":""}>${esc(W.keep)}</option>
      </select>
      <div class="row" id="${p}dayswrap" style="margin-top:6px;${del==="days"?"":"display:none"}"><input type="number" class="inl" id="${p}days" min="0" max="${MAX_KEEP_DAYS}" value="${r.keepDays!=null?esc(r.keepDays):""}" placeholder="${esc(g.keepDays)}"><span class="muted">${esc(W.unit)}</span></div>
    </div>
  </div>`; }
function wireRetention(p, scope){
  const del=scope.querySelector("#"+p+"del"), wrap=scope.querySelector("#"+p+"dayswrap");
  del.addEventListener("change",()=>{ wrap.style.display=del.value==="days"?"":"none"; if(del.value==="days") scope.querySelector("#"+p+"days").focus(); });
}
// → { ret } (null = same as everyone) or { error, el }
function readRetention(p, scope){
  const lock=scope.querySelector("#"+p+"lock").value, del=scope.querySelector("#"+p+"del").value, o={};
  if(lock) o.lockAfter=lock==="1";
  if(del==="keep") o.keep=true;
  if(del==="days"){ const el=scope.querySelector("#"+p+"days"), n=el.value.trim()===""?NaN:Number(el.value);
    if(!Number.isInteger(n) || n<0 || n>MAX_KEEP_DAYS) return { error:`Γράψε τον αριθμό των ημερών (0–${MAX_KEEP_DAYS})`, el };
    o.keepDays=n; }
  return { ret:Object.keys(o).length?o:null };
}

// ---------------------------------------------------------------- dialog
// One dialog at a time. A customer card that opens «Επεξεργασία…» or the trash is remembered in dlgBack, and closing that
// dialog (saved, cancelled or Esc) brings the card back, fresh. Whatever replaces or closes a card first saves its notes.
let dlgBack=null, cardNotes=null;   // cardNotes: the open card's notes box, {key, el, st, timer, last, …}
function openDialog(html){
  let d=document.getElementById("dlg");
  if(!d){ d=document.createElement("dialog"); d.id="dlg"; d.className="dlg"; d.lang="el"; document.body.appendChild(d);   // lang: see #toolsSection
    d.addEventListener("cancel", e=>{ e.preventDefault(); closeDialog(); }); }   // Esc goes the same way as ✕
  flushNotes(); cardNotes=null;
  const t=document.getElementById("toast");
  delete d.dataset.ctx; d.innerHTML=html; d.scrollTop=0;
  if(t && !t.isConnected) d.appendChild(t);   // a toast said just before a redraw stays on screen
  d.querySelectorAll("[data-dclose]").forEach(b=>b.onclick=()=>closeDialog());
  if(!d.open){ try{ d.showModal(); }catch(e){ d.setAttribute("open",""); } d.scrollTop=0; }   // a closed dialog kept its old scroll
  return d;
}
function closeDialog(){ const d=document.getElementById("dlg"); if(!d) return;
  flushNotes(); cardNotes=null;
  if(d.open){ try{ d.close(); }catch(e){ d.removeAttribute("open"); } } delete d.dataset.ctx;
  const t=document.getElementById("toast"); if(t && t.parentNode===d) document.body.appendChild(t);
  d.innerHTML="";
  if(dlgBack){ const k=dlgBack; dlgBack=null; refreshCustomers(); openCustomer(k); } else cardPanel=null; }   // back from «Επεξεργασία…» / the trash: the row may have changed too
const dlgHead=title=>`<div class="dhead"><h2>${title}</h2><button class="btn sm ghost" data-dclose title="Κλείσιμο">✕</button></div>`;
// A missing or wrong field: say what is needed and put the cursor there.
function invalid(el, msg){ toast(msg); if(el){ el.setAttribute("aria-invalid","true"); el.focus();
  el.addEventListener("input",()=>el.removeAttribute("aria-invalid"),{ once:true }); el.addEventListener("change",()=>el.removeAttribute("aria-invalid"),{ once:true }); } }

// ---------------------------------------------------------------- forgot the admin key (signed out)
// admin.html#recover=<token> is the one-hour link e-mailed to the recovery address; it makes a NEW admin key, shown once.
// admin.html#verify=<token> is the one-day link that confirms a new recovery address (PUT /admin/owner only asks).
// The token leaves the address at once and is only spent on an explicit press — mail scanners follow links.
const EMAIL_OK=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e) && e.length<=200;
const RATE_MSG="Too many requests — try again in a little while.";
const MAIL_OFF_MSG=`Email is off on the server — you'll need the key from <span class="mono">server.env</span>.`;
const SENT_MSG="If that address is the confirmed recovery address, a link is on its way. It is valid for one hour.";
let screenSeq=0;
// Every signed-out screen lives in the same sign-in card; rendering one also drops an answer still in flight.
function loginCard(html){ screenSeq++; dlgBack=null; closeDialog(); app.innerHTML=`<div class="card login">${html}</div>`; return screenSeq; }
const busy=()=>app.querySelectorAll("button").forEach(b=>b.disabled=true);
function backHtml(){ return `<button class="btn ghost" id="back" style="margin-top:12px;font-size:13px">${getKey()?"← Back to the console":"← Sign in with the key"}</button>`; }
function bindBack(){ const b=document.getElementById("back"); if(b) b.onclick=()=>{ if(getKey()) load(); else renderLogin(); }; }
// A public POST — no owner key, and a 403 here must never bounce the page to the sign-in screen.
async function pub(path, body){
  let r; try{ r=await fetch(SYNC_URL+path,{ method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) }); }
  catch(e){ return { ok:false, status:0, d:{} }; }
  let d=null; try{ d=await r.json(); }catch(e){}
  return { ok:r.ok, status:r.status, d:d||{} };
}
// One nonce per link and tab: a retry after a lost answer is recognised as the same device.
function tokenNonce(kind, token){
  const nk="weddingOwner"+kind+"Nonce."+String(token).slice(0,10);
  const fresh=()=>{ const a=new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,"0")).join(""); };
  let n=""; try{ n=sessionStorage.getItem(nk)||""; if(!n){ n=fresh(); sessionStorage.setItem(nk,n); } }catch(e){ n=n||fresh(); }
  return n;
}
// #recover=<token>, #verify=<token> (or a bare #recover) → the signed-out link screens. The fragment is dropped first,
// so the token is out of the address bar (and out of anything that reads it) before a single request is made.
function linkFromHash(){
  const h=location.hash||"", get=k=>{ const m=h.match(new RegExp("(?:^#|&)"+k+"=([^&]+)")); if(!m) return ""; try{ return decodeURIComponent(m[1]); }catch(e){ return m[1]; } };
  const rtok=get("recover"), vtok=get("verify"), ask=/(?:^#|&)recover(?:&|$)/.test(h);
  if(!rtok && !vtok && !ask) return false;
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  if(rtok) renderRecoverClaim({ token:rtok, nonce:tokenNonce("Rec",rtok) });
  else if(vtok) renderVerifyOwner({ token:vtok, nonce:tokenNonce("Ver",vtok) });
  else renderForgot({});
  return true;
}
// A message about a link, with «Try again» (same nonce, so the server knows this device) or a way back to the form.
function linkMsg(title, html, o){
  o=o||{};
  loginCard(`<h1>${esc(title)}</h1><p class="lead" style="margin:8px 0 0">${html}</p>
    ${o.retry?`<div style="margin-top:14px"><button class="btn primary" id="lRetry" style="width:100%">Try again</button></div>`:""}
    ${o.again?`<div style="margin-top:14px"><button class="btn primary" id="lAgain" style="width:100%">Send me a new link</button></div>`:""}
    ${backHtml()}`);
  bindBack();
  if(o.retry) document.getElementById("lRetry").onclick=o.retry;
  if(o.again) document.getElementById("lAgain").onclick=()=>renderForgot({});
}
// What went wrong with the link → the message; null = no answer or server trouble. `kind` is "verify" or "recover":
// a 410 never says only "already used" — the same answer comes when the address changed or a newer link superseded it.
function linkErr(r, kind){
  const v=kind==="verify", at=r.d.at?` (${esc(fmtDateTime(r.d.at))})`:"";
  if(r.d.error==="token_used") return v
    ? `That confirmation link can no longer be used${at} — it was already opened, a newer confirmation link replaced it, or the recovery address was changed or removed since.`
    : `That link can no longer be used${at} — it makes a key only once, and it also stops working when the recovery address changed since, or when a newer recovery link (or a claimed one) superseded it.`;
  if(r.d.error==="token_expired") return v
    ? "That confirmation link has expired — a confirmation link is valid for one day."
    : "That link has expired — a recovery link is valid for one hour.";
  if(r.d.error==="token_invalid" || r.status===404) return "That link is not valid — it may have been copied only half, or the recovery address has changed since.";
  return null;
}
function renderForgot(st){
  st=st||{};
  if(st.step==="sent"){
    loginCard(`<h1>Check your email</h1>
      <p class="lead" style="margin:8px 0 0">${SENT_MSG}</p>
      <div class="muted" style="margin-top:10px">Look in the spam folder too. The link opens once and makes a new admin key. An address that was never confirmed from the mailbox itself gets nothing.</div>
      ${backHtml()}`);
    bindBack(); return;
  }
  if(st.step==="off"){   // 503 mail_off — this server cannot send anything
    loginCard(`<h1>Forgot the admin key?</h1>
      <p class="lead" style="margin:8px 0 0">${MAIL_OFF_MSG}</p>
      <div class="muted" style="margin-top:10px">Recovery by email needs <span class="mono">SMTP_*</span> set in <span class="mono">server.env</span>; until then <span class="mono">OWNER_KEY</span> there is the only way in.</div>
      ${backHtml()}`);
    bindBack(); return;
  }
  loginCard(`<h1>Forgot the admin key?</h1>
    <p class="lead" style="margin:6px 0 14px">Enter the recovery address — the one confirmed from its own mailbox. A link that makes a new admin key goes to it.</p>
    <input id="remail" type="email" autocomplete="email" inputmode="email" maxlength="200" placeholder="Recovery email" value="${esc(st.email||"")}">
    ${st.err?`<div class="muted" style="color:var(--danger);margin-top:8px">${esc(st.err)}</div>`:""}
    <div style="margin-top:12px"><button class="btn primary" id="rSend" style="width:100%">Send me a link</button></div>
    ${backHtml()}`);
  bindBack();
  const inp=document.getElementById("remail"), btn=document.getElementById("rSend");
  inp.focus();
  const go=async()=>{
    if(btn.disabled) return;
    const email=inp.value.trim();
    if(!EMAIL_OK(email)){ renderForgot({ email, err:BAD_EMAIL }); return; }
    busy(); const my=screenSeq;
    const r=await pub("/admin/recover",{ email });
    if(my!==screenSeq) return;
    if(r.ok) renderForgot({ step:"sent" });
    else if(r.status===503) renderForgot({ step:"off", email });
    else renderForgot({ email, err:r.status===429?RATE_MSG:r.status===400?BAD_EMAIL:r.status?"Something went wrong — try again.":"Connection error — try again." });
  };
  btn.onclick=go;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
}
// #recover=<token>: nothing happens until the button is pressed, and it may only ever be pressed once — the server
// mints one key per link and refuses a second attempt (a second key would silently kill the one already saved).
function renderRecoverClaim(st){
  loginCard(`<h1>New admin key</h1>
    <p class="lead" style="margin:8px 0 0">This creates a <strong>new</strong> admin key and stops the previous recovered key. The <span class="mono">OWNER_KEY</span> set in <span class="mono">server.env</span> keeps working.</p>
    <div class="muted" style="margin-top:10px">You see the new key once, here, and are signed in with it. The link works a single time — every other recovery link still in a mailbox stops working.</div>
    <div style="margin-top:14px"><button class="btn primary" id="rGo" style="width:100%">Create a new admin key</button></div>
    ${backHtml()}`);
  bindBack();
  document.getElementById("rGo").onclick=()=>doRecoverClaim(st);
}
async function doRecoverClaim(st){
  busy(); const my=screenSeq;
  const r=await pub("/admin/recover/claim",{ token:st.token, nonce:st.nonce });
  const key=r.ok && typeof r.d.key==="string" ? r.d.key : "";
  if(key){ setKey(key); showNewOwnerKey(key); return; }   // always shown, even if the page moved on: the old key is already gone
  if(my!==screenSeq) return;
  const err=linkErr(r,"recover");
  if(err){ linkMsg("New admin key", err+" Ask for a fresh one with your recovery address.", { again:true }); return; }
  // No answer, or the server stumbled. There is no «Try again» here on purpose: this link is spent on the first press,
  // a second press is refused, and the key — if one was made — was only ever shown in the answer we did not get.
  linkMsg("New admin key", (r.status===429?RATE_MSG+" ":"")
    +"We did not get an answer, so we cannot tell whether a key was made. This link may already have been used — it works only once, and pressing it again is refused. Check your email for the «New admin key» notice, and otherwise ask for a fresh link with your recovery address.", { again:true });
}
// #verify=<token>: confirms a new recovery address. Nothing is spent on load, and a repeat from this tab replays the
// same answer for 15 minutes — so here «Try again» is safe.
function renderVerifyOwner(st){
  loginCard(`<h1>Confirm the recovery address</h1>
    <p class="lead" style="margin:8px 0 0">Confirm that this address becomes the recovery address of the admin console — the only address a new admin key is ever e-mailed to.</p>
    <div class="muted" style="margin-top:10px">Until you confirm it, it counts for nothing and the previous recovery address (if there was one) stays in place.</div>
    <div style="margin-top:14px"><button class="btn primary" id="vGo" style="width:100%">Confirm this address</button></div>
    ${backHtml()}`);
  bindBack();
  document.getElementById("vGo").onclick=()=>doVerifyOwner(st);
}
async function doVerifyOwner(st){
  busy(); const my=screenSeq;
  const r=await pub("/verify",{ token:st.token, nonce:st.nonce });
  if(my!==screenSeq) return;
  if(r.ok && r.d.ok){
    const signed=!!getKey();
    loginCard(`<h1>Recovery address confirmed</h1>
      <div class="keybox" style="text-align:left">
        <div style="font-weight:700">✅ This address is now the recovery address.</div>
        ${r.d.email?`<div class="k" style="margin-top:6px;font-weight:600">${esc(r.d.email)}</div>`:""}
      </div>
      <div class="muted" style="margin-top:10px;text-align:left">If you ever lose the admin key, ask for a link on the sign-in screen — it goes here and nowhere else.</div>
      <div style="margin-top:14px"><button class="btn primary" id="vNext" style="width:100%">${signed?"Continue to the console":"Sign in"}</button></div>`);
    document.getElementById("vNext").onclick=()=>{ if(getKey()) load(); else renderLogin(); };
    return;
  }
  const err=linkErr(r,"verify");
  if(err) linkMsg("Confirm the recovery address", err+" Set the address again in the console under «Admin access» to get a new confirmation link.", {});
  else linkMsg("Confirm the recovery address", (r.status===429?RATE_MSG:"Could not reach the server — nothing was confirmed."), { retry:()=>doVerifyOwner(st) });
}
// The only time the key is ever visible. It is stored as a hash on the server, so this screen cannot come back.
function showNewOwnerKey(key){
  loginCard(`<h1>Your new admin key</h1>

    <div style="margin-top:14px"><button class="btn primary" id="toDash" style="width:100%">Continue to the dashboard</button></div>`);

function licenseFields(prefix, L){

  L=L||{ type:"seasonal", autoRenew:true };

  return `<div class="grid">

    <div class="perw lim"><label for="${prefix}quota">Όριο εκδηλώσεων</label><input type="number" id="${prefix}quota" min="1" placeholder="π.χ. 20" value="${per&&L.quota?esc(L.quota):""}"></div>
    <div class="full"><label class="chk"><input type="checkbox" id="${prefix}unl"${unl&&!isNew?" checked":""}> <span>Απεριόριστη — <span data-unltxt></span></span></label></div>
    <div class="seasonal"><label for="${prefix}cap">Μέγιστες εκδηλώσεις ταυτόχρονα</label><input type="number" id="${prefix}cap" min="1" placeholder="π.χ. 40" value="${!per&&L.cap?esc(L.cap):""}">
      <label class="chk sm"><input type="checkbox" id="${prefix}nocap"${!per&&L.cap?"":" checked"}> Χωρίς μέγιστο</label></div>
    <div class="seasonal renew"><label>Ανανέωση</label>
      <label class="chk"><input type="checkbox" id="${prefix}renew"${L.autoRenew===false?"":" checked"}> Ανανεώνεται αυτόματα</label>
      <div class="muted" style="margin-top:4px">Την επομένη του τέλους της σεζόν ξεκινά ξανά, με τις ίδιες ημερομηνίες του επόμενου χρόνου· τότε η καρτέλα του δείχνει «εκκρεμεί τιμολόγιο». Το κτήμα μπορεί να την κλείσει από την κονσόλα του.</div></div>
  </div>`;
}
function wireLicenseToggle(prefix, scope){
  const q=s=>scope.querySelector("#"+prefix+s);
  const sel=q("type"), unl=q("unl"), nocap=q("nocap");
  const upd=()=>{ const per=sel.value==="per_wedding", u=unl.checked;
    scope.querySelectorAll(".seasonal").forEach(e=>e.style.display=per?"none":"");
    scope.querySelectorAll(".perw").forEach(e=>e.style.display=per?"":"none");
    scope.querySelectorAll(".lim").forEach(e=>{ if(u) e.style.display="none"; });
    scope.querySelectorAll(".renew").forEach(e=>e.style.display=(per||u)?"none":"");
    scope.querySelector("[data-unltxt]").textContent=per?"χωρίς όριο, όσες εκδηλώσεις θέλει":"χωρίς ημερομηνίες σεζόν, η άδεια δεν λήγει ποτέ";
    q("cap").disabled=nocap.checked; if(nocap.checked) q("cap").removeAttribute("aria-invalid"); };
  sel.addEventListener("change",upd); unl.addEventListener("change",upd);
  nocap.addEventListener("change",()=>{ upd(); if(!nocap.checked) q("cap").focus(); });
  upd();
}
// → { license } or { error, el }
function readLicense(prefix, scope){
  const q=s=>scope.querySelector("#"+prefix+s);
  const type=q("type").value==="per_wedding"?"per_wedding":"seasonal", unl=q("unl").checked;
  const autoRenew=q("renew").checked;
  const num=el=>{ const v=el.value.trim(); return v===""?NaN:Number(v); };
  if(type==="per_wedding"){
    if(unl) return { license:{ type, quota:0, seasonStart:null, seasonEnd:null, cap:0, autoRenew } };
    const n=num(q("quota"));
    if(!Number.isInteger(n) || n<1) return { error:"Γράψε το όριο εκδηλώσεων — ή σημείωσε «Απεριόριστη»", el:q("quota") };
    return { license:{ type, quota:n, seasonStart:null, seasonEnd:null, cap:0, autoRenew } };
  }
  let seasonStart=null, seasonEnd=null, cap=0;
  if(!unl){
    seasonStart=q("start").value||null; seasonEnd=q("end").value||null;
    if(!isYmd(seasonStart)) return { error:"Γράψε πότε αρχίζει η σεζόν — ή σημείωσε «Απεριόριστη»", el:q("start") };
    if(!isYmd(seasonEnd)) return { error:"Γράψε πότε τελειώνει η σεζόν — ή σημείωσε «Απεριόριστη»", el:q("end") };
    if(seasonEnd<seasonStart) return { error:"Η σεζόν τελειώνει πριν αρχίσει", el:q("end") };
  }
  if(!q("nocap").checked){ const n=num(q("cap"));
    if(!Number.isInteger(n) || n<1) return { error:"Γράψε τον μέγιστο αριθμό εκδηλώσεων — ή σημείωσε «Χωρίς μέγιστο»", el:q("cap") };
    cap=n; }
  return { license:{ type, seasonStart, seasonEnd, quota:0, cap, autoRenew } };
}

// The server's language also picks the e-mails and recovery links, so keep it in step with the link language chosen here.
// Picks go out one at a time, and each is compared with the last one SENT (c.lang changes only when a save comes back),
// so a quick en → de → el leaves the server on el.
const langSent={};   // cid → { lang: the last pick sent, done: its save }
function saveCoupleLang(cid, lang){
  const c=couplesCache.find(x=>x.id===cid), s=langSent[cid];
  if(s ? s.lang===lang : (c && c.lang===lang)) return;
  const done=(s?s.done:Promise.resolve()).then(()=>req("/admin/couples/"+encodeURIComponent(cid),{ method:"PATCH", body:JSON.stringify({ lang }) }))
    .then(res=>{ const x=couplesCache.find(y=>y.id===cid); if(res.ok && x) x.lang=lang;
      if(!res.ok && langSent[cid] && langSent[cid].lang===lang) delete langSent[cid]; });   // failed: the next pick goes out, whatever it is
  langSent[cid]={ lang, done };
}

// A couple's planner opens at 00:00 Athens on day 15 after purchase (after their 14-day withdrawal period) — or at once with
// «Άμεση έναρξη», which the server accepts only for an event less than 3 weeks away; a sale whose planner would open only on
// or after the event day is refused (never_opens). Tables, floor and decor unlock 30 days before the event.
const START_NOW_DAYS=21, OPEN_DAYS=15;
const NEVER_OPENS="Το σχέδιο θα άνοιγε μετά την εκδήλωση. Διάλεξε «Άμεση έναρξη» (μόνο για εκδήλωση σε λιγότερο από 3 εβδομάδες) ή έλεγξε την ημερομηνία.";
const daysUntil=s=>isYmd(s)?Math.round((Date.parse(s+"T00:00:00Z")-Date.parse(todayYmd()+"T00:00:00Z"))/86400000):NaN;
function syncStartNow(){
  const dateEl=document.getElementById("cdate"), box=document.getElementById("cstart"), when=document.getElementById("cwhen"); if(!dateEl || !box || !when) return;
  const d=dateEl.value, n=daysUntil(d), ok=n>=0 && n<START_NOW_DAYS;
  box.disabled=!ok; if(!ok) box.checked=false;
  const OPENS="Το σχέδιο ανοίγει τη 15η μέρα μετά την αγορά (μετά τις 14 μέρες υπαναχώρησης του πελάτη)";
  when.style.color=n>=0 && !box.checked && n<=OPEN_DAYS ? "var(--danger)" : "";
  when.textContent=!(n>=0) ? OPENS+"· τραπέζια, κάτοψη και διακόσμηση ξεκλειδώνουν 30 μέρες πριν από την εκδήλωση."
    : box.checked ? "Το σχέδιο ανοίγει αμέσως, με πλήρη επεξεργασία."
    : n<=OPEN_DAYS ? `Η εκδήλωση είναι ${n===0?"σήμερα":n===1?"αύριο":`σε ${n} μέρες`} — χωρίς «Άμεση έναρξη» το σχέδιο δεν προλαβαίνει να ανοίξει.`
    : n<START_NOW_DAYS ? `Η εκδήλωση είναι σε ${n} μέρες — χωρίς «Άμεση έναρξη» το σχέδιο ανοίγει μόλις ${gN(n-OPEN_DAYS,"μέρα","μέρες")} πριν.`
    : n>OPEN_DAYS+30 ? `${OPENS}· τραπέζια, κάτοψη και διακόσμηση ξεκλειδώνουν στις ${gYmd(ymdPlus(d,-30))}.`
    : OPENS+", με πλήρη επεξεργασία.";
}
// «Έγινε πελάτης» on a contact's card opens «+ Ιδιώτης» or «+ Κτήμα» filled in from it, and the create call names the

const fromLeadHtml=pre=>pre ? `<div class="fromlead" id="fromlead">Από την επαφή «${esc(pre.name||"—")}» — το ιστορικό της περνά στον νέο πελάτη.</div>` : "";

async function createCouple(){
  const nameEl=document.getElementById("cname"), btn=document.getElementById("createC");
  const kindEl=document.getElementById("ckind"), kind=evKind({ kind:kindEl&&kindEl.value });
  const name=nameEl.value.trim(); if(!name){ invalid(nameEl, EVW[kind].askName); return; }
  if(btn.disabled) return;
  const contact=document.getElementById("ccontact").value.trim();
  const email=document.getElementById("cemail").value.trim();
  const sel=document.getElementById("clang").value, lang=PLANNER_FILE[sel]?sel:"el";
  const dateEl=document.getElementById("cdate"), weddingDate=dateEl.value||"", startEl=document.getElementById("cstart");
  if(dateEl.validity && dateEl.validity.badInput){ invalid(dateEl, "Η ημερομηνία δεν είναι πλήρης"); return; }
  const PAST_DATE="Η ημερομηνία δεν μπορεί να είναι στο παρελθόν — το σχέδιο ενός νέου πελάτη θα σβηνόταν αμέσως";
  const NO_DATE="Γράψε την ημερομηνία της εκδήλωσης — από αυτήν εξαρτάται πότε ο πελάτης στήνει τα τραπέζια";
  const TOO_EARLY="Άμεση έναρξη μόνο για εκδήλωση σε λιγότερο από 3 εβδομάδες";
  if(!weddingDate){ invalid(dateEl, NO_DATE); return; }
  if(weddingDate<todayYmd()){ invalid(dateEl, PAST_DATE); return; }
  const startNow=!!(startEl.checked && !startEl.disabled);
  if(!startNow && daysUntil(weddingDate)<=OPEN_DAYS){ invalid(dateEl, NEVER_OPENS); return; }
  btn.disabled=true;
  const res=await req("/admin/couples",{ method:"POST", body:JSON.stringify({ name, contact, email, lang, kind, weddingDate, ...(startNow?{ startNow:true }:{}),
    ...(convertFrom?{ fromLead:convertFrom.lead }:{}) }) });
  if(!document.getElementById("createC")) return;
  btn.disabled=false;
  const c=res.d && res.d.couple;
  if(convertDone(res, c && "c:"+c.id)) return;
  if(!res.ok || !c || !(res.d.mailed || res.d.claimToken)){
    const err=res.d && res.d.error;
    if(err==="past_date"){ invalid(dateEl, PAST_DATE); return; }
    if(err==="missing_date"){ invalid(dateEl, NO_DATE); return; }
    if(err==="start_now_too_early"){ syncStartNow(); invalid(dateEl, TOO_EARLY); return; }
    if(err==="never_opens"){ syncStartNow(); invalid(dateEl, NEVER_OPENS); return; }
    failToast(res, badEmail(res)?BAD_EMAIL:err==="bad_date"?"Η ημερομηνία δεν είναι έγκυρη":"Δεν δημιουργήθηκε"); return; }
  rememberLang(c.id, lang);
  if(res.d.mailed) showCoupleSent(c.id, `✅ Ο πελάτης δημιουργήθηκε — ο σύνδεσμος στάλθηκε στο ${esc(c.email||email)}`, CLAIM_NOTE);
  else showClaimPanel(c.id, c.name, res.d.claimToken, "new", c.kind||kind);
  nameEl.value=""; document.getElementById("ccontact").value=""; document.getElementById("cemail").value=""; dateEl.value=""; startEl.checked=false; syncStartNow();
  toast(res.d.mailed?"Ο σύνδεσμος στάλθηκε στο "+(c.email||email):"Ο πελάτης δημιουργήθηκε"); refreshCouples(); refreshCustomers();
}
// Every admin action on a couple, in one place — the customer card and the support card in «Εργαλεία» both call it.

  const path="/admin/couples/"+encodeURIComponent(c.id);
  if(a==="copy"){
    if(!c.claimToken) return;
    showClaimPanel(c.id, c.name, c.claimToken, "link", c.kind);
    copy(claimLink(c.claimToken, coupleLang(c.id)));
  } else if(a==="edit"){
    openCoupleEdit(c);
  } else if(a==="unfreeze"){
    const until=c.life&&c.life.frozenUntil?` (παγωμένο ως ${fmtDay(c.life.frozenUntil)})`:"";
    if(!confirm(`Ξεπάγωμα του «${c.name}»${until};\n\nΟ πελάτης μπορεί να αλλάζει ξανά αμέσως· τι μπορεί να αλλάξει εξαρτάται από την ημερομηνία της εκδήλωσης. Το ξεπάγωμα καταγράφεται.`)) return;
    btn.disabled=true;
    const res=await req(path,{ method:"PATCH", body:JSON.stringify({ unfreeze:true }) });
    btn.disabled=false;
    if(!res.ok){ failToast(res, res.status===404?"Αυτός ο πελάτης δεν υπάρχει πια — ανανεώνω":"Δεν ξεπάγωσε"); if(res.status===404) refreshCouples(); return; }
    toast("Ξεπάγωσε"); refreshCouples();
  } else if(a==="send"){
    if(!confirm(`Να σταλεί ο σύνδεσμος στο ${c.email};

Φεύγει ένα αληθινό email στον πελάτη, τώρα.`)) return;
    btn.disabled=true;
    const res=await req(path+"/send",{ method:"POST", body:"{}" });
    btn.disabled=false;
    if(!res.ok || !res.d || !res.d.mailed){
      if(res.status===410) toast("Ο πελάτης έχει σβήσει το σχέδιό του — δεν υπάρχει τίποτα να σταλεί.");
      else if(res.status===503) toast(res.d&&res.d.error==="mail_failed"?"Ο διακομιστής email αρνήθηκε το μήνυμα — δες την κατάσταση του email στην κορυφή της σελίδας και δοκίμασε ξανά":"Η αποστολή email είναι κλειστή ή ο πελάτης δεν έχει email");
      else failToast(res, res.status===404?"Αυτός ο πελάτης δεν υπάρχει πια — ανανεώνω":"Δεν στάλθηκε το email");
      if(res.status!==403) refreshCouples();
      return; }
    showCoupleSent(c.id, `✉ Ο σύνδεσμος για «${esc(c.name)}» στάλθηκε στο ${esc(res.d.to)}`,
      c.pendingClaim ? "Ο σύνδεσμος για να ανοίξει το σχέδιο (καινούργιος, αν ο παλιός είχε λήξει)." : "Σύνδεσμος για να ξαναμπεί στο σχέδιό του (ισχύει 7 μέρες).");
    toast("Στάλθηκε στο "+res.d.to); refreshCouples();
  } else if(a==="reset"){
    const byMail=mailOn() && c.email ? ` Ο νέος σύνδεσμος πάει με email στο ${c.email}.` : "";
    if(!confirm(`Νέος σύνδεσμος για «${c.name}»;\n\nΚάθε σύνδεσμος και κάθε συσκευή του πελάτη σταματούν να δουλεύουν, και κλείνει όποια πρόσβαση υποστήριξης είναι ανοιχτή. Ο πελάτης θα δει ότι το TakeaSeat ανανέωσε την πρόσβασή του.${byMail} Συνέχεια;`)) return;
    btn.disabled=true;
    const res=await req(path+"/reset",{ method:"POST", body:"{}" });
    btn.disabled=false;
    if(!res.ok || !res.d || !(res.d.mailed || res.d.claimToken)){
      if(res.status===410) toast("Ο πελάτης έχει σβήσει το σχέδιό του — δεν υπάρχει πρόσβαση να ανανεωθεί.");
      else failToast(res, res.status===404?"Αυτός ο πελάτης δεν υπάρχει πια — ανανεώνω":"Δεν έγινε");
      if(res.status!==403) refreshCouples();
      return; }
    if(res.d.mailed){ showCoupleSent(c.id, `✅ Ο νέος σύνδεσμος για «${esc(c.name)}» στάλθηκε στο ${esc(res.d.to)}`, CLAIM_NOTE+RESET_NOTE); toast("Ο νέος σύνδεσμος στάλθηκε στο "+res.d.to); }
    else { showClaimPanel(c.id, c.name, res.d.claimToken, "reset", c.kind); toast("Ο νέος σύνδεσμος είναι έτοιμος"); }
    refreshCouples(); refreshSupport();
  } else if(a==="email"){
    const next=prompt(`Email του «${c.name}» — εκεί πηγαίνουν οι σύνδεσμοί του και η ανάκτηση (άφησέ το κενό για να αφαιρεθεί):`, c.email||"");
    if(next==null) return;
    const email=next.trim();
    if(email.toLowerCase()===(c.email||"")) return;
    const lines=[`Αλλαγή του email του «${c.name}»;`, "", `Παλιό: ${c.email||"(κανένα)"}`, `Νέο: ${email||"(κανένα)"}`, ""];
    if(c.email && mailOn()) lines.push("Στην παλιά διεύθυνση πάει ένα email ότι το TakeaSeat την άλλαξε.");
    lines.push("Η αλλαγή γράφεται στο ιστορικό πρόσβασης του πελάτη — θα τη δει.");
    if(c.pendingClaim) lines.push("", "Ο σύνδεσμος που δεν έχει ανοίξει σταματά· ένας καινούργιος "+(email && mailOn()?"πάει με email στη νέα διεύθυνση.":"φτιάχνεται για να τον στείλεις εσύ."));
    if(!confirm(lines.join("\n"))) return;
    btn.disabled=true;
    const res=await req(path,{ method:"PATCH", body:JSON.stringify({ email }) });
    btn.disabled=false;
    if(!res.ok){ failToast(res, badEmail(res)?BAD_EMAIL:res.status===404?"Αυτός ο πελάτης δεν υπάρχει πια — ανανεώνω":"Δεν άλλαξε το email"); if(res.status===404) refreshCouples(); return; }
    if(res.d && res.d.mailed) toast("Το email αποθηκεύτηκε — ο νέος σύνδεσμος στάλθηκε στο "+email);
    else if(res.d && res.d.couple && res.d.couple.claimToken && c.pendingClaim){ showClaimPanel(c.id, c.name, res.d.couple.claimToken, "link", c.kind); toast("Το email αποθηκεύτηκε — ο νέος σύνδεσμος είναι έτοιμος"); }
    else toast(email?"Το email αποθηκεύτηκε":"Το email αφαιρέθηκε");
    refreshCouples();
  }
}

// «Επεξεργασία…» on a customer: the event type, the name, the date (the admin may set any date or clear it), retention.
function lifeLineHtml(L){
  if(!L || !L.lockAt) return "";
  const lock=L.locked?"Μόνο προβολή από τις":L.over?"Τελείωσε στις":"Τελειώνει στις";
  return `<div class="muted" style="margin-top:6px">${lock} ${esc(gD(L.lockAt))}${L.fallback?" (χωρίς ημερομηνία — 18 μήνες αφότου φτιάχτηκε)":""} · ${L.keep?"κρατιέται, δεν σβήνεται ποτέ":"σβήνεται στις "+esc(gD(L.deleteAt))}</div>`;
}

    <div class="dfoot"><button class="btn" data-dclose>Άκυρο</button><button class="btn primary" id="ce_save">Αποθήκευση</button></div>`);
  wireRetention("ce_", d);
  d.querySelector("#ce_clear").onclick=()=>{ d.querySelector("#ce_date").value=""; };
  d.querySelector("#ce_kind").onchange=e=>{ const K=EV({ kind:e.target.value });   // the labels follow the pick
    d.querySelector("#ce_namelbl").textContent=K.name; d.querySelector("#ce_datelbl").textContent=K.date; };

async function saveCoupleEdit(c, d){
  const q=s=>d.querySelector(s), btn=q("#ce_save"); if(btn.disabled) return;
  const kind=evKind({ kind:q("#ce_kind").value });
  const name=q("#ce_name").value.trim(); if(!name){ invalid(q("#ce_name"), EVW[kind].askName); return; }
  const dateEl=q("#ce_date"); if(dateEl.validity && dateEl.validity.badInput){ invalid(dateEl, "Η ημερομηνία δεν είναι πλήρης"); return; }
  const date=dateEl.value||"", oldDate=isYmd(c.weddingDate)?c.weddingDate:"";
  const r=readRetention("ce_", d); if(r.error){ invalid(r.el, r.error); return; }
  const body={ name, retention:r.ret };   // the notes are the card's own box, saved as he types
  if(kind!==evKind(c)) body.kind=kind;    // the type, corrected (it was picked here but never sent, until phase 2)
  if(date!==oldDate){
    if(date && date<todayYmd() && !confirm(`Η ${gYmd(date)} είναι στο παρελθόν.\n\nΤο σχέδιο γίνεται μόνο για προβολή και — αν δεν κρατιέται — μπορεί να σβηστεί στον επόμενο ωριαίο έλεγχο. Συνέχεια;`)) return;
    if(!date && !confirm(`Να σβηστεί η ημερομηνία της εκδήλωσης του «${c.name}»;\n\nΧωρίς ημερομηνία, το σχέδιο θεωρείται ότι τελείωσε 18 μήνες αφότου φτιάχτηκε.`)) return;
    body.weddingDate=date||null;
  }
  btn.disabled=true;
  const res=await req("/admin/couples/"+encodeURIComponent(c.id),{ method:"PATCH", body:JSON.stringify(body) });
  btn.disabled=false;
  if(!res.ok){ failToast(res, res.d&&res.d.error==="bad_date"?"Η ημερομηνία δεν είναι έγκυρη":res.status===404?"Αυτός ο πελάτης δεν υπάρχει πια — ανανεώνω":"Δεν αποθηκεύτηκε"); if(res.status===404){ closeDialog(); refreshCouples(); } return; }
  closeDialog(); toast("Αποθηκεύτηκε"); refreshCouples();
}

function wireKeyBox(box, key, v){
  const link=venueConsoleLink();
  const q=s=>box.querySelector(s);
  if(q('[data-c="key"]')) q('[data-c="key"]').onclick=()=>copy(key);
  if(q('[data-c="both"]')) q('[data-c="both"]').onclick=()=>copy("Κονσόλα: "+link+"\nΚωδικός κτήματος: "+key);   // the venue's own word: venue.html's sign-in field
  if(q('[data-c="reset"]') && v) q('[data-c="reset"]').onclick=()=>resetVenueKey(v);
  if(q("[data-close]")) q("[data-close]").onclick=()=>{ box.innerHTML=""; delete box.dataset.vid; };
}
function showVenuePanel(v, html, key){
  const box=panelTarget||document.getElementById("vpanel"); if(!box) return;
  box.dataset.vid=v.id; box.innerHTML=html; wireKeyBox(box, key, v);
  box.scrollIntoView({ behavior:"smooth", block:"nearest" });

async function resetVenueKey(v){
  const byMail=mailOn() && v.email;
  if(!confirm(byMail
    ? `Να σταλεί στο «${v.name}» σύνδεσμος για νέο κλειδί;\n\nΠάει στο ${v.email}. Το τωρινό κλειδί του κτήματος δουλεύει μέχρι να χρησιμοποιήσει τον σύνδεσμο.`
    : `Νέο κλειδί για το «${v.name}»;\n\nΤο τωρινό κλειδί του κτήματος σταματά να δουλεύει· δώσε του το καινούργιο.`)) return;
  const res=await req("/admin/venues/"+encodeURIComponent(v.id)+"/reset-key",{ method:"POST", body:"{}" });
  if(!res.ok || !res.d || !(res.d.mailed || res.d.key)){ failToast(res, res.status===404?"Αυτό το κτήμα δεν υπάρχει πια":res.status===503?"Το email δεν στάλθηκε και δεν άλλαξε τίποτα — δες την κατάσταση του email στην κορυφή της σελίδας":"Δεν έγινε"); return; }
  if(res.d.mailed){
    const box=panelTarget||document.getElementById("vpanel"); if(box) box.dataset.vid=v.id;
    showSent(box, `✉ Ο σύνδεσμος στάλθηκε στο ${esc(res.d.to)} — το τωρινό κλειδί δουλεύει μέχρι να τον χρησιμοποιήσει.`, "Ο σύνδεσμος ισχύει 7 μέρες· με αυτόν το κτήμα ορίζει το νέο του κλειδί.");
    toast("Ο σύνδεσμος στάλθηκε"); refreshVenues(); return;
  }
  showVenueKey(v, res.d.key, "reset");
  toast("Το νέο κλειδί είναι έτοιμο"); refreshVenues();
}

async function createVenue(){
  const nameEl=document.getElementById("nname"), name=nameEl.value.trim(); if(!name){ invalid(nameEl, "Γράψε το όνομα του κτήματος"); return; }
  const contact=document.getElementById("ncontact").value.trim(), notes=document.getElementById("nnotes").value.trim();
  const email=document.getElementById("nemail").value.trim(), lang=document.getElementById("nlang").value;
  const afmEl=document.getElementById("nafm"), afm=afmEl.value.replace(/\s/g,"");
  if(afm && !/^\d{9}$/.test(afm)){ invalid(afmEl, "Το ΑΦΜ έχει 9 ψηφία"); return; }
  const lic=readLicense("n", document.getElementById("licwrap")); if(lic.error){ invalid(lic.el, lic.error); return; }
  const license=lic.license;
  const btn=document.getElementById("createV"); if(btn.disabled) return; btn.disabled=true;
  const res=await req("/admin/venues",{method:"POST",body:JSON.stringify({name,contact,notes,email,lang,license,afm,...(convertFrom?{ fromLead:convertFrom.lead }:{})})});
  if(!document.getElementById("createV")) return;
  btn.disabled=false;
  const vid=res.d && (res.d.id || (res.d.venue && res.d.venue.id));
  if(convertDone(res, res.ok && vid && "v:"+vid)) return;
  if(res.d && res.d.error==="bad_afm"){ invalid(afmEl, "Αυτό το ΑΦΜ δεν είναι έγκυρο"); return; }
  if(!res.ok || !res.d || !(res.d.mailed || res.d.key)){ failToast(res, badEmail(res)?BAD_EMAIL:"Δεν δημιουργήθηκε"); return; }
  const box=document.getElementById("newkey");
  if(res.d.mailed){
    const to=(res.d.venue && res.d.venue.email) || email;
    showSent(box, `✅ Το κτήμα δημιουργήθηκε — ο σύνδεσμος ρύθμισης στάλθηκε στο ${esc(to)}`, "Με αυτόν το κτήμα ορίζει το δικό του κλειδί (ο σύνδεσμος ισχύει 7 μέρες). Εσύ δεν βλέπεις το κλειδί.");
  } else {
    box.innerHTML=venueKeyBoxHtml("✅ Το κτήμα δημιουργήθηκε — δώσε του αυτά τα δύο:", res.d.key, "", false);
    wireKeyBox(box, res.d.key, null);
  }
  ["nname","ncontact","nemail","nnotes","nafm"].forEach(id=>{ document.getElementById(id).value=""; });
  const lw=document.getElementById("licwrap"); lw.innerHTML=licenseFields("n"); wireLicenseToggle("n", lw);   // the next venue starts clean
  toast(res.d.mailed?"Ο σύνδεσμος ρύθμισης στάλθηκε":"Το κτήμα δημιουργήθηκε"); refreshVenues(); refreshCustomers();
}

// Only what the admin changed is sent: a licence or «Active» the admin didn't touch is never written back.
async function saveVenueEdit(v, d, initial){
  const q=s=>d.querySelector(s), btn=q("#ve_save"); if(btn.disabled) return;
  const body={};
  const name=q("#ve_name").value.trim(); if(!name){ invalid(q("#ve_name"), "Γράψε το όνομα του κτήματος"); return; }
  if(name!==(v.name||"")) body.name=name;
  const contact=q("#ve_contact").value.trim(); if(contact!==(v.contact||"")) body.contact=contact;
  const sel=q("#ve_lang").value, lang=PLANNER_FILE[sel]?sel:"el"; if(lang!==(PLANNER_FILE[v.lang]?v.lang:"el")) body.lang=lang;
  const active=q("#ve_active").checked; if(active!==!!v.active) body.active=active;
  if(formState(q("#ve_lic"))!==initial.lic){ const lic=readLicense("ve_", d); if(lic.error){ invalid(lic.el, lic.error); return; } body.license=lic.license; }
  if(q("#ve_endtrial") && q("#ve_endtrial").checked) body.trial=false;
  if(formState(q("#vr_box"))!==initial.ret){ const r=readRetention("vr_", d); if(r.error){ invalid(r.el, r.error); return; } body.retention=r.ret; }
  const email=q("#ve_email").value.trim(), emailChanged=email.toLowerCase()!==(v.email||"").toLowerCase();
  if(emailChanged){
    if(v.email && !confirm(`Αλλαγή του email του «${v.name}»;\n\nΠαλιό: ${v.email}\nΝέο: ${email||"(κανένα)"}${mailOn()?"\n\nΣτην παλιά διεύθυνση πάει ένα email ότι το TakeaSeat την άλλαξε.":""}`)) return;
    body.email=email;
  }
  if(!Object.keys(body).length){ closeDialog(); toast("Δεν άλλαξε τίποτα"); return; }
  btn.disabled=true;
  const res=await req("/admin/venues/"+encodeURIComponent(v.id),{ method:"PATCH", body:JSON.stringify(body) });
  btn.disabled=false;
  if(!res.ok){
    if(badEmail(res)){ invalid(q("#ve_email"), BAD_EMAIL); return; }
    failToast(res, res.status===404?"Αυτό το κτήμα δεν υπάρχει πια — ανανεώνω":"Δεν αποθηκεύτηκε");
    if(res.status===404){ closeDialog(); refreshVenues(); }
    return; }
  closeDialog();
  toast(emailChanged?(email?"Αποθηκεύτηκε — το email άλλαξε":"Αποθηκεύτηκε — το email αφαιρέθηκε"):"Αποθηκεύτηκε"); refreshVenues();
}

// Events the venue deleted: 14 days in the trash; only the admin restores (when the venue asks) or erases them now.
function openTrash(v){
  const d=openDialog(`${dlgHead(`Κάδος — ${esc(v.name)}`)}

async function loadTrash(v, d){
  const ctx="trash:"+v.id;
  const res=await req("/admin/venues/"+encodeURIComponent(v.id)+"/trash");
  if(!d.open || d.dataset.ctx!==ctx) return;
  const body=d.querySelector(".dbody"); if(!body) return;
  if(!res.ok || !res.d){ if(res.status!==403) body.innerHTML=`<div class="empty">${res.status===404?"Αυτό το κτήμα δεν υπάρχει πια.":"Δεν φορτώθηκε ο κάδος — δοκίμασε ξανά."}</div>`; return; }
  const list=(res.d.trash||[]).slice().sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0));
  const kindWord=t=>{ const k=C_KIND[evKind(t)]; return k.charAt(0).toUpperCase()+k.slice(1); };   // «Γιορτή», not a third kind shown as a wedding
  body.innerHTML=`<p class="muted" style="margin:0 0 14px">Αυτές τις εκδηλώσεις τις έσβησε το κτήμα. Η καθεμία σβήνεται οριστικά 14 μέρες μετά τη διαγραφή της. Μόνο εσύ μπορείς να φέρεις πίσω κάποια — και μόνο όταν το ζητήσει το κτήμα.</p>`
    +(list.length ? list.map(t=>`<div class="titem" data-pid="${esc(t.planId)}">
        <div class="grow"><strong>${esc(t.label||"Χωρίς τίτλο")}</strong>
          <div class="muted">${kindWord(t)}: ${t.date?esc(gYmd(t.date)):"χωρίς ημερομηνία"} · διαγράφηκε ${esc(gDT(t.deletedAt))}</div>
          <div class="muted">Σβήνεται οριστικά στις ${esc(gD(t.purgeAt))} (${esc(gAgo(t.purgeAt))})</div></div>
        <div class="row acts"><button class="btn sm" data-t="restore">Επαναφορά…</button><button class="btn sm danger" data-t="erase">Οριστική διαγραφή…</button></div>
      </div>`).join("") : `<div class="empty">Ο κάδος είναι άδειος.</div>`);
  body.onclick=async e=>{
    const btn=e.target.closest("button[data-t]"); if(!btn) return;
    const item=btn.closest("[data-pid]"), t=list.find(x=>x.planId===(item&&item.dataset.pid)); if(!t) return;
    const path="/admin/venues/"+encodeURIComponent(v.id)+"/trash/"+encodeURIComponent(t.planId);
    const label=t.label||"Χωρίς τίτλο";
    if(btn.dataset.t==="restore"){
      if(!confirm(`Κάνε επαναφορά μόνο όταν σου το ζήτησε το κτήμα.\n\nΕπαναφορά του «${label}»; Γυρίζει στην κονσόλα του «${v.name}».`)) return;
      btn.disabled=true; const r=await req(path+"/restore",{ method:"POST", body:"{}" }); btn.disabled=false;
      if(r.status===409 && r.d && r.d.error==="past_retention"){ showPastRetention(item, t, r.d.deleteAt); return; }
      if(!r.ok){ failToast(r, r.status===410?"Δεν μπορεί πια να επανέλθει":r.status===404?"Δεν είναι πια στον κάδο":"Η επαναφορά δεν έγινε"); }
      else toast(`Το «${label}» επανήλθε`);
    } else if(btn.dataset.t==="keeprestore"){
      // The wedding is past its after-the-wedding deletion date: keep it forever first (an existing exception keeps its other parts), then restore.
      if(!confirm(`Να μη σβηστεί ποτέ το «${label}» και να επανέλθει;\n\nΜπαίνει εξαίρεση «δεν σβήνεται ποτέ» για το σχέδιο ${t.planId}· μπορείς να τη βγάλεις αργότερα από το «After the event» → «Exceptions».`)) return;
      btn.disabled=true;
      const ex=((settingsCache&&settingsCache.planExceptions)||[]).find(x=>x.planId===t.planId)||{};
      const ret={ ...(ex.lockAfter!=null?{ lockAfter:ex.lockAfter }:{}), keep:true };
      const p=await req("/admin/plans/"+encodeURIComponent(t.planId)+"/retention",{ method:"PUT", body:JSON.stringify(ret) });
      if(!p.ok){ btn.disabled=false; failToast(p, p.status===404?"Δεν είναι πια στον κάδο":"Δεν μπήκε η εξαίρεση — δεν επανήλθε τίποτα"); if(p.status!==403){ refreshVenues(); loadTrash(v, d); } return; }
      refreshSettings();
      const r=await req(path+"/restore",{ method:"POST", body:"{}" }); btn.disabled=false;
      if(!r.ok){ failToast(r, r.status===410?"Δεν μπορεί πια να επανέλθει (η εξαίρεση μπήκε)":r.status===404?"Δεν είναι πια στον κάδο":"Η εξαίρεση μπήκε, αλλά η επαναφορά δεν έγινε — πάτα ξανά «Επαναφορά…»"); }
      else toast(`Το «${label}» επανήλθε και δεν θα σβηστεί`);
    } else if(btn.dataset.t==="erase"){
      if(!confirm(`Οριστική διαγραφή του «${label}» τώρα;\n\nΤο σχέδιο, η λίστα καλεσμένων και το ιστορικό του σβήνονται για πάντα. Δεν αναιρείται.`)) return;
      btn.disabled=true; const r=await req(path,{ method:"DELETE" }); btn.disabled=false;
      if(!r.ok){ failToast(r, "Η διαγραφή δεν έγινε"); }
      else toast(`Το «${label}» σβήστηκε`);
    }
    refreshVenues(); loadTrash(v, d);
  };
}

async function venueAction(v, a, btn){
  const id=v.id, path="/admin/venues/"+encodeURIComponent(id);

  if(a==="key"){
    btn.disabled=true; const res=await req(path); btn.disabled=false;
    if(!res.ok || !res.d){ failToast(res, "Δεν έγινε"); return; }
    if(res.d.key){ showVenueKey(v, res.d.key, "current"); copySilently(res.d.key, "Το κλειδί αντιγράφηκε"); }
    else showVenueOwnKey(v);
  }

Φεύγει η υπενθύμιση «εκκρεμεί τιμολόγιο» — τίποτε άλλο δεν αλλάζει και τίποτα δεν στέλνεται.`)) return;

    else failToast(res, "Δεν έγινε"); }
  else if(a==="toggle"){
    // Deactivating stops the venue creating events the moment it is pressed; activating only gives that back.

Δεν θα μπορεί να δημιουργεί νέες εκδηλώσεις· οι υπάρχουσες συνεχίζουν. Αναιρείται από το ίδιο κουμπί.`)) return;
    btn.disabled=true; const res=await req(path,{method:"PATCH",body:JSON.stringify({active:!v.active})}); btn.disabled=false;
    if(res.ok){ toast(v.active?"Απενεργοποιήθηκε":"Ενεργοποιήθηκε"); refreshVenues(); } else failToast(res, "Δεν έγινε"); }
}

// ---------------------------------------------------------------- after the wedding: global default + plan exceptions
async function refreshSettings(){
  if(!document.getElementById("gbox")) return;
  const res=await req("/admin/settings");
  const gbox=document.getElementById("gbox"), xlist=document.getElementById("xlist"); if(!gbox || !xlist) return;

  settingsCache={ retention:res.d.retention||{}, coupleRetention:res.d.coupleRetention||{}, planExceptions:Array.isArray(res.d.planExceptions)?res.d.planExceptions:[] };
  renderGlobal(); renderExceptions();
}
function renderGlobal(){
  const box=document.getElementById("gbox"); if(!box) return;
  const block=(p, title, g)=>`<h3 style="margin:0 0 8px;font-size:15px">${esc(title)}</h3>
    <label class="chk"><input type="checkbox" id="${p}lock"${g.lockAfter?" checked":""}> View-only from the day after the event</label>
    <div class="row fw" style="margin-top:12px;font-size:14px">Delete <input type="number" class="inl" id="${p}days" min="0" max="${MAX_KEEP_DAYS}" value="${esc(g.keepDays)}"> days after the event</div>`;
  box.innerHTML=`${block("g", "Venue weddings", globalRet())}
    <div class="muted" style="margin-top:6px">This is what the venues accept in their agreement (dpa.html §4: a year after the event) — change it only together with the agreement. Guest notes are erased the day after the event, whatever is set here.</div>
    <div style="margin-top:18px">${block("gc", "A couple's own plan (bought directly)", coupleRet())}</div>
    <div class="muted" style="margin-top:8px">Until then anyone with access can still open the plan and download its PDF. A plan without an event date counts as over 18 months after it was made.</div>
    <div class="row fw" style="margin-top:14px"><button class="btn primary" id="gsave">Save</button></div>`;
  document.getElementById("gsave").onclick=saveGlobal;
}
async function saveGlobal(){
  const btn=document.getElementById("gsave"); if(!btn || btn.disabled) return;
  const read=p=>{ const el=document.getElementById(p+"days"), n=el.value.trim()===""?NaN:Number(el.value);
    return { el, keepDays:n, lockAfter:document.getElementById(p+"lock").checked }; };
  const rules=[{ p:"g", key:"retention", who:"venue weddings", g:globalRet() }, { p:"gc", key:"coupleRetention", who:"couples' own plans", g:coupleRet() }];
  const body={};
  for(const x of rules){ const v=read(x.p);
    if(!Number.isInteger(v.keepDays) || v.keepDays<0 || v.keepDays>MAX_KEEP_DAYS){ invalid(v.el, `Enter the number of days (0–${MAX_KEEP_DAYS})`); return; }
    if(v.keepDays===x.g.keepDays && v.lockAfter===x.g.lockAfter) continue;
    if(v.keepDays<x.g.keepDays && !confirm(`Delete ${x.who} ${daysText(v.keepDays)} after the event instead of ${daysText(x.g.keepDays)}?

Plans whose event was more than ${daysText(v.keepDays)} ago are deleted at the next hourly check (unless they have their own setting). This cannot be undone.`)) return;
    body[x.key]={ keepDays:v.keepDays, lockAfter:v.lockAfter }; }
  if(!Object.keys(body).length){ toast("Nothing changed"); return; }
  btn.disabled=true;
  const res=await req("/admin/settings",{ method:"PUT", body:JSON.stringify(body) });
  btn.disabled=false;
  if(!res.ok || !res.d){ failToast(res, "Could not save the settings"); return; }
  settingsCache={ ...(settingsCache||{}), retention:res.d.retention||globalRet(), coupleRetention:res.d.coupleRetention||coupleRet() };
  renderGlobal(); toast("Saved");
}

// A pasted planner link (…?plan=<id>#…) or a bare plan id → the id; "" if neither.
function planIdFrom(s){
  s=String(s||"").trim(); if(!s) return "";
  let id="";
  try{ id=new URL(s).searchParams.get("plan")||""; }catch(e){}
  if(!id){ const m=/[?&]plan=([^&#\s]+)/.exec(s); if(m){ try{ id=decodeURIComponent(m[1]); }catch(e){ id=m[1]; } } }
  if(!id && /^[A-Za-z0-9_-]{6,64}$/.test(s)) id=s;
  return /^[A-Za-z0-9_-]{6,64}$/.test(id)?id:"";
}
function wireExceptionForm(){
  const q=id=>document.getElementById(id);
  const upd=()=>{ q("xmore").disabled=q("xkeep").checked; q("xdays").disabled=q("xkeep").checked; };
  q("xkeep").addEventListener("change",upd);
  q("xdays").addEventListener("input",()=>{ if(q("xdays").value!=="") q("xmore").checked=true; });
  q("xmore").addEventListener("change",()=>{ if(q("xmore").checked) q("xdays").focus(); });
  q("xplan").addEventListener("keydown",e=>{ if(e.key==="Enter") addException(); });
  q("xadd").onclick=addException; upd();
}
async function addException(){
  const q=id=>document.getElementById(id), btn=q("xadd"); if(!btn || btn.disabled) return;
  const pid=planIdFrom(q("xplan").value);
  if(!pid){ invalid(q("xplan"), "Paste a plan link (with ?plan=…) or a plan id"); return; }
  const body={};
  if(q("xkeep").checked) body.keep=true;
  if(q("xedit").checked) body.lockAfter=false;
  if(!body.keep && q("xmore").checked){
    const n=q("xdays").value.trim()===""?NaN:Number(q("xdays").value);
    if(!Number.isInteger(n) || n<0 || n>MAX_KEEP_DAYS){ invalid(q("xdays"), `Enter the number of days (0–${MAX_KEEP_DAYS})`); return; }
    body.keepDays=n;
  }
  if(!Object.keys(body).length){ toast("Choose what the exception does"); return; }
  const had=((settingsCache&&settingsCache.planExceptions)||[]).some(x=>x.planId===pid);
  if(had && !confirm(`Plan ${pid} already has an exception. Replace it?`)) return;
  btn.disabled=true;
  const res=await req("/admin/plans/"+encodeURIComponent(pid)+"/retention",{ method:"PUT", body:JSON.stringify(body) });

async function onExceptionAction(e){

// ---------------------------------------------------------------- admin access: the recovery address and the mailed key

let ownerCache=null;
async function refreshOwner(){

}
function renderOwner(note){

  box.innerHTML=`
    <p class="lead" style="margin:0 0 14px">If you ever lose the admin key, a one-hour link to a new one is e-mailed to the recovery address — nowhere else, and only once that address has been confirmed from its own mailbox.</p>

    </div>
