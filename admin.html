        <div class="muted" style="margin-top:4px">It counts for nothing until the link in that email is opened: the current recovery address is still ${live?`<span class="mono">${esc(live)}</span>`:"none"} — ${live?"a new admin key would go there, not to the address above":"until this one is confirmed, a lost admin key cannot be recovered by email at all"}. The confirmation link is valid for one day.</div>
        <div class="row fw" style="margin-top:8px"><button class="btn sm" id="oresend">Send the confirmation again</button>
          <span class="muted">Removing the recovery address drops the pending one too.</span></div>
      </div>`:""}
    ${mailOff?`<div class="mailbar" style="margin-top:12px">Email is off — no confirmation and no recovery link can be sent, so no recovery address can be set. Set <span class="mono">SMTP_*</span> in <span class="mono">server.env</span>. Until then the <span class="mono">OWNER_KEY</span> there is the only way in. (Removing an address still works.)</div>`:""}
    <div class="subh">Recovered key</div>
    ${o.hasRecoveryKey
      ? `<div class="row between fw" style="gap:10px;align-items:flex-start">
           <div style="min-width:0"><span class="badge warn">Active since ${esc(fmtDateTime(o.keyAt))}</span>
             <div class="muted" style="margin-top:4px">A key issued through a recovery link is in use. Revoking it leaves only the <span class="mono">OWNER_KEY</span> from <span class="mono">server.env</span> — so you have to be signed in with that <span class="mono">OWNER_KEY</span> to revoke it, not with the recovered key itself.</div></div>
           <button class="btn sm danger" id="orevoke">Revoke recovered key</button></div>`
      : `<div class="muted">No recovered key — only the <span class="mono">OWNER_KEY</span> in <span class="mono">server.env</span> opens this console.</div>`}
    <div id="onote">${note||""}</div>`;
  const e=document.getElementById("oedit"); if(e) e.onclick=editOwnerEmail;

function ownerNote(html){ const n=document.getElementById("onote"); if(n) n.innerHTML=`<div class="keybox note" style="margin-top:12px">${html}</div>`; }
async function editOwnerEmail(){
  const o=ownerCache||{};
  const next=prompt("Recovery address for the admin key — the only address a recovery link ever goes to. A confirmation link is sent to it; it counts only once that link is opened. (Leave empty to remove.)", o.email||"");
  if(next==null) return;
  const email=next.trim();
  if(email && email.toLowerCase()===(o.email||"").toLowerCase()){ toast("That is already the recovery address"); return; }
  if(!email && !(o.email||o.pending)){ toast("There is no recovery address to remove"); return; }
  if(email && !EMAIL_OK(email)){ toast(BAD_EMAIL); return; }
  const lines=[email?(o.email?"Ask to change the recovery address?":"Ask to set the recovery address?"):"Remove the recovery address?", "",
    `Now: ${o.email||"(none)"}`, `${email?"Asking for":"To"}: ${email||"(none)"}`, ""];
  if(email){
    lines.push("A confirmation link goes to the new address. Nothing changes until that link is opened — until then the recovery address stays "+(o.email||"(none)")+".");
    if(o.pending && o.pending!==email) lines.push("", "The confirmation waiting at "+o.pending+" is replaced.");
  }else{
    lines.push("It is removed at once — no confirmation needed.");
    if(o.pending) lines.push("A confirmation waiting at "+o.pending+" is dropped too.");
    lines.push("Any recovery link already sent stops working.", "", "Without an address the only way in is the OWNER_KEY in server.env.");
  }
  if(!confirm(lines.join("\n"))) return;
  putOwnerEmail(email, "oedit", false);
}
// PUT /admin/owner {email}: asks for a confirmation (or removes the address when empty). It never makes an address live.
async function putOwnerEmail(email, btnId, resend){
  const btn=document.getElementById(btnId); if(btn){ if(btn.disabled) return; btn.disabled=true; }
  const res=await req("/admin/owner",{ method:"PUT", body:JSON.stringify({ email }) });
  const b2=document.getElementById(btnId); if(b2) b2.disabled=false;
  if(!res.ok || !res.d){
    const err=(res.d&&res.d.error)||"";
    if(res.status===403) return;   // already back at the sign-in screen
    if(err==="mail_off"){ ownerNote(`Email is off on the server, so no confirmation link can be sent — and an address nobody can confirm is refused outright. Set <span class="mono">SMTP_*</span> in <span class="mono">server.env</span>, then try again. Nothing changed.`); toast("Email is off — nothing changed"); return; }
    if(err==="mail_failed"){ ownerNote(`The confirmation could not be sent — the mail server refused it. Check the <span class="mono">SMTP_*</span> settings in <span class="mono">server.env</span>, then try again. Nothing changed.`); toast("The confirmation could not be sent"); return; }
    if(res.status===429){ ownerNote(`Too many confirmation emails to that address — try again in a little while. Nothing changed.`); toast(RATE_MSG); return; }
    if(badEmail(res)){ toast(BAD_EMAIL); return; }
    failToast(res, "Could not save the recovery address"); return;
  }
  ownerCache={ ...(ownerCache||{}), email:res.d.email||"", emailVerified:!!res.d.emailVerified, pending:res.d.pending||"",
    lang:res.d.lang||(ownerCache&&ownerCache.lang)||"", hasRecoveryKey:!!res.d.hasRecoveryKey, keyAt:res.d.keyAt||null, mail:res.d.mail };
  if(email){
    renderOwner();
    ownerNote(`A confirmation link was sent to <span class="mono" style="overflow-wrap:anywhere">${esc(res.d.pending||email)}</span>. Open it from that mailbox — the address becomes the recovery address only then, and the link is valid for one day.`);
    toast(resend?"Confirmation sent again":"Confirmation link sent");
  }else{
    renderOwner(); toast("Recovery address removed");
  }
}
async function revokeOwnerKey(){
  const o=ownerCache||{};
  if(!confirm(`Revoke the recovered admin key?\n\nThe key issued on ${fmtDateTime(o.keyAt)} stops working at once — if you signed in with it, this browser is signed out too.\n\nOnly the OWNER_KEY in server.env will open this console. Revoking works only while you are signed in with that OWNER_KEY. This cannot be undone.`)) return;
  const btn=document.getElementById("orevoke"); if(btn) btn.disabled=true;
  const res=await req("/admin/owner/key",{ method:"DELETE" });
  const b2=document.getElementById("orevoke"); if(b2) b2.disabled=false;
  if(res.status===409 && res.d && res.d.error==="would_lock_out"){
    // The server only accepts this from the env key itself, so that revoking can never leave nobody with a way in.
    ownerNote(`Nothing was revoked: this request did not come from the <span class="mono">OWNER_KEY</span> in <span class="mono">server.env</span>.
      Most likely you are signed in with the recovered key — sign out and sign in with the <span class="mono">OWNER_KEY</span> from <span class="mono">server.env</span>, then revoke.
      If there is no <span class="mono">OWNER_KEY</span> set there at all (or it no longer matches the file), this recovered key is the only way in and cannot be revoked until one is set.`);
    toast("Sign in with the OWNER_KEY to revoke it"); return;
  }
  if(!res.ok || !res.d){ failToast(res, "Could not revoke the key"); return; }
  ownerCache={ ...(ownerCache||{}), hasRecoveryKey:false, keyAt:null };
  renderOwner(); toast("Recovered key revoked");
}

function gDT(t){ if(!t) return "—"; try{ return new Date(t).toLocaleString("el-GR",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return String(t); } }
function gYmd(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||"")); if(!m) return "—";
  return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString("el-GR",{day:"2-digit",month:"short",year:"numeric"}); }

const gN=(n,one,many)=>n+" "+(n===1?one:many);   // «1 ώρα», not «1 ώρες»
function gAgo(t){ if(!t) return ""; const d=t-Date.now(), a=Math.abs(d);

const C_UNTIL={ season:"τέλος σεζόν", trial:"τέλος δωρεάν χρόνου", plan:"διαγραφή σχεδίου", keep:"κρατιέται" };
const C_SIGNUP={ pending:"περιμένει να ανοίξει τον σύνδεσμο", verified:"επιβεβαιώθηκε", expired:"έληξε", deleted:"διαγράφηκε" };
const C_CHIPS=[["all","Όλοι"],["want","Θέλουν εμένα"],["leads","Επαφές"],["venues","Κτήματα"],["private","Ιδιώτες"],["soon","Εκδήλωση σε 14 ημέρες"],["ending","Λήγουν σε 60 ημέρες"],["archive","Αρχείο"]];
const C_COLS=[["name","Πελάτης",1],["type","Τύπος",1],["stage","Στάδιο",1],["pay","Πληρωμή",1],["next","Επόμενη εκδήλωση",1],["events","Εκδηλώσεις",-1],
  ["until","Λήξη",1],["last","Τελευταία κίνηση",-1],["reach","Επαφή",1]];   // key, header, the direction a first tap sorts in
let custData=null, custFilter="all", custSortBy={ col:"next", dir:1 };
const cDays=(a,b)=>Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000);
function cInDays(ymd){ const n=cDays(todayYmd(), ymd);
  return n===0?"σήμερα":n===1?"αύριο":n===-1?"χθες":n>0?"σε "+gN(n,"μέρα","μέρες"):"πριν "+gN(-n,"μέρα","μέρες"); }
// «Μαρία» finds «ΜΑΡΙΑ» and «Μάρια»: case and accents do not count in the search.
const cFold=s=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function cMatch(c, f, today){
  const archived=c.stage===7 || c.stage===8;   // finished, or a contact that went elsewhere
  if(f==="want") return (c.flags||[]).length>0;
  if(f==="leads") return c.stage>=1 && c.stage<=3;   // contacts still in play: not yet customers
  if(f==="venues") return !archived && c.type==="venue";
  if(f==="private") return !archived && c.type!=="venue";
  if(f==="soon") return !!c.next && c.next>=today && cDays(today, c.next)<=14;
  if(f==="ending") return (c.untilKind==="season" || c.untilKind==="trial") && !!c.until && c.until>=today && cDays(today, c.until)<=60;
  if(f==="archive") return archived;
  return !archived;   // «Όλοι»: everyone still in play
}
function cSearch(c, q){
  if(!q) return true;
  const digits=q.replace(/\D/g,"");   // «697 735 5378» finds +306977355378
  if(digits.length>=3 && (String(c.phone||"").replace(/\D/g,"").includes(digits) || String(c.afm||"").includes(digits))) return true;
  const f=cFold(q);
  return [c.name, c.email, c.afm, c.phone].some(x=>cFold(x).includes(f));
}
function cSortVal(c, col){
  if(col==="name") return cFold(c.name);
  if(col==="type") return C_TYPE_ORDER[c.type]==null ? 9 : C_TYPE_ORDER[c.type];
  if(col==="stage") return c.stage;
  if(col==="pay") return c.pay && c.pay.state ? P_ORDER[c.pay.state] : null;   // late first
  if(col==="next") return c.next||null;
  if(col==="events") return (c.upcoming||0)*10000+(c.total||0);
  if(col==="until") return c.until||null;
  if(col==="last") return c.last||null;
  if(col==="reach") return cFold(c.email||c.phone)||null;
  return null;
}
function cCompare(a, b){
  const { col, dir }=custSortBy, x=cSortVal(a, col), y=cSortVal(b, col);
  if(x==null && y!=null) return 1; if(y==null && x!=null) return -1;   // the empty ones last, whichever way
  if(x!=null && y!=null && x!==y) return (typeof x==="string" ? x.localeCompare(y, "el") : x<y ? -1 : 1)*dir;
  return cFold(a.name).localeCompare(cFold(b.name), "el");
}
function cVisible(){
  if(!custData) return [];
  const today=custData.today||todayYmd(), q=((document.getElementById("custQ")||{}).value||"").trim();
  // A search on «Όλοι» looks in the archive too: a name he types may well be someone who finished.
  const f=(q && custFilter==="all") ? null : custFilter;
  return custData.customers.filter(c=>(!f || cMatch(c, f, today)) && cSearch(c, q)).sort(cCompare);
}
// Call, Viber, mail. Viber only for a mobile or a foreign number: a Greek landline has none.
function cReach(c, full){
  const out=[];
  if(c.phone){
    out.push(`<a class="btn sm" href="tel:${esc(c.phone)}" title="Κλήση ${esc(c.phone)}">📞${full?" "+esc(c.phone):""}</a>`);
    if(!/^\+302/.test(c.phone)) out.push(`<a class="btn sm" href="viber://chat?number=${encodeURIComponent(c.phone)}" title="Viber ${esc(c.phone)}">Viber</a>`);
  }
  if(c.email) out.push(`<a class="btn sm" href="mailto:${esc(encodeURIComponent(c.email).replace(/%40/g,"@"))}" title="${esc(c.email)}">✉${full?" "+esc(c.email):""}</a>`);
  return out.length ? `<div class="reach">${out.join("")}</div>` : `<span class="muted">—</span>`;
}
function cRowHtml(c){
  const flags=(c.flags||[]).map(f=>`<span class="badge warn" title="${esc((C_FLAG[f]||[])[1]||f)}">⚑ ${esc((C_FLAG[f]||[])[0]||f)}</span>`).join("");
  const next=c.next ? `<span class="nw">${esc(gYmd(c.next))}</span><div class="muted">${esc(cInDays(c.next))}${c.nextKind && c.nextKind!=="wedding" ? " · "+esc(C_KIND[c.nextKind]||c.nextKind) : ""}${c.nextPct!=null ? ` · ${c.nextPct} % με θέση` : ""}</div>` : `<span class="muted">—</span>`;
  const until=c.until ? `<span class="nw">${esc(gYmd(c.until))}</span><div class="muted">${esc(C_UNTIL[c.untilKind]||"")}</div>` : `<span class="muted">${c.untilKind==="keep" ? C_UNTIL.keep : "—"}</span>`;
  const st=c.step, step=st ? `<div class="muted cstep${st.due && st.due<=(custData.today||todayYmd()) ? " due" : ""}">→ ${esc(st.text)}${st.due ? ` · ${esc(gYmd(st.due))}` : ""}</div>` : "";
  return `<tr class="crow" data-key="${esc(c.key)}" tabindex="0">
    <td><div class="cname">${esc(c.name||"—")}</div>${flags ? `<div class="cflags">${flags}</div>` : ""}${step}</td>
    <td data-l="Τύπος">${esc(C_TYPE[c.type]||c.type)}</td>
    <td data-l="Στάδιο"><span class="badge st${esc(c.stage)}">${esc(C_STAGE[c.stage]||c.stage)}</span></td>
    <td data-l="Πληρωμή"${c.pay && c.pay.state ? "" : ` class="ce"`}>${cPayBadge(c.pay)}</td>
    <td data-l="Επόμενη"${c.next ? "" : ` class="ce"`}>${next}</td>
    <td data-l="Εκδηλώσεις" title="επόμενες / σύνολο"${c.total ? "" : ` class="ce"`}>${esc(c.upcoming)} <span class="muted">/ ${esc(c.total)}</span></td>
    <td data-l="Λήξη"${c.until || c.untilKind==="keep" ? "" : ` class="ce"`}>${until}</td>
    <td data-l="Κίνηση" title="${esc(gDT(c.last))}"${c.last ? "" : ` class="ce"`}>${c.last ? esc(gAgo(c.last)) : "—"}</td>
    <td data-l="Επαφή"${c.phone || c.email ? "" : ` class="ce"`}>${cReach(c)}</td></tr>`;
}
function renderCustomers(){
  const box=document.getElementById("custTable"); if(!box || !custData) return;
  const today=custData.today||todayYmd(), all=custData.customers, q=document.getElementById("custQ").value.trim();

  document.getElementById("custChips").innerHTML=C_CHIPS.map(([k, l])=>{ const n=all.filter(c=>cMatch(c, k, today)).length;
    return `<button class="chip${k===custFilter ? " on" : ""}${k==="want" && n ? " hot" : ""}" data-f="${k}" aria-pressed="${k===custFilter}">${esc(l)} <small>${n}</small></button>`; }).join("");

  const rows=cVisible();
  // a search that finds nothing under this chip may still find them elsewhere: one tap to look in everyone
  const elsewhere=(!rows.length && q && custFilter!=="all") ? all.filter(c=>cSearch(c, q)).length : 0;
  box.innerHTML=rows.length
    ? `<table class="cards"><thead><tr>${C_COLS.map(([k, l])=>{ const on=custSortBy.col===k;
        return `<th data-sort="${k}" aria-sort="${on ? (custSortBy.dir>0 ? "ascending" : "descending") : "none"}" title="Ταξινόμηση">${esc(l)}${on ? (custSortBy.dir>0 ? " ▲" : " ▼") : ""}</th>`; }).join("")}</tr></thead>
       <tbody>${rows.map(cRowHtml).join("")}</tbody></table>`
    : `<div class="empty">${q ? `Κανένα αποτέλεσμα για «${esc(q)}» εδώ.` : "Κανείς εδώ."}${elsewhere ? `<div style="margin-top:8px"><button class="btn sm" data-f="all">Δες ${elsewhere===1 ? "το 1 αποτέλεσμα" : `τα ${elsewhere} αποτελέσματα`} σε όλους</button></div>` : ""}</div>`;
}
async function refreshCustomers(){
  const res=await req("/admin/customers");

const NOTES_MAX=2000, STEP_MAX=200, ACT_TEXT_MAX=300, TL_FIRST=8;   // the server's limits; the timeline shows its newest 8 first
const C_ACTS=[["call","📞 Τηλεφώνησα"],["viber","💬 Viber"],["email","✉ Email"],["offer","Έστειλα προσφορά"],["meeting","Συνάντηση"],["other","Άλλο"]];
const C_ACT=Object.fromEntries(C_ACTS);
const gD=t=>{ if(!t) return "—"; try{ return new Date(t).toLocaleDateString("el-GR",{ timeZone:"Europe/Athens", day:"2-digit", month:"short", year:"numeric" }); }catch(e){ return "—"; } };
// «σε 4 χρόνια», not «σε 1461 μέρες»
function cFar(ymd){ const n=cDays(todayYmd(), ymd);
  return n<60 ? cInDays(ymd) : n<730 ? "σε "+gN(Math.round(n/30.44),"μήνα","μήνες") : "σε "+gN(Math.round(n/365.25),"χρόνο","χρόνια"); }

// Opens a card, or redraws the one on screen in place (same scroll), after his own change or an action.
let cardPanel=null;   // {key, el}: the last answer box (a new key, a new link) of the open card, kept until he closes it or the card
async function openCustomer(key, holder){
  await flushNotes();
  if(holder) cardPanel={ key, el:holder };
  else if(cardPanel && cardPanel.key===key && cardPanel.el.innerHTML) holder=cardPanel.el;   // a later redraw keeps the box
  else cardPanel=null;
  let d=document.getElementById("dlg");
  const same=!!(d && d.open && d.dataset.ctx==="cust:"+key), top=same ? d.scrollTop : 0;
  if(!same){ d=openDialog(`<div lang="el">${dlgHead("Φορτώνει…")}<div class="dbody"><div class="empty">Φορτώνει…</div></div></div>`); d.dataset.ctx="cust:"+key; }
  const res=await req("/admin/customers/"+encodeURIComponent(key));
  if(!d.open || d.dataset.ctx!=="cust:"+key) return;   // closed, or another card opened meanwhile
  if(!res.ok || !res.d || !res.d.customer){

  }

  d.dataset.ctx="cust:"+key; d.scrollTop=top;

const refreshCard=(key, holder)=>{ const d=document.getElementById("dlg");
  return (d && d.open && d.dataset.ctx==="cust:"+key) ? openCustomer(key, holder) : Promise.resolve(); };
function wireCard(root, key, x, holder){
  const q=s=>root.querySelector(s);

  const ta=q("#cn_notes");

    const n=cardNotes={ key, el:ta, st:q("#cn_state"), timer:null, last:ta.value, busy:null, pending:null };
    ta.addEventListener("input", ()=>{ n.st.textContent=""; n.st.classList.remove("err"); clearTimeout(n.timer); n.timer=setTimeout(()=>saveNotes(n), 800); });
    ta.addEventListener("blur", ()=>{ if(cardNotes===n) flushNotes(); });
  }
  const tx=q("#ct_text");
  if(tx) tx.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); toast("Τώρα πάτα τι έγινε: «Τηλεφώνησα», «Viber»…"); } });
  root.addEventListener("click", e=>onCardClick(e, root, key, x));
}
// His notes save themselves: 0.8 s after he stops typing, when he leaves the box, and before the card closes or redraws.
function saveNotes(n){
  clearTimeout(n.timer); n.timer=null;
  const val=n.el.value;
  if(val===n.last) return Promise.resolve();
  if(n.busy && n.pending===val) return n.busy;
  n.pending=val; n.st.textContent="αποθηκεύεται…"; n.st.classList.remove("err");
  const p=n.busy=req("/admin/customers/"+encodeURIComponent(n.key)+"/notes",{ method:"PUT", body:JSON.stringify({ notes:val }) }).then(res=>{
    if(n.busy===p) n.busy=null;
    if(res.ok){ n.last=val; if(n.el.value===val) n.st.textContent="αποθηκεύτηκε ✓"; refreshCustomers(); }
    else { n.st.textContent="δεν αποθηκεύτηκε — γράψε κάτι για να ξαναδοκιμάσει"; n.st.classList.add("err"); failToast(res, "Οι σημειώσεις δεν αποθηκεύτηκαν"); }
  });
  return p;
}
function flushNotes(){ const n=cardNotes; return n ? saveNotes(n) : Promise.resolve(); }
async function onCardClick(e, root, key, x){

// A card button runs the same admin action the old lists ran, on the old lists' row for this customer (it carries what
// the card leaves out, e.g. an unopened link to copy). Its answer (a link, a key) lands in a detached holder that the
// fresh card takes in, so redrawing the card does not wipe it. «Επεξεργασία…» and the trash are dialogs of their own:
// closing them comes back to the card (dlgBack).
async function cardAction(key, x, a, btn){
  if(a==="forget") return cardForget(key, x, btn);
  if(a==="tpl") return showReply(btn, x);
  if(key.slice(0,1)==="l") return leadAction(key, x, a, btn);
  const couple=key.slice(0,1)==="c", id=key.slice(2);
  btn.disabled=true;
  await (couple ? refreshCouples() : refreshVenues());
  btn.disabled=false;
  const rec=(couple ? couplesCache : venuesCache).find(r=>r.id===id);
  if(!rec){ toast("Ο πελάτης δεν βρέθηκε — πάτα «Ανανέωση»"); return; }
  if(a==="copy" && !rec.claimToken){ toast("Δεν υπάρχει σύνδεσμος για αντιγραφή — φτιάξε νέο"); return; }
  const run=()=>couple ? coupleAction(rec, a, btn) : venueAction(rec, a, btn);
  if(a==="edit" || a==="trash"){ dlgBack=key; return run(); }

function eurNum(c){ const n=Math.abs(c), i=String(Math.floor(n/100)).replace(/\B(?=(\d{3})+(?!\d))/g,"."); return (c<0 ? "−" : "")+i+","+String(n%100).padStart(2,"0"); }

function parseEur(s){

  if(/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(s)) s=s.replace(/\./g,"").replace(",",".");   // 1.234,56
  else if(/^\d+(,\d{1,2})?$/.test(s)) s=s.replace(",",".");
  else if(!/^\d+(\.\d{1,2})?$/.test(s)) return null;
  const [i, f=""]=s.split("."), c=(+i)*100+(+(f+"00").slice(0,2));

  if(k==="p_unwaive") return paySend(b, key, path+"/dues/"+encodeURIComponent(id)+"/unwaive", "POST", {}, "Αναιρέθηκε — αναμένεται ξανά");
  if(!pay) return;
  if(k==="p_rcpt"){
    const r=prompt(pay.refundOf ? "Αριθμός πιστωτικού από τον Λογιστή:" : "Αριθμός απόδειξης από τον Λογιστή:", pay.receipt||""); if(r==null) return;
    return paySend(b, key, path+"/pay/"+encodeURIComponent(id), "PATCH", { receipt:r.trim() }, r.trim() ? "Γράφτηκε ο αριθμός" : "Ο αριθμός σβήστηκε");
  }
  if(k==="p_note"){
    const r=prompt("Σημείωση για αυτή την κίνηση:", pay.note||""); if(r==null) return;
    return paySend(b, key, path+"/pay/"+encodeURIComponent(id), "PATCH", { note:r.trim() }, "Αποθηκεύτηκε");
  }
  if(k==="p_cancel"){
    const r=prompt(`Ακύρωση ${pay.refundOf ? "της επιστροφής" : "της πληρωμής"} ${eur(pay.amount)} της ${gYmd(pay.date)}.\n\nΔεν σβήνεται: μένει διαγραμμένη, με τον λόγο, και δεν μετράει πουθενά. Γιατί ακυρώνεται; (π.χ. λάθος ποσό — θα την περάσω ξανά)`);
    if(r==null) return;
    if(!r.trim()){ toast("Χρειάζεται ένας λόγος"); return; }
    return paySend(b, key, path+"/pay/"+encodeURIComponent(id)+"/cancel", "POST", { reason:r.trim() }, "Ακυρώθηκε");

}
function payChip(root, ch){

  box.querySelectorAll(`.pick .chip[data-g="${g}"]`).forEach(c=>{ const on=c===ch; c.classList.toggle("on", on); c.setAttribute("aria-pressed", on); });
  if(g==="what" && box.dataset.mode==="due"){   // a season is «+ ΦΠΑ» and has dates; a couple's plan includes ΦΠΑ
    const v=ch.dataset.v, row=box.querySelector("#pf_seasonrow"), vat=box.querySelector("#pf_plusvat");
    if(row) row.style.display=v==="season" ? "" : "none";

function payFormSave(root, key, b){
  const q=s=>root.querySelector(s), box=q("#pp_box"), mode=box.dataset.mode, id=box.dataset.id||"";
  const pick=g=>{ const c=box.querySelector(`.pick[data-pick="${g}"] .chip.on`); return c ? c.dataset.v : null; };
  const path="/admin/customers/"+encodeURIComponent(key), aEl=q("#pf_amount"), amount=parseEur(aEl.value);
  if(!amount){ invalid(aEl, "Γράψε το ποσό, π.χ. 19,00"); return; }
  const about=q("#pf_about") ? q("#pf_about").value.trim() : "", what=pick("what");
  if(q("#pf_about") && what==="other" && !about){ invalid(q("#pf_about"), "Γράψε τι είναι"); return; }
  if(mode==="due"){
    const dEl=q("#pf_due"), from=q("#pf_from").value, to=q("#pf_to").value;
    if(!dEl.value){ invalid(dEl, "Γράψε ως πότε"); return; }
    if(what==="season" && (from || to) && !(from && to && from<=to)){ invalid(q(from ? "#pf_to" : "#pf_from"), P_ERR.bad_season); return; }
    return paySend(b, key, path+"/dues", "POST", { what, about, amount, plusVat:q("#pf_plusvat").checked, due:dEl.value, ...(what==="season" && from ? { from, to } : {}) },
      "Προστέθηκε στις αναμενόμενες");
  }
  const vEl=q("#pf_vat"), vRaw=vEl.value.trim(), vat=vRaw ? parseEur(vRaw) : null, dEl=q("#pf_date");
  if(vRaw && vat==null){ invalid(vEl, "Ο ΦΠΑ δεν είναι σωστός, π.χ. 30,96"); return; }
  if(vat!=null && vat>amount){ invalid(vEl, "Ο ΦΠΑ δεν μπορεί να είναι πάνω από το ποσό"); return; }
  if(!dEl.value || dEl.value>todayYmd()){ invalid(dEl, "Η ημερομηνία δεν μπορεί να είναι μετά από σήμερα"); return; }
  const common={ amount, vat, date:dEl.value, method:pick("method"), receipt:q("#pf_receipt").value.trim(), note:q("#pf_note").value.trim() };
  if(mode==="refund"){
    const rEl=q("#pf_reason"); if(!rEl.value.trim()){ invalid(rEl, "Γράψε γιατί επιστρέφονται"); return; }
    return paySend(b, key, path+"/pay/"+encodeURIComponent(id)+"/refund", "POST", { ...common, reason:rEl.value.trim() }, "Η επιστροφή καταχωρίστηκε");
  }
  return paySend(b, key, path+"/pay", "POST", id ? { ...common, dueId:id } : { ...common, what, about }, "Η πληρωμή καταχωρίστηκε");
}

function wireLeadForm(d, except, onKnown){
  const q=s=>d.querySelector(s); let stageTouched=false, timer=null, seq=0;
  const pick=g=>{ const b=q(`.pick[data-pick="${g}"] .chip.on`); return b ? b.dataset.v : null; };
  const set=(g, v)=>d.querySelectorAll(`.pick[data-pick="${g}"] .chip`).forEach(b=>{ const on=b.dataset.v===String(v); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  const sync=()=>{ const t=pick("type"), venue=t==="venue";
    q("#ld_namel").textContent=venue ? "Όνομα κτήματος" : "Όνομα"; q("#ld_name").placeholder=venue ? "π.χ. Κτήμα Ηλιοβασίλεμα" : "π.χ. Μαρία Παπαδάκη";
    q("#ld_afmw").style.display=venue ? "" : "none"; q("#ld_datew").style.display=venue ? "none" : "";
    if(!venue) q("#ld_datel").textContent=EVW[LEAD_KINDS[t]].date;
    q("#ld_placel").innerHTML=venue ? `Περιοχή <span class="hint">— πού είναι το κτήμα</span>` : `Πού γίνεται <span class="hint">— κτήμα ή περιοχή</span>`;
    q("#ld_place").placeholder=venue ? "π.χ. Μαραθώνας" : "π.χ. Κτήμα Ηλιοβασίλεμα"; };
  // only what could already be someone's: a whole address, a whole number, nine digits
  async function look(){
    const email=q("#ld_email").value.trim(), phone=q("#ld_phone").value.trim(), afm=pick("type")==="venue" ? q("#ld_afm").value.replace(/\s/g,"") : "";
    const body={ email:/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) ? email : "", phone:phone.replace(/\D/g,"").length>=10 ? phone : "", afm:/^\d{9}$/.test(afm) ? afm : "", except:except||"" };
    const box=q("#ld_known"), my=++seq;
    if(!body.email && !body.phone && !body.afm){ box.innerHTML=""; return; }
    const res=await req("/admin/match", { method:"POST", body:JSON.stringify(body) });
    if(my!==seq || !box.isConnected) return;
    const list=res.ok && res.d && Array.isArray(res.d.matches) ? res.d.matches : [], was=!!box.innerHTML;
    box.innerHTML=list.length ? knownHtml(list, !except) : "";
    if(list.length && !was) box.scrollIntoView({ behavior:"smooth", block:"nearest" });   // under the fold otherwise, and easy to miss
  }
  const later=()=>{ clearTimeout(timer); timer=setTimeout(look, 450); };
  ["#ld_email", "#ld_phone", "#ld_afm"].forEach(s=>q(s).addEventListener("input", later));
  d.addEventListener("click", e=>{
    const k=e.target.closest("[data-known]"); if(k){ onKnown(k.dataset.known, k.dataset.key, k); return; }
    const b=e.target.closest(".pick .chip"); if(!b) return;
    const g=b.dataset.g; set(g, b.dataset.v);
    if(g==="stage") stageTouched=true;
    if(g==="source" && !stageTouched && q('.pick[data-pick="stage"]')) set("stage", b.dataset.v==="phone" ? 2 : 1);   // on the phone he has answered already
    if(g==="type"){ sync(); later(); }
  });
  sync(); later();
  return { pick, stageTouched:()=>stageTouched };
}
function knownHtml(list, canAdd){
  return `<div class="known"><div style="font-weight:700">Γνωστός πελάτης${list.length>1 ? ` <span class="muted">(${list.length})</span>` : ""}</div>
    ${canAdd ? `<div class="muted">Αν είναι ο ίδιος, πρόσθεσε την επαφή στην καρτέλα του αντί για νέα γραμμή.</div>` : ""}
    ${list.map(m=>{
      const evs=(m.events||[]).map(e=>`${C_KIND[e.kind]||e.kind}${e.date ? " "+gYmd(e.date) : ""}${e.gone ? " (πέρασε)" : ""}`).join(" · ");
      const ask=m.lead ? [m.lead.date ? gYmd(m.lead.date) : "", m.lead.place].filter(Boolean).join(" · ") : "";
      return `<div class="kc"><div class="row fw" style="gap:6px"><strong>${esc(m.name||"—")}</strong><span class="badge tpl">${esc(C_TYPE[m.type]||m.type)}</span><span class="badge st${esc(m.stage)}">${esc(C_STAGE[m.stage]||m.stage)}</span>
          <span class="muted">${esc((m.how||[]).map(h=>C_HOW[h]||h).join(" · "))}</span></div>
        ${fieldsHtml([ m.phone ? ["Τηλέφωνο", esc(m.phone)] : null, m.email ? ["Email", esc(m.email)] : null, evs ? ["Εκδηλώσεις", esc(evs)] : null,
          ask ? [m.type==="venue" ? "Περιοχή" : "Ζήτησε για", esc(ask)] : null, m.last ? ["Τελευταία κίνηση", esc(gWhen(m.last))] : null, m.notes ? ["Σημειώσεις", esc(m.notes)] : null ])}
        ${(m.said||[]).length ? `<ul class="tl">${m.said.map(s=>`<li><time>${esc(gDT(s.at))}</time><span class="w">${esc(s.text)}</span></li>`).join("")}</ul>` : ""}
        <div class="row fw" style="margin-top:8px">${canAdd ? `<button type="button" class="btn sm primary" data-known="add" data-key="${esc(m.key)}">Πρόσθεσε στην καρτέλα του</button>` : ""}
          <button type="button" class="btn sm" data-known="open" data-key="${esc(m.key)}">Άνοιξε την καρτέλα</button></div></div>`; }).join("")}</div>`;
}
// → {lead} or {error, el}
function readLeadForm(d, f){
  const v=id=>d.querySelector("#"+id).value.trim(), type=f.pick("type"), venue=type==="venue", dateEl=d.querySelector("#ld_date");
  if(!venue && dateEl.validity && dateEl.validity.badInput) return { error:"Η ημερομηνία δεν είναι ολόκληρη", el:dateEl };
  const o={ source:f.pick("source"), type, name:v("ld_name"), phone:v("ld_phone"), email:v("ld_email"), afm:venue ? v("ld_afm").replace(/\s/g,"") : "", date:venue ? "" : dateEl.value, place:v("ld_place") };
  if(!o.name && !o.phone && !o.email) return { error:LEAD_ERR.empty[1], el:d.querySelector("#ld_name") };
  if(o.afm && !/^\d{9}$/.test(o.afm)) return { error:"Το ΑΦΜ έχει 9 ψηφία", el:d.querySelector("#ld_afm") };
  return { lead:o };
}
function leadFail(d, res, fallback){
  const e=LEAD_ERR[res.d && res.d.error];
  if(e){ invalid(d.querySelector("#"+e[0]), e[1]); return; }
  failToast(res, res.status===409 && res.d && res.d.error==="full" ? "Οι επαφές έφτασαν τις 3.000 — σβήσε όσες δεν χρειάζεσαι" : fallback);
}
// The dialog element is reused, so everything listens on its content: a listener on the dialog would outlive the form.
function openNewLead(){
  const d=openDialog(`<div lang="el">${dlgHead("Νέα επαφή")}<div class="dbody">${leadFormHtml(null, true)}</div>
    <div class="dfoot"><button class="btn" data-dclose>Άκυρο</button><button class="btn primary" id="ld_save">Αποθήκευση</button></div></div>`).firstElementChild;
  const q=s=>d.querySelector(s);
  const next=()=>{ const t=q("#ld_next").value.trim(), due=q("#ld_due").value; return t ? { next:{ text:t, due:due||null } } : {}; };
  const f=wireLeadForm(d, "", async (what, key, btn)=>{
    if(what==="open") return openCustomer(key);
    // the same person again: the contact goes on their card, with how it came, and nothing new is made
    const body={ source:f.pick("source")||"other", text:q("#ld_text").value.trim(), ...next(), ...(key.slice(0,1)==="l" && f.stageTouched() ? { stage:+f.pick("stage") } : {}) };
    btn.disabled=true; const res=await req("/admin/customers/"+encodeURIComponent(key)+"/contact", { method:"POST", body:JSON.stringify(body) }); btn.disabled=false;
    if(!res.ok){ failToast(res, res.status===404 ? "Αυτός ο πελάτης δεν υπάρχει πια" : "Δεν γράφτηκε"); return; }
    toast("Γράφτηκε στην καρτέλα του"); refreshCustomers(); openCustomer(key);
  });
  const save=async ()=>{
    const r=readLeadForm(d, f); if(r.error){ invalid(r.el, r.error); return; }
    const dueEl=q("#ld_due"); if(dueEl.validity && dueEl.validity.badInput){ invalid(dueEl, "Η ημερομηνία δεν είναι ολόκληρη"); return; }
    const btn=q("#ld_save"); if(btn.disabled) return; btn.disabled=true;
    const res=await req("/admin/leads", { method:"POST", body:JSON.stringify({ ...r.lead, stage:+f.pick("stage"), text:q("#ld_text").value.trim(), ...next() }) });
    if(!d.isConnected) return;
    btn.disabled=false;
    if(!res.ok){ leadFail(d, res, "Δεν αποθηκεύτηκε"); return; }
    closeDialog(); toast("Η επαφή μπήκε στους πελάτες"); refreshCustomers();
  };
  q("#ld_save").onclick=save;
  ["#ld_name", "#ld_phone", "#ld_email", "#ld_text", "#ld_next"].forEach(s=>q(s).addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); save(); } }));
  q("#ld_name").focus();
}
function openLeadEdit(key, l){
  const d=openDialog(`<div lang="el">${dlgHead("Επεξεργασία επαφής")}<div class="dbody">${leadFormHtml(l, false)}</div>
    <div class="dfoot"><button class="btn" data-dclose>Άκυρο</button><button class="btn primary" id="ld_save">Αποθήκευση</button></div></div>`).firstElementChild;
  const f=wireLeadForm(d, key, (what, k)=>{ if(what==="open"){ dlgBack=null; openCustomer(k); } });
  d.querySelector("#ld_save").onclick=async e=>{
    const r=readLeadForm(d, f); if(r.error){ invalid(r.el, r.error); return; }
    const btn=e.currentTarget; btn.disabled=true;
    const res=await req("/admin/customers/"+encodeURIComponent(key)+"/lead", { method:"PATCH", body:JSON.stringify(r.lead) });
    if(!d.isConnected) return;
    btn.disabled=false;
    if(!res.ok){ leadFail(d, res, res.status===404 ? "Αυτή η επαφή δεν υπάρχει πια" : "Δεν αποθηκεύτηκε"); return; }
    toast("Αποθηκεύτηκε"); closeDialog();   // back to the card (dlgBack)
  };
}
// The contact's own buttons on its card.
async function leadAction(key, x, a, btn){
  const l=x.lead||{}, path="/admin/customers/"+encodeURIComponent(key);
  if(a==="ledit"){ dlgBack=key; return openLeadEdit(key, l); }
  if(a==="convert"){
    await flushNotes();
    const notes=[[l.phone ? "Τηλ. "+l.phone : "", l.place ? (l.type==="venue" ? "Περιοχή: " : "Πού: ")+l.place : ""].filter(Boolean).join(" · "), x.notes||""]
      .filter(Boolean).join("\n").slice(0, NOTES_MAX);
    const pre={ lead:l.id, name:l.name, email:l.email, notes };
    dlgBack=key;   // cancelled: back to the contact; created: convertDone points it at the new customer
    if(l.type==="venue") return openNewVenue({ ...pre, afm:l.afm });
    // a βάπτιση's plan is named after the child and a γιορτή's after the event: the person who called goes in the notes
    const own=l.type==="couple";
    return openNewCouple({ ...pre, kind:LEAD_KINDS[l.type]||"wedding", date:l.date, plan:own ? l.name : "",
      notes:(own || !l.name ? notes : ["Επαφή: "+l.name, notes].filter(Boolean).join("\n")).slice(0, NOTES_MAX) });
  }
  if(a==="lost"){
    const p=btn.closest(".dbody").querySelector(".cardpanel"); if(!p) return;
    p.innerHTML=`<div class="cbox"><label for="cl_text"><span>Δεν προχώρησε — γιατί;</span></label>
      <input id="cl_text" maxlength="${ACT_TEXT_MAX}" autocomplete="off" placeholder="Μια γραμμή, αν θέλεις">
      <div class="tlbtns">${Object.entries(C_LOST).map(([k, t])=>`<button class="btn sm" data-k="lost_save" data-r="${k}">${esc(cap(t))}</button>`).join("")}<button class="btn sm ghost" data-k="panel_close">Άκυρο</button></div>
      <div class="muted" style="margin-top:6px">Η επαφή πάει στο «Αρχείο». Αν δεν ξαναμιλήσετε, σβήνεται 2 χρόνια μετά την τελευταία επαφή.</div></div>`;
    p.scrollIntoView({ behavior:"smooth", block:"nearest" }); p.querySelector("#cl_text").focus(); return;
  }
  if(/^st[123]$/.test(a)){
    const stage=+a.slice(2);
    btn.disabled=true; const res=await req(path+"/stage", { method:"POST", body:JSON.stringify({ stage }) }); btn.disabled=false;
    if(!res.ok){ failToast(res, res.status===404 ? "Αυτή η επαφή δεν υπάρχει πια" : "Δεν άλλαξε"); return; }
    toast("Στάδιο: "+C_STAGE[stage]); refreshCustomers(); await refreshCard(key);
  }
}

// ---- «Excel»: what is on screen, in the order it is on screen ----
// The planner's own format: UTF-8 with a BOM and ";", which Greek Excel opens with a double click.
function cCsvCell(v){ v=String(v==null?"":v); if(/^[=+\-@\t\r]/.test(v)) v="'"+v;   // a cell starting like a formula stays text
  return /[";\r\n]|^\s|\s$/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
// ΑΦΜ and phone as text: otherwise Excel drops an ΑΦΜ's leading 0 and turns a phone into 3,07E+11. Both reach us
// checked by the server (digits, and a leading + on a phone), and the filter below keeps it that way.
const cCsvText=v=>{ const t=String(v||"").replace(/[^\d+]/g,""); return t ? '"=""'+t+'"""' : ""; };
const cStamp=t=>{ const d=new Date(t), p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
function exportCustomersCsv(){
  const rows=cVisible();
  if(!rows.length){ toast("Δεν υπάρχει τίποτα για να βγει σε αρχείο"); return; }
  const head=["Πελάτης","Τύπος","Στάδιο","Πληρωμή","Αναμένεται (€)","Επόμενη εκδήλωση","Με θέση %","Επόμενες εκδηλώσεις","Όλες οι εκδηλώσεις","Λήξη","Τι λήγει","Τελευταία κίνηση","Email","Τηλέφωνο","ΑΦΜ","Θέλουν εμένα"];
  const lines=[head.map(cCsvCell).join(";")].concat(rows.map(c=>[
    cCsvCell(c.name), cCsvCell(C_TYPE[c.type]||c.type), cCsvCell(C_STAGE[c.stage]||c.stage),
    cCsvCell(c.pay && c.pay.state ? P_STATE[c.pay.state] : ""), c.pay && c.pay.owed ? cCsvNum(c.pay.owed) : "", cCsvCell(c.next||""), cCsvCell(c.nextPct==null ? "" : c.nextPct),
    cCsvCell(c.upcoming), cCsvCell(c.total), cCsvCell(c.until||""), cCsvCell(c.until ? C_UNTIL[c.untilKind]||"" : ""), cCsvCell(c.last ? cStamp(c.last) : ""),
    cCsvCell(c.email), cCsvText(c.phone), cCsvText(c.afm), cCsvCell((c.flags||[]).map(f=>(C_FLAG[f]||[])[0]||f).join(", ")),
  ].join(";")));
  const name="takeaseat-pelates-"+todayYmd()+".csv";
  const url=URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")+"\r\n"], { type:"text/csv;charset=utf-8" })), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 60000);
  toast("Κατέβηκε: "+name);
}

async function toolsLookup(q){
  const box=document.getElementById("suOut"); if(!box) return;
  const el=document.getElementById("suQ");
  if(q==null) q=el?el.value.trim():"";
  if(q.length<2){ invalid(el,"Γράψε τουλάχιστον 2 χαρακτήρες"); return; }
  lookupQ=q;
  box.innerHTML=`<div class="empty">Ψάχνω…</div>`;
  const res=await req("/admin/lookup?q="+encodeURIComponent(q));
  if(document.getElementById("suOut")!==box) return;
  if(!res.ok || !res.d){ box.innerHTML=`<div class="empty">Δεν μπόρεσα να ψάξω.</div>`; failToast(res,"Η αναζήτηση απέτυχε"); return; }
  const rs=res.d.results||[];
  box.innerHTML=rs.length
    ? rs.map(lookupCardHtml).join("")+(res.d.capped?`<div class="muted" style="margin-top:8px">Δείχνω τα πρώτα ${rs.length} — γράψε κάτι πιο συγκεκριμένο.</div>`:"")
    : `<div class="empty">Τίποτα για «${esc(q)}».</div>`;
}
// The card's buttons are the same admin actions as the two tables below — no hunting through three lists. The action
// runs against a DETACHED holder: redrawing the card afterwards would otherwise wipe the answer it just produced, so
// the holder (handlers and all) is moved into the fresh card instead.
async function runFromCard(sel, id, fn){
  const holder=document.createElement("div"); holder.className="cardpanel";
  panelTarget=holder;
  try{ await fn(); } finally { panelTarget=null; }
  if(lookupQ) await toolsLookup(lookupQ);
  if(!holder.innerHTML) return;
  const card=document.querySelector(`#suOut [${sel}="${(window.CSS&&CSS.escape)?CSS.escape(id):id}"]`);
  const slot=card&&card.querySelector(":scope > .cardpanel");
  if(slot) slot.replaceWith(holder); else { const out=document.getElementById("suOut"); if(out) out.prepend(holder); }
  holder.scrollIntoView({ behavior:"smooth", block:"nearest" });
}
async function onLookupAction(e){
  const copyBtn=e.target.closest("button[data-copy]"); if(copyBtn){ copy(copyBtn.dataset.copy); return; }
  const ob=e.target.closest("button[data-open]"); if(ob){ openCustomer(ob.dataset.open); return; }
  const pb=e.target.closest("button[data-pa]");
  if(pb && pb.dataset.pa==="ret"){ openPlanRetention(pb.dataset.pid, pb.dataset.pname, pb.dataset.pret); return; }
  const cb=e.target.closest("button[data-ca]");
  if(cb){
    const id=cb.closest("[data-cid]").dataset.cid;
    const c=couplesCache.find(x=>x.id===id);
    if(!c){ toast("Ανανέωσε τη λίστα των ζευγαριών"); refreshCouples(); return; }
    await runFromCard("data-cid", id, ()=>coupleAction(c, cb.dataset.ca, cb));
    return;
  }
  const vb=e.target.closest("button[data-va]");
  if(vb){
    const id=vb.closest("[data-vid]").dataset.vid;
    const v=venuesCache.find(x=>x.id===id);
    if(!v){ toast("Ανανέωσε τη λίστα των κτημάτων"); refreshVenues(); return; }
    await runFromCard("data-vid", id, ()=>venueAction(v, vb.dataset.va, vb));
  }
}

function tile(label, n, hot){ return `<div${hot?' class="hot"':''}><b>${esc(String(n))}</b><span>${esc(label)}</span></div>`; }
// What the hourly sweep actually did, in words, with the zeros left out.
const GR_SWEEP={ tok:"σύνδεσμοι", rlmail:"όρια email", claim:"προσκλήσεις", find:"ορφανά QR", locked:"κλείδωσαν",
  keepsakes:"αναμνηστικά", purged:"σβήστηκαν", notesGone:"σχέδια χωρίς σημειώσεις πια", trash:"κάδος", findEnded:"QR που έκλεισαν", renewed:"ανανεώσεις", reminded:"υπενθυμίσεις",
  rl:"όρια αιτημάτων", trialReminded:"υπενθυμίσεις δωρεάν χρόνου", signupsExpired:"εγγραφές που έληξαν", signupsDropped:"εγγραφές που σβήστηκαν" };
// skipped / archived / full describe HOW it looked (the archive list), not what it did — said apart, after the work.
function sweepWords(o){ o=o||{}; const how=new Set(["skipped","archived","full"]);
  const xs=Object.entries(o).filter(([k,v])=>v && !how.has(k)).map(([k,v])=>`${v} ${GR_SWEEP[k]||k}`);
  const done=xs.length?xs.join(" · "):"δεν χρειάστηκε να κάνει τίποτα";
  const look=o.full?"πλήρης έλεγχος όλων των σχεδίων":o.skipped?`${o.skipped} αρχειοθετημένα σχέδια δεν χρειάστηκε να τα ανοίξει`:"";
  return done+(look?` (${look})`:""); }
// The per-IP buckets server.mjs counts. «findtoken» is one slot per unknown QR per address, so it always sits at its
// own ceiling of 1 — that is not pressure, and it is not coloured as such.
const GR_BUCKET={ write:"γραψίματα", create:"νέα σχέδια", find:"αναζητήσεις QR", findfail:"άγνωστα QR",
  findtoken:"ανά άγνωστο QR", mail:"αιτήματα email", pdf:"PDF", amelie:"Amelie", authfail:"λάθος κλειδιά", signup:"εγγραφές κτημάτων" };

  const c=d.counts||{}, m=d.mail||{}, h=d.host||null, sw=d.sweep||null, sm=m.smtp||null;
  const le=m.lastError, failing=!!(le && le.at && (!m.lastOkAt || le.at>m.lastOkAt));
  const mailLine = !m.enabled ? `<strong style="color:var(--danger)">Email: κλειστό</strong> — δεν φεύγει κανένα μήνυμα.`
    : `<strong style="color:var(--good)">Email: ανοιχτό</strong> ${esc(m.mode==="log"?"(μόνο καταγραφή — MAIL_LOG=1)":"(SMTP)")}${m.from?` · από <span class="mono">${esc(m.from)}</span>`:""}`;
  return `${fieldsHtml([
      ["Email", mailLine],
      sm?["SMTP", `${esc(sm.host)}:${esc(String(sm.port))} · σύνδεση: ${sm.login==="ok"?`<strong style="color:var(--good)">εντάξει</strong>`:sm.login==="failed"?`<strong style="color:var(--danger)">απέτυχε</strong> ${esc(sm.code||"")}`:"ελέγχεται…"}${sm.at?` (${esc(gAgo(sm.at))})`:""}`]:null,
      ["Μηνύματα", `${+m.sent||0} εστάλησαν · ${+m.failed||0} απέτυχαν · ${+m.queued||0} στην ουρά${failing?` <span style="color:var(--danger)">· τελευταίο σφάλμα ${esc(gDT(le.at))} προς ${esc(le.to||"?")} (${esc(le.code||"")})</span>`:""}`],
      ["Έκδοση", h?`${esc(h.version||"—")}${h.commit?` · commit <span class="mono">${esc(h.commit.slice(0,8))}</span>`:" · commit άγνωστο"}${h.builtAt?` · build ${esc(h.builtAt)}`:""}`:"—"],
      ["Διακομιστής", h?`ξεκίνησε ${esc(gAgo(h.startedAt))} · node ${esc(h.node)} · KV ${esc(h.kv)} · PDF ${h.pdf?"ναι":"όχι"} · RAM ${Math.round((h.rss||0)/1048576)} MB`:"—"],
      ["Σκούπα (ωριαία)", sw?`${esc(gWhen(sw.at))} · ${esc(sweepWords(sw.out))}`:"δεν έχει τρέξει ακόμη από την εκκίνηση"],
      ...[["Μετά την εκδήλωση — κτήματα", d.retention], ["Μετά την εκδήλωση — ζευγάρια", d.coupleRetention]].map(([t, r])=>
        [t, `${r&&r.lockAfter?"κλειδώνει":"μένει ανοιχτό"} · ${r&&r.keep?"δεν σβήνει ποτέ":"σβήνει μετά από "+(r?r.keepDays:"?")+" μέρες"}`]),
    ])}
    <div class="subh">Τι υπάρχει <span class="muted">— μόνο πελάτες</span></div>
    <div class="kv">${tile("κτήματα",c.venues)}${tile("ζευγάρια",c.couples)}${tile("σχέδια",c.plans)}${tile("QR ανοιχτά",c.findersOn)}${tile("QR που απαντούν",c.findersOpen)}${tile("ανοιχτές υποστηρίξεις",c.support)}${tile("χωρίς ημερομηνία",c.noDate,c.noDate>0)}${tile("κλειδωμένα",c.locked)}</div>
    ${(c.testPlans||c.testVenues)?`<div class="subh">Δικά σου δοκιμαστικά <span class="muted">— δεν μετρούν πουθενά παραπάνω</span></div>
    <div class="kv">${tile("δοκιμαστικοί γάμοι",c.testPlans,true)}${tile("δοκιμαστικός χώρος",c.testVenues,true)}${tile("QR δοκιμής",c.testFinders||0,true)}</div>`:""}
    <div class="subh">Εγγραφές κτημάτων <span class="muted">— η ουρά της δημόσιας φόρμας</span></div>
    <div class="kv">${tile("εκκρεμείς το 24ωρο (max "+(c.signupsMax||"—")+")", c.signupsToday||0, c.signupsMax&&(c.signupsToday||0)>=c.signupsMax*0.8)}</div>
    ${(c.signupsMax&&(c.signupsToday||0)>=c.signupsMax*0.8)?`<div class="muted" style="margin-top:6px;color:var(--danger)">Κοντά στο όριο — όταν γεμίσει, η φόρμα απαντά «δεν είναι διαθέσιμη». Καθαρίστε τις εκκρεμείς στις «Εγγραφές».</div>`:""}
    <div class="subh">Τις επόμενες 7 μέρες</div>
    <div class="kv">${tile("κλειδώνουν",c.lockIn7)}${tile("σβήνονται",c.deleteIn7,c.deleteIn7>0)}${tile("στον κάδο",c.inTrash)}</div>
    <div class="subh">Πίεση στα όρια <span class="muted">— τώρα, χωρίς διευθύνσεις</span></div>
    ${(h&&h.rate)?(h.rate.buckets.length
      ? `<div class="kv">${h.rate.buckets.map(b=>tile((GR_BUCKET[b.kind]||b.kind)+" (max "+(b.limit||"—")+")", b.worst, b.kind!=="findtoken"&&b.limit&&b.worst>=b.limit*0.8)).join("")}</div>
         <div class="muted" style="margin-top:6px">${gN(h.rate.clients,"διεύθυνση μετράει","διευθύνσεις μετρούν")} αυτή τη στιγμή σε ${gN(h.rate.live,"κάδο","κάδους")}.</div>`
      : `<div class="muted">Κανένα όριο δεν μετράει αυτή τη στιγμή.</div>`)
      : `<div class="muted">Ο διακομιστής δεν το αναφέρει.</div>`}`;
}

      <div class="big">Πολλά ονόματα (${g.count})</div><div class="muted" style="margin-top:4px">Ζητάει από τον καλεσμένο να γράψει περισσότερα. Κανένα όνομα δεν δίνεται.</div></div>`;
  else if(d.status===200 && (g.matches||[]).length) body=`<div class="guest"><div class="muted">${esc(g.event||"")} · ${esc(gYmd(g.date))}</div>
      ${g.matches.map(m=>`<div style="margin-top:8px"><div class="big">${esc(m.name)}</div><div>${m.table?`Τραπέζι <strong>${esc(m.table)}</strong>`:`<span class="muted">δεν έχει θέση ακόμη</span>`}</div></div>`).join("")}</div>`;
  else if(d.status===200) body=`<div class="guest"><div class="muted">${esc(g.event||"")} · ${esc(gYmd(g.date))}</div>
      <div class="big">Δεν βρέθηκε</div></div>`;
  else body=`<div class="guest"><div class="big err">${esc(d.status===403?"Κλειστό":d.status===429?"Πολλές αναζητήσεις":"Άγνωστος σύνδεσμος")}</div>
      <div class="muted" style="margin-top:4px">HTTP ${d.status} · ${esc(g.error||"")}</div></div>`;
  return body+fieldsHtml([
    ["Τι συμβαίνει", `<strong>${esc(GR_WHY[d.why]||d.why||"—")}</strong>`],
    w?["Γάμος", esc(gYmd(w.weddingDate))]:null,
    w?["Παράθυρο", `${esc(gDT(w.opensAt))} → ${esc(gDT(w.closesAt))} · ${w.open?`<strong style="color:var(--good)">ανοιχτό</strong>`:`<strong style="color:var(--danger)">κλειστό</strong>`}`]:null,
    w?["Διακόπτης", `${w.on?"ανοιχτός":"κλειστός"}${w.since?` — από ${esc(gDT(w.since))}`:""}${w.rotatedAt?` · νέο κλειδί ${esc(gDT(w.rotatedAt))}`:""}`]:null,
    (w&&w.spentToday!=null)?["Σήμερα", `${w.spentToday} / ${w.perDay} αναζητήσεις`]:null,
    d.planId?["Σχέδιο", `<span class="mono">${esc(d.planId)}</span> <button class="btn sm" data-lookup="${esc(d.planId)}">Κάρτα πελάτη</button>`]:null,
  ]);
}
async function toolsFinderTest(btn){
  const le=document.getElementById("ftLink"), qe=document.getElementById("ftQ"), box=document.getElementById("ftOut");
  const link=le.value.trim(), q=qe.value.trim();
  if(!link){ invalid(le,"Κόλλα τον σύνδεσμο ή το κλειδί"); return; }
  if(q.length<3){ invalid(qe,"Γράψε τουλάχιστον 3 γράμματα — όπως ο καλεσμένος"); return; }
  btn.disabled=true; box.innerHTML=`<div class="empty">Δοκιμάζω…</div>`;
  const res=await req("/admin/find-test",{ method:"POST", body:JSON.stringify({ link, q }) });
  btn.disabled=false;
  if(!document.getElementById("ftOut")) return;
  if(!res.ok || !res.d){ box.innerHTML=`<div class="empty">Δεν μπόρεσα να δοκιμάσω.</div>`; failToast(res,"Απέτυχε"); return; }
  box.innerHTML=`<div style="margin-top:12px">${finderHtml(res.d)}</div>`;
}

// ---- δοκιμαστικός γάμος ----
function testWeddingHtml(x){
  return `<div class="titem">
    <div class="grow">
      <div class="row fw" style="gap:6px"><strong>${esc(x.name)}</strong><span class="badge tmark">ΔΟΚΙΜΗ</span></div>
      <div class="muted">${x.kind==="baptism"?"Βάπτιση":"Γάμος"} ${esc(gYmd(x.weddingDate))} (${esc(gAgo(Date.parse(x.weddingDate+"T12:00:00")))}) · ${x.guests} καλεσμένοι, ${x.seated} σε ${x.tables} τραπέζια · φάση: ${esc(GR_PHASE[x.phase]||x.phase)} · QR ${x.findOn?(x.findOpen?"απαντά":"ανοιχτό αλλά εκτός παραθύρου"):"κλειστό"}</div>
      <div style="margin-top:8px">
        ${linkRow("Κτήμα — το σχέδιο με τα δικαιώματα του κτήματος", x.links.venue)}
        ${linkRow(x.kind==="baptism"?"Γονείς — ό,τι βλέπουν και αλλάζουν οι γονείς":"Ζευγάρι — ό,τι βλέπει και αλλάζει το ζευγάρι", x.links.couple)}
        ${linkRow("Ανάγνωση — δείχνει το σχέδιο, δεν το αλλάζει", x.links.view)}
        ${x.links.find?linkRow("Βρες το τραπέζι σου — ό,τι βλέπει ο καλεσμένος στην πόρτα", x.links.find):""}
      </div>
      ${x.links.find?`<div class="row fw" style="margin-top:8px"><button class="btn sm" data-ftry="${esc(x.links.find)}">Δοκίμασέ το στο «βρες το τραπέζι σου»</button></div>`:""}
    </div>
    <button class="btn sm danger" data-twdel="${esc(x.planId)}" data-twname="${esc(x.name)}">Διαγραφή</button></div>`;
}
// A row in the test venue is NOT what makes a record a test — only the flag on the record is. Anything else in there
// is listed here, without the ΔΟΚΙΜΗ badge, without its keys and without a delete button that could only be refused.
const GR_STRAY={ dangling_row:"γραμμή χωρίς σχέδιο — δεν υπάρχει πια", not_flagged:"σχέδιο μέσα στον δοκιμαστικό χώρο που ΔΕΝ είναι σημειωμένο ως δοκιμή",
  orphan_plan:"δοκιμαστικό σχέδιο εκτός του δοκιμαστικού χώρου" };
function testDataHtml(d){
  const parts=[];
  if(d.venue) parts.push(`<div class="keybox note"><div class="row between" style="align-items:flex-start;gap:8px">
      <div><div style="font-weight:700">${esc(d.venue.name)}</div>
        <div class="muted">Η κονσόλα του δοκιμαστικού χώρου — βάλε το κλειδί στο venue.html. Ό,τι φτιάξεις από εκεί μέσα σημειώνεται κι αυτό ως δοκιμή και σβήνεται από εδώ.</div>
        <div class="k" style="margin-top:6px">${esc(d.venue.key)}</div></div>
      <div class="row" style="gap:6px"><button class="btn sm" data-copy="${esc(d.venue.key)}">📋</button>
        <a class="btn sm" href="${esc(d.venue.url)}" target="_blank" rel="noopener noreferrer">venue.html ↗</a></div></div></div>`);
  if(d.weddings.length) parts.push(d.weddings.map(testWeddingHtml).join(""));
  if(d.strays.length) parts.push(`<div class="keybox note" style="border-color:#e3b4ac"><div style="font-weight:700">Υπολείμματα (${d.strays.length})</div>
    <div class="muted" style="margin-bottom:4px">Ό,τι βρέθηκε γύρω από τον δοκιμαστικό χώρο χωρίς να είναι δοκιμαστικό. Δεν σβήνεται από εδώ.</div>
    ${d.strays.map(s=>`<div class="muted mono">${esc(s.planId)} — ${esc(GR_STRAY[s.what]||s.what)}${s.name?" · "+esc(s.name):""}</div>`).join("")}</div>`);
  if(!parts.length) return `<div class="empty">Κανένα δοκιμαστικό δεδομένο — τίποτα δεν έχει μείνει πίσω.</div>`;
  parts.push(`<div class="row fw" style="margin-top:14px"><button class="btn danger" id="twWipe">Διαγραφή όλων των δοκιμαστικών</button></div>`);
  return parts.join("");
}
async function toolsTestRefresh(){
  const box=document.getElementById("twList"); if(!box) return;
  const res=await req("/admin/test/data");
  if(!document.getElementById("twList")) return;
  if(!res.ok || !res.d){ box.innerHTML=`<div class="empty">Δεν μπόρεσα να δω τα δοκιμαστικά δεδομένα.</div>`; return; }
  box.innerHTML=testDataHtml(res.d);
}
async function toolsMakeTest(btn){
  const ke=document.getElementById("twKind"), kind=(ke&&ke.value==="baptism")?"baptism":"wedding";
  if(!confirm(`Να φτιαχτεί δοκιμαστικ${kind==="baptism"?"ή βάπτιση":"ός γάμος"};\n\nΜπαίνει σε δικό του δοκιμαστικό χώρο («ΔΟΚΙΜΗ»), με ημερομηνία σε ${TEST_DAYS} μέρες, ~60 καλεσμένους και ανοιχτό «βρες το τραπέζι σου». Δεν αγγίζει κανέναν πελάτη και δεν μετράει σε καμία άδεια.`)) return;
  btn.disabled=true;
  const res=await req("/admin/test/wedding",{ method:"POST", body:JSON.stringify({ kind }) });
  btn.disabled=false;
  if(!res.ok || !res.d || !res.d.wedding){ failToast(res, res.d&&res.d.error==="not_test"?"Υπάρχει ήδη άλλη εγγραφή στο id του δοκιμαστικού χώρου":"Δεν φτιάχτηκε"); return; }
  toast("Έτοιμος — οι σύνδεσμοι είναι παρακάτω");
  await toolsTestRefresh();
  const box=document.getElementById("twList"); if(box) box.scrollIntoView({ behavior:"smooth", block:"nearest" });
}
async function onTestAction(e){
  const c=e.target.closest("button[data-copy]"); if(c){ copy(c.dataset.copy); return; }
  const t=e.target.closest("button[data-ftry]");
  if(t){ const le=document.getElementById("ftLink"); le.value=t.dataset.ftry;
    const qe=document.getElementById("ftQ"); if(!qe.value) qe.value="Μαρία";
    le.scrollIntoView({ behavior:"smooth", block:"center" }); qe.focus(); return; }
  const d=e.target.closest("button[data-twdel]");
  if(d){
    if(!confirm(`Διαγραφή του «${d.dataset.twname}»;\n\nΣβήνεται οριστικά το δοκιμαστικό σχέδιο, το ιστορικό του και το QR του. Δεν αγγίζει τίποτα πελάτη.`)) return;
    d.disabled=true;
    const res=await req("/admin/test/wedding/"+encodeURIComponent(d.dataset.twdel),{ method:"DELETE" });
    d.disabled=false;
    if(!res.ok){ failToast(res, res.status===409?"Αυτό δεν είναι δοκιμαστικό — δεν σβήνεται από εδώ":res.status===404?"Δεν υπάρχει πια":"Δεν σβήστηκε"); toolsTestRefresh(); return; }
    toast("Σβήστηκε"); toolsTestRefresh(); return;
  }
  if(e.target.id==="twWipe"){
    if(!confirm("Διαγραφή ΟΛΩΝ των δοκιμαστικών δεδομένων;\n\nΣβήνονται όλοι οι δοκιμαστικοί γάμοι και ο δοκιμαστικός χώρος. Ό,τι δεν είναι σημειωμένο ως δοκιμή μένει ανέγγιχτο.")) return;
    const b=e.target; b.disabled=true;
    const res=await req("/admin/test/data",{ method:"DELETE" });
    b.disabled=false;
    if(!res.ok || !res.d){ failToast(res, res.status===409?"Στο id του δοκιμαστικού χώρου κάθεται άλλη εγγραφή — δεν αγγίζεται από εδώ":"Δεν σβήστηκαν"); return; }
    const what = res.d.plans===0 ? (res.d.venue?"Σβήστηκε ο δοκιμαστικός χώρος":"Δεν υπήρχε τίποτα να σβηστεί")
      : res.d.plans===1 ? "Σβήστηκε 1 σχέδιο" : `Σβήστηκαν ${res.d.plans} σχέδια`;
    toast(what+(res.d.kept?` · ${gN(res.d.kept,"δεν ήταν δοκιμαστικό και έμεινε","δεν ήταν δοκιμαστικά και έμειναν")}`:""));
    if(res.d.kept) toast(`Ο δοκιμαστικός χώρος κρατήθηκε για ${gN(res.d.kept,"σχέδιο που δεν είναι δοκιμή","σχέδια που δεν είναι δοκιμή")} — δες τα «Υπολείμματα».`);
    toolsTestRefresh(); refreshVenues();
  }
}
function wireTools(){
  const on=(id,ev,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener(ev,fn); };
  on("suGo","click",()=>toolsLookup());
  on("suQ","keydown",e=>{ if(e.key==="Enter") toolsLookup(); });
  document.getElementById("suOut").addEventListener("click", onLookupAction);
  on("ftGo","click",e=>toolsFinderTest(e.currentTarget));
  on("ftQ","keydown",e=>{ if(e.key==="Enter") toolsFinderTest(document.getElementById("ftGo")); });
  document.getElementById("ftOut").addEventListener("click", e=>{
    const b=e.target.closest("button[data-lookup]"); if(!b) return;
    const q=document.getElementById("suQ"); q.value=b.dataset.lookup; toolsLookup(b.dataset.lookup);
    document.getElementById("suOut").scrollIntoView({ behavior:"smooth", block:"nearest" });
  });
  on("dgGo","click",e=>toolsDiagnostics(e.currentTarget));
  on("dgMailGo","click",e=>toolsTestEmail(e.currentTarget));
  on("twMake","click",e=>toolsMakeTest(e.currentTarget));
  on("twRefresh","click",()=>toolsTestRefresh());
  document.getElementById("twList").addEventListener("click", onTestAction);
  toolsTestRefresh();
}

async function load(silent){
  if(!getKey()){ renderLogin(); return; }
  if(!silent) app.innerHTML=`<div class="muted" style="text-align:center;padding:40px">Loading…</div>`;
  const mailP=fetchMail();
  let r; try{ r=await api("/admin/venues"); }catch(e){ renderLogin("Connection error."); return; }
  if(r.status===403){ setKey(""); renderLogin("Wrong owner key."); return; }
  if(r.status===503){ renderLogin("Admin is disabled — set the OWNER_KEY secret on the server first."); return; }
  if(!r.ok){ renderLogin("Something went wrong."); return; }
  const d=await r.json(); mailInfo=await mailP; renderDashboard((d.venues||[]).sort(byNewest));
  try{ localStorage.setItem("weddingOwnerDevice","1"); }catch(e){}   // not a secret: this device's own plans skip the free 8-table limit (the lab stays capped)
}
// New invitations may arrive while the tab is in the background.
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && getKey() && document.getElementById("supList")) refreshSupport(); });
// A mailed link (#recover=… / #verify=…) takes over before anything is loaded with the key this browser may still
// have — also when the link is opened in a tab that already has this page (only the fragment changes, nothing reloads).
window.addEventListener("hashchange",()=>{ linkFromHash(); });
if(!linkFromHash()) load();
</script>
