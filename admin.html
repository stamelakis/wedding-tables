// Only what the admin changed is sent: a licence or «Active» the admin didn't touch is never written back.
async function saveVenueEdit(v, d, initial){
  const q=s=>d.querySelector(s), btn=q("#ve_save"); if(btn.disabled) return;
  const body={};
  const name=q("#ve_name").value.trim(); if(!name){ invalid(q("#ve_name"), "Enter a venue name"); return; }
  if(name!==(v.name||"")) body.name=name;
  const contact=q("#ve_contact").value.trim(); if(contact!==(v.contact||"")) body.contact=contact;
  const notes=q("#ve_notes").value.trim(); if(notes!==(v.notes||"")) body.notes=notes;
  const sel=q("#ve_lang").value, lang=PLANNER_FILE[sel]?sel:"el"; if(lang!==(PLANNER_FILE[v.lang]?v.lang:"el")) body.lang=lang;
  const active=q("#ve_active").checked; if(active!==!!v.active) body.active=active;
  if(formState(q("#ve_lic"))!==initial.lic){ const lic=readLicense("ve_", d); if(lic.error){ invalid(lic.el, lic.error); return; } body.license=lic.license; }
  if(formState(q("#vr_box"))!==initial.ret){ const r=readRetention("vr_", d); if(r.error){ invalid(r.el, r.error); return; } body.retention=r.ret; }
  const email=q("#ve_email").value.trim(), emailChanged=email.toLowerCase()!==(v.email||"").toLowerCase();
  if(emailChanged){
    if(v.email && !confirm(`Change the email of "${v.name}"?\n\nFrom: ${v.email}\nTo: ${email||"(none)"}${mailOn()?"\n\nThe old address gets an email saying TakeaSeat changed it.":""}`)) return;
    body.email=email;
  }
  if(!Object.keys(body).length){ closeDialog(); toast("Nothing changed"); return; }
  btn.disabled=true;
  const res=await req("/admin/venues/"+encodeURIComponent(v.id),{ method:"PATCH", body:JSON.stringify(body) });
  btn.disabled=false;
  if(!res.ok){
    if(badEmail(res)){ invalid(q("#ve_email"), BAD_EMAIL); return; }
    failToast(res, res.status===404?"This venue no longer exists — refreshing":"Could not save");
    if(res.status===404){ closeDialog(); refreshVenues(); }
    return; }
  closeDialog();
  toast(emailChanged?(email?"Saved — email changed":"Saved — email removed"):"Saved"); refreshVenues();
}
// Restore refused (409 past_retention): the wedding's own deletion date has passed, so it would be erased again at once.
function showPastRetention(item, t, deleteAt){
  if(!item) return;
  let box=item.querySelector("[data-past]");
  if(!box){ box=document.createElement("div"); box.dataset.past=""; box.className="keybox note"; box.style.marginTop="8px"; item.querySelector(".grow").appendChild(box); }
  box.innerHTML=`<div>This wedding is past its deletion date${deleteAt?` (${esc(fmtDate(deleteAt))})`:""}. To bring it back, first add an exception for plan <span class="mono" style="word-break:break-all">${esc(t.planId)}</span> (Keep forever or extra days) in «After the wedding», then restore.</div>
    <div class="row fw" style="margin-top:8px"><button class="btn sm primary" data-t="keeprestore">Add keep-forever exception and restore</button></div>`;
}
// Weddings the venue deleted: 14 days in the trash; only the admin restores (when the venue asks) or erases them now.
function openTrash(v){
  const d=openDialog(`${dlgHead(`Deleted weddings — ${esc(v.name)}`)}
    <div class="dbody"><div class="empty">Loading…</div></div>
    <div class="dfoot"><button class="btn" data-dclose>Close</button></div>`);
  d.dataset.ctx="trash:"+v.id;
  loadTrash(v, d);
}
async function loadTrash(v, d){
  const ctx="trash:"+v.id;
  const res=await req("/admin/venues/"+encodeURIComponent(v.id)+"/trash");
  if(!d.open || d.dataset.ctx!==ctx) return;
  const body=d.querySelector(".dbody"); if(!body) return;
  if(!res.ok || !res.d){ if(res.status!==403) body.innerHTML=`<div class="empty">${res.status===404?"This venue no longer exists.":"Could not load the deleted weddings — try again."}</div>`; return; }
  const list=(res.d.trash||[]).slice().sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0));
  body.innerHTML=`<p class="muted" style="margin:0 0 14px">The venue deleted these weddings. Each is erased for good 14 days after it was deleted. Only you can bring one back — and only when the venue asks.</p>`
    +(list.length ? list.map(t=>`<div class="titem" data-pid="${esc(t.planId)}">
        <div class="grow"><strong>${esc(t.label||"Untitled")}</strong>
          <div class="muted">Wedding: ${t.date?esc(fmtYmd(t.date)):"no date"} · deleted ${esc(fmtDateTime(t.deletedAt))}</div>
          <div class="muted">Erased for good on ${esc(fmtDate(t.purgeAt))} (${esc(relTime(t.purgeAt))})</div></div>
        <div class="row acts"><button class="btn sm" data-t="restore">Restore…</button><button class="btn sm danger" data-t="erase">Erase now…</button></div>
      </div>`).join("") : `<div class="empty">No deleted weddings.</div>`);
  body.onclick=async e=>{
    const btn=e.target.closest("button[data-t]"); if(!btn) return;
    const item=btn.closest("[data-pid]"), t=list.find(x=>x.planId===(item&&item.dataset.pid)); if(!t) return;
    const path="/admin/venues/"+encodeURIComponent(v.id)+"/trash/"+encodeURIComponent(t.planId);
    const label=t.label||"Untitled";
    if(btn.dataset.t==="restore"){
      if(!confirm(`Only restore when the venue asked you to.\n\nRestore "${label}"? It goes back into the console of ${v.name}.`)) return;
      btn.disabled=true; const r=await req(path+"/restore",{ method:"POST", body:"{}" }); btn.disabled=false;
      if(r.status===409 && r.d && r.d.error==="past_retention"){ showPastRetention(item, t, r.d.deleteAt); return; }
      if(!r.ok){ failToast(r, r.status===410?"It can no longer be restored":r.status===404?"It is no longer in the trash":"Restore failed"); }
      else toast(`"${label}" restored`);
    } else if(btn.dataset.t==="keeprestore"){
      // The wedding is past its after-the-wedding deletion date: keep it forever first (an existing exception keeps its other parts), then restore.
      if(!confirm(`Keep "${label}" forever and restore it?\n\nThis adds a «Keep forever» exception for plan ${t.planId}; you can remove it later under «After the wedding».`)) return;
      btn.disabled=true;
      const ex=((settingsCache&&settingsCache.planExceptions)||[]).find(x=>x.planId===t.planId)||{};
      const ret={ ...(ex.lockAfter!=null?{ lockAfter:ex.lockAfter }:{}), keep:true };
      const p=await req("/admin/plans/"+encodeURIComponent(t.planId)+"/retention",{ method:"PUT", body:JSON.stringify(ret) });
      if(!p.ok){ btn.disabled=false; failToast(p, p.status===404?"It is no longer in the trash":"Could not add the exception — nothing was restored"); if(p.status!==403){ refreshVenues(); loadTrash(v, d); } return; }
      refreshSettings();
      const r=await req(path+"/restore",{ method:"POST", body:"{}" }); btn.disabled=false;
      if(!r.ok){ failToast(r, r.status===410?"It can no longer be restored (the keep-forever exception was added)":r.status===404?"It is no longer in the trash":"The exception was added, but the restore failed — try «Restore…» again"); }
      else toast(`"${label}" kept forever and restored`);
    } else if(btn.dataset.t==="erase"){
      if(!confirm(`Erase "${label}" now?\n\nThe plan, its guest list and its history are deleted for good. This cannot be undone.`)) return;
      btn.disabled=true; const r=await req(path,{ method:"DELETE" }); btn.disabled=false;
      if(!r.ok){ failToast(r, "Erase failed"); }
      else toast(`"${label}" erased`);
    }
    refreshVenues(); loadTrash(v, d);
  };
}
function onRowAction(){ return async e=>{
  const btn=e.target.closest("button[data-a]"); if(!btn) return;
  const tr=btn.closest("tr"); if(!tr) return;
  const id=tr.dataset.id; const v=venuesCache.find(x=>x.id===id); if(!v) return;
  const path="/admin/venues/"+encodeURIComponent(id);
  if(btn.dataset.a==="key"){
    btn.disabled=true; const res=await req(path); btn.disabled=false;
    if(!res.ok || !res.d){ failToast(res, "Failed"); return; }
    if(res.d.key){ showVenueKey(v, res.d.key, "current"); copySilently(res.d.key, "Key copied"); }
    else showVenueOwnKey(v);
  }
  else if(btn.dataset.a==="edit") openVenueEdit(v);
  else if(btn.dataset.a==="trash") openTrash(v);
  else if(btn.dataset.a==="invoiced"){
    btn.disabled=true; const res=await req(path+"/invoiced",{method:"POST",body:"{}"}); btn.disabled=false;
    if(res.ok){ toast("Marked as invoiced"); refreshVenues(); }
    else failToast(res, res.status===404?"This venue no longer exists":"Failed"); }
  else if(btn.dataset.a==="toggle"){
    btn.disabled=true; const res=await req(path,{method:"PATCH",body:JSON.stringify({active:!v.active})}); btn.disabled=false;
    if(res.ok){ toast(v.active?"Disabled":"Enabled"); refreshVenues(); } else failToast(res, "Failed"); }
  else if(btn.dataset.a==="del"){
    const n=v.weddingCount||0;
    if(!confirm(`Permanently delete venue "${v.name}"?\n\nThe venue, all its weddings (${n}) and its template are erased — plans, guest lists and history. Nothing stays and this cannot be undone.`)) return;
    btn.disabled=true; const res=await req(path,{method:"DELETE"}); btn.disabled=false;
    if(res.ok){ const p=document.getElementById("vpanel"); if(p && p.dataset.vid===id){ p.innerHTML=""; delete p.dataset.vid; }
      toast("Deleted"); refreshVenues(); refreshSupport(); }
    else failToast(res, "Failed"); }
}; }

// ---------------------------------------------------------------- after the wedding: global default + plan exceptions
async function refreshSettings(){
  if(!document.getElementById("gbox")) return;
  const res=await req("/admin/settings");
  const gbox=document.getElementById("gbox"), xlist=document.getElementById("xlist"); if(!gbox || !xlist) return;
  if(!res.ok || !res.d){ if(res.status!==403){ gbox.innerHTML=`<div class="empty">Could not load the settings — reload the page.</div>`; xlist.innerHTML=""; } return; }
  settingsCache={ retention:res.d.retention||{}, planExceptions:Array.isArray(res.d.planExceptions)?res.d.planExceptions:[] };
  renderGlobal(); renderExceptions();
}
function renderGlobal(){
  const box=document.getElementById("gbox"); if(!box) return;
  const g=globalRet();
  box.innerHTML=`<label class="chk"><input type="checkbox" id="glock"${g.lockAfter?" checked":""}> Plans become view-only the day after the wedding</label>
    <div class="row fw" style="margin-top:12px;font-size:14px">Delete <input type="number" class="inl" id="gdays" min="0" max="${MAX_KEEP_DAYS}" value="${esc(g.keepDays)}"> days after the wedding</div>
    <div class="muted" style="margin-top:8px">Until then anyone with access can still open the plan and download its PDF. A plan without a wedding date counts as over 18 months after it was made.</div>
    <div class="row fw" style="margin-top:14px"><button class="btn primary" id="gsave">Save</button></div>`;
  document.getElementById("gsave").onclick=saveGlobal;
}
async function saveGlobal(){
  const btn=document.getElementById("gsave"), el=document.getElementById("gdays"); if(!btn || btn.disabled) return;
  const n=el.value.trim()===""?NaN:Number(el.value), lockAfter=document.getElementById("glock").checked, g=globalRet();
  if(!Number.isInteger(n) || n<0 || n>MAX_KEEP_DAYS){ invalid(el, `Enter the number of days (0–${MAX_KEEP_DAYS})`); return; }
  if(n===g.keepDays && lockAfter===g.lockAfter){ toast("Nothing changed"); return; }
  if(n<g.keepDays && !confirm(`Delete plans ${daysText(n)} after the wedding instead of ${daysText(g.keepDays)}?\n\nPlans whose wedding was more than ${daysText(n)} ago are deleted at the next hourly check (unless they have their own setting). This cannot be undone.`)) return;
  btn.disabled=true;
  const res=await req("/admin/settings",{ method:"PUT", body:JSON.stringify({ retention:{ keepDays:n, lockAfter } }) });
  btn.disabled=false;
  if(!res.ok || !res.d){ failToast(res, "Could not save the settings"); return; }
  settingsCache={ ...(settingsCache||{}), retention:res.d.retention||{ keepDays:n, lockAfter } };
  renderGlobal(); toast("Saved");
}
function exceptionRule(x){ return retentionText(x) || "—"; }
function exceptionsHtml(list){
  if(!list.length) return `<div class="empty">No exceptions — every plan follows the rules above (or its venue's / couple's).</div>`;
  return `<table class="cards"><thead><tr><th>Plan</th><th>Rule</th><th>Wedding</th><th>Owner</th><th></th></tr></thead><tbody>
    ${list.map(x=>`<tr data-pid="${esc(x.planId)}">
      <td><span class="mono" style="font-size:12.5px;word-break:break-all">${esc(x.planId)}</span></td>
      <td data-l="Rule">${esc(exceptionRule(x))}</td>
      <td data-l="Wedding">${x.weddingDate?esc(fmtYmd(x.weddingDate)):`<span class="muted">no date</span>`}</td>
      <td data-l="Owner">${x.owner==="venue"?`<span class="badge season">Venue</span>`:x.owner==="couple"?`<span class="badge per">Couple</span>`:`<span class="badge off">${esc(x.owner||"—")}</span>`}</td>
      <td class="acts-cell"><div class="row acts"><button class="btn sm danger" data-x="remove">Remove</button></div></td>
    </tr>`).join("")}</tbody></table>`;
}
function renderExceptions(){
  const box=document.getElementById("xlist"); if(!box) return;
  const list=(settingsCache&&settingsCache.planExceptions)||[];
  box.innerHTML=exceptionsHtml(list);
  const n=document.getElementById("xcount"); if(n) n.textContent=list.length?`(${list.length})`:"";
}
// A pasted planner link (…?plan=<id>#…) or a bare plan id → the id; "" if neither.
function planIdFrom(s){
  s=String(s||"").trim(); if(!s) return "";
  let id="";
  try{ id=new URL(s).searchParams.get("plan")||""; }catch(e){}
  if(!id){ const m=/[?&]plan=([^&#\s]+)/.exec(s); if(m){ try{ id=decodeURIComponent(m[1]); }catch(e){ id=m[1]; } } }
  if(!id && /^[A-Za-z0-9_-]{6,64}$/.test(s)) id=s;
  return /^[A-Za-z0-9_-]{6,64}$/.test(id)?id:"";
}
function wireExceptionForm(){
  const q=id=>document.getElementById(id);
  const upd=()=>{ q("xmore").disabled=q("xkeep").checked; q("xdays").disabled=q("xkeep").checked; };
  q("xkeep").addEventListener("change",upd);
  q("xdays").addEventListener("input",()=>{ if(q("xdays").value!=="") q("xmore").checked=true; });
  q("xmore").addEventListener("change",()=>{ if(q("xmore").checked) q("xdays").focus(); });
  q("xplan").addEventListener("keydown",e=>{ if(e.key==="Enter") addException(); });
  q("xadd").onclick=addException; upd();
}
async function addException(){
  const q=id=>document.getElementById(id), btn=q("xadd"); if(!btn || btn.disabled) return;
  const pid=planIdFrom(q("xplan").value);
  if(!pid){ invalid(q("xplan"), "Paste a plan link (with ?plan=…) or a plan id"); return; }
  const body={};
  if(q("xkeep").checked) body.keep=true;
  if(q("xedit").checked) body.lockAfter=false;
  if(!body.keep && q("xmore").checked){
    const n=q("xdays").value.trim()===""?NaN:Number(q("xdays").value);
    if(!Number.isInteger(n) || n<0 || n>MAX_KEEP_DAYS){ invalid(q("xdays"), `Enter the number of days (0–${MAX_KEEP_DAYS})`); return; }
    body.keepDays=n;
  }
  if(!Object.keys(body).length){ toast("Choose what the exception does"); return; }
  const had=((settingsCache&&settingsCache.planExceptions)||[]).some(x=>x.planId===pid);
  if(had && !confirm(`Plan ${pid} already has an exception. Replace it?`)) return;
  btn.disabled=true;
  const res=await req("/admin/plans/"+encodeURIComponent(pid)+"/retention",{ method:"PUT", body:JSON.stringify(body) });
  btn.disabled=false;
  if(!res.ok || !res.d){ failToast(res, res.status===404?"No plan with that id — check the link":"Could not save the exception"); return; }
  const L=res.d.life||{};
  q("xplan").value=""; q("xdays").value=""; ["xkeep","xedit","xmore"].forEach(id=>q(id).checked=false); q("xmore").disabled=false; q("xdays").disabled=false;
  toast(L.keep?"Exception saved — the plan is kept":L.deleteAt?"Exception saved — deleted on "+fmtDate(L.deleteAt):"Exception saved");
  refreshSettings();
}
async function onExceptionAction(e){
  const btn=e.target.closest("button[data-x]"); if(!btn) return;
  const tr=btn.closest("tr"); if(!tr) return;
  const pid=tr.dataset.pid;
  if(btn.dataset.x==="remove"){
    if(!confirm(`Remove the exception for plan ${pid}?\n\nThe plan follows the normal rules again — if its wedding is long past, it may be deleted at the next hourly check.`)) return;
    btn.disabled=true;
    const res=await req("/admin/plans/"+encodeURIComponent(pid)+"/retention",{ method:"DELETE" });
    btn.disabled=false;
    if(!res.ok){ failToast(res, res.status===404?"That plan no longer exists":"Could not remove the exception"); if(res.status===404) refreshSettings(); return; }
    toast("Exception removed"); refreshSettings();
  }
}

// ---------------------------------------------------------------- admin access: the recovery address and the mailed key
// GET /admin/owner → {email, emailVerified, pending, lang, hasRecoveryKey, keyAt, mail}. `email` is the live recovery
// address (confirmed from that mailbox); `pending` is an address that was asked for and is still waiting for its link
// to be opened — it counts for nothing until then.
let ownerCache=null;
async function refreshOwner(){
  if(!document.getElementById("obox")) return;
  const res=await req("/admin/owner");
  const box=document.getElementById("obox"); if(!box) return;
  if(!res.ok || !res.d){ if(res.status!==403) box.innerHTML=`<div class="empty">Could not load the recovery settings — reload the page.</div>`; return; }
  ownerCache=res.d; renderOwner();
}
function renderOwner(note){
  const o=ownerCache||{}, box=document.getElementById("obox"); if(!box) return;
  const live=o.email||"", pend=o.pending||"", mailOff=o.mail===false;
  // Three honest states: nothing set · an address confirmed from its own mailbox · a confirmation still waiting.
  const liveHtml = live
    ? `<span class="mono">${esc(live)}</span>${o.emailVerified
        ? ` <span class="vok" title="Confirmed — the link sent to it was opened">✓</span>`
        : ` <span class="badge warn">not confirmed</span>`}`
    : `<span class="muted">none set</span>`;
  box.innerHTML=`
    <p class="lead" style="margin:0 0 14px">If you ever lose the admin key, a one-hour link to a new one is e-mailed to the recovery address — nowhere else, and only once that address has been confirmed from its own mailbox.</p>
    <div class="row between fw" style="gap:10px;align-items:flex-end">
      <div style="min-width:0"><label>Recovery address</label>
        <div style="overflow-wrap:anywhere">${liveHtml}</div></div>
      <button class="btn sm" id="oedit"${mailOff&&!live?" title=\"Email is off — an address that cannot be confirmed is refused\"":""}>${live?"Change…":"Set an address…"}</button>
    </div>
    ${pend?`<div class="keybox note" style="margin-top:12px">
        <div style="font-weight:700">Waiting for confirmation at <span class="mono" style="overflow-wrap:anywhere">${esc(pend)}</span></div>
        <div class="muted" style="margin-top:4px">It counts for nothing until the link in that email is opened: the current recovery address is still ${live?`<span class="mono">${esc(live)}</span>`:"none"} — ${live?"a new admin key would go there, not to the address above":"until this one is confirmed, a lost admin key cannot be recovered by email at all"}. The confirmation link is valid for one day.</div>
        <div class="row fw" style="margin-top:8px"><button class="btn sm" id="oresend">Send the confirmation again</button>
          <span class="muted">Removing the recovery address drops the pending one too.</span></div>
      </div>`:""}
    ${mailOff?`<div class="mailbar" style="margin-top:12px">Email is off — no confirmation and no recovery link can be sent, so no recovery address can be set. Set <span class="mono">SMTP_*</span> in <span class="mono">server.env</span>. Until then the <span class="mono">OWNER_KEY</span> there is the only way in. (Removing an address still works.)</div>`:""}
    <div class="subh">Recovered key</div>
    ${o.hasRecoveryKey
      ? `<div class="row between fw" style="gap:10px;align-items:flex-start">
           <div style="min-width:0"><span class="badge warn">Active since ${esc(fmtDateTime(o.keyAt))}</span>
             <div class="muted" style="margin-top:4px">A key issued through a recovery link is in use. Revoking it leaves only the <span class="mono">OWNER_KEY</span> from <span class="mono">server.env</span> — so you have to be signed in with that <span class="mono">OWNER_KEY</span> to revoke it, not with the recovered key itself.</div></div>
           <button class="btn sm danger" id="orevoke">Revoke recovered key</button></div>`
      : `<div class="muted">No recovered key — only the <span class="mono">OWNER_KEY</span> in <span class="mono">server.env</span> opens this console.</div>`}
    <div id="onote">${note||""}</div>`;
  const e=document.getElementById("oedit"); if(e) e.onclick=editOwnerEmail;
  const s=document.getElementById("oresend"); if(s) s.onclick=()=>putOwnerEmail(pend, "oresend", true);
  const r=document.getElementById("orevoke"); if(r) r.onclick=revokeOwnerKey;
}
function ownerNote(html){ const n=document.getElementById("onote"); if(n) n.innerHTML=`<div class="keybox note" style="margin-top:12px">${html}</div>`; }
async function editOwnerEmail(){
  const o=ownerCache||{};
  const next=prompt("Recovery address for the admin key — the only address a recovery link ever goes to. A confirmation link is sent to it; it counts only once that link is opened. (Leave empty to remove.)", o.email||"");
  if(next==null) return;
  const email=next.trim();
  if(email && email.toLowerCase()===(o.email||"").toLowerCase()){ toast("That is already the recovery address"); return; }
  if(!email && !(o.email||o.pending)){ toast("There is no recovery address to remove"); return; }
  if(email && !EMAIL_OK(email)){ toast(BAD_EMAIL); return; }
  const lines=[email?(o.email?"Ask to change the recovery address?":"Ask to set the recovery address?"):"Remove the recovery address?", "",
    `Now: ${o.email||"(none)"}`, `${email?"Asking for":"To"}: ${email||"(none)"}`, ""];
  if(email){
    lines.push("A confirmation link goes to the new address. Nothing changes until that link is opened — until then the recovery address stays "+(o.email||"(none)")+".");
    if(o.pending && o.pending!==email) lines.push("", "The confirmation waiting at "+o.pending+" is replaced.");
  }else{
    lines.push("It is removed at once — no confirmation needed.");
    if(o.pending) lines.push("A confirmation waiting at "+o.pending+" is dropped too.");
    lines.push("Any recovery link already sent stops working.", "", "Without an address the only way in is the OWNER_KEY in server.env.");
  }
  if(!confirm(lines.join("\n"))) return;
  putOwnerEmail(email, "oedit", false);
}
// PUT /admin/owner {email}: asks for a confirmation (or removes the address when empty). It never makes an address live.
async function putOwnerEmail(email, btnId, resend){
  const btn=document.getElementById(btnId); if(btn){ if(btn.disabled) return; btn.disabled=true; }
  const res=await req("/admin/owner",{ method:"PUT", body:JSON.stringify({ email }) });
  const b2=document.getElementById(btnId); if(b2) b2.disabled=false;
  if(!res.ok || !res.d){
    const err=(res.d&&res.d.error)||"";
    if(res.status===403) return;   // already back at the sign-in screen
    if(err==="mail_off"){ ownerNote(`Email is off on the server, so no confirmation link can be sent — and an address nobody can confirm is refused outright. Set <span class="mono">SMTP_*</span> in <span class="mono">server.env</span>, then try again. Nothing changed.`); toast("Email is off — nothing changed"); return; }
    if(err==="mail_failed"){ ownerNote(`The confirmation could not be sent — the mail server refused it. Check the <span class="mono">SMTP_*</span> settings in <span class="mono">server.env</span>, then try again. Nothing changed.`); toast("The confirmation could not be sent"); return; }
    if(res.status===429){ ownerNote(`Too many confirmation emails to that address — try again in a little while. Nothing changed.`); toast(RATE_MSG); return; }
    if(badEmail(res)){ toast(BAD_EMAIL); return; }
    failToast(res, "Could not save the recovery address"); return;
  }
  ownerCache={ ...(ownerCache||{}), email:res.d.email||"", emailVerified:!!res.d.emailVerified, pending:res.d.pending||"",
    lang:res.d.lang||(ownerCache&&ownerCache.lang)||"", hasRecoveryKey:!!res.d.hasRecoveryKey, keyAt:res.d.keyAt||null, mail:res.d.mail };
  if(email){
    renderOwner();
    ownerNote(`A confirmation link was sent to <span class="mono" style="overflow-wrap:anywhere">${esc(res.d.pending||email)}</span>. Open it from that mailbox — the address becomes the recovery address only then, and the link is valid for one day.`);
    toast(resend?"Confirmation sent again":"Confirmation link sent");
  }else{
    renderOwner(); toast("Recovery address removed");
  }
}
async function revokeOwnerKey(){
  const o=ownerCache||{};
  if(!confirm(`Revoke the recovered admin key?\n\nThe key issued on ${fmtDateTime(o.keyAt)} stops working at once — if you signed in with it, this browser is signed out too.\n\nOnly the OWNER_KEY in server.env will open this console. Revoking works only while you are signed in with that OWNER_KEY. This cannot be undone.`)) return;
  const btn=document.getElementById("orevoke"); if(btn) btn.disabled=true;
  const res=await req("/admin/owner/key",{ method:"DELETE" });
  const b2=document.getElementById("orevoke"); if(b2) b2.disabled=false;
  if(res.status===409 && res.d && res.d.error==="would_lock_out"){
    // The server only accepts this from the env key itself, so that revoking can never leave nobody with a way in.
    ownerNote(`Nothing was revoked: this request did not come from the <span class="mono">OWNER_KEY</span> in <span class="mono">server.env</span>.
      Most likely you are signed in with the recovered key — sign out and sign in with the <span class="mono">OWNER_KEY</span> from <span class="mono">server.env</span>, then revoke.
      If there is no <span class="mono">OWNER_KEY</span> set there at all (or it no longer matches the file), this recovered key is the only way in and cannot be revoked until one is set.`);
    toast("Sign in with the OWNER_KEY to revoke it"); return;
  }
  if(!res.ok || !res.d){ failToast(res, "Could not revoke the key"); return; }
  ownerCache={ ...(ownerCache||{}), hasRecoveryKey:false, keyAt:null };
  renderOwner(); toast("Recovered key revoked");
}

async function load(silent){
  if(!getKey()){ renderLogin(); return; }
  if(!silent) app.innerHTML=`<div class="muted" style="text-align:center;padding:40px">Loading…</div>`;
  const mailP=fetchMail();
  let r; try{ r=await api("/admin/venues"); }catch(e){ renderLogin("Connection error."); return; }
  if(r.status===403){ setKey(""); renderLogin("Wrong owner key."); return; }
  if(r.status===503){ renderLogin("Admin is disabled — set the OWNER_KEY secret on the server first."); return; }
  if(!r.ok){ renderLogin("Something went wrong."); return; }
  const d=await r.json(); mailInfo=await mailP; renderDashboard((d.venues||[]).sort(byNewest));
  try{ localStorage.setItem("weddingOwnerDevice","1"); }catch(e){}   // not a secret: this device's own plans skip the free 8-table limit (the lab stays capped)
}
// New invitations may arrive while the tab is in the background.
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && getKey() && document.getElementById("supList")) refreshSupport(); });
// A mailed link (#recover=… / #verify=…) takes over before anything is loaded with the key this browser may still
// have — also when the link is opened in a tab that already has this page (only the fragment changes, nothing reloads).
window.addEventListener("hashchange",()=>{ linkFromHash(); });
if(!linkFromHash()) load();
</script>
