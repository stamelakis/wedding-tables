  .mrow{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .modal .mlab{ font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:10px 2px 5px; }
  .csvt-wrap{ overflow-x:auto; margin-top:8px; }
  .csvt{ width:100%; border-collapse:collapse; font-size:12px; }
  .csvt th{ text-align:left; color:var(--faint); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:4px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .csvt td{ padding:4px 6px; border-bottom:1px solid var(--line); max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .csvsum{ font-size:13px; margin-top:10px; line-height:1.45; }
  .csvsum .muted{ color:var(--soft); font-size:12px; }
  #csvModal .mrow{ position:sticky; bottom:0; background:var(--card); margin:0 -16px; padding:10px 16px 12px; border-top:1px solid var(--line); }
  #importModal .mrow{ position:sticky; bottom:0; background:var(--card); margin:0 -16px; padding:10px 16px 12px; border-top:1px solid var(--line); }   /* Load / Choose file stay reachable while the mode list scrolls */
  .imodes{ display:flex; flex-direction:column; gap:4px; }
  .imode{ display:flex; gap:8px; align-items:flex-start; padding:6px 9px; border:1px solid var(--line); border-radius:9px; cursor:pointer; font-size:13px; background:var(--card); }
  .imode[hidden]{ display:none; }   /* display:flex would beat the hidden attribute */
  .imode input{ margin:3px 0 0; flex:none; }
  .imode b{ display:block; font-weight:600; }
  .imode small{ display:block; color:var(--soft); font-size:11.5px; line-height:1.35; }
  .imode:has(input:checked){ border-color:var(--accent); background:var(--accent-soft); }
  .mrow .ibtn{ flex:1; min-width:120px; height:38px; }
  .ibtn.busy::before{ content:""; width:13px; height:13px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .8s linear infinite; flex:none; }   /* waiting for the server (PDF) */
  @keyframes spin{ to{ transform:rotate(360deg); } }
  /* help & contact sheet */
  .hl-hours{ font-size:14px; line-height:1.5; margin:0 0 4px; }
  .hl-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 4px; }
  .hl-grid .ibtn{ height:42px; text-decoration:none; color:var(--ink); font-size:14px; }
  .hl-grid .ibtn.wide{ grid-column:1 / -1; }
  .hl-legal{ font-size:12.5px; color:var(--soft); margin-top:12px; }
  .hl-legal a{ color:var(--accent-ink); }
  .hist{ display:flex; flex-direction:column; gap:6px; padding:10px 16px 16px; }
  .hrow{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; }
  .hrow>div{ flex:1; min-width:0; }
  .hrow .muted{ font-size:12px; color:var(--faint); }
  .decor-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px; padding:16px; }
  .decor-item{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 8px; border:1px solid var(--line); border-radius:12px; cursor:pointer; text-align:center; font-size:12px; background:var(--card); transition:.1s; }
  .decor-item:hover{ background:var(--paper); border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-1); }
  .decor-item .di{ font-size:28px; line-height:1; }
  /* ---------- Guided tour ---------- */
  #tour{ position:fixed; inset:0; z-index:500; }
  #tour[hidden]{ display:none; }
  #tourBack{ position:absolute; inset:0; }
  #tourSpot{ position:fixed; border-radius:12px; box-shadow:0 0 0 9999px rgba(20,14,10,.62); outline:2px solid rgba(255,255,255,.95); pointer-events:none; transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease; z-index:1; }
  #tourCard{ position:fixed; z-index:2; background:var(--card); border-radius:16px; padding:16px 18px 14px; box-shadow:0 20px 60px rgba(0,0,0,.45); max-width:400px; }
  #tourCard .tour-step{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:700; }
  #tourCard .tour-x{ position:absolute; top:8px; right:8px; width:32px; height:32px; border:none; background:none; color:var(--faint); font-size:18px; cursor:pointer; border-radius:8px; }
  #tourCard .tour-x:hover{ background:var(--paper); color:var(--ink); }
  #tourCard h3{ font-family:var(--serif); font-size:20px; margin:4px 0 8px; line-height:1.2; }
  #tourCard p{ font-size:14px; line-height:1.5; color:var(--soft); margin:0 0 14px; }
  #tourCard p b{ color:var(--ink); }
  #tourCard h3.tour-welcome{ font-size:24px; margin:0 0 10px; text-align:center; }
  .tour-lines{ list-style:none; margin:0 0 16px; padding:0; counter-reset:w; }
  .tour-lines li{ counter-increment:w; position:relative; padding:5px 0 5px 32px; font-size:15px; line-height:1.45; color:var(--ink); }
  .tour-lines li::before{ content:counter(w); position:absolute; left:0; top:5px; width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink); font-size:12px; font-weight:700; text-align:center; line-height:22px; }
  .tour-btns{ display:flex; gap:8px; align-items:center; }
  .tour-btns .ibtn{ height:38px; }
  .tour-btns .spacer{ flex:1; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2a2622; color:#fff; padding:9px 16px; border-radius:10px; font-size:13px; opacity:0; transition:.3s; z-index:400; pointer-events:none; max-width:92vw; text-align:center; }
  .toast.show{ opacity:.96; }
  /* one-time tips: a small dark card under the app bar, top-right — never a modal, never in the way of the keyboard */
  #tip{ position:fixed; top:calc(var(--appbar-h) + 10px); right:10px; z-index:290; max-width:min(320px, calc(100vw - 20px)); background:#2a2622; color:#fff; border-radius:12px; padding:10px 8px 10px 12px; display:flex; gap:8px; align-items:flex-start; font-size:13px; line-height:1.4; box-shadow:0 8px 26px rgba(0,0,0,.3); animation:tipIn .25s ease-out; }
  #tip[hidden]{ display:none; }
  #tip .ic{ stroke:#f2d27a; width:20px; height:20px; margin-top:1px; }
  #tip .tt{ flex:1; }
  #tip .ta{ border:none; background:rgba(255,255,255,.16); color:#fff; border-radius:999px; padding:5px 11px; font-size:12.5px; cursor:pointer; white-space:nowrap; align-self:center; }
  #tip .tx{ border:none; background:none; color:#c9c2b8; font-size:14px; cursor:pointer; padding:0 4px; line-height:1; }
  #tip a{ color:#f2d27a; font-weight:700; text-decoration:underline; white-space:nowrap; }   /* the lab's "up to 8 tables" note links to the pricing */
  @keyframes tipIn{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:none; } }
  @media (min-width:901px){ #tip{ right:auto; left:calc(50% - 170px); width:340px; } }   /* PC: over the floor, not over the side panels */

  /* ---------- Mobile ---------- */
  @media (max-width:1180px){ #appbar .stat{ display:none; } }
  @supports (height:1dvh){ :root{ --sheet-h:46dvh; } }
  @media (max-width:900px){
    body{ height:100dvh; }
    #appbar{ padding:0 8px; gap:6px; }
    #appbar .brand, #appbar .stat, #appbar .ctl.font, #appbar #printBtn, #appbar .langsel{ display:none; }
    #appbar .ctl.zoom .lbl, #appbar #zoomIn, #appbar #zoomOut{ display:none; }
    #labBadge{ font-size:10px; padding:2px 7px; }
    #navBtn{ display:inline-flex; }
    /* the plan name (the couple's names) gets the whole middle of the bar with a real ellipsis; the native select sits
       invisibly on top so a tap still opens the phone's own picker */
    #appbar .spacer{ display:none; }   /* the plan name takes every free pixel of the bar on a phone */
    .planpick{ flex:1; position:relative; min-width:0; }
    .planpick .planname{ display:flex; align-items:center; gap:2px; flex:1; min-width:0; height:32px; padding:0 2px 0 6px; font-family:var(--serif); font-weight:700; font-size:16px; }
    .planname .txt{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .planname .ic{ width:16px; height:16px; opacity:.55; }
    .planpick select{ position:absolute; inset:0; width:100%; height:100%; max-width:none; min-width:0; opacity:0; }
    #cloudTxt{ display:none; }
    #profNew, #profMore, #zoomFit{ display:none; }
    /* iOS zooms the page when a focused field is under 16px — keep every field at 16px on phones */
    input, select, textarea{ font-size:16px !important; }
    /* the guest drawer must sit above the seat sheet (160) so the pool stays reachable while a table is open */
    #sidebar{ position:fixed; left:0; top:0; bottom:0; width:88vw; max-width:360px; z-index:180; transform:translateX(-100%); transition:transform .22s ease; box-shadow:0 0 40px rgba(0,0,0,.3); }
    #navScrim{ z-index:170; }
    body.nav-open #sidebar{ transform:none; }
    body.nav-open #navScrim{ display:block; }
    .side-scroll{ padding-bottom:env(safe-area-inset-bottom); display:flex; flex-direction:column; }
    .side-scroll>.sec{ flex:none; }
    /* the sidebar IS the drawer, so the invitations arrive here unchanged — only reach, keyboard and touch size differ */
    /* NO bottom:var(--kb) here. `body.kb .side-scroll` already pads the scroller by the keyboard's height, and a
       second inset subtracted it twice: with a 336 px keyboard the bar landed at y 79–140, over the invitation
       header and the first rows, instead of 415–476 just above the keyboard. Measured, both values. */
    #invFoot{ order:3; padding-bottom:calc(8px + env(safe-area-inset-bottom)); }
    /* min-width:0 or a flex item never shrinks below its text: «Όλα τα προσκλητήρια» pushed [Τέλος] off the panel */
    #invFoot .ibtn{ flex:1; min-width:0; height:44px; justify-content:center; }
    #invFoot .ibtn>span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #invFoot .ibtn.primary{ flex:none; padding:0 20px; }
    body.invlist .side-scroll>.sec, body.invfill .side-scroll>.sec{ flex:1; }   /* the Guests section owns the drawer */
    /* the A–Z rail: one thumb, 80 invitations or 300 names */
    #invRail{ position:absolute; right:1px; top:var(--invcap-top,108px); bottom:64px; width:18px; z-index:7;
      display:flex; flex-direction:column; justify-content:center; align-items:center; touch-action:none;
      font-size:9px; font-weight:700; color:var(--faint); user-select:none; }
    #invRail[hidden]{ display:none !important; }   /* an author display: wins over the attribute — say it explicitly */
    /* while the rail is up it owns the right edge: give the section its width back so no row ends under it */
    body.invrail .side-scroll>.sec{ padding-right:32px; }
    body.invrail #invHead, body.invrail #invSheet, body.invrail .search, body.invrail .invpickhead{ box-shadow:-14px 0 0 var(--card), 32px 0 0 var(--card); }
    /* the keyboard is up: band C's heading folds away (the search field above it already says what the list is)
       so the three tabs and four 44 px rows stay on screen */
    body.kb.invfill .invpickhead .invband{ display:none; }
    /* and the tabs fold to one line each, so the filter stays reachable without eating the rows he is ticking */
    body.kb.invfill #invSeg.seg button{ flex-direction:row; gap:5px; min-height:34px; }
    body.kb.invfill #invSeg.seg button .n{ font-size:12px; }
    /* 375 px: the row says the one thing this panel is about — whose invitation he is already in. The seat is in
       the row's title and in band B's «N με θέση»; keeping both here made every second row two lines tall. */
    .gchip.tickable .ann.both .a1, .gchip.tickable .ann.both .sep{ display:none; }
    .gchip.tickable{ row-gap:0; }                                   /* a wrapped annotation costs a line, not a line + a gap */
    .gchip.tickable .ann{ font-size:11px; line-height:1.3; }
    #invRail b{ display:block; line-height:1.05; padding:0 2px; font-weight:700; }
    #invRail.on{ color:var(--accent-ink); }
    body.kb #invRail{ display:none; }
    #toolsSec{ order:2; border-bottom:none; border-top:1px solid var(--line); }   /* phone: guests first, tools folded below (couples mostly get the venue's layout) */
    #addTableBtn.primary{ background:var(--card); color:var(--ink); border-color:var(--line); }   /* the drawer's one primary button is «Προσθήκη στη λίστα» */
    #stagewrap{ padding-bottom:calc(90px + env(safe-area-inset-bottom)); }
    body.focused #stagewrap{ padding-bottom:calc(var(--sheet-h) + 60px); }   /* room to scroll a low table above the sheet */
    #stage{ margin:12px; }
    #mobilebar{ display:flex; }
    body.focused #mobilebar, body.picking #mobilebar{ display:none; }
    #focus{ position:fixed; left:0; right:0; bottom:0; height:var(--sheet-h); width:auto; border-left:none; border-top:1px solid var(--line); border-radius:18px 18px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.25); z-index:160; transition:height .2s; padding-bottom:env(safe-area-inset-bottom); }
    #focus.tall{ height:88vh; height:min(88dvh, calc(100dvh - var(--appbar-h))); }
    .fhandle{ display:block; }
    .ffoot{ display:none; }   /* phone: fill/clear live under ⚙ — the rows get the space */
    .fhint{ padding:6px 14px 2px; font-size:13px; color:var(--soft); }
    /* a third line in the party bar cost a row of the very list he is ticking (3 of 12 seats left on screen):
       when an existing invitation is named, its line takes the selection count over and the hint line stands down */
    #partysel.found .pb1{ display:none; }
    #partysel.found .pbfound .ps{ display:inline; }
    .modal{ width:96vw; max-height:88vh; }
    #importText, #csvText{ height:80px !important; }
    .decor-grid{ grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; padding:12px; }
    #pickbar{ bottom:calc(14px + env(safe-area-inset-bottom)); }
    #pickbar .pbhint{ display:none; }
    #pickbar .pbname{ max-width:none; flex:1; }
    body.focused #pickbar{ bottom:calc(var(--sheet-h) + 10px); }
    .toast{ bottom:calc(70px + env(safe-area-inset-bottom)); }
    body.focused .toast, body.picking .toast{ bottom:calc(var(--sheet-h) + 12px); }
    /* on-screen keyboard: --kb = its height (syncKeyboard). The sheet sits on top of the
       keyboard and, while typing, owns everything above it; the drawer gets bottom padding so its fields can scroll up. */
    :root{ --kb:0px; }
    #focus{ bottom:var(--kb); }
    body.kb #focus{ height:calc(100dvh - var(--kb) - var(--appbar-h)); transition:none; }
    body.kb .side-scroll{ padding-bottom:calc(var(--kb) + env(safe-area-inset-bottom)); }
    body.kb .toast{ bottom:calc(var(--kb) + 12px); }
    body.touch .feature .rz, body.touch .feature .rot-h{ opacity:1; visibility:visible; }   /* no hover on touch — show decor handles */
    .ibtn{ height:36px; min-width:36px; }
    .tools .ibtn{ height:40px; }
    .gchip{ padding-top:9px; padding-bottom:9px; }
  }
  @media (max-width:420px){ #zoomFit{ padding:0 7px; font-size:12px; } }
  @media (max-width:900px){   /* phone: one flowing paragraph with the button at its end, ✕ in the corner — a low strip */
    #lifebar{ display:block; font-size:12.5px; padding:7px 34px 7px 10px; }
    #lifebar>.ic{ display:none; }
    #lifebar .lt{ display:inline; }
    #lifebar .ibtn{ display:inline-flex; height:26px; padding:0 9px; margin-left:6px; vertical-align:middle; font-size:12.5px; }
    #lifebar .lx{ position:absolute; right:6px; top:5px; }
    #lifebar .lcd{ display:inline-block; margin-left:6px; padding:0 8px; font-size:12px; }
  }

  /* ---------- Table chooser (overview ⇄ one table): a column right of the floor on PC, under the floor on phones.
     The right side is always "tables": this list when nothing is selected, the seat list when a table is. ---------- */
  #tablestrip{ display:flex; flex-direction:column; flex:none; width:176px; min-height:0; background:var(--card); border-left:1px solid var(--line); }
  body.focused #tablestrip{ display:none; }
  body.strip-collapsed .ts-grid{ display:none; }
  body.strip-collapsed #tablestrip{ width:auto; }
  .ts-head{ display:flex; align-items:center; gap:6px; padding:8px 10px; flex:none; flex-wrap:wrap; }
  .ts-head .ts-title{ font-family:var(--serif); font-size:15px; font-weight:700; color:var(--ink); }
  #tsAll{ border-color:transparent; background:transparent; color:var(--accent-ink); font-weight:600; }
  #tsToggle{ border-color:transparent; background:transparent; }
  .ts-head .ts-cnt{ font-size:12px; color:var(--soft); margin-right:auto; font-variant-numeric:tabular-nums; }
  .ts-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:6px; padding:0 10px 10px; overflow-y:auto; overscroll-behavior:contain; }
  .ts-chip{ border:none; border-radius:12px; padding:8px 4px 6px; text-align:center; background:var(--paper); cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; transition:background .1s,box-shadow .1s; }
  .ts-chip:hover{ background:#fff; box-shadow:0 0 0 1.5px var(--accent) inset; }
  .ts-chip.full{ background:#e9f2ea; }
  .ts-chip:active{ background:var(--accent-soft); }
  .ts-chip .lbl{ font-family:var(--serif); font-weight:700; font-size:18px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ts-chip .occ{ font-size:10.5px; color:var(--faint); margin-top:1px; font-variant-numeric:tabular-nums; }
  .ts-chip .bar{ height:3px; border-radius:2px; background:var(--line); margin-top:4px; overflow:hidden; }
  .ts-chip .bar i{ display:block; height:100%; background:var(--accent); }
  .ts-chip.full .bar i{ background:var(--good); }
  @media (max-width:900px){
    #main{ flex-direction:column; }
    /* overview: the canvas is sized to the fitted floor (layoutCanvas) and the list takes the rest;
       zoomed in: the canvas grows and the list shrinks to a strip */
    #tablestrip{ flex:1 1 auto; width:auto; border-left:none; border-top:1px solid var(--line); padding-bottom:calc(58px + env(safe-area-inset-bottom)); }
    body.strip-collapsed #tablestrip{ width:auto; }
    body.zoomed #tablestrip{ flex:0 1 auto; max-height:26vh; }
    body.zoomed #stagewrap{ flex:1 1 auto; }
    body.picking #tablestrip{ display:none; }
    #stagewrap{ padding-bottom:0; }
    body.picking.zoomed:not(.focused) #stagewrap{ padding-bottom:calc(70px + env(safe-area-inset-bottom)); }   /* room to scroll the bottom chairs above the pick bar */
    #appbar #viewBtn, #appbar #undoBtn, #appbar #redoBtn, #appbar #helpBtn{ display:none; }   /* they live in the bottom bar / ⋯ on phones */
  }

  /* ---------- Print ---------- */
  #printarea{ display:none; }
  @media print{
    html, body{ height:auto !important; overflow:visible !important; display:block !important;
      background:#fff !important; }   /* the app's beige paper must not flood every printed sheet ("Background graphics" on) */
    #appbar, #main, #mobilebar, #pickbar, .toast, .popover, .modal-back, #navScrim{ display:none !important; }
    #printarea{ display:block; position:static; width:100%; padding:0 10px; }
  }
  #printarea h2{ font-size:22px; margin:0 0 2px; font-family:var(--serif); }
  #printarea .pmeta{ color:#555; font-size:12.5px; margin:0 0 4px; }
  #printarea .psub{ color:#666; margin-bottom:14px; font-size:13px; }
  #printarea .ptables{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  #printarea .pcard{ border:1px solid #ccc; border-radius:8px; padding:10px 12px; break-inside:avoid; }
  #printarea .pcard h3{ font-size:15px; margin-bottom:6px; border-bottom:1px solid #eee; padding-bottom:4px; font-family:var(--serif); }
  #printarea .pcard ol{ margin-left:18px; font-size:12.5px; line-height:1.55; }
  #printarea .pcard .empty{ color:#bbb; }
  #printarea .punassigned{ margin-top:18px; font-size:12.5px; }
  #printarea .ptag{ color:#888; font-size:11px; }
  #printarea .pinvh{ font-family:var(--serif); font-size:16px; margin:22px 0 8px; page-break-before:auto; }
  #printarea .pinvs{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px 18px; font-size:12px; }
  #printarea .pinv{ break-inside:avoid; }
  #printarea .pinv b{ font-size:12.5px; }
  #printarea .pinv .n{ color:#888; }
  #printarea .pinv ul{ margin:2px 0 0 14px; padding:0; line-height:1.45; }
  #printarea .pinvl{ list-style:none; margin:0; padding:0; font-size:12.5px; line-height:1.6; }
  #printarea .pinvl .pn{ color:#888; font-size:11px; margin-left:4px; }
  #printarea .pinvh .psn{ font-family:var(--sans); font-size:11.5px; font-weight:400; color:#777; margin-left:8px; }
  /* A–Z — a real ruled table, one block per invitation, header repeated on every printed page */
  #printarea .palpha{ width:100%; table-layout:fixed; border-collapse:collapse; font-size:11px; line-height:1.28; }
  #printarea .palpha thead{ display:table-header-group; }          /* the column titles come back on page 2, 3, 4… */
  #printarea .palpha tr{ break-inside:avoid; page-break-inside:avoid; }
  /* A cell that spans rows across a page break is clipped or repeated by every browser, so a whole invitation stays
     on one sheet. `avoid` and not `avoid-page`: an invitation taller than A4 must still be allowed to break rather
     than vanish, which is what the stronger value costs. */
  #printarea .palpha tbody.pg{ break-inside:avoid; page-break-inside:avoid; }
  #printarea .palpha th{ text-align:left; font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:#333; background:#eee; border-bottom:1.4px solid #888; padding:3px 6px; overflow-wrap:anywhere; }
  #printarea .palpha td{ padding:1.8px 6px; border-bottom:1px solid #e6e6e6; vertical-align:top; overflow-wrap:anywhere; }
  #printarea .palpha th + th, #printarea .palpha td + td{ border-left:1px solid #e0e0e0; }   /* the columns read as columns */
  /* the left rule of the ΟΝΟΜΑ column, for the rows whose neighbour on the left is a cell spanned from above */
  #printarea .palpha td.cn{ border-left:1px solid #e0e0e0; }
  /* The stripe is per INVITATION, not per row: a cell spanning three rows can only carry one background, so
     striping the rows would cut a zebra line straight through the middle of it. Every other block is tinted. */
  #printarea .palpha tbody.alt td{ background:#f6f6f6; }
  #printarea .palpha tbody.pg + tbody.pg td{ border-top:1px solid #d9d9d9; }   /* where one invitation ends and the next begins */
  #printarea .palpha th, #printarea .palpha tbody.alt td{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  #printarea .palpha .ci{ width:30%; }
  #printarea .palpha .cn{ width:33%; }
  /* 11 %, and only the NUMBERS refuse to wrap: the German title "PERSONEN" ran into the next column at 9 % + nowrap */
  #printarea .palpha .cp{ width:11%; text-align:right; font-variant-numeric:tabular-nums; }
  #printarea .palpha td.cp{ white-space:nowrap; }
  #printarea .palpha .ct{ width:26%; }
  #printarea .palpha td.ci{ font-weight:700; }                    /* the invitation is the heading of its block */
  #printarea .palpha td.cn, #printarea .palpha td.cs{ font-weight:600; }
  #printarea .palpha td.ct{ color:#444; }
  #printarea .palpha .ast{ color:#a00; font-weight:400; font-size:10px; }
  #printarea .palpha .none{ color:#bbb; }
  #printarea .palpha .empty{ color:#bbb; text-align:center; font-weight:400; }
  /* The footnote is the last ROW of the LAST BLOCK (not a tbody of its own): that block's break-inside:avoid carries
     the last invitation over with it, so it can never land alone on an extra sheet with only the header row. */
  #printarea .palpha td.pfoot{ font-size:10.5px; color:#777; font-style:italic; padding-top:6px;
    border-left:0 !important; border-top:0 !important; border-bottom:0; background:transparent !important; }
  /* "alphainv" — the same A–Z table without the ΟΝΟΜΑ column: one row per invitation (or lone guest).
     ΤΡΑΠΕΖΙ gets the room, a split invitation lists every table it sits at: «8 (2) · 12 (1)». */
  #printarea .palpha.pone .ci{ width:52%; }
  #printarea .palpha.pone .ct{ width:37%; }
  #printarea .palpha.pone .tn{ color:#777; font-variant-numeric:tabular-nums; }
  /* buildAndPrint("alpha") lays the page out here, off screen at print width, to measure each block before printing */
  #printarea.pmeasure{ display:block; position:absolute; left:-10000px; top:0; width:170mm; padding:0 10px;
    visibility:hidden; pointer-events:none; }
</style>

// ============================================================
//  Procedural floor textures — small SVG tiles with fractal-noise filters, inlined as data
//  URIs (the site CSP allows img-src data:). No external assets, sharp at any zoom.
// ============================================================
const SVG_NS='xmlns="http://www.w3.org/2000/svg"';
function svgUri(s){ return 'url("data:image/svg+xml,'+encodeURIComponent(s.replace(/\s{2,}/g," ").trim())+'")'; }
function noise(id,freq,oct,seed,rgb,alpha){
  return `<filter id="${id}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${oct}" seed="${seed}" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 ${rgb[0]} 0 0 0 0 ${rgb[1]} 0 0 0 0 ${rgb[2]} 0 0 0 ${alpha} 0"/></filter>`;
}
function veins(id,freq,oct,seed,rgb){   // marble: narrow bands of a noise field become dark veins
  return `<filter id="${id}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${oct}" seed="${seed}" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 ${rgb[0]} 0 0 0 0 ${rgb[1]} 0 0 0 0 ${rgb[2]} 0 0 0 1 0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0 0 0.05 0.55 0.05 0 0 0"/></feComponentTransfer></filter>`;
}
function tileSvg(w,h,defs,body){ return `<svg ${SVG_NS} width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${defs}</defs>${body}</svg>`; }
const RECT=(x,y,w,h,f,extra="")=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${extra}/>`;
const FILL=(id,w,h)=>`<rect width="${w}" height="${h}" filter="url(#${id})"/>`;
function texGrass(){ return tileSvg(256,256, noise("a","0.018",2,3,[0.72,0.80,0.56],0.45)+noise("b","0.9",3,7,[0.30,0.42,0.24],0.32), RECT(0,0,256,256,"#8aa970")+FILL("a",256,256)+FILL("b",256,256)); }   // soft sage, low-contrast blades
function texParquet(){
  const cols=["#d09f66","#c48f55","#cc9a60","#c8945a"]; let b=RECT(0,0,128,128,"#a4713f");
  for(let by=0;by<2;by++) for(let bx=0;bx<2;bx++){ const horiz=(bx+by)%2===0;
    for(let i=0;i<4;i++){ const c=cols[(i+bx+by)%4]; b+= horiz? RECT(bx*64+1, by*64+i*16+1, 62, 14, c) : RECT(bx*64+i*16+1, by*64+1, 14, 62, c); } }
  return tileSvg(128,128, noise("g","0.08 0.5",2,4,[0.3,0.17,0.06],0.22), b+FILL("g",128,128));
}
function texWood(){
  const cols=["#b07b4c","#a87447","#b5804f","#a3703f"]; let b=RECT(0,0,256,128,"#8b5e38");
  for(let i=0;i<4;i++){ const off=(i%2)*96, y=i*32+2;
    b+=RECT(off-158, y, 156, 28, cols[i])+RECT(off+2, y, 156, 28, cols[(i+1)%4])+RECT(off+162, y, 156, 28, cols[(i+2)%4]); }
  return tileSvg(256,128, noise("w","0.006 0.45",2,2,[0.25,0.13,0.05],0.35), b+FILL("w",256,128));
}
function texStone(){
  const cols=["#bdb9b0","#b0aca3","#c6c2b9","#b8b3aa","#aba79e","#c0bcb3"]; let b=RECT(0,0,256,256,"#8d8a82"), k=0;
  const rows=[[4,58,[[4,76],[84,100],[188,64]]],[66,70,[[4,110],[118,60],[182,70]]],[140,54,[[4,60],[68,90],[162,90]]],[198,54,[[4,120],[128,124]]]];
  rows.forEach(([y,h,st])=>st.forEach(([x,w])=>{ b+=RECT(x,y,w,h,cols[k++%cols.length],'rx="7"'); }));
  return tileSvg(256,256, noise("s","0.6",2,5,[0.35,0.33,0.3],0.3)+noise("s2","0.02",2,8,[1,1,0.95],0.22), b+FILL("s",256,256)+FILL("s2",256,256));
}
function texTile(){ const b=RECT(0,0,64,64,"#cfcbc3")+RECT(1,1,30,30,"#f1efeb")+RECT(33,1,30,30,"#e4e1db")+RECT(1,33,30,30,"#e4e1db")+RECT(33,33,30,30,"#f1efeb"); return tileSvg(64,64, noise("t","0.9",1,2,[0.5,0.48,0.45],0.12), b+FILL("t",64,64)); }
function texMarble(){ return tileSvg(256,256, veins("v","0.012",4,5,[0.42,0.42,0.48])+noise("m","0.05",2,9,[0.55,0.55,0.6],0.12), RECT(0,0,256,256,"#f1efeb")+FILL("m",256,256)+FILL("v",256,256)); }
function texSand(){ return tileSvg(128,128, noise("sa","1.3",1,9,[0.72,0.6,0.36],0.45)+noise("sb","1.0",1,4,[1,0.98,0.88],0.35), RECT(0,0,128,128,"#e3d3a6")+FILL("sa",128,128)+FILL("sb",128,128)); }
function texWater(){ return tileSvg(256,256, noise("wa","0.012 0.045",3,3,[0.78,0.9,1],0.45)+noise("wb","0.02 0.07",2,11,[0.08,0.28,0.6],0.35), RECT(0,0,256,256,"#3b82d6")+FILL("wb",256,256)+FILL("wa",256,256)); }
function texCarpet(){ return tileSvg(128,128, noise("ca","1.2",2,6,[0.32,0.06,0.1],0.45)+noise("cb","0.9",1,2,[1,0.55,0.6],0.14), RECT(0,0,128,128,"#8e2c39")+FILL("ca",128,128)+FILL("cb",128,128)); }
function texConcrete(){ return tileSvg(256,256, noise("co","1.0",2,3,[0.45,0.45,0.43],0.38)+noise("cp","0.02",2,7,[0.75,0.75,0.72],0.35), RECT(0,0,256,256,"#c9c8c2")+FILL("cp",256,256)+FILL("co",256,256)); }

// ---------- persistence (multiple named profiles / couples) ----------
function planKey(id){ return PBASE+".plan."+id; }
function newProfileId(){ return "prof"+Date.now()+Math.floor(Math.random()*1000); }
function loadProfilesIdx(){ try{ const p=JSON.parse(localStorage.getItem(PROFILES_KEY)); if(p&&Array.isArray(p.profiles)&&p.profiles.length){
  p.profiles=p.profiles.filter(x=>x&&!x.support); if(!p.profiles.length) return null;
  if(!p.profiles.some(x=>x.id===p.activeId)) p.activeId=p.profiles[0].id; return p; } }catch(e){} return null; }
// A support session (TakeaSeat helping a couple) lives only in memory: nothing of the couple's plan stays on the helper's device.
function saveProfilesIdx(){ try{ const keep=profiles.profiles.filter(p=>!p.support); if(!keep.length) return;
  let act=profiles.activeId; if(!keep.some(p=>p.id===act)) act=keep.some(p=>p.id===profiles.lastRealId)?profiles.lastRealId:keep[0].id;
  localStorage.setItem(PROFILES_KEY, JSON.stringify({...profiles, activeId:act, profiles:keep})); }catch(e){} }
function loadPlan(id){
  try{ const raw=localStorage.getItem(planKey(id)); if(raw==null){ loadError="no local copy"; return null; }
    const s=JSON.parse(raw);
    if(s&&s.tables){ sanitizePlan(s); if(s.layoutVersion!==LAYOUT_VERSION) migrateLayout(s); loadError="";
      if(IS_LAB){ const cut=labTrim(s,true,true); if(cut){ labCutPending+=cut; try{ localStorage.setItem(planKey(id), JSON.stringify(s)); }catch(e){} } }   // a lab plan from before the limit: its spare EMPTY tables go (people are never unseated here)
      return s; }
    loadError="local copy has no tables";
  }catch(e){ loadError=String(e&&e.message||e); }
  return null;
}
// First run: adopt any pre-profiles single-plan save into an initial "Our wedding" profile (lab: a demo plan).
function ensureProfiles(){
  const existing=loadProfilesIdx();
  if(existing) return existing;
  const id=newProfileId();
  let migrated=null;
  if(!IS_LAB){ try{ const old=JSON.parse(localStorage.getItem(STORE_KEY)); if(old&&old.tables) migrated=old; }catch(e){} }
  try{ localStorage.setItem(planKey(id), JSON.stringify(migrated||(IS_LAB?labState():defaultState()))); }catch(e){}
  const p={ activeId:id, profiles:[{id, name:IS_LAB?tr("labPlan"):tr("ourWedding")}] };
  try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(p)); }catch(e){}  // persist so we don't re-migrate on next load
  return p;
}
// ---------- save + undo / redo (one snapshot per saved change; the stacks reset when another plan is loaded) ----------
let undoStack=[], redoStack=[], lastJSON=null;
const VIEW_KEYS=["seatFontScale","tableFontScale","nameMode","nameCase","printMode","activeGroupId"];   // how this device shows the plan, not the plan
function planCore(json){ const o=JSON.parse(json); VIEW_KEYS.forEach(k=>delete o[k]); return JSON.stringify(o); }
function save(opts){
  const now=JSON.stringify(state);
  if(ACCESS.ro && lastJSON!==null && now!==lastJSON && planCore(now)!==planCore(lastJSON)){ restoreSnapshot(lastJSON); roToast(); return; }   // read only: whatever slipped past the UI goes back
  if(lastJSON!==null && now!==lastJSON && !(opts&&opts.noHistory)){ undoStack.push(lastJSON); if(undoStack.length>60) undoStack.shift(); redoStack.length=0; }
  lastJSON=now;
  const sp=(profiles&&profiles.profiles)?profiles.profiles.find(p=>p.id===profiles.activeId):null;
  if(sp&&sp.support) sp._mem=now; else { try{ localStorage.setItem(planKey(profiles.activeId), now); }catch(e){} }
  scheduleCloudPush(); updateUndoButtons();
}
function resetHistory(){ undoStack=[]; redoStack=[]; lastJSON=JSON.stringify(state); updateUndoButtons(); }
function updateUndoButtons(){
  ["undoBtn","mbUndo"].forEach(id=>{ const b=$(id); if(b) b.disabled=!undoStack.length||ACCESS.ro; });
  ["redoBtn","mbRedo"].forEach(id=>{ const b=$(id); if(b) b.disabled=!redoStack.length||ACCESS.ro; });
}
function restoreSnapshot(json){
  const s=sanitizePlan(JSON.parse(json)); if(s.layoutVersion!==LAYOUT_VERSION) migrateLayout(s);
  setPick(null); dragData=null; hideSug(); closePlaceMenu(); closeGroupMenu();
  state=s; uid=Math.max(uid, state._uid||0); fontScale=state.seatFontScale||1;
  applyStage(); $("stageFloor").value=state.stageMaterial||"grass";
  if(focusId!=null && !state.tables.some(t=>t.id===focusId)) unfocusTable();
  renderAll();
}
function undo(){ if(!undoStack.length||ACCESS.ro) return; const cur=JSON.stringify(state); const j=undoStack.pop(); redoStack.push(cur); restoreSnapshot(j); lastJSON=j; wipeAllowedUntil=Date.now()+15000; save({noHistory:true}); toast(tr("tUndo")); }
function redo(){ if(!redoStack.length||ACCESS.ro) return; const cur=JSON.stringify(state); const j=redoStack.pop(); undoStack.push(cur); restoreSnapshot(j); lastJSON=j; wipeAllowedUntil=Date.now()+15000; save({noHistory:true}); toast(tr("tRedo")); }
// Version-aware migration — keeps guests / groups / seat assignments (and, from v4 on, table positions).
function migrateLayout(s){
  const from=s.layoutVersion||0;
  if(from<4){
    let ri=0;
    s.tables.forEach(t=>{ if(t.shape!=="head"){ t.shape="round"; if(LEGACY_POSITIONS[ri]){ t.x=LEGACY_POSITIONS[ri][0]; t.y=LEGACY_POSITIONS[ri][1]; } ri++; } });
    if(!s.tables.some(t=>t.shape==="head")){ s._uid=(s._uid||2001)+1; const h=makeHeadTable(s._uid); h.y=1290; s.tables.push(h); }
    s.features = defaultFeatures(true);
    if(typeof s.seatFontScale!=="number") s.seatFontScale=1;
  }
  if(from<5){
    if(!s.stage) s.stage={ w:2100, h:1400 };
    if(!s.stageMaterial) s.stageMaterial="grass";
    s.features=(s.features||defaultFeatures()).map(upgradeFeature);
  }
  s.layoutVersion=LAYOUT_VERSION;
}

function assignedGuestIds(){ const set=new Set(); state.tables.forEach(t=>t.seats.forEach(g=>{ if(g)set.add(g); })); return set; }

// How a name shows on the seat pill: full «Ανδρέας Σταμελάκης», short «Ανδρέας Σ.», initials «Α.Σ.» (colours stay).
function initialOf(w){ const c=[...w][0]; return c? c.toUpperCase()+"." : ""; }
function displayName(id){
  const n=guestName(id), mode=state.nameMode||"full"; if(mode==="full") return n;
  const parts=n.trim().split(/\s+/).filter(Boolean); if(parts.length<2) return n;
  return mode==="short" ? parts[0]+" "+initialOf(parts[1]) : parts.map(initialOf).join("");
}
function hexTint(hex){ return hex+"1f"; }
function toast(msg,ms){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._to); t._to=setTimeout(()=>t.classList.remove("show"),ms||1700); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }

function gNote(id){ return state.guests[id]?.note || ""; }
function statusTitle(id){ const s=gStatus(id); const n=gNote(id); return (STATUS_TXT(s)?` · ⚠ ${STATUS_TXT(s)}`:"") + (n?` · ${n}`:""); }
function hasInv(id){ const g=state.guests[id]; return !!(g && g.partyId); }   // the pip: belongs to an invitation, nothing more
function invTitle(id){ const p=partyOf(id); return p?` · ✉ ${caseName(p.name)}`:""; }   // hovering any name anywhere says WHICH invitation
function statusTag(id){ const s=gStatus(id); return STATUS_TXT(s)?`<span class="stag${s==="cut"?" cut":""}">${STATUS_TXT(s)}</span>`:""; }
// ---------- the pip, as a button ----------
// One mark, one meaning, everywhere he works: press it and the invitation opens in the left panel with the rest of
// its people ringed on the floor. Read only may press it too — opening and highlighting change nothing.
// `host` must already be a positioned box; the caller adds class "pipbtn" so the decorative ::after stands down.
function makeInvPip(gid, host){
  const p=partyOf(gid); if(!p) return null;
  const b=document.createElement("button");
  b.type="button"; b.className="ipip"; b.dataset.pip=gid;
  b.title=tr("invPipTip",{n:caseName(p.name)}); b.setAttribute("aria-label", b.title);
  // A pill is draggable (mouse) and long-pressable (touch). Neither may start from the mark: swallow the gesture
  // at pointerdown and put draggable back on the very next pointerup, wherever it lands.
  b.addEventListener("pointerdown",e=>{
    e.stopPropagation();
    if(!host.draggable) return;
    host.draggable=false;
    const back=()=>{ host.draggable=true; document.removeEventListener("pointerup",back,true); document.removeEventListener("pointercancel",back,true); };
    document.addEventListener("pointerup",back,true); document.addEventListener("pointercancel",back,true);
  });
  b.addEventListener("contextmenu",e=>{ e.preventDefault(); e.stopPropagation(); });   // never the guest editor / Android's long-press menu
  b.addEventListener("dblclick",e=>e.stopPropagation());
  b.addEventListener("click",e=>{ e.preventDefault(); e.stopPropagation(); invOpenFor(gid, host.classList.contains("seat")); });
  return b;
}
// Hang the mark on a host that has one — returns the host, so callers can chain.
function addInvPip(host, gid){
  const b=makeInvPip(gid, host); if(b){ host.classList.add("pipbtn"); host.appendChild(b); }
  return host;
}
// The mark's one action: open that invitation, ring its people on the floor.
// Pressed ON THE FLOOR on a phone, the ring IS the answer he asked for — so the 330 px drawer does not slide over
// it and the table sheet he was working in stays open; the panel is one tap on ≡ away, and the toast says so.
function invOpenFor(gid, fromFloor){
  const p=partyOf(gid); if(!p) return;
  const quiet=isNarrow() && !!fromFloor;
  enterInv(p.id, quiet?{stay:true}:undefined);      // enterInv() ends with renderInvHighlight()
  toast(tr(quiet?"invPipOpenedPhone":"invPipOpened",{g:guestName(gid), n:caseName(p.name)}), quiet?4200:2600);
}

// ---------- text measuring (so seats grow to fit the name) ----------
const _measureCtx = document.createElement("canvas").getContext("2d");
function textWidth(txt, fs){ _measureCtx.font = `700 ${fs}px ${FONT_FAMILY}`; return _measureCtx.measureText(txt).width; }
const PIP_W=18;   // the invitation mark's gutter inside a pill — must equal --pipw in the stylesheet
// A marked pill is built PIP_W wider and hands that width straight back as padding-right, so the text box is
// byte-for-byte the one it had before the mark existed: the mark costs nobody a letter. gid is optional — a caller
// that has no guest (an empty chair) passes nothing and gets the plain width.
function seatWidthFor(name, fs, gid){ return Math.round(clamp(textWidth(name,fs)+20, 46, 190)) + (gid&&hasInv(gid)?PIP_W:0); }

const stage = $("stage");
const stagewrap = $("stagewrap");
let focusId = null;          // table currently open in the names panel
let focusRowWanted = null;   // row to focus after the next renderFocus

function renderFeatures(){
  stage.querySelectorAll(".feature").forEach(e=>e.remove());
  (state.features||[]).forEach((f,fi)=>{
    const el=document.createElement("div");
    const kind=FEATURE_KINDS.includes(f.kind)?f.kind:"marker";
    el.className="feature k-"+kind; el.dataset.fi=fi;
    el.style.left=f.x+"px"; el.style.top=f.y+"px"; el.style.width=f.w+"px"; el.style.height=f.h+"px";
    if(kind==="zone"){
      applyMaterial(el, f.material||"grass");
      if(f.label){ const l=document.createElement("div"); l.className="zlabel"; l.textContent=f.label; el.appendChild(l); }
    } else if(kind==="prop"){
      el.innerHTML=`<div class="picon">${escapeHtml(f.icon||"📦")}</div>${f.label?`<div class="plabel">${escapeHtml(f.label)}</div>`:""}`;
    } else {
      el.textContent=f.label||"";
    }
    el.style.transform=`translate(-50%,-50%) rotate(${f.rot||0}deg)`;
    if(featLocked(f)){   // the venue's element: shown, not editable
      el.classList.add("flocked"); if(!ACCESS.ro) el.title=tr("featLockedTip",{v:ACCESS.venueName||tr("theVenue")});
      el.addEventListener("contextmenu",e=>{ e.preventDefault(); e.stopPropagation(); lockedToast("decor"); });
      stage.appendChild(el); return;
    }
    const rz=document.createElement("div"); rz.className="rz"; el.appendChild(rz);
    makeResizable(rz, el, f);
    const roth=document.createElement("div"); roth.className="rot-h"; roth.style.left="50%"; roth.style.top="-24px"; roth.style.transform="translateX(-50%)"; el.appendChild(roth);
    makeRotatable(roth, el, f, ()=>{ el.style.transform=`translate(-50%,-50%) rotate(${f.rot||0}deg)`; });
    el.addEventListener("contextmenu",e=>{ e.preventDefault(); e.stopPropagation(); openFeatureMenu(f,e); });
    const fg=document.createElement("div"); fg.className="feat-gear"; fg.innerHTML=ICON("gear"); fg.title=tr("featGear");
    fg.addEventListener("pointerdown",e=>e.stopPropagation());
    fg.addEventListener("click",e=>{ e.stopPropagation(); const r=fg.getBoundingClientRect(); openFeatureMenu(f,{clientX:r.left,clientY:r.bottom}); });
    el.appendChild(fg);
    el.title=tr("featTip");
    makeDraggable(el, el, f, ()=>{});
    stage.appendChild(el);
  });
}

const BASE_SLOT=46; // reference seat spacing — table size depends on this + seat count, NOT on name length
function roundGeom(t){
  const n=t.capacity;
  const fs=Math.round(11*fontScale);
  const seatH=fs+11;
  const need = n<2 ? BASE_SLOT : BASE_SLOT/(2*Math.sin(Math.PI/n));
  const ringR=Math.max(need, 46, seatH*1.2);
  const discR=Math.max(24, ringR - seatH/2 - 7);
  return {n,fs,seatH,ringR,discR};
}
function buildSeat(t,i,relx,rely,fs,seatH){
  const seat=document.createElement("div");
  const gid=t.seats[i];
  const picked=pick && pick.from==="seat" && pick.tableId===t.id && pick.seatIndex===i && pick.guestId===gid;
  seat.className="seat"+(gid?" occupied":"")+(picked?" picked":"");
  seat.style.height=seatH+"px"; seat.style.borderRadius=(seatH/2)+"px"; seat.style.fontSize=fs+"px";
  seat.dataset.tableId=t.id; seat.dataset.seatIndex=i;
  let sw=34;                                   // the pill's width — it also decides where its left edge goes
  if(gid){
    const col=guestColor(gid);
    const shown=displayName(gid);
    sw=seatWidthFor(shown,fs,gid); seat.style.backgroundColor=col; seat.style.width=sw+"px";   // colour only: the CSS gradient keeps the pill's sheen
    if(gStatus(gid)!=="confirmed"){ seat.style.borderStyle="dashed"; seat.style.borderColor="rgba(255,255,255,.9)"; seat.style.backgroundClip="padding-box"; }   // not-yet-confirmed: white dashes inside the pill, visible on any floor
    seat.innerHTML=`<span class="nm">${escapeHtml(shown)}</span>`;
    seat.title=guestName(gid)+(guestGroup(gid)?` · ${guestGroup(gid).name}`:"")+statusTitle(gid)+invTitle(gid);
    seat.draggable=!isTouch&&!ACCESS.ro; seat.dataset.guestId=gid;   // touch moves with seatHold — no native (iOS) drag session competing
    // THE mark, on the floor where he actually works. Built here, in the one place a pill is ever made, so every
    // renderTables / renderFocus / renderAll puts it straight back — and a collided name carries it to the outer ring.
    if(hasInv(gid)){ seat.classList.add("hasinv"); addInvPip(seat, gid); }
  }else{
    seat.style.width="34px";
    seat.innerHTML=`<span class="nm" style="opacity:.6">+</span>`;
  }
  // relx/rely are the pill's CENTRE; with no centring transform we place its top-left ourselves (same pixels)
  seat.style.left=(relx-sw/2)+"px"; seat.style.top=(rely-seatH/2)+"px";
  wireSeat(seat);
  return seat;
}
function seatLeader(ax,ay,px,py,gid){   // a dot on the chair + a thin line to where its name pill went (drawn under the pills)
  const col=gid?guestColor(gid):"#cfc8bd", frag=document.createDocumentFragment();
  const dot=document.createElement("div"); dot.className="stem"; dot.style.left=ax+"px"; dot.style.top=ay+"px"; dot.style.background=col; frag.appendChild(dot);
  const line=document.createElement("div"); line.className="leader"; const len=Math.hypot(px-ax,py-ay);
  line.style.left=ax+"px"; line.style.top=ay+"px"; line.style.width=len+"px"; line.style.transform=`rotate(${Math.atan2(py-ay,px-ax)}rad)`; line.style.background=col; frag.appendChild(line);
  return frag;
}
function tableExtent(t){   // half-size of a table incl. its seats and any name that slid outward — used to zoom onto it
  if(t.shape==="rect"){ const {g,W,pos}=rectLayout(t); let rx=g.tableW/2+24, ry=g.tableH/2+g.seatH+14;   // wrap frame (the focus ring); zx/zy = the same box as the stage sees it (zoom)
    pos.forEach((p,i)=>{ if(t.seats[i]){ rx=Math.max(rx, Math.abs(p.x)+W[i]/2+8); ry=Math.max(ry, Math.abs(p.y)+g.seatH/2+8); } });
    const a=(t.rot||0)*Math.PI/180, c=Math.abs(Math.cos(a)), s=Math.abs(Math.sin(a)); return {rx, ry, zx:rx*c+ry*s, zy:rx*s+ry*c}; }
  if(t.shape==="head"){ const {g,W,pos}=headLayout(t); let rx=g.tableW/2+30+100, ry=g.tableH/2+g.seatH+40;
    pos.forEach((p,i)=>{ if(t.seats[i]&&p.moved){ rx=Math.max(rx, Math.abs(p.sx)+W[i]/2+10); ry=Math.max(ry, Math.abs(p.sy)+g.seatH/2+30); } }); return { rx, ry }; }
  const {g,W,seats}=roundLayout(t); let rx=g.ringR+100, ry=g.ringR+40;
  seats.forEach((p,i)=>{ if(p.moved){ rx=Math.max(rx, Math.abs(p.sx)+W[i]/2+10); ry=Math.max(ry, Math.abs(p.sy)+g.seatH/2+30); } });
  return {rx, ry};
}
function wireTableDisc(disc, t, wrap){   // every table top: tip, gear, right-click menu, drag (merge by drop), tap = open, name drops
  disc.title=tr("tableTip");
  disc.querySelector(".tgear").addEventListener("click",e=>{ e.stopPropagation(); openMenu(t.id,e); });
  disc.addEventListener("contextmenu",e=>{ e.preventDefault(); openMenu(t.id,e); });
  makeDraggable(disc, wrap, t, ()=>renderTables([t.id]), ()=>{ if(pick){ const p=pick; setPick(null); placeInTable(p, t.id); } else focusTable(t.id); }, tableHooks());
  wireDiscDrop(disc, t);
  wrap.appendChild(disc);
}
function renderRoundTable(t, wrap){
  const g=roundGeom(t);
  const disc=document.createElement("div");
  disc.className="table-disc";
  disc.style.width=(g.discR*2)+"px"; disc.style.height=(g.discR*2)+"px"; disc.style.setProperty("--dd",(g.discR*2)+"px");
  const occ=t.seats.filter(Boolean).length;
  disc.innerHTML=`<span class="tgear" title="${escapeHtml(tr("tableSettings"))}">${ICON("gear")}</span><span class="tnum">${escapeHtml(t.label)}</span><span class="tcount">${occ}/${t.capacity}</span>`;
  wireTableDisc(disc, t, wrap);
  // Name pills that would collide slide apart along an outer circle (like labels around a pie chart), each tied to its
  // chair by a thin leader; a table where nothing collides looks exactly as it always did.
  const {W, seats}=roundLayout(t);
  let hTop=g.ringR+g.seatH/2;   // the rotate handle sits above whatever pill crosses its column
  // leaders first, pills after: with no z-index on a pill (see .seat.occupied) only tree order keeps the hairlines under the names
  const lead=document.createDocumentFragment(), pills=document.createDocumentFragment();
  seats.forEach((p,i)=>{
    if(Math.abs(p.x)<W[i]/2+9 && -p.y+g.seatH/2>hTop) hTop=-p.y+g.seatH/2;
    if(p.moved) lead.appendChild(seatLeader(p.cx, p.cy, p.x, p.y, t.seats[i]));
    pills.appendChild(buildSeat(t,i, p.x, p.y, g.fs, g.seatH));
  });
  wrap.appendChild(lead); wrap.appendChild(pills);
  addTableRotateHandle(wrap, t, hTop+19);   // = ringR+30 when nothing moved
}
// Boxes placed as close to home as possible without collisions (stage frame). items: {hx,hy,w,h,ox,oy} — home, size and the
// outward direction; obstacles: fixed boxes (empty chairs, the head table); disc: the round table {x,y,ring}. A pill that is
// free at home stays there; otherwise it takes the nearest free spot around its chair (outward preferred, sideways when that is
// closer), never crossing inward over the chairs. Nothing is ever pushed to a shared far circle.
function placeNear(items, obstacles, disc){
  const boxes=obstacles.slice(), res=[];
  const hitB=(x,y,w,h,B)=>B.c!=null ? hitRot(x,y,w/2+2,h/2+2,B) : Math.abs(x-B.x)<(w+B.w)/2+2 && Math.abs(y-B.y)<(h+B.h)/2+2;
  // the pill's CENTRE stays on or outside the chair ring (a wide pill's inner corner may brush the disc, as it always did at its chair)
  const ok=(x,y,w,h)=>(!disc||Math.hypot(x-disc.x,y-disc.y)>=disc.ring-4) && !boxes.some(B=>hitB(x,y,w,h,B));
  for(const it of items){
    let p=null;
    if(ok(it.hx,it.hy,it.w,it.h)) p={x:it.hx,y:it.hy};
    else if(it.slide) for(let d=6; d<=it.maxSlide && !p; d+=6){ for(const sgn of [1,-1]){ const q=it.slide(d*sgn); if(ok(q.x,q.y,it.w,it.h)){ p=q; break; } } }   // first choice: slide along the chairs, into the free space beside the table
    if(!p) for(let r=6; r<=150 && !p; r+=6){ let best=null;
      for(let k=0;k<24;k++){ const a=k/24*2*Math.PI, x=it.hx+r*Math.cos(a), y=it.hy+r*Math.sin(a);
        if(!ok(x,y,it.w,it.h)) continue; const pref=-(Math.cos(a)*it.ox+Math.sin(a)*it.oy); if(!best||pref<best.pref) best={x,y,pref}; }   // same distance: the most outward wins
      if(best) p={x:best.x,y:best.y}; }
    if(!p) p={x:it.hx,y:it.hy};   // nowhere within 150 px: stay home
    res.push(p); boxes.push({x:p.x,y:p.y,w:it.w,h:it.h});
  }
  return res;
}
// An upright box (half sizes aw,ah) against a rotated one {x,y,w,h,c,s} (a long table at any angle) — separating axes.
function hitRot(x,y,aw,ah,B){
  const dx=x-B.x, dy=y-B.y, bw=B.w/2, bh=B.h/2, c=Math.abs(B.c), s=Math.abs(B.s);
  return Math.abs(dx)<aw+bw*c+bh*s && Math.abs(dy)<ah+bw*s+bh*c && Math.abs(dx*B.c+dy*B.s)<aw*c+ah*s+bw && Math.abs(dy*B.c-dx*B.s)<aw*s+ah*c+bh;
}
// Where every seat of a round table goes. The collision maths runs in the STAGE frame (pills are counter-rotated, so they are
// axis-aligned there); results come back in wrap coordinates (x,y) plus the stage ones (sx,sy) for the zoom extent.
function roundLayout(t){
  const g=roundGeom(t), cnt=t.capacity, rot=(t.rot||0)*Math.PI/180, c=Math.cos(rot), s=Math.sin(rot), R=g.ringR, h=g.seatH;
  const ang=i=>(i/cnt)*2*Math.PI-Math.PI/2+rot;
  const W=[]; for(let i=0;i<cnt;i++){ const gid=t.seats[i]; W.push(gid?seatWidthFor(displayName(gid),g.fs,gid):34); }
  const chairs=[], items=[];
  for(let i=0;i<cnt;i++){ const a=ang(i), hx=Math.cos(a)*R, hy=Math.sin(a)*R;
    if(t.seats[i]) items.push({i,hx,hy,w:W[i],h,ox:Math.cos(a),oy:Math.sin(a), slide:d=>({x:Math.cos(a+d/R)*R, y:Math.sin(a+d/R)*R}), maxSlide:W[i]}); else chairs.push({x:hx,y:hy,w:34,h}); }
  const placed=placeNear(items, chairs, {x:0,y:0,ring:R});
  const seats=[]; for(let i=0;i<cnt;i++){ const a=ang(i); seats[i]={sx:Math.cos(a)*R, sy:Math.sin(a)*R, moved:false}; }
  items.forEach((it,k)=>{ const p=placed[k]; seats[it.i]={sx:p.x, sy:p.y, moved:Math.abs(p.x-it.hx)>3||Math.abs(p.y-it.hy)>3}; });
  seats.forEach((p,i)=>{ p.x=p.sx*c+p.sy*s; p.y=-p.sx*s+p.sy*c; const a0=ang(i)-rot; p.cx=Math.cos(a0)*R; p.cy=Math.sin(a0)*R; });
  return {g, W, seats};
}
// The head table's row of names: a colliding name takes the nearest free spot (below or beside the row), tied to its chair.
function headLayout(t){
  const g=headGeom(t), rot=(t.rot||0)*Math.PI/180, c=Math.cos(rot), s=Math.sin(rot), h=g.seatH;
  const toS=(x,y)=>({x:x*c-y*s, y:x*s+y*c}), toW=(X,Y)=>({x:X*c+Y*s, y:-X*s+Y*c});
  const W=[]; for(let i=0;i<g.top;i++){ const gid=t.seats[i]; W.push(gid?seatWidthFor(displayName(gid),g.fs,gid):34); }
  const rely=g.tableH/2+h/2+6;
  const corners=[[-g.tableW/2,-g.tableH/2],[g.tableW/2,-g.tableH/2],[g.tableW/2,g.tableH/2],[-g.tableW/2,g.tableH/2]].map(([x,y])=>toS(x,y));
  const bx=Math.min(...corners.map(p=>p.x)), bX=Math.max(...corners.map(p=>p.x)), by=Math.min(...corners.map(p=>p.y)), bY=Math.max(...corners.map(p=>p.y));
  const obstacles=[{x:(bx+bX)/2,y:(by+bY)/2,w:bX-bx,h:bY-by}], items=[], homes=[];
  for(let i=0;i<g.top;i++){ const hw=-g.innerW/2+g.slot/2+i*g.slot, p=toS(hw,rely); homes.push({x:hw,y:rely});
    if(t.seats[i]) items.push({i,hx:p.x,hy:p.y,w:W[i],h,ox:-s,oy:c, slide:d=>({x:p.x+d*c, y:p.y+d*s}), maxSlide:W[i]}); else obstacles.push({x:p.x,y:p.y,w:34,h}); }
  const li=g.top, ri=g.top+1, endGap=30;
  [[li,-(g.tableW/2)-endGap],[ri,(g.tableW/2)+endGap]].forEach(([idx,x])=>{ if(idx<t.capacity){ const p=toS(x,0); obstacles.push({x:p.x,y:p.y,w:t.seats[idx]?seatWidthFor(displayName(t.seats[idx]),g.fs,t.seats[idx]):34,h}); } });
  const placed=placeNear(items, obstacles, null);
  const pos=homes.map(hm=>({x:hm.x,y:hm.y,sx:0,sy:0,moved:false}));
  items.forEach((it,k)=>{ const p=placed[k], w=toW(p.x,p.y); pos[it.i]={x:w.x,y:w.y,sx:p.x,sy:p.y,moved:Math.abs(p.x-it.hx)>3||Math.abs(p.y-it.hy)>3}; });
  return {g, W, homes, pos};
}
function headGeom(t){
  const n=t.capacity;
  const top=Math.max(1,n-2);
  const fs=Math.round(11*fontScale);
  const seatH=fs+11;
  const slot=Math.round(64*fontScale);
  const innerW=top*slot;
  const tableW=innerW+34;
  const tableH=seatH+50;
  return {n,top,fs,seatH,slot,innerW,tableW,tableH};
}
function renderHeadTable(t, wrap){
  const g=headGeom(t);
  const disc=document.createElement("div");
  disc.className="table-disc head";
  disc.style.width=g.tableW+"px"; disc.style.height=g.tableH+"px";
  const occ=t.seats.filter(Boolean).length;
  disc.innerHTML=`<span class="tgear" title="${escapeHtml(tr("tableSettings"))}">${ICON("gear")}</span><span class="tnum">${escapeHtml(t.label)}</span><span class="tcount">${occ}/${t.capacity} · ${escapeHtml(tr("headFacing"))}</span>`;
  wireTableDisc(disc, t, wrap);
  // main row on the FAR side of the table, so the couple sits behind the table facing the dance floor
  // the row of names under the table: colliding names slide sideways (past the table ends if needed), tied to their chair
  const {homes, pos}=headLayout(t);
  const lead=document.createDocumentFragment(), pills=document.createDocumentFragment();   // leaders under the pills by tree order
  for(let i=0;i<g.top;i++){ const p=pos[i];
    if(t.seats[i] && p.moved) lead.appendChild(seatLeader(homes[i].x, g.tableH/2, p.x, p.y, t.seats[i]));
    pills.appendChild(buildSeat(t,i, p.x, p.y, g.fs, g.seatH));
  }
  const li=g.top, ri=g.top+1, endGap=30;
  if(li<t.capacity) pills.appendChild(buildSeat(t,li, -(g.tableW/2)-endGap, 0, g.fs, g.seatH));
  if(ri<t.capacity) pills.appendChild(buildSeat(t,ri,  (g.tableW/2)+endGap, 0, g.fs, g.seatH));
  wrap.appendChild(lead); wrap.appendChild(pills);
  addTableRotateHandle(wrap, t, g.tableH/2 + g.seatH + 30);
}
// A long table (shape "rect"): chairs on both long sides, none at the ends. Seat order: side A (top, left→right) 0..per-1,
// then side B (bottom, left→right). Geometry mirrors the head table; the server's PDF draws it the same way.
function rectGeom(t){
  const n=t.capacity, per=Math.max(1,Math.ceil(n/2)), fs=Math.round(11*fontScale), seatH=fs+11, slot=Math.round(64*fontScale), innerW=per*slot;
  return {n,per,fs,seatH,slot,innerW,tableW:innerW+34,tableH:70};
}
function rectHome(g,i){ const b=i>=g.per, k=b?i-g.per:i; return {x:-g.innerW/2+g.slot/2+k*g.slot, y:(b?1:-1)*(g.tableH/2+g.seatH/2+6), b}; }
// Both rows, like the head table's row: a colliding name slides along its row (past the ends if needed), else the nearest free spot.
function rectLayout(t){
  const g=rectGeom(t), rot=(t.rot||0)*Math.PI/180, c=Math.cos(rot), s=Math.sin(rot), h=g.seatH;
  const toS=(x,y)=>({x:x*c-y*s, y:x*s+y*c}), toW=(X,Y)=>({x:X*c+Y*s, y:-X*s+Y*c});
  const W=[], homes=[], items=[], obstacles=[{x:0,y:0,w:g.tableW,h:g.tableH,c,s}];   // the table top as the rotated box it is
  for(let i=0;i<g.n;i++){ const gid=t.seats[i], hm=rectHome(g,i), o=hm.b?{x:-s,y:c}:{x:s,y:-c};
    W.push(gid?seatWidthFor(displayName(gid),g.fs,gid):34);
    const sh=Math.max(0, W[i]/2*Math.abs(s)+h/2*Math.abs(c)-h/2); hm.y+=hm.b?sh:-sh;   // turned table: an upright pill steps out until it clears the table top (0 at 0°, half its width at 90°)
    const p=toS(hm.x,hm.y); homes.push(hm);
    if(gid) items.push({i,hx:p.x,hy:p.y,w:W[i],h,ox:o.x,oy:o.y, slide:d=>({x:p.x+d*c, y:p.y+d*s}), maxSlide:W[i]}); else obstacles.push({x:p.x,y:p.y,w:34,h}); }
  const placed=placeNear(items, obstacles, null);
  const pos=homes.map(hm=>({x:hm.x,y:hm.y,sx:0,sy:0,moved:false}));
  items.forEach((it,k)=>{ const p=placed[k], w=toW(p.x,p.y); pos[it.i]={x:w.x,y:w.y,sx:p.x,sy:p.y,moved:Math.abs(p.x-it.hx)>3||Math.abs(p.y-it.hy)>3}; });
  return {g, W, homes, pos};
}
function renderRectTable(t, wrap){
  const g=rectGeom(t), disc=document.createElement("div");
  disc.className="table-disc rect"; disc.style.width=g.tableW+"px"; disc.style.height=g.tableH+"px";
  const occ=t.seats.filter(Boolean).length;
  disc.innerHTML=`<span class="tgear" title="${escapeHtml(tr("tableSettings"))}">${ICON("gear")}</span><span class="tnum">${escapeHtml(t.label)}</span><span class="tcount">${occ}/${t.capacity}</span>`;
  wireTableDisc(disc, t, wrap);
  const {W, homes, pos}=rectLayout(t);
  let hTop=g.tableH/2+6+g.seatH;   // the rotate handle sits above whatever pill crosses its column
  const lead=document.createDocumentFragment(), pills=document.createDocumentFragment();   // leaders under the pills by tree order
  for(let i=0;i<g.n;i++){ const p=pos[i];
    if(t.seats[i] && Math.abs(p.x)<W[i]/2+9 && -p.y+g.seatH/2>hTop) hTop=-p.y+g.seatH/2;
    if(t.seats[i] && p.moved) lead.appendChild(seatLeader(homes[i].x, (homes[i].b?1:-1)*g.tableH/2, p.x, p.y, t.seats[i]));
    pills.appendChild(buildSeat(t,i, p.x, p.y, g.fs, g.seatH)); }
  wrap.appendChild(lead); wrap.appendChild(pills);
  addTableRotateHandle(wrap, t, hTop+19);
}
function buildTableWrap(t){
  const wrap=document.createElement("div");
  wrap.className="table"+(t.shape==="rect"?" shape-rect":"")+(t.id===focusId?" focused":""); wrap.style.left=t.x+"px"; wrap.style.top=t.y+"px"; wrap.dataset.tableId=t.id;
  wrap.style.setProperty("--tfs", String(state.tableFontScale||1));
  if(t.shape==="head") renderHeadTable(t,wrap); else if(t.shape==="rect") renderRectTable(t,wrap); else renderRoundTable(t,wrap);
  const ext=tableExtent(t); wrap.style.setProperty("--frx", Math.round(ext.rx+4)+"px"); wrap.style.setProperty("--fry", Math.round(ext.ry+4)+"px");
  return wrap;
}
// Re-render every table, or only the ids in `only` (a seat change touches one or two tables — not 300 pills).
function renderTables(only){
  if(only){
    only.forEach(id=>{ const t=state.tables.find(x=>x.id===id); const old=stage.querySelector(`.table[data-table-id="${id}"]`);
      if(!t){ if(old) old.remove(); return; } const wrap=buildTableWrap(t); if(old) old.replaceWith(wrap); else stage.appendChild(wrap); });

let searchQ="";
let invLooseFilter=false;   // the NORMAL-state "χωρίς προσκλητήριο" pool chip, armed from the INDEX's loose row
function unseatedIds(){ const assigned=assignedGuestIds(); return Object.keys(state.guests).filter(id=>!assigned.has(id)); }
function visiblePoolIds(){
  const q=norm(searchQ); let ids=unseatedIds();
  if(q) ids=ids.filter(id=>norm(guestName(id)).includes(q)||(partyOf(id)&&norm(partyOf(id).name).includes(q)));   // a search looks across all groups (and invitation names)
  else if(state.activeGroupId) ids=ids.filter(id=>state.guests[id].groupId===state.activeGroupId);
  if(invLooseFilter) ids=ids.filter(id=>!state.guests[id].partyId);   // the INDEX's "sweep up the loose names" loop
  return ids;
}
function seatedHits(){   // a search also finds names that already sit somewhere (table order, then seat order)
  const q=norm(searchQ), out=[]; if(!q) return out;
  state.tables.forEach(t=>t.seats.forEach((id,i)=>{ if(id&&state.guests[id]&&(norm(guestName(id)).includes(q)||(partyOf(id)&&norm(partyOf(id).name).includes(q)))) out.push({id,t,i}); }));
  return out;
}
function partyCounts(){   // {byId:{pid:n}, loose, live} in ONE pass — partyMembers() per invitation is O(parties × guests)
  const byId={}; let loose=0;
  for(const id in state.guests){ const pid=state.guests[id].partyId; if(pid) byId[pid]=(byId[pid]||0)+1; else loose++; }
  return {byId, loose, live:(state.parties||[]).filter(p=>byId[p.id]).length};
}
function renderInvBtn(){   // the plan-level answer to "who is and is not in an invitation": a dot answers one name, a count answers 300
  const c=partyCounts(), loose=c.loose, n=c.live;
  $("invBtnN").textContent=loose?`${n} · ${tr("invLooseShort",{n:loose})}`:String(n);
  const wrap=$("invLooseWrap"); wrap.hidden=!invLooseFilter;
  if(invLooseFilter && !wrap.firstChild){
    const c=document.createElement("button"); c.type="button"; c.className="chip active";
    c.innerHTML=`${ICON("mail")}<span>${escapeHtml(tr("invLooseChip"))}</span><span class="gmore">✕</span>`;
    c.title=tr("invLooseChip"); c.addEventListener("click",()=>{ invLooseFilter=false; renderPool(); });
    wrap.appendChild(c);
  } else if(!invLooseFilter) wrap.innerHTML="";
}
// Band C's data: EVERY guest, seated and unseated, flat and alphabetical — on paper you tick from the complete list.
function invTickIds(){
  const q=norm(searchQ), cur=invOpenId;
  const ok=id=>{
    if(q && !(norm(guestName(id)).includes(q)||(partyOf(id)&&norm(partyOf(id).name).includes(q)))) return false;
    if(invFilter==="loose") return !state.guests[id].partyId;
    if(invFilter==="in") return state.guests[id].partyId===cur;
    return true;
  };
  return Object.keys(state.guests).filter(id=>ok(id)||invSticky.has(id))   // a row just ticked must not vanish under the finger
    .sort((a,b)=>guestName(a).localeCompare(guestName(b),"el",{sensitivity:"base",numeric:true}));
}
function renderPool(){
  const pool=$("pool"); pool.innerHTML="";
  renderInvBtn();
  if(invMode==="index"){ renderInvPanel(); return; }   // INDEX replaces the list entirely
  if(invMode==="fill"){ renderInvPanel(); renderTickList(pool); return; }
  const un=unseatedIds(), ids=visiblePoolIds(), hits=seatedHits();
  $("poolCount").textContent=tr("unseatedN",{n:un.length});
  $("mbCount").textContent=un.length;
  $("searchWrap").classList.toggle("has", !!searchQ);
  $("searchWrap").hidden = isNarrow() && !searchQ && document.activeElement!==$("guestSearch") && Object.keys(state.guests).length<8;   // phones: search only once the list needs it (it finds seated names too); PC: always
  if(ids.length===0 && !hits.length){
    const msg = searchQ ? escapeHtml(tr("noMatch")) : (state.activeGroupId&&un.length) ? escapeHtml(tr("poolEmptyGroup")) : (Object.keys(state.guests).length ? escapeHtml(tr("poolEmpty")) : tr("poolEmptyNew"));
    pool.innerHTML=`<div class="empty-note">${msg}</div>`;
    if(!Object.keys(state.guests).length) $("addNames").open=true;
    return;
  }
  const byParty=new Map(), singles=[];
  ids.forEach(id=>{ const p=partyOf(id); if(p){ if(!byParty.has(p.id)) byParty.set(p.id,{p,members:[]}); byParty.get(p.id).members.push(id); } else singles.push(id); });
  [...byParty.values()].sort((a,b)=>a.p.name.localeCompare(b.p.name)).forEach(({p,members})=>{ pool.appendChild(partyHeader(p, members, partyUnseated(p.id).length)); members.forEach(id=>pool.appendChild(makeChip(id, true))); });
  singles.forEach(id=>pool.appendChild(makeChip(id, false)));
  if(hits.length){ const cap=document.createElement("div"); cap.className="gm-cap"; cap.textContent=tr("seatedCap")+" · "+hits.length; pool.appendChild(cap);
    hits.slice(0,40).forEach(h=>pool.appendChild(makeSeatedHit(h)));
    if(hits.length>40){ const more=document.createElement("div"); more.className="empty-note"; more.textContent=tr("moreMatches",{n:hits.length-40}); pool.appendChild(more); } }
}
// Band C — THE LIST YOU TICK FROM, under its own heading, with three tabs that say in full words what each one
// filters and one quiet line that answers «το νούμερο 295 δε το βλέπω σε καμία από τις 3»: these count NAMES.
function renderTickList(pool){
  const gids=Object.keys(state.guests), cur=invOpenId;
  const nAll=gids.length, nLoose=gids.filter(id=>!state.guests[id].partyId).length, nIn=cur?partyMembers(cur).length:0;
  // heading + tabs are ONE sticky block: whatever he scrolls to, the list he is picking from carries its own label
  // and its own filter. Only the quiet explanatory line below scrolls away, once read.
  const head=document.createElement("div"); head.className="invpickhead";
  const band=document.createElement("div"); band.className="invband pick";
  band.innerHTML=`<span class="bt">${escapeHtml(tr("invBandPick"))}</span><span class="bn">${escapeHtml(tr("invBandPickN",{n:nAll}))}</span>`;
  head.appendChild(band);
  const seg=document.createElement("div"); seg.className="seg"; seg.id="invSeg";
  seg.innerHTML=[["all","invFilterAll",nAll],["loose","invFilterLoose",nLoose],["in","invFilterIn",nIn]]
    .map(([k,t,n])=>`<button type="button" data-f="${k}"${invFilter===k?' class="on"':""}><span class="lb">${escapeHtml(tr(t))}</span><span class="n">${n}</span></button>`).join("");
  seg.addEventListener("click",e=>{ const b=e.target.closest("[data-f]"); if(!b||b.dataset.f===invFilter) return;
    invFilter=b.dataset.f; invSticky.clear(); invSel=null; renderPool(); });           // a filter change clears the sticky set and the highlight
  head.appendChild(seg); pool.appendChild(head);
  const note=document.createElement("div"); note.className="invsegnote"; note.id="invSegNote";
  note.textContent=invSegNoteText(); pool.appendChild(note);
  // A name that already exists must never be offered as "create" — not even when the current filter hides it
  // (that silently made a second «Μαρία Παπαδοπούλου»). Test every guest, and pull the one that exists back
  // into view through invSticky so the typist sees it instead.
  const q0=searchQ.trim(), nq=norm(q0);
  const exact=q0?gids.find(id=>norm(guestName(id))===nq):null;
  if(exact) invSticky.add(exact);
  const ids=invTickIds(), seats=invSeats();
  if(!ids.length && !searchQ.trim()){ const d=document.createElement("div"); d.className="empty-note";
    d.innerHTML=nAll?escapeHtml(tr("noMatch")):tr("poolEmptyNew"); pool.appendChild(d); }
  const frag=document.createDocumentFragment();
  ids.forEach(id=>frag.appendChild(makeChip(id,{tick:true, seats})));
  pool.appendChild(frag);
  // the typed name is nobody on the list yet: create the guest AND file them, in one save and one undo step
  if(q0 && !exact && !ACCESS.ro){
    const b=document.createElement("button"); b.type="button"; b.className="invnew-guest"+(invSel==="__new"?" sel":"");
    b.dataset.gid="__new"; b.innerHTML=`${ICON("plus")}<span>${escapeHtml(tr("invNewGuest",{n:q0}))}</span>`;
    b.addEventListener("click",()=>invCreateGuest(q0));
    pool.appendChild(b);
  } else if(exact) invSel=exact;   // a duplicate is the worst failure mode: point at the row that exists, never offer a second one
}
function makeSeatedHit({id,t,i}){
  const row=document.createElement("div"); row.className="gchip seated"+(hasInv(id)?" hasinv":""); row.dataset.guestId=id; row.style.borderLeftColor=guestColor(id);
  row.innerHTML=`<span class="nm">${escapeHtml(guestName(id))}${statusTag(id)}</span><span class="to">→ ${escapeHtml(t.label)}</span>`;
  row.title=tr("dragTo",{t:t.label,n:i+1})+invTitle(id);
  row.addEventListener("click",()=>goToSeat(t.id,i));
  if(hasInv(id)) addInvPip(row, id);
  return row;
}
// A search hit: open that table (the usual glide + seat sheet) and show where the guest sits — the chair pulses, the row lights up.
function goToSeat(tid, i){
  if(!state.tables.some(x=>x.id===tid)) return;
  if(pick) setPick(null);
  focusTable(tid,{}); markSeat(i);
  const row=fSeats.querySelector(`.frow[data-i="${i}"]`);
  if(row){ row.classList.add("hit"); setTimeout(()=>row.classList.remove("hit"),2600);
    requestAnimationFrame(()=>{ const r=row.getBoundingClientRect(), fr=fSeats.getBoundingClientRect(); fSeats.scrollTop+=r.top-fr.top-(fr.height-r.height)/2; }); }
  const el=stage.querySelector(`.table[data-table-id="${tid}"] .seat[data-seat-index="${i}"]`);
  if(el){ el.classList.add("found"); setTimeout(()=>el.classList.remove("found"),2600); }
}
function partyHeader(p, members, total){

  h.innerHTML=`<span class="grip" title="${escapeHtml(tr("gripParty"))}">${ICON("grip")}</span><b>${escapeHtml(caseName(p.name))}</b><span class="n">${cnt}</span><button class="pedit" title="${escapeHtml(tr("invEditTip"))}">${ICON("plus")}</button>`;

  h.querySelector(".pedit").addEventListener("click",e=>{ e.stopPropagation(); enterInv(p.id); });   // the invitations editor, on this one: who is in it, rename, delete, add…
  h.addEventListener("click",()=>{ const same=pick&&pick.type==="party"&&pick.partyId===p.id; setPick(same?null:{type:"party",partyId:p.id}); });

// opts: {inParty} a .pparty member · {tick} a FILL tick row (no drag, no .acts, no grip — a tick can never delete a guest)
function makeChip(id, opts){
    const o=(opts&&typeof opts==="object")?opts:{inParty:!!opts};
    const col=guestColor(id);
    const chip=document.createElement("div");
    if(o.tick){
      const on=!!invOpenId && state.guests[id].partyId===invOpenId;
      const s=(o.seats||invSeats())[id], p=partyOf(id);
      // The accent dot is a BUTTON everywhere else (it opens the invitation); on a tick row the whole row is
      // invToggle(), so the same dot in the same corner would have added or removed the person instead — two
      // meanings for one mark, with no hover on touch to tell them apart. The dot goes; the annotation says it in
      // words instead, and now says BOTH facts, the seat and the invitation, never one hiding the other.
      const aSeat=s?`→ ${escapeHtml(s.t.label)}`:"", aInv=(p&&!on)?escapeHtml(tr("invInOther",{p:caseName(p.name)})):"";
      const ann=(aSeat||aInv)?`<span class="a1">${aSeat}</span>${aSeat&&aInv?'<span class="sep"> · </span>':""}<span class="a2">${aInv}</span>`:"";
      const annT=[s?tr("dragTo",{t:s.t.label,n:s.i+1}):"", (p&&!on)?tr("invInOther",{p:caseName(p.name)}):""].filter(Boolean).join(" · ");
      chip.className="gchip tickable"+(on?" on":"")+(invSel===id?" sel":"");
      chip.draggable=false; chip.dataset.guestId=id;
      chip.style.borderLeftColor=col; chip.style.background=on?"":hexTint(col);
      chip.title=(guestGroup(id)?guestGroup(id).name:"")+statusTitle(id)+invTitle(id);
      chip.innerHTML=`<span class="gtick">${on?"✓":""}</span><span class="nm">${escapeHtml(guestName(id))}${statusTag(id)}</span>`
        +(ann?`<span class="ann${aSeat&&aInv?" both":""}" title="${escapeHtml(annT)}">${ann}</span>`:"");
      chip.addEventListener("click",()=>invToggle(id));
      return chip;
    }
    chip.className="gchip"+(o.inParty?" inparty":"")+(hasInv(id)?" hasinv":""); chip.draggable=!ACCESS.ro; chip.dataset.guestId=id;
    chip.style.borderLeftColor=col; chip.style.background=hexTint(col);
    chip.title=(guestGroup(id)?guestGroup(id).name:"")+statusTitle(id)+invTitle(id);
    chip.innerHTML=`<span class="grip" title="${escapeHtml(tr("gripTitle"))}">${ICON("grip")}</span><span class="nm">${escapeHtml(guestName(id))}${statusTag(id)}</span><span class="acts"><button class="edit" title="${escapeHtml(tr("chipEdit"))}">${ICON("edit")}</button><button class="x" title="${escapeHtml(tr("chipRemove"))}">✕</button></span>`;
    if(pick && pick.from==="pool" && pick.guestId===id) chip.classList.add("picked");
    chip.addEventListener("dragstart",e=>{ dragData={type:"guest",guestId:id,from:"pool"}; e.dataTransfer.effectAllowed="move"; });
    chip.addEventListener("contextmenu",e=>{ e.preventDefault(); openGuestEditor(id,e); });
    chip.querySelector(".grip").addEventListener("click",e=>{ e.stopPropagation(); openPlaceMenu(id, anchorOf(e.currentTarget), null); });
    chip.addEventListener("click",e=>{
      if(e.target.closest(".acts")) return;
      const same = pick && pick.from==="pool" && pick.guestId===id;
      setPick(same ? null : {type:"guest",guestId:id,from:"pool"});
    });
    chip.querySelector(".edit").addEventListener("click",e=>{ e.stopPropagation(); openGuestEditor(id,e); });
    chip.querySelector(".x").addEventListener("click",e=>{ e.stopPropagation(); if(pick&&pick.guestId===id) setPick(null); delete state.guests[id]; pruneParties(invOpenId); save(); renderPool(); renderGroups(); updateStats(); toast(tr("tGuestRemoved")); });
    if(hasInv(id)) addInvPip(chip, id);   // the list's mark opens its invitation too
    return chip;
}
function updateStats(){

// Phone: the table chooser under the canvas — tap a chip to glide onto that table; "⤢ Όλα" comes back to the overview.
function renderStrip(seated,total){

function overview(){ unfocusTable(); setPick(null); requestAnimationFrame(()=>{ layoutCanvas(true); zoom=clamp(fitZoom(),0.1,2.5); applyZoom(); stagewrap.scrollTop=0; stagewrap.scrollLeft=0; }); }
// Phone overview: make the canvas exactly as tall as the floor fitted to the screen width, so the table list
// gets the rest instead of dead space. Once the user zooms in (>1.25× fit) the canvas takes over and the list shrinks.
function layoutCanvas(forceOverview){
  if(!isNarrow() || document.body.classList.contains("focused")){ stagewrap.style.height=""; stagewrap.style.flex=""; document.body.classList.remove("zoomed"); return; }
  const m=12, zf=Math.max(0.1,(stagewrap.clientWidth-2*m)/state.stage.w);
  const zoomedIn=!forceOverview && zoom>zf*1.25;
  document.body.classList.toggle("zoomed", zoomedIn);
  if(zoomedIn){ stagewrap.style.height=""; stagewrap.style.flex=""; return; }
  const avail=window.innerHeight-52;
  stagewrap.style.flex="none"; stagewrap.style.height=clamp(Math.round(state.stage.h*zf+2*m+10), 200, Math.round(avail*0.62))+"px";
}

function suggestPartyName(ids){   // an existing invitation among the picked names, else the surname most of them share — stored spelling (the Aa mode is applied on display)
  for(const id of ids){ const p=partyOf(id); if(p) return p.name; }
  const perStem={}, perTok={};
  for(const id of ids){ const nm=rawName(id), st=surnameStems(nm)[0]; if(!st) continue;
    perStem[st]=(perStem[st]||0)+1;
    const tok=nm.split(/\s*[+&]\s*/)[0].split(/[^\p{L}\p{M}]+/u).find(w=>upperGreek(w).startsWith(st));
    if(tok){ const k=st+"|"+tok; perTok[k]=(perTok[k]||0)+1; } }
  const top=Object.keys(perStem).sort((a,b)=>perStem[b]-perStem[a])[0];
  if(top){ const best=Object.keys(perTok).filter(k=>k.startsWith(top+"|")).sort((a,b)=>perTok[b]-perTok[a]||b.length-a.length)[0]; if(best) return best.slice(top.length+1); }
  for(const id of ids){ const t=surnameToken(rawName(id)); if(t) return t; } return "";
}
function partySelIds(){   // only names still seated at the picked table — ×, undo or a grip move may have taken one away

// ensureParty() has always REUSED an invitation whose normalised name matches; he simply could not see it. Now the

function invByName(v){ const nm=String(v||"").trim(); if(!nm) return null; return (state.parties||[]).find(x=>norm(x.name)===norm(nm))||null; }

function psAlreadyIn(){   // members of that invitation seated at THIS table and not among the ones he is ticking now
  const out=new Set(); if(!partySel) return out;
  const p=psExisting(); if(!p) return out;
  const t=state.tables.find(x=>x.id===partySel.tableId); if(!t) return out;
  t.seats.forEach(id=>{ if(id && state.guests[id] && state.guests[id].partyId===p.id && !partySel.ids.has(id)) out.add(id); });
  return out;
