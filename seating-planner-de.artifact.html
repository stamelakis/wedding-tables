function matSwatchesHtml(current){ return `<div class="fm-mats">`+Object.keys(MATERIALS).map(k=>`<div class="fm-mat${k===current?' on':''}" data-mat="${k}" title="${escapeHtml(matName(k))}"><span class="sw" data-mat="${k}"></span></div>`).join("")+`</div>`; }
function paintSwatches(menu){ menu.querySelectorAll(".sw").forEach(sw=>applyMaterial(sw, sw.dataset.mat)); }
function closeFeatureMenu(){ $("featuremenu").style.display="none"; }
// Re-order a feature within the stack (array order = paint order; first = back, last = front).
function moveFeature(f, dir){
  if(featLocked(f)){ lockedToast("decor"); return; }
  const arr=state.features, i=arr.indexOf(f); if(i<0) return;
  arr.splice(i,1);
  const j = dir==="back"?0 : dir==="front"?arr.length : dir==="backward"?Math.max(0,i-1) : Math.min(arr.length,i+1);
  arr.splice(j,0,f); save(); renderFeatures();
}
function openFeatureMenu(f, evt){
  if(featLocked(f)){ lockedToast("decor"); return; }
  const menu=$("featuremenu");
  let html="";
  if(f.kind==="zone") html+=`<div class="gm-cap">${escapeHtml(tr("fmSurface"))}</div>`+matSwatchesHtml(f.material||"grass");
  html+=`<div class="gm-cap">${escapeHtml(tr("fmLayer"))}</div>`;
  html+=`<div class="gm-item" data-act="back">${escapeHtml(tr("fmBack"))}</div><div class="gm-item" data-act="backward">${escapeHtml(tr("fmBackward"))}</div>`;
  html+=`<div class="gm-item" data-act="forward">${escapeHtml(tr("fmForward"))}</div><div class="gm-item" data-act="front">${escapeHtml(tr("fmFront"))}</div>`;
  html+=`<div class="gm-sep"></div><div class="gm-item" data-act="rename">${ICON("edit")}${escapeHtml(tr("fmRename"))}</div><div class="gm-item danger" data-act="delete">${ICON("trash")}${escapeHtml(tr("fmDelete"))}</div>`;
  menu.innerHTML=html; paintSwatches(menu);
  menu.querySelectorAll(".fm-mat").forEach(m=>m.onclick=()=>{ f.material=m.dataset.mat; save(); renderFeatures(); closeFeatureMenu(); });
  ["back","backward","forward","front"].forEach(dir=>{ const el=menu.querySelector(`[data-act="${dir}"]`); if(el) el.onclick=()=>{ moveFeature(f,dir); closeFeatureMenu(); }; });
  menu.querySelector('[data-act="rename"]').onclick=()=>{ const nm=prompt(tr("fmLabelPrompt"), f.label||""); if(nm!==null){ f.label=nm.slice(0,80); save(); renderFeatures(); } closeFeatureMenu(); };
  menu.querySelector('[data-act="delete"]').onclick=()=>deleteFeature(f);
  showPopover(menu,evt);
}
// Right-click the empty space → change the whole floor
function openStageMenu(evt){
  const menu=$("featuremenu");
  menu.innerHTML=`<div class="gm-cap">${escapeHtml(tr("fmStage"))}</div>`+matSwatchesHtml(state.stageMaterial||"grass"); paintSwatches(menu);
  menu.querySelectorAll(".fm-mat").forEach(m=>m.onclick=()=>{ state.stageMaterial=m.dataset.mat; $("stageFloor").value=m.dataset.mat; applyStage(); save(); closeFeatureMenu(); });
  showPopover(menu,evt);
}
stage.addEventListener("contextmenu",e=>{ if(e.target===stage){ e.preventDefault(); if(can("floor")) openStageMenu(e); } });
function initFloorSelect(){
  const sel=$("stageFloor");
  sel.innerHTML=Object.keys(MATERIALS).map(k=>`<option value="${k}">${escapeHtml(matName(k))}</option>`).join("");
  sel.value=state.stageMaterial||"grass";
  sel.addEventListener("change",()=>{ if(!can("floor")){ sel.value=state.stageMaterial||"grass"; lockedToast("floor"); return; } state.stageMaterial=sel.value; applyStage(); save(); });
}
function visibleCenter(){   // centre of the visible part of the canvas, in stage coordinates
  const m=isNarrow()?12:24, box=visibleBox();
  return { x:Math.round((stagewrap.scrollLeft + box.w/2 - m)/zoom), y:Math.round((stagewrap.scrollTop + box.h/2 - m)/zoom) };
}
function addDecor(item){
  const c=visibleCenter();
  state.features.push({ id:"f"+nextId(), kind:item.kind||"prop",
    x:clamp(c.x,60,state.stage.w-60), y:clamp(c.y,60,state.stage.h-60),
    w:item.w, h:item.h, label:item.label, icon:item.icon||null, material:item.material||null,
    ...(ACCESS.owner==="venue"?{by:ACCESS.role==="venue"?"venue":"couple"}:{}) });   // who placed it decides who may move it later
  save(); renderFeatures(); toast(tr("decorAdded",{n:item.label}));
}
function initDecor(){
  const grid=$("decorGrid");
  grid.innerHTML=DECOR_ITEMS.map((it,i)=>`<div class="decor-item" data-i="${i}"><div class="di">${it.icon}</div><div>${escapeHtml(it.label)}</div></div>`).join("");
  grid.querySelectorAll(".decor-item").forEach(el=>el.addEventListener("click",()=>{ addDecor(DECOR_ITEMS[+el.dataset.i]); closeDecor(); }));
}
function openDecor(){ setNav(false); $("decorModal").classList.add("open"); }
function closeDecor(){ $("decorModal").classList.remove("open"); }
$("decorBtn").addEventListener("click",openDecor);
$("decorClose").addEventListener("click",closeDecor);

function currentProfile(){ return profiles.profiles.find(p=>p.id===profiles.activeId); }
function renderProfiles(){
  const sel=$("profileSelect");
  sel.innerHTML=profiles.profiles.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("");
  sel.value=profiles.activeId;
  const cur=profiles.profiles.find(p=>p.id===profiles.activeId); $("planName").querySelector(".txt").textContent=cur?cur.name:"";   // phone label
}
function loadActive(){
  unfocusTable();
  const lp=currentProfile();
  let st=null; if(lp&&lp.support&&lp._mem){ try{ st=JSON.parse(lp._mem); sanitizePlan(st); if(st.layoutVersion!==LAYOUT_VERSION) migrateLayout(st); }catch(e){ st=null; } }
  state=st||loadPlan(profiles.activeId)||defaultState(); uid=state._uid||2001; fontScale=state.seatFontScale||1;
  applyAccess();
  applyStage(); $("stageFloor").value=state.stageMaterial||"grass";
  renderProfiles(); renderAll(); resetHistory(); flushLabNote();
  setTimeout(()=>{ zoom=initialZoom(); applyZoom(); },30);
}
function switchProfile(id){ save();
  const snap=pendingSnap; if(snap){ pendingSnap=null; clearTimeout(cloudTimer); cloudTimer=null; cloudPush(snap).catch(()=>{}); }
  profiles.activeId=id; saveProfilesIdx(); setPick(null); loadActive();
  pullIfNewer(); }
function newProfile(){
  const name=prompt(tr("promptNewProfile"),"");
  if(name===null) return;
  save();
  const id=newProfileId();
  profiles.profiles.push({id, name:(name.trim()||tr("weddingN",{n:profiles.profiles.length+1}))});
  profiles.activeId=id; saveProfilesIdx();
  state=defaultState(); uid=state._uid; fontScale=1;
  try{ localStorage.setItem(planKey(id), JSON.stringify(state)); }catch(e){}
  loadActive(); toast(tr("tProfileCreated"));
}
function renameProfile(){ const p=currentProfile(); const nm=prompt(tr("promptRenameProfile"),p.name); if(nm&&nm.trim()){ p.name=nm.trim(); saveProfilesIdx(); renderProfiles(); save(); } }
function duplicateProfile(){
  save(); const p=currentProfile(); const id=newProfileId();
  const copy=JSON.parse(JSON.stringify(state)), cut=labTrim(copy,false,tableCapFor({}));   // the copy lives on this device only: 8 guest tables
  try{ localStorage.setItem(planKey(id), JSON.stringify(copy)); }catch(e){}
  profiles.profiles.push({id, name:p.name+tr("copySuffix")}); profiles.activeId=id; saveProfilesIdx(); loadActive(); toast(tr("tProfileCopied"));
  if(cut) labCapNote(tr("labCapCut",{n:LAB_MAX_TABLES,k:cut}));
}
function deleteProfile(){
  if(profiles.profiles.length<=1){ toast(tr("keepOne")); return; }
  const p=currentProfile(); if(!confirm(tr("confirmDeleteProfile",{n:p.name}))) return;
  try{ localStorage.removeItem(planKey(p.id)); }catch(e){}
  profiles.profiles=profiles.profiles.filter(x=>x.id!==p.id);
  profiles.activeId=profiles.profiles[0].id; saveProfilesIdx(); loadActive(); toast(tr("tProfileDeleted"));
}
function importPlanAsProfile(s, suggestedName){
  sanitizePlan(s);
  if(s.layoutVersion!==LAYOUT_VERSION) migrateLayout(s);
  const cut=labTrim(s,false,tableCapFor({}));   // a new plan on this device (and the lab) keeps the first 8 guest tables of a bigger plan (their people stay on the list)
  const name=(s._profileName||suggestedName||tr("importedPlan")); delete s._profileName;
  const id=newProfileId();
  try{ localStorage.setItem(planKey(id), JSON.stringify(s)); }catch(e){}
  profiles.profiles.push({id, name}); profiles.activeId=id; saveProfilesIdx(); loadActive();
  toast(tr("tImported",{n:name}));
  if(cut) labCapNote(tr("labCapCut",{n:LAB_MAX_TABLES,k:cut}));
}
function openProfileMenu(evt){

try{ const ts=$("toolsSec"); if(isNarrow()) ts.open=localStorage.getItem("weddingSeatingPlanner.tools")==="1";

// One-time hints. Hold-to-move shows the first time a finger tries to DRAG a table and the floor pans instead (not on a tap —
// the freshly opened sheet must not get a toast on top). The Enter hint is one line inside the sheet until the first name is seated.
const HINT_HOLD="weddingSeatingPlanner.hint.hold", HINT_ENTER="weddingSeatingPlanner.hint.enter";
function seenHint(k){ try{ return !!localStorage.getItem(k); }catch(e){ return true; } }
function markHint(k){ try{ localStorage.setItem(k,"1"); }catch(e){} }   // hints are re-evaluated on the next sheet open, not mid-typing
function hintHold(){ if(!isTouch || seenHint(HINT_HOLD)) return; markHint(HINT_HOLD); toast(tr("holdToMove"),4000); }
// Tips: one card at a time, each shown once per device, only at the moment the action becomes useful (see checkTips).
const TIP_KEY="weddingSeatingPlanner.tips"; let tipsSeen={}, tipTimer=null, tipPending=null;
try{ tipsSeen=JSON.parse(localStorage.getItem(TIP_KEY)||"{}")||{}; }catch(e){ tipsSeen={}; }
function tipText(k){ if(k.startsWith("date.")) return tr("dateNudge"); const t={ move:isTouch?tr("tipMoveTouch"):tr("tipMove"), pick:isTouch?tr("tipPickTouch"):tr("tipPick"), groups:tr("tipGroups"), full:can("seats")?tr("tipFull"):tr("tipFullLocked"), print:tr("tipPrint"), inv:tr("invTip"), invseat:tr("invSeatsUnchanged") }; return t[k]||""; }
function showTip(key){
  if(tipsSeen[key]) return false;
  const el=$("tip"); if(!el || !el.hidden || tour || document.querySelector(".modal-back.open")) return false;   // not now — the trigger will come round again
  if(isNarrow() && (document.body.classList.contains("kb") || document.body.classList.contains("nav-open"))){ tipPending=key; return false; }   // would sit on the sheet head / the drawer: show it when they go
  tipsSeen[key]=1; try{ localStorage.setItem(TIP_KEY, JSON.stringify(tipsSeen)); }catch(e){}
  const act=key.startsWith("date.")?[tr("dateNudgeGo"),()=>{ hideTip(); openAccess(); }]:null;
  el.innerHTML=`${ICON("bulb")}<span class="tt">${escapeHtml(tipText(key))}</span>${act?`<button class="ta">${escapeHtml(act[0])}</button>`:""}<button class="tx" title="${escapeHtml(tr("close"))}">✕</button>`;
  el.hidden=false; el.querySelector(".tx").onclick=hideTip; if(act) el.querySelector(".ta").onclick=act[1];
  clearTimeout(tipTimer); tipTimer=setTimeout(hideTip, 9000);
  return true;
}
function hideTip(){ const el=$("tip"); if(el) el.hidden=true; clearTimeout(tipTimer); }
function flushTip(){ const k=tipPending; tipPending=null; if(k) setTimeout(()=>showTip(k),300); }   // after the sheet/drawer transition
function checkTips(why){
  const guests=Object.values(state.guests), n=guests.length, seated=assignedGuestIds().size;
  if(why==="seated" && showTip("move")) return;
  if(why==="added" && showTip("pick")) return;
  if(why==="full" && showTip("full")) return;
  if(n>=6 && !guests.some(g=>g.groupId) && showTip("groups")) return;
  if(n>=10 && !ACCESS.ro && !guests.some(g=>g.partyId) && showTip("inv")) return;   // ten names in and not one invitation: say what they are for
  if(n>=20 && seated>=0.8*n) showTip("print");
}
function renderSheetHint(){ const el=$("fHint"); if(!el) return; el.hidden=!(focusedTable() && !seenHint(HINT_ENTER) && !ACCESS.ro); if(!el.hidden) el.textContent=tr("hintEnter"); }

// ---- tap to place: HTML5 drag & drop never fires on touch, so this is the phone's way to seat anyone ----
let pick=null;   // {type,guestId,from,tableId,seatIndex}
function setPick(p){
  if(ACCESS.ro) p=null;   // read only: nothing to pick up
  pick=p||null;
  document.body.classList.toggle("picking", !!pick);
  stage.querySelectorAll(".seat.picked").forEach(el=>el.classList.remove("picked"));

  renderPickBar(); renderPool();
  if(pick && isNarrow()) setNav(false);   // reveal the seats they're aiming at
}
function renderPickBar(){
  const bar=$("pickbar");
  if(!pick){ bar.innerHTML=""; return; }
  const isParty=pick.type==="party";
  const label=isParty?tr("pbParty",{n:partyName(pick.partyId), c:partyUnseated(pick.partyId).length}):guestName(pick.guestId);
  bar.innerHTML=`<span class="pbname">${escapeHtml(label)}</span>
    <span class="pbhint">${escapeHtml(tr("pbHint"))}</span>
    ${isParty?"":`<button data-a="edit" title="${escapeHtml(tr("pbEdit"))}">${ICON("edit")}</button>`}
    ${pick.from==="seat"?`<button data-a="unseat">${escapeHtml(tr("pbUnseat"))}</button>`:""}
    <button data-a="cancel" title="${escapeHtml(tr("pbCancel"))}">✕</button>`;
  bar.querySelector('[data-a="cancel"]').onclick=()=>setPick(null);

  const un=bar.querySelector('[data-a="unseat"]');
  if(un) un.onclick=()=>{ const t=state.tables.find(x=>x.id===pick.tableId); if(t) t.seats[pick.seatIndex]=null; setPick(null); save(); renderTables(); renderPool(); };
}
function placePick(tableId,seatIndex){ const p=pick; setPick(null); if(p.type==="party") placePartyInTable(p.partyId,tableId,seatIndex); else placeGuestInSeat(p,tableId,seatIndex); }

// ---- pinch to zoom on the canvas (two fingers) ----
// While a zoom gesture runs, the stage gets will-change:transform so the compositor scales a cached layer
// instead of re-painting 2100×1400 px of floor on every frame.
let zoomingTimer=null;
function markZooming(){ document.body.classList.add("zooming"); clearTimeout(zoomingTimer); zoomingTimer=setTimeout(()=>document.body.classList.remove("zooming"),450); }
(function(){
  const wrap=stagewrap;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const mid =t=>({ x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 });
  let base=null, pending=null, raf=null;
  wrap.addEventListener("touchstart",e=>{
    if(e.touches.length!==2){ base=null; return; }
    if(activeDragCancel && !pointerGesture) activeDragCancel();   // a second finger cancels a pending long-press
    if(pointerGesture){ base=null; return; }
    const m=mid(e.touches), r=wrap.getBoundingClientRect();
    base={ d:dist(e.touches)||1, z:zoom, cx:(wrap.scrollLeft+m.x-r.left)/zoom, cy:(wrap.scrollTop+m.y-r.top)/zoom };
    markZooming();
  },{passive:true});
  wrap.addEventListener("touchmove",e=>{
    if(!base||e.touches.length!==2) return;
    e.preventDefault();
    const m=mid(e.touches), r=wrap.getBoundingClientRect();
    pending={ z:clamp(base.z*dist(e.touches)/base.d, 0.2, 2.5), mx:m.x-r.left, my:m.y-r.top };
    if(!raf) raf=requestAnimationFrame(()=>{ raf=null; const p=pending; if(!p||!base) return; markZooming();   // one layout per frame, not per touch event
      zoom=p.z; applyZoom(); wrap.scrollLeft=base.cx*zoom-p.mx; wrap.scrollTop=base.cy*zoom-p.my; });
  },{passive:false});
  const end=e=>{ if(e.touches.length<2) base=null; };
  wrap.addEventListener("touchend",end,{passive:true});
  wrap.addEventListener("touchcancel",end,{passive:true});
})();
// ---- ctrl/⌘ + wheel zooms around the cursor (desktop) ----
stagewrap.addEventListener("wheel",e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  e.preventDefault(); markZooming();
  const r=stagewrap.getBoundingClientRect(), m=isNarrow()?12:24;
  const cx=(stagewrap.scrollLeft+e.clientX-r.left-m)/zoom, cy=(stagewrap.scrollTop+e.clientY-r.top-m)/zoom;
  zoom=clamp(zoom*(e.deltaY<0?1.1:0.9), 0.2, 2.5); applyZoom();
  stagewrap.scrollLeft=m+cx*zoom-(e.clientX-r.left); stagewrap.scrollTop=m+cy*zoom-(e.clientY-r.top);
},{passive:false});
// Zoom buttons keep the centre of the visible floor where it is.
function zoomBy(f){ const c=visibleCenter(); markZooming(); viewTo(c.x, c.y, clamp(zoom*f, 0.2, 2.5), false); }
window.addEventListener("resize",()=>applyZoom());

// ============================================================
//  DRAG & DROP (guests between seats / pool) + seat taps
// ============================================================
let dragData=null;
function wireSeat(seat){
  const tableId=+seat.dataset.tableId, idx=+seat.dataset.seatIndex;
  seat.addEventListener("dragstart",e=>{ if(!seat.classList.contains("occupied"))return; dragData={type:"guest", guestId:seat.dataset.guestId, from:"seat", tableId, seatIndex:idx}; e.dataTransfer.effectAllowed="move"; e.stopPropagation(); });
  seat.addEventListener("dragover",e=>{ if(dragData&&(dragData.type==="guest"||dragData.type==="party")){ e.preventDefault(); seat.classList.add("dragover"); }});
  seat.addEventListener("dragleave",()=>seat.classList.remove("dragover"));
  seat.addEventListener("drop",e=>{ e.preventDefault(); e.stopPropagation(); seat.classList.remove("dragover"); if(dragData&&dragData.type==="guest"){ placeGuestInSeat(dragData,tableId,idx); dragData=null; } else if(dragData&&dragData.type==="party"){ placePartyInTable(dragData.partyId,tableId,idx); dragData=null; } });
  seat.addEventListener("click",e=>{
    e.stopPropagation();
    if(performance.now()-seatDragEndedAt<500) return;   // the click that trails a lift is not a tap
    if(pick){ placePick(tableId,idx); return; }
    const occ=seat.classList.contains("occupied");
    if(occ && isTouch && !ACCESS.ro){ setPick({type:"guest",guestId:seat.dataset.guestId,from:"seat",tableId,seatIndex:idx}); return; }   // touch: pick up to move
    focusTable(tableId,{row:idx});                                                                                        // otherwise: type in the names panel
  });
  // Mouse: right-click edits. Touch: a long press MOVES the name (seatHold) — editing lives in the pick bar, never two things at once.
  seat.addEventListener("contextmenu",e=>{ if(seat.classList.contains("occupied")){ e.preventDefault(); e.stopPropagation(); if(!isTouch) openGuestEditor(seat.dataset.guestId,e); } });
  if(isTouch) seat.addEventListener("pointerdown",e=>{ if(e.pointerType==="touch" && seat.classList.contains("occupied") && !ACCESS.ro) seatHold(e, seat, tableId, idx); });
}
// Touch: hold a seated name ~⅓ s → it lifts and follows the finger; release over another chair to move (or swap) it.
// Before the lift the finger pans the floor as usual (touch-action), so nothing happens by accident.
let seatDragEndedAt=0, holdArmed=false;
// Android fires a contextmenu ~400 ms into a still long press (that was the "edit menu on top of the move" bug): swallow it for the whole hold.
function blockCtxMenu(){ const h=ev=>{ ev.preventDefault(); ev.stopPropagation(); }; document.addEventListener("contextmenu",h,true); return ()=>document.removeEventListener("contextmenu",h,true); }
function seatHold(e, seat, tableId, idx){

function seatNeighbours(t,i){   // who physically sits next to seat i (head table: a row 0..top-1 with the two ends at its corners)
  const cnt=t.capacity;
  if(t.shape==="rect"){ const per=Math.ceil(cnt/2), b=i>=per, k=b?i-per:i, len=b?cnt-per:per, base=b?per:0, r=[];   // same side left/right, then across
    if(k>0) r.push(base+k-1); if(k<len-1) r.push(base+k+1); const o=b?k:per+k; if(o<cnt) r.push(o); return r; }
  if(t.shape!=="head") return [(i+1)%cnt,(i-1+cnt)%cnt];
  const top=Math.max(1,cnt-2), li=top, ri=top+1;
  if(i===li) return [0]; if(i===ri) return [top-1];
  const r=[]; if(i>0) r.push(i-1); else if(li<cnt) r.push(li); if(i<top-1) r.push(i+1); else if(ri<cnt) r.push(ri); return r;

function freeSeatFor(t){

function labTrim(s, emptyOnly, capped){   // capped: whether the plan it goes into is limited (default: the plan on screen)
  if(!(capped===undefined?tableCapFor(currentProfile()):capped)||!s||!Array.isArray(s.tables)) return 0;
  let over=guestTableCount(s.tables)-LAB_MAX_TABLES, cut=0; if(over<=0) return 0;
  const head=s.tables.find(t=>t.shape==="head");
  if(emptyOnly){ for(let i=s.tables.length-1;i>=0&&over>0;i--){ const t=s.tables[i]; if(t!==head && !(t.seats||[]).some(Boolean)){ s.tables.splice(i,1); over--; cut++; } } return cut; }
  let kept=0; s.tables=s.tables.filter(t=>{ if(t===head) return true; if(kept<LAB_MAX_TABLES){ kept++; return true; } cut++; return false; });
  return cut;
}

function autoSeat(){   // whole invitations first, then families (names sharing a surname inside one colour group), then singles — each chunk goes to the table with its own kind, else the first table with room
  const un=unseatedIds(); if(!un.length){ toast(tr("tNoSeats")); return; }
  const stemsOf={}; const stems=id=>stemsOf[id]||(stemsOf[id]=surnameStems(rawName(id)));
  const chunks=[], seenP=new Set(), rest=[];
  un.forEach(id=>{ const p=state.guests[id].partyId; if(p){ if(!seenP.has(p)){ seenP.add(p); chunks.push({ids:un.filter(x=>state.guests[x].partyId===p), pid:p}); } } else rest.push(id); });
  const parent={}; const find=x=>parent[x]===x?x:(parent[x]=find(parent[x])); rest.forEach(id=>{ parent[id]=id; });
  const byKey={}; rest.forEach(id=>{ const g=state.guests[id].groupId||""; stems(id).forEach(st=>{ const k=g+"|"+st; if(byKey[k]) parent[find(id)]=find(byKey[k]); else byKey[k]=id; }); });
  const fam={}; rest.forEach(id=>{ const r=find(id); (fam[r]=fam[r]||[]).push(id); }); Object.values(fam).forEach(ids=>chunks.push({ids}));
  const tables=state.tables.filter(t=>t.shape!=="head"), freeIdx=t=>t.seats.map((x,i)=>x?null:i).filter(i=>i!=null);
  const seatedP=new Set(); tables.forEach(t=>t.seats.forEach(id=>{ const p=id&&state.guests[id]&&state.guests[id].partyId; if(p) seatedP.add(p); }));
  const home=c=>(c.pid&&seatedP.has(c.pid))?0:1, gkey=c=>String(state.guests[c.ids[0]].groupId||"\uffff");
  chunks.sort((a,b)=>home(a)-home(b)||(b.ids.length-a.ids.length)||gkey(a).localeCompare(gkey(b)));   // the rest of a seated invitation first (its table still has the room), then the bigger chunks (a family needs a whole block), then colour group
  const affinity=(t,c)=>{ const here=t.seats.filter(id=>id&&state.guests[id]); if(!here.length) return 0;
    const g=state.guests[c.ids[0]].groupId||null, cst=new Set(c.ids.flatMap(stems)); let sc=0;
    if(c.pid&&here.some(id=>state.guests[id].partyId===c.pid)) sc+=8;          // the rest of the invitation sits here
    if(here.some(id=>stems(id).some(x=>cst.has(x)))) sc+=4;                       // same surname at this table
    sc+=here.some(id=>(state.guests[id].groupId||null)===g)?2:-3;                 // own colour group here / only strangers
    return sc; };
  let placed=0; const leftovers=[];
  for(const c of chunks){
    const fit=tables.filter(t=>freeIdx(t).length>=c.ids.length); if(!fit.length){ leftovers.push(...c.ids); continue; }
    fit.sort((a,b)=>affinity(b,c)-affinity(a,c)||(tables.indexOf(a)-tables.indexOf(b)));
    const seats=blockSeats(fit[0], c.ids.length); c.ids.forEach((id,k)=>{ fit[0].seats[seats[k]]=id; placed++; });
  }
  for(const t of tables.slice().sort((a,b)=>freeIdx(b).length-freeIdx(a).length)){ const free=freeIdx(t); while(free.length&&leftovers.length){ t.seats[free.shift()]=leftovers.shift(); placed++; } }   // bigger than any free block: split over the emptiest tables
  save(); renderTables(); renderPool(); toast(placed?tr("tAutoSeated",{n:placed}):tr("tNoSeats"));
  checkTips("placed");
}
// k free chairs that sit together: grown seat by seat through seatNeighbours (round: a run; long table: along a side and across),
// else — a fragmented table — each next to the ones already chosen where possible. The caller checked that k chairs are free.
function blockSeats(t, k){
  const free=t.seats.map((x,i)=>x?null:i).filter(i=>i!=null), isFree=i=>!t.seats[i];
  for(const s of free){ const got=[s];
    while(got.length<k){ const nx=got.flatMap(i=>seatNeighbours(t,i)).find(j=>isFree(j)&&!got.includes(j)); if(nx==null) break; got.push(nx); }
    if(got.length===k) return got; }
  const got=[]; while(got.length<k){ const nx=got.flatMap(i=>seatNeighbours(t,i)).find(j=>isFree(j)&&!got.includes(j)); got.push(nx!=null?nx:free.find(j=>!got.includes(j))); }
  return got;
}

function mergePlanInto(src, mode){

  if(mode==="replaceAll"){
    delete src._profileName; src._uid=Math.max(src._uid||0, uid);
    const cut=labTrim(src);   // a capped plan (lab / this device only): the first 8 guest tables
    restoreSnapshot(JSON.stringify(src)); uid=state._uid||uid; save();   // save() stacks the previous state, so ↶ brings it back
    toast(tr("tMergedPlan",{g:Object.keys(state.guests).length, t:state.tables.length})); if(cut) labCapNote(tr("labCapCut",{n:LAB_MAX_TABLES,k:cut})); return;
  }

  (src.groups||[]).forEach(sg=>{ let g=state.groups.find(x=>norm(x.name)===norm(sg.name));
    if(!g){ g={id:"grp"+nextId(), name:sg.name, color:sg.color||GROUP_PALETTE[state.groups.length%GROUP_PALETTE.length]}; state.groups.push(g); } gmap[sg.id]=g.id; });
  const pmap={}; (src.parties||[]).forEach(sp=>{ const p=ensureParty(sp.name); if(p) pmap[sp.id]=p.id; });
  const idmap={}; let gCount=0;
  Object.keys(src.guests||{}).forEach(sid=>{ const sg=src.guests[sid]; const nid="g"+nextId();
    state.guests[nid]={ name:sg.name, groupId:(sg.groupId&&gmap[sg.groupId])||null, partyId:(sg.partyId&&pmap[sg.partyId])||null, ...(sg.status?{status:sg.status}:{}), ...(sg.note?{note:sg.note}:{}) };
    idmap[sid]=nid; gCount++; });

  const addTable=st=>{ const t={...st, id:nextId(), seats:remap(st.seats)};
    if(t.shape!=="head"){ const m=maxSeatsFor(t); if(t.capacity>m){ t.capacity=m; t.seats=t.seats.slice(0,m); } }   // the venue's seat maximum: extra guests stay visibly unseated   // a new table steps aside if the spot is taken (a file exported from this very plan lands on top of it)

    src.tables.forEach(st=>{ if(!labCanAdd(st.shape)){ labCut++; return; } addTable(st); tCount++; added++; });   // capped plans: up to 8 guest tables, in file order
  }

    const used=new Set(), pairs=src.tables.map(st=>{ const t=state.tables.find(x=>!used.has(x.id)&&x.shape===st.shape&&norm(x.label)===norm(st.label)); if(t) used.add(t.id); return [st,t||null]; });
    pairs.forEach(p=>{ if(p[1]) return; const t=state.tables.find(x=>!used.has(x.id)&&x.shape===p[0].shape); if(t){ used.add(t.id); p[1]=t; } });   // never a round table onto the head table

      if(!t){ if(can("tables")){ if(!labCanAdd(st.shape)){ labCut++; return; } addTable(st); tCount++; added++; } return; }   // no new tables when the venue fixed them (or the lab is full): those guests stay in the list
      const seats=remap(st.seats), need=seats.reduce((m,x,i)=>x?i+1:m,0); if(need>t.capacity && can("seats")){ t.capacity=Math.min(30,need,Math.max(t.capacity,maxSeatsFor(t))); grown++; }

  }
  pruneParties(); sanitizePlan(state); save(); renderAll();
  toast(tr("tMergedPlan",{g:gCount, t:tCount})+(mode==="replaceSeating"&&added?tr("tMergedPlanAdded",{a:added}):"")+(mode==="replaceSeating"&&grown?tr("tMergedPlanGrown",{c:grown}):""), 5000);
  if(labCut) labCapNote(tr("labCapSkip",{k:labCut}));
}

  table:["τραπέζι","table","tisch"], group:["ομάδα","group","gruppe"], party:["προσκλητήριο","πρόσκληση","invitation","party","einladung"],

function parseDelimited(text){   // CSV / TSV / Excel cells → rows of trimmed cells; the separator (tab, ;, ,) is guessed from the first lines

  const outside=(l,c)=>{ let n=0,q=false; for(const ch of l){ if(ch==='"') q=!q; else if(ch===c&&!q) n++; } return n; };
  const sample=text.split("\n").filter(l=>l.trim()).slice(0,30);

    if(ch==='"' && !cell.trim()){ q=true; cell=""; continue; }
    if(sep && ch===sep){ row.push(cell); cell=""; continue; }
    if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; continue; }
    cell+=ch; }
  if(cell||row.length){ row.push(cell); rows.push(row); }

async function doRecover(st){
  const go=$("recGo"); if(go) go.disabled=true;
  let d=null, status=0;
  try{ const r=await fetch(SYNC_URL+"/recover/couple",{method:"POST",headers:{"Content-Type":"application/json","X-Client":"2"},body:JSON.stringify({token:st.token, nonce:st.nonce})}); status=r.status; d=await r.json().catch(()=>null); }catch(e){}
  const plans=(d&&Array.isArray(d.plans))?d.plans.filter(x=>x&&PLAN_ID_RE.test(String(x.id))&&x.editKey):[];
  if(!plans.length){
    if(d&&d.error==="token_expired") renderRecover({step:"msg", text:tr("recExpired"), again:true});
    else if(status===404||status===410||(d&&d.plans)) renderRecover({step:"msg", text:tr("recUsed"), again:true});
    else renderRecover({step:"msg", text:tr("claimFail"), retry:()=>doRecover(st)});
    return; }
  const fresh=new Set();
  const profs=plans.map(x=>{ let prof=profiles.profiles.find(q=>q.cloudId===x.id&&!q.support);
    if(!prof){ prof={ id:newProfileId()+"r"+x.id.slice(0,4), name:x.name||tr("ourWedding"), cloudId:x.id, cloudUpdated:0 }; profiles.profiles.push(prof); fresh.add(prof); }
    Object.assign(prof,{ editKey:x.editKey, viewKey:x.readKey||"", role:"couple", owner:"couple", readonly:false, _lostShown:false });
    return prof; });
  const main=profs[0]; profiles.activeId=main.id; saveProfilesIdx(); loadActive();
  try{ const pd=await cloudFetch(main.cloudId, main); applyPulledPlan(main,pd); }catch(e){}
  profs.forEach(q=>{ if(fresh.has(q)) registerUnderCode(q); }); renderProfiles(); setCloudDot("ok");
  renderClaim({step:"done", prof:main, lead:tr("recDone",{n:main.name})});
}
async function doVerify(st){
  const go=$("verGo"); if(go) go.disabled=true;
  let d=null, status=0; try{ const r=await fetch(SYNC_URL+"/verify",{method:"POST",headers:{"Content-Type":"application/json","X-Client":"2"},body:JSON.stringify({token:st.token, nonce:st.nonce})}); status=r.status; d=await r.json().catch(()=>null); }catch(e){}

async function pullIfNewer(force){
  const cur=currentProfile(); if(!cur||!cur.cloudId){ setCloudDot(); return; }
  force=force||cur.unsynced;   // an unsynced profile takes the server's copy whatever the timestamps say
  if(cur.readonly && cur._lostShown){ setCloudDot("err"); return; }
  try{ const d=await cloudFetch(cur.cloudId, cur); const wait=!!cur.phaseDirty;   // a change waiting to go up: not replaced here (adoptAccess sends it once the plan opens)
    if(adoptAccess(cur,d)){ saveProfilesIdx(); applyAccess(); }
    if(!wait && waitPushFor!==cur.id && d.updated && (force || !cur.cloudUpdated || d.updated>cur.cloudUpdated)){
      if(interactionBusy()){ clearTimeout(conflictTimer); conflictTimer=setTimeout(()=>pullIfNewer(force),4000); return; }   // never apply under the user's fingers — retry
      applyPulledPlan(cur,d); toast(tr("cUpdated")); }
    setCloudDot("ok");
  }catch(e){ setCloudDot("err"); if(e.status===401||e.status===403){ accessLost(cur, e.code); return; } if(e.status===410){ planGone(cur); return; } if(cur.unsynced) toast(tr("cLoadErr",{e:String(e&&e.message||e)}),7000); }
}

// ============================================================
//  ROLES & ACCESS — the server decides; this mirrors it so locked things don't look editable
// ============================================================
const PERM_KEYS=["floor","decor","layout","tables","seats","labels"];
const PERM_LABEL={floor:"permFloor",decor:"permDecor",layout:"permLayout",tables:"permTables",seats:"permSeats",labels:"permLabels"};
let ACCESS={role:"couple", restricted:false, preview:false, perms:null};
function can(k){ return IS_LAB || (!ACCESS.ro && (!ACCESS.perms || ACCESS.perms[k]!==false)); }   // read only: nothing
function applyAccess(){
  const cur=(profiles&&profiles.profiles)?currentProfile():null;
  const role=(IS_LAB||!cur||!cur.cloudId)?"local":(cur.support?"support":(cur.role||(cur.readonly?"viewer":"couple")));
  const venueCouple=role==="couple" && cur.owner==="venue";
  // the server's perms for a couple are the effective ones (the venue's ∩ the phase): anything closed → the lock mirror
  const restricted=role==="couple" && !!cur.perms && (venueCouple || PERM_KEYS.some(k=>cur.perms[k]===false));
  const preview=role==="venue" && !!cur.previewCouple && !cur.template && !!cur.couplePerms;
  const perms=restricted?cur.perms:preview?cur.couplePerms:null;
  const locked=!IS_LAB && !!(cur && cur.cloudId && cur.life && cur.life.locked);   // after the wedding every role only looks (venues too)
  const gone=!IS_LAB && !!(cur && cur.cloudId && cur.gone);   // in the venue's trash (410) until the admin restores it
  const phase=role==="couple"?phaseOf(cur):"", waitRo=phase==="waiting"||phase==="frozen";   // only couples live by phases
  const wasRo=!!ACCESS.ro;
  ACCESS={role, restricted, venueCouple, preview, perms:perms?{...perms}:null, venueName:(cur&&cur.venueName)||"", template:!!(cur&&cur.template), owner:(cur&&cur.owner)||"couple", locked, gone, phase, waitRo, ro:locked||gone||waitRo||role==="viewer"};
  document.body.classList.toggle("ro", ACCESS.ro);
  PERM_KEYS.forEach(k=>document.body.classList.toggle("lock-"+k, !can(k)));
  const fl=$("stageFloor"); if(fl) fl.disabled=!can("floor");
  ["venue","support","viewer"].forEach(r=>document.body.classList.toggle("role-"+r, role===r));
  renderRoleBadge(); renderLifeBar(); updateUndoButtons(); schedulePhaseCheck();
  if(wasRo!==ACCESS.ro){ setPick(null); closeMenu(); renderAll(); }   // chairs, chips and seat rows are built read-only (or not)
}
// ---- a couple's phases (the server decides: life.phase) — "waiting" 14 days after a direct purchase, "names" until 30 days
// before the wedding (guests & seating; the room stays closed), "full", "frozen" after the one date change, "locked" after ----
const PHASE_LOCKS=["floor","layout","tables"];   // what the names phase keeps closed (decor stays open: the owner's decision)
function phaseOf(prof){ return (!IS_LAB && prof && prof.cloudId && prof.role==="couple" && !prof.support && prof.life && prof.life.phase) || ""; }
function phaseRo(prof){ const p=phaseOf(prof); return p==="waiting"||p==="frozen"; }
function athensYmd(ms){ try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Athens",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(ms)); }catch(e){ return new Date(ms).toISOString().slice(0,10); } }
function daysUntil(ms){ const n=Math.round((Date.parse(athensYmd(ms))-Date.parse(todayAthens()))/864e5); return n>1?tr("phIn",{n}):n===1?tr("phIn1"):tr("phSoon"); }   // calendar days (Athens)
function phaseOpensAt(L){ return L.phase==="waiting"?L.opensAt:L.phase==="frozen"?L.frozenUntil:L.phase==="names"?L.fullAt:null; }
function phaseText(cur){ const L=(cur&&cur.life)||{}, at=phaseOpensAt(L);
  if(L.phase==="waiting") return tr("phWait",{d:fmtDate(at)});
  if(L.phase==="frozen") return tr("phFrozen",{d:fmtDate(at)});
  if(L.phase==="names") return tr(cur.owner==="venue"?"phNamesV":"phNames",{d:fmtDate(at)});
  return ""; }
function phaseLine(cur){ const L=(cur&&cur.life)||{}, at=phaseOpensAt(L), v=cur.owner==="venue";
  if(L.phase==="waiting") return tr("phLineWait",{d:fmtDate(at), n:daysUntil(at)});
  if(L.phase==="frozen") return tr("phLineFrozen",{d:fmtDate(at)});
  if(L.phase==="names") return tr(v?"phLineNamesV":"phLineNames",{d:fmtDate(at)});
  if(L.phase==="full" && L.weddingDate && !L.over) return tr(v?"phLineFullV":"phLineFull",{d:fmtDate(L.weddingDate)});
  return ""; }
// The next moment the phase changes: re-ask the server then (no reload needed); the 15 s poll is the safety net.
let phaseTimer=null, phaseTimerAt=0;
function schedulePhaseCheck(){
  const cur=(profiles&&profiles.profiles)?currentProfile():null, L=ACCESS.role==="couple"&&cur&&cur.life;
  const next=L?[L.opensAt,L.frozenUntil,L.fullAt,L.lockAt].filter(t=>t&&t>Date.now()).sort((a,b)=>a-b)[0]||0:0;
  if(next===phaseTimerAt) return; clearTimeout(phaseTimer); phaseTimer=null; phaseTimerAt=next; if(!next) return;
  phaseTimer=setTimeout(()=>{ phaseTimer=null; phaseTimerAt=0; renderLifeBar();
    if(Date.now()>=next) pullIfNewer(); else schedulePhaseCheck(); }, Math.min(next-Date.now()+1500, 3600e3));   // long waits: wake up hourly (the countdown; timers cap at ~24 days)
}

// The A–Z groups, in the one order both A–Z pages print them: an invitation with at least one seated member (its seated
// people sorted by name inside it), or a lone seated guest who is in none. "alpha" prints a row per person, "alphainv" a
// row per group — both from HERE, so the two lists can never disagree about who is on the page or in which order.
//   groups[i] = { p: the invitation or null, ids: its seated guests in print order, key: what it files under }
//   nameOf(id) = ΕΠΩΝΥΜΟ ΟΝΟΜΑ as the page prints it · tableAt[id] = the POSITION of the guest's table in state.tables
function alphaGroups(seatedSet){
  const coll=(a,b)=>String(a).localeCompare(String(b),"el",{sensitivity:"base",numeric:true});
  const disp={};   // id → ΕΠΩΝΥΜΟ ΟΝΟΜΑ as this page prints it (display only, computed once)
  const nameOf=id=>disp[id]||"";
  const seatedIds=Object.keys(state.guests).filter(id=>seatedSet.has(id));
  // Which table each seated guest sits at, BY POSITION — a plan can carry two tables with the same id or the same
  // label, and those must never be merged into one cell (nor counted as one table).
  const tableAt={}; state.tables.forEach((t,ix)=>t.seats.forEach(gid=>{ if(gid) tableAt[gid]=ix; }));
  // Groups: an invitation with at least one seated member, or a lone seated guest who is in none.
  const byP=new Map(), groups=[];
  seatedIds.forEach(id=>{ const p=partyOf(id);
    if(!p){ groups.push({p:null, ids:[id]}); return; }
    let g=byP.get(p.id); if(!g){ g={p, ids:[]}; byP.set(p.id,g); groups.push(g); } g.ids.push(id); });
  groups.forEach(g=>{
    // the other members of the invitation (seated or not) are the evidence that a word is the family's name
    const mem=g.p?partyMembers(g.p.id):[];
    g.ids.forEach(id=>{ disp[id]=caseName(surnameFirstName((state.guests[id]||{}).name||"", g.p?g.p.name:"",
      mem.filter(x=>x!==id).map(x=>(state.guests[x]||{}).name||""))); });
  });
  groups.forEach(g=>{ g.ids.sort((a,b)=>coll(nameOf(a),nameOf(b))||coll(a,b));
    g.key=g.p?caseName(g.p.name):nameOf(g.ids[0]); });   // an invitation files under its own name, a lone guest under his surname
  groups.sort((a,b)=>coll(a.key,b.key)||coll(nameOf(a.ids[0]),nameOf(b.ids[0]))||coll(a.ids[0],b.ids[0]));
  return {groups, nameOf, seatedIds, tableAt};
}
function buildAndPrint(mode){

  const seatedSet=assignedGuestIds();   // who has a CHAIR — never "whose table has a name"; a table may be left unnamed
  const seated=seatedSet.size, totalSeats=state.tables.reduce((s,t)=>s+t.capacity,0);

  const meta=[tr("printTitle"), wd?tr("printWed",{d:fmtDate(wd)}):"", tr("printAt",{t:new Date().toLocaleString(LANG,{dateStyle:"short",timeStyle:"short"})})].filter(Boolean).join(" · ");

  // The plan-wide counts line: the A–Z list has its own counts under its own heading and must not print them twice.
  const subLine=`<div class="psub">${escapeHtml(tr("printSub",{t:state.tables.length, s:seated, c:totalSeats}))}</div>`;
  // A–Z: a real table read at the door, grouped the way the invitations were sent. Two pages, one set of groups:
  //   "alpha"     ΠΡΟΣΚΛΗΤΗΡΙΟ · ΟΝΟΜΑ · ΑΤΟΜΑ · ΤΡΑΠΕΖΙ
  // One block per invitation (its name written once, spanning its people's rows), one row per seated person inside it;
  // a guest who belongs to no invitation is his own block and his two first cells are merged into one, surname first.
  //   "alphainv"  ΠΡΟΣΚΛΗΤΗΡΙΟ · ΑΤΟΜΑ · ΤΡΑΠΕΖΙ — the same page without the ΟΝΟΜΑ column: each block on ONE row.
  // Nobody without a seat is printed (a door list is for people who have one); a single footnote counts those left out.

    const hidden=Object.keys(state.guests).length-seatedIds.length;

    const footRow=hidden?`<tr class="pfootr"><td class="pfoot" colspan="${cols}">${escapeHtml(hidden===1?tr("printHidden1"):tr("printHidden",{n:hidden}))}</td></tr>`:"";

      return `<tbody class="pg${b.gi%2?" alt":""}">${rows}${last?footRow:""}</tbody>`;   // one <tbody> per block: it is what keeps a merged cell off a page break
    };
    // "alphainv": the whole block on one row. An invitation prints its name as typed and how many of its people have a
    // seat (the count "alpha" prints); a lone guest prints the very cell "alpha" prints for him (surname first) and 1 —
    // he asked for the 1 here. ΤΡΑΠΕΖΙ is the one table they all sit at or, when the invitation is split, every table
    // with how many of it sit there, «8 (2) · 12 (1)», in the order its people come in "alpha". Tables are told apart
    // by POSITION, never by label (two tables may share one). Still one <tbody> per row: the zebra, the rule between
    // entries and the footnote riding on the last entry all work exactly as in "alpha".
    const lineHtml=(b,last)=>{
      const g=b.g, at=new Map();   // table position → [its first person in "alpha" order, how many of the invitation sit there]
      g.ids.forEach(id=>{ const e=at.get(tableAt[id]); if(e) e[1]++; else at.set(tableAt[id],[id,1]); });
      const tbl=at.size===1?tLabel(g.ids[0]):[...at.values()].map(([id,k])=>`${tLabel(id)}&nbsp;<span class="tn">(${k})</span>`).join("&nbsp;· ");
      return `<tbody class="pg${b.gi%2?" alt":""}"><tr>`
        +(g.p?`<td class="ci">${escapeHtml(caseName(g.p.name))}</td>`:`<td class="cs">${cell(g.ids[0])}</td>`)
        +`<td class="cp">${g.ids.length}</td><td class="ct">${tbl}</td></tr>${last?footRow:""}</tbody>`;
    };
    // No heading of its own (the owner: "not needed") — only the quiet summary line every print mode carries, with a
    // singular at exactly 1 («1 άτομο · 1 τραπέζι»), like printHidden1.
    const nPpl=seatedIds.length;
    const sumLine=[nPpl===1?tr("printInvS1"):tr("printInvS",{n:nPpl}), usedTables===1?tr("printInvT1"):tr("printInvT",{n:usedTables})].join(" · ");
    const thead=`<th class="ci">${escapeHtml(tr("printColInv"))}</th>`+(one?"":`<th class="cn">${escapeHtml(tr("printColName"))}</th>`)
      +`<th class="cp">${escapeHtml(tr("printColPeople"))}</th><th class="ct">${escapeHtml(tr("printColTable"))}</th>`;
    // One block per invitation. A merged cell that crosses a page break prints its text on the first sheet only — the
    // rows on the next sheet would stand there with no invitation and NO TABLE — so every block must fit on one sheet.
    // How tall a block prints depends on how many lines its names and table labels wrap to, which a row count cannot
    // know (36 three-line names are taller than A4). So the page is laid out once, off screen, at the narrowest usual
    // print width (A4 with 20 mm margins), every block is MEASURED, and a block taller than 225 mm (A4 or Letter with
    // up to 20 mm margins, less the repeated header, with room to spare) is cut between rows into blocks that each fit;
    // every piece repeats the invitation name and ΑΤΟΜΑ and merges only its own table runs. Measured again after the
    // cut, a few rounds at most. An invitation that big never happens at a wedding; the owner's are six people at most.
    // "alphainv" has nothing to cut: each of its blocks is a single row, and a row never splits (tr break-inside:avoid).
    let blocks=groups.map((g,gi)=>({g, gi, ids:g.ids}));
    const render=()=>{ area.innerHTML=head
      +`<div class="psub">${escapeHtml(sumLine)}</div>`
      +`<table class="palpha${one?" pone":""}"><thead><tr>${thead}</tr></thead>`
      +(blocks.length?blocks.map((b,i)=>(one?lineHtml:blockHtml)(b,i===blocks.length-1)).join(""):`<tbody class="pg"><tr><td class="empty" colspan="${cols}">—</td></tr>${footRow}</tbody>`)
      +`</table>`; };
    render();
    if(one){ window.print(); return; }
    const PAGE_PX=225*96/25.4;
    area.classList.add("pmeasure");
    try{
      for(let round=0; round<4; round++){
        const tbs=area.querySelectorAll("table.palpha > tbody.pg"); let cut=false; const next=[];
        blocks.forEach((b,i)=>{ const tb=tbs[i];
          if(!tb || b.ids.length<2 || tb.getBoundingClientRect().height<=PAGE_PX){ next.push(b); return; }
          const hs=[...tb.rows].slice(0,b.ids.length).map(r=>r.getBoundingClientRect().height);
          const parts=[]; let part=[], sum=0;
          b.ids.forEach((id,k)=>{ if(part.length && sum+hs[k]>PAGE_PX){ parts.push(part); part=[]; sum=0; }
            part.push(id); sum+=hs[k]; });
          if(part.length) parts.push(part);
          parts.forEach(ids=>next.push({g:b.g, gi:b.gi, ids}));
          if(parts.length>1) cut=true; });
        if(!cut) break;
        blocks=next; render();
      }
    } finally { area.classList.remove("pmeasure"); }
    window.print(); return;
  }
  const cards=state.tables.map(t=>{
    if(byParties){   // one line per invitation at this table (how many of its people sit here), singles by name
      const byP=new Map(), singles=[];
      t.seats.forEach(gid=>{ if(!gid||!state.guests[gid]) return; const p=partyOf(gid); if(p){ if(!byP.has(p.id)) byP.set(p.id,{p,ids:[]}); byP.get(p.id).ids.push(gid); } else singles.push(gid); });
      const lines=[...byP.values()].map(({p,ids})=>{ const tot=partyMembers(p.id).length; return `<li><b>${escapeHtml(caseName(p.name))}</b> <span class="pn">${ids.length}${tot!==ids.length?" / "+tot:""}</span></li>`; })
        .concat(singles.map(gid=>`<li>${escapeHtml(guestName(gid))} <span class="pn">1</span></li>`));
      const occ=t.seats.filter(Boolean).length;
      return `<div class="pcard"><h3>${escapeHtml(t.label)} <span style="font-weight:400;color:#888;font-size:12px">(${occ}/${t.capacity})</span></h3><ul class="pinvl">${lines.join("")||`<li class="empty">—</li>`}</ul></div>`;
    }
    const rows=t.seats.map(gid=> gid?`<li>${escapeHtml(guestName(gid))}${STATUS_TXT(gStatus(gid))?` <span style="color:#a00">(${STATUS_TXT(gStatus(gid))})</span>`:""}</li>`:`<li class="empty">${escapeHtml(tr("printEmpty"))}</li>`).join("");
    const occ=t.seats.filter(Boolean).length;
    return `<div class="pcard"><h3>${escapeHtml(t.label)} <span style="font-weight:400;color:#888;font-size:12px">(${occ}/${t.capacity})</span></h3><ol>${rows}</ol></div>`;
  }).join("");
  const un=unseatedIds();
  const unHtml=un.length?`<div class="punassigned"><strong>${escapeHtml(tr("printUnassigned",{n:un.length}))}</strong> ${un.map(id=>escapeHtml(guestName(id))).join(", ")}</div>`:"";
  const parties=(state.parties||[]).map(p=>({p, m:partyMembers(p.id)})).filter(x=>x.m.length).sort((a,b)=>a.p.name.localeCompare(b.p.name));
  const invHtml=(parties.length&&!byParties)?`<h3 class="pinvh">${escapeHtml(tr("printInvites"))}</h3><div class="pinvs">${parties.map(({p,m})=>`<div class="pinv"><b>${escapeHtml(caseName(p.name))}</b> <span class="n">(${m.length})</span><ul>${m.map(id=>`<li>${escapeHtml(guestName(id))}${tableOf[id]?` <span class="ptag">— ${escapeHtml(tableOf[id])}</span>`:` <span class="ptag">— ${escapeHtml(tr("printNoSeat"))}</span>`}</li>`).join("")}</ul></div>`).join("")}</div>`:"";
  area.innerHTML=head+subLine+`<div class="ptables">${cards}</div>${unHtml}${invHtml}`;
  window.print();
}

// ============================================================
//  TEXT SIZE + ZOOM
// ============================================================
function setFontScale(v){ fontScale=clamp(v,0.6,2.0); state.seatFontScale=fontScale; save(); renderTables(); toast(tr("tFont",{n:Math.round(fontScale*100)})); }
function setTableFontScale(v){ state.tableFontScale=clamp(v,0.6,2.4); save(); renderTables(); toast(tr("tNumSize",{n:Math.round(state.tableFontScale*100)})); }
function setNameMode(m){ if(!["full","short","initials"].includes(m)) return; state.nameMode=m; save(); renderTables(); }
function setNameCase(m){ if(!["asis","upper","lower"].includes(m)||m===(state.nameCase||"asis")) return; state.nameCase=m; save(); renderTables(); renderPool(); if(focusId!=null) renderFocus(); if(m==="lower") toast(tr("tLowerHint"),4500); }
// The "Aa" view menu: name display · name size · table-number size · zoom — same on PC and phone.
function renderViewMenu(){
  const m=$("viewmenu"); const mode=state.nameMode||"full"; const tfs=state.tableFontScale||1;
  m.innerHTML=`<div class="gm-cap">${escapeHtml(tr("names"))}</div>
    <div class="vrow"><div class="seg" id="vmNames">${["full","short","initials"].map(k=>`<button data-m="${k}" class="${mode===k?"on":""}">${escapeHtml(tr({full:"nm_full",short:"nm_short",initials:"nm_initials"}[k]))}</button>`).join("")}</div></div>
    <div class="gm-cap">${escapeHtml(tr("nameCase"))}</div>
    <div class="vrow"><div class="seg" id="vmCase">${["asis","upper","lower"].map(k=>`<button data-c="${k}" class="${(state.nameCase||"asis")===k?"on":""}">${escapeHtml(tr({asis:"nc_asis",upper:"nc_upper",lower:"nc_lower"}[k]))}</button>`).join("")}</div></div>
    <div class="gm-cap">${escapeHtml(tr("nameSize"))}</div>
    <div class="vrow"><button class="ibtn" data-a="fdown">A−</button><span class="pct">${Math.round(fontScale*100)}%</span><button class="ibtn" data-a="fup">A＋</button></div>
    <div class="gm-cap">${escapeHtml(tr("numSize"))}</div>
    <div class="vrow"><button class="ibtn" data-a="ndown">1−</button><span class="pct">${Math.round(tfs*100)}%</span><button class="ibtn" data-a="nup">1＋</button></div>
    <div class="gm-cap">${escapeHtml(tr("zoomLbl"))}</div>
    <div class="vrow"><button class="ibtn" data-a="zout">−</button><span class="pct">${Math.round(zoom*100)}%</span><button class="ibtn" data-a="zin">＋</button><button class="ibtn" data-a="fit">${escapeHtml(tr("fit"))}</button></div>`;
  m.querySelectorAll("#vmNames button").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); setNameMode(b.dataset.m); renderViewMenu(); });
  m.querySelectorAll("#vmCase button").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); setNameCase(b.dataset.c); renderViewMenu(); });
  m.querySelectorAll("[data-a]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); const a=b.dataset.a;
    if(a==="fdown") setFontScale(fontScale-0.15); else if(a==="fup") setFontScale(fontScale+0.15);
    else if(a==="ndown") setTableFontScale((state.tableFontScale||1)-0.2); else if(a==="nup") setTableFontScale((state.tableFontScale||1)+0.2);
    else if(a==="zout") zoomBy(1/1.2); else if(a==="zin") zoomBy(1.2); else if(a==="fit"){ zoom=clamp(fitZoom(),0.2,2.5); applyZoom(); }
    renderViewMenu(); });
}
function openViewMenu(anchorEl){ const m=$("viewmenu"); if(m.style.display==="block"){ m.style.display="none"; return; } renderViewMenu(); showPopover(m, anchorOf(anchorEl)); }
function fitZoom(){ const b=visibleBox(), n=isNarrow(); return Math.min(1,(b.w-(n?24:60))/state.stage.w,(b.h-(n?34:80))/state.stage.h); }
// Opening view: the 0.5 floor keeps names readable on a desktop; a phone fits the whole space instead.
function initialZoom(){ if(isNarrow()) layoutCanvas(true); return Math.min(1, Math.max(fitZoom(), isNarrow()?0.1:0.5)); }
function applyZoom(){
  layoutCanvas();
  // far view (phones only, overview zoom): one big number per table instead of counters/gear/'+' nobody can read at 16 % — hysteresis so a pinch at the edge doesn't flicker
  const far=document.body.classList.contains("far"); document.body.classList.toggle("far", isNarrow() && (far ? zoom<0.50 : zoom<0.40));
  stage.style.transform=`scale(${zoom})`;
  const m=isNarrow()?12:24, w=(state.stage&&state.stage.w)||1700, h=(state.stage&&state.stage.h)||1360;
  stage.style.margin=`${m}px ${Math.round(m+w*(zoom-1))}px ${Math.round(m+h*(zoom-1))}px ${m}px`;
  $("zoomLabel").textContent=Math.round(zoom*100)+"%";
}
$("zoomIn").addEventListener("click",()=>zoomBy(1.15));
$("zoomOut").addEventListener("click",()=>zoomBy(1/1.15));
$("zoomFit").addEventListener("click",()=>{ zoom=clamp(fitZoom(),0.2,2.5); applyZoom(); });

// ============================================================
//  INIT
// ============================================================
function renderAll(){ renderFeatures(); renderTables(); renderGroups(); renderPool(); updateStats(); if(invMode) renderInvPanel(); }
if(!state.stage) state.stage={w:2100,h:1400};
if(!state.stageMaterial) state.stageMaterial="grass";
applyStage();
const _stageResize=document.createElement("div"); _stageResize.id="stageResize"; _stageResize.title=tr("stageResizeTip");
stage.appendChild(_stageResize); makeStageResizable(_stageResize);
initFloorSelect(); initDecor(); renderProfiles();
applyAccess(); renderAll(); resetHistory();
setTimeout(()=>{ zoom=initialZoom(); applyZoom(); },50);
// Turn each SVG texture into a plain bitmap once (canvas → JPEG data URI). Browsers re-render the SVG noise
// filters at every zoom step, which is what made pinch-zoom crawl on phones; a bitmap just gets resampled.
function rasterizeMaterials(){
  const dpr=Math.min(2, window.devicePixelRatio||1); let pending=0;
  const done=()=>{ if(--pending===0){ applyStage(); renderFeatures(); } };
  Object.keys(MATERIALS).forEach(k=>{
    const m=MATERIALS[k]; const uri=m.img.slice(5,-2); const [w,h]=m.size.split(" ").map(parseFloat);
    const img=new Image(); pending++;
    img.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); m.img='url("'+c.toDataURL("image/jpeg",0.86)+'")'; }catch(e){} done(); };
    img.onerror=done; img.src=uri;
  });
}
setTimeout(rasterizeMaterials, 0);
// ☁ open a shared link if present, otherwise refresh the active profile from the cloud (the lab never talks to the cloud)
if(!IS_LAB){ const p0=currentProfile(); if(loadError && p0 && p0.cloudId) toast(tr("cLocalErr",{e:loadError}),7000); }
if(!IS_LAB) (async()=>{ if(!(await openSharedFromURL())) await pullIfNewer(); if(getSyncCode()) await syncFromCode(); startCloudPoll(); maybeWelcome(); setTimeout(maybeDateNudge,2500); })();
else { maybeWelcome(); flushLabNote(); }
</script>
