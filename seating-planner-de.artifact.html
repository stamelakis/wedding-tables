<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --paper:#f6f2ec; --paper-2:#ece6dc; --card:#fffdfa; --ink:#241f1a; --soft:#6b6259; --faint:#9a9084;
    --line:#e6ddd2; --line-2:#d5cabc;
    --accent:#7d5a8c; --accent-ink:#5c3f68; --accent-soft:#efe6f2; --gold:#b58a3c;
    --danger:#c0392b; --good:#3f7a52; --seat-neutral:#7e6d5f;
    --shadow-1:0 1px 2px rgba(40,30,20,.06),0 6px 18px rgba(40,30,20,.08);
    --shadow-2:0 10px 30px rgba(40,30,20,.2);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --appbar-h:52px; --sidebar-w:316px; --focus-w:330px; --sheet-h:46vh;
    --pipw:18px;   /* the invitation mark's gutter inside a name pill — PIP_W in the script must match */
  }
  html,body{ height:100%; }
  body{ font-family:var(--sans); color:var(--ink); background:var(--paper-2); height:100vh; overflow:hidden; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  input,textarea,select{ background:var(--card); }

  /* ---------- App bar ---------- */
  #appbar{ height:var(--appbar-h); flex:none; display:flex; align-items:center; gap:8px; padding:0 12px; background:rgba(255,253,250,.97); border-bottom:1px solid var(--line); z-index:30; position:relative; }
  .brand{ font-family:var(--serif); font-weight:700; font-size:19px; letter-spacing:-.01em; white-space:nowrap; }
  .brand em{ color:var(--accent); font-style:normal; }
  .planpick{ display:flex; gap:4px; align-items:center; min-width:0; }
  .planpick select{ max-width:220px; min-width:110px; height:32px; padding:0 22px 0 8px; border:1px solid transparent; border-radius:9px; background:transparent; font-family:var(--serif); font-weight:700; font-size:15px; }
  .planpick select:focus{ outline:none; border-color:var(--line); background:var(--card); }
  body.mode-lab #cloudBtn{ display:none; }   /* the lab is local-only: no cloud, no share links */
  .ibtn{ height:32px; min-width:32px; padding:0 9px; border:1px solid var(--line); background:var(--card); border-radius:10px; cursor:pointer; font-size:14px; line-height:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; transition:background .12s,border-color .12s,color .12s; }
  .ibtn:hover{ background:var(--paper); border-color:var(--line-2); }
  .ibtn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .ibtn.primary:hover{ background:var(--accent-ink); border-color:var(--accent-ink); }
  .ibtn.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
  .ibtn.danger{ color:var(--danger); }
  .ibtn:disabled{ opacity:.5; cursor:default; }
  /* one monochrome stroke icon set (inline sprite at the top of <body>) — pointer-events:none keeps every click on the button */
  .ic{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; flex:none; display:inline-block; vertical-align:-3px; }
  .ibtn.sq .ic{ width:20px; height:20px; }
  .gm-item .ic{ width:16px; height:16px; opacity:.7; }
  .tools .ibtn .ic{ width:16px; height:16px; opacity:.8; }
  .gchip .acts button .ic{ width:14px; height:14px; }
  .search .ico .ic{ width:15px; height:15px; }
  .tgear .ic{ width:13px; height:13px; }
  .feat-gear .ic{ width:13px; height:13px; }
  .ts-chip .lbl .ic{ width:18px; height:18px; vertical-align:-4px; }
  #pickbar button .ic{ width:15px; height:15px; vertical-align:-3px; }
  #cloudBtn.err{ color:var(--danger); }
  #cloudTxt:empty{ display:none; }
  #cloudBtn.pending{ opacity:.7; }
  body.strip-collapsed #tsToggle .ic{ transform:rotate(180deg); }
  .planname{ display:none; }
  #appbar .ibtn:not(.primary){ border-color:transparent; background:transparent; min-width:36px; }
  #appbar .ibtn:not(.primary):hover, #appbar .ibtn:not(.primary):active{ background:var(--paper); }
  #appbar .ibtn.on{ background:var(--accent-soft); }
  #appbar .ibtn:disabled{ opacity:.35; }
  .stat{ font-size:12.5px; color:var(--faint); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .spacer{ flex:1; }
  .ctl{ display:inline-flex; align-items:center; gap:3px; }
  .ctl .lbl{ font-size:11px; color:var(--faint); padding:0 4px; min-width:38px; text-align:center; }
  .langsel{ display:inline-flex; gap:2px; }
  .langsel a{ font-size:11px; font-weight:700; color:var(--faint); text-decoration:none; padding:4px 6px; border-radius:6px; }
  .langsel a:hover{ background:var(--paper); color:var(--ink); }
  .langsel a.on{ color:var(--accent-ink); background:var(--accent-soft); }
  #labBadge{ display:none; font-size:11px; font-weight:700; background:#fff3c4; color:#7a5a00; border:1px solid #f0d78a; border-radius:20px; padding:3px 9px; white-space:nowrap; cursor:help; }
  body.mode-lab #labBadge{ display:inline-block; }
  #roleBadge{ font:inherit; font-size:11.5px; font-weight:700; border-radius:20px; padding:3px 10px; white-space:nowrap; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--soft); max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  #roleBadge.r-venue{ background:var(--accent-soft); color:var(--accent-ink); border-color:#d9c7e2; }
  #roleBadge.r-support{ background:#fff1d6; color:#8a5a00; border-color:#f0cf8a; }
  #roleBadge.r-locked{ background:#eef3ef; color:#2f6b45; border-color:#cfe2d5; }
  #roleBadge.r-viewer{ background:#eef1f5; color:#44536a; border-color:#d3dbe6; }
  .acc-sec{ border-top:1px solid var(--line); padding:12px 0 4px; margin-top:12px; }
  .acc-sec:first-child{ border-top:none; margin-top:0; padding-top:0; }
  .acc-sec h4{ font-size:13px; margin:0 0 6px; }
  .acc-perms{ list-style:none; margin:6px 0 0; padding:0; font-size:13px; line-height:1.7; }
  .acc-perms .no{ color:var(--faint); }
  .acc-log{ list-style:none; margin:6px 0 0; padding:0; font-size:12.5px; line-height:1.55; max-height:180px; overflow:auto; }
  .acc-log li{ display:flex; gap:8px; } .acc-log .t{ color:var(--faint); flex:none; min-width:108px; }
  .acc-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .acc-row select, .acc-sec textarea{ font:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px; padding:7px 9px; background:var(--card); }
  .acc-sec textarea{ width:100%; min-height:60px; resize:vertical; margin-top:8px; }
  .acc-live{ background:#fff7e6; border:1px solid #f0d49a; border-radius:10px; padding:10px 12px; font-size:13px; }
  .claim-lead{ font-size:15px; line-height:1.5; margin:0 0 6px; }
  /* after the wedding: a calm strip under the app bar (✕ hides it for this visit; the badge brings it back) */
  #lifebar{ flex:none; display:flex; align-items:center; gap:10px; padding:8px 14px; background:#f3efe6; border-bottom:1px solid var(--line); font-size:13px; line-height:1.4; color:var(--ink); position:relative; z-index:25; }
  #lifebar[hidden]{ display:none; }
  #lifebar>.ic{ color:var(--gold); flex:none; }
  #lifebar .lt{ flex:1; min-width:0; }
  #lifebar .ibtn{ height:32px; flex:none; }
  #lifebar .ibtn[hidden]{ display:none; }
  #lifebar .lx{ border:none; background:none; color:var(--faint); font-size:15px; cursor:pointer; padding:4px; flex:none; }
  #lifebar .lcd{ flex:none; font-weight:700; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:3px 10px; white-space:nowrap; }
  #lifebar .lcd[hidden]{ display:none; }
  .acc-phase{ font-size:13px; line-height:1.45; margin:6px 0 2px; padding:7px 10px; border-radius:8px; background:var(--paper); }
  .acc-date{ font-family:var(--serif); font-size:17px; font-weight:700; margin:2px 0 4px; }
  .acc-row input[type=date]{ font:inherit; font-size:14px; height:36px; border:1px solid var(--line); border-radius:8px; padding:0 10px; background:var(--paper); color:inherit; }
  /* read only (the wedding is over, or a view link): nothing looks editable — save() reverts anything that slips through */
  body.ro #toolsSec, body.ro #addNames, body.ro .grip, body.ro .fx, body.ro .gchip .acts, body.ro .pparty .pedit, body.ro .tgear, body.ro .rot-h, body.ro .feat-gear, body.ro .rz, body.ro #stageResize,
  body.ro .ffoot, body.ro #fSettings, body.ro .chip.add, body.ro .chip .gmore{ display:none !important; }
  body.ro .frow .fdot, body.ro .chip .dot{ pointer-events:none; }
  body.ro .gchip, body.ro .pparty{ cursor:default; }
  /* Invitations follow ACCESS.ro only (never a can() key): a couple whose layout the venue locked must still be able to fix
     its own family groupings. A viewer keeps the panel — counting invitations is exactly what a viewer needs — but sees
     facts, not affordances. Hidden by class, never by a second set of JS branches. */
  body.ro .gtick, body.ro #invNewSide, body.ro #invSheet .invx, body.ro .invtop .invmore,
  body.ro .invnew-guest, body.ro #invFoot [data-a="new"]{ display:none !important; }
  body.ro .gchip.tickable{ cursor:default; }
  .feature.flocked{ cursor:default; }
  body.lock-floor #stageResize{ display:none !important; }
  body.lock-tables #addTableBtn, body.lock-tables #addRectBtn, body.lock-tables #addHeadBtn, body.lock-tables #menuDelete{ display:none !important; }
  #tablemenu .caps button:disabled, #menuCapCustom:disabled{ opacity:.45; cursor:not-allowed; }
  #menuLabel[readonly]{ background:var(--paper); color:var(--soft); }
  body.mode-lab #langsel{ display:none; }
  #navBtn{ display:none; }

  /* ---------- Main layout ---------- */
  #main{ flex:1; display:flex; min-height:0; position:relative; }
  #sidebar{ position:relative; width:var(--sidebar-w); flex:none; background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  /* The invitations panel is a working surface, not a sidebar note: while it is open the panel takes the width it
     needs («Νέο προσκλητήριο», «0 άτομα · 0 με θέση» and «Χωρίς προσκλητήριο» must never truncate) and gives it
     back on the way out. invFitFloor() re-fits the floor around it. Phones ignore this — there the panel is the
     full-width drawer already (88vw). */
  body.invlist, body.invfill{ --sidebar-w:392px; }
  .side-scroll{ flex:1; overflow-y:auto; min-height:0; overscroll-behavior:contain; }
  .sec{ padding:12px 14px 12px; border-bottom:1px solid var(--line); }
  .sec:last-child{ border-bottom:none; }
  .sec-title{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .sec-title .cnt{ font-weight:600; color:var(--soft); text-transform:none; letter-spacing:0; margin-left:auto; }
  details.sec>summary{ list-style:none; cursor:pointer; user-select:none; }
  details.sec>summary::-webkit-details-marker{ display:none; }
  details.sec>summary::after{ content:"▸"; margin-left:auto; font-size:11px; transition:transform .15s; }
  details.sec[open]>summary::after{ transform:rotate(90deg); }
  details.sec:not([open])>summary{ margin-bottom:0; }
  .tools{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .tools .ibtn{ height:36px; font-size:12.5px; justify-content:flex-start; padding:0 10px; }
  .tools .ibtn.wide{ grid-column:1 / -1; }
  .floorrow{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--soft); }
  .floorrow select{ flex:1; height:32px; padding:0 8px; border:1px solid var(--line); border-radius:8px; font-size:12.5px; }
  .search{ position:relative; margin-bottom:8px; }
  @media (min-width:901px){ .search{ position:sticky; top:0; z-index:3; background:var(--card); padding:2px 0 6px; margin:-2px 0 4px; box-shadow:-14px 0 0 var(--card), 14px 0 0 var(--card); } }   /* PC: stays put while the list scrolls (shadows paint the section gutters) */
  .search input{ width:100%; height:36px; padding:0 30px 0 32px; border:1px solid var(--line); border-radius:10px; background:var(--paper); font-size:13.5px; }
  .search input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:#fff; }
  .search .ico{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:13px; pointer-events:none; }
  .search .clr{ position:absolute; right:4px; top:50%; transform:translateY(-50%); border:none; background:none; color:var(--faint); cursor:pointer; font-size:14px; padding:6px; display:none; }
  .search.has .clr{ display:block; }
  .chips{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
  .chip{ display:inline-flex; align-items:center; gap:5px; padding:4px 9px 4px 7px; border-radius:20px; border:1.5px solid var(--line); background:var(--card); cursor:pointer; font-size:12px; user-select:none; touch-action:manipulation; transition:background .1s,border-color .1s; }
  .chip:hover{ background:var(--paper); }
  .chip.active{ border-color:var(--ink); background:var(--paper); }
  .chip .dot{ width:11px; height:11px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); }
  .chip .n{ color:var(--faint); font-size:11px; }
  .chip.add{ border-style:dashed; color:var(--soft); }
  .chip .gmore{ margin-left:2px; color:var(--faint); font-weight:700; padding:0 2px; }
  body.touch .chip .gmore{ opacity:.45; }
  #pool{ display:flex; flex-direction:column; gap:5px; min-height:44px; }
  #pool.dragover{ outline:2px dashed var(--accent); outline-offset:-4px; border-radius:10px; background:var(--accent-soft); }
  .gchip{ position:relative; display:flex; align-items:center; gap:6px; padding:7px 6px 7px 4px; border-radius:10px; background:var(--paper); border:1px solid var(--line); border-left:5px solid #ccc; cursor:grab; user-select:none; font-size:13px; transition:box-shadow .12s,background .12s; }
  /* "this person belongs to an invitation" — one binary pip. Its 3 px outward bleed lives inside the
     Guests section's 14 px gutter (the .search sticky rule paints it); shrink that padding and the pip clips.
     .hasinv paints it where nothing can be clicked (a tick row, a suggestion); everywhere he WORKS — the name
     pills on the floor, the seat rows, the guest list — the very same dot is a real button, .ipip, in the same
     corner and the same size, so one mark means one thing whether you read it or press it. */
  .gchip.hasinv:not(.pipbtn)::after{ content:""; position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 0 2px var(--card); pointer-events:none; }
  body.touch .gchip.hasinv:not(.pipbtn)::after{ width:9px; height:9px; }
  /* ::before, never ::after — .frow .fdot::after is the dot's own inner ring and must survive */
  .frow .fdotw:not(.pipbtn) .fdot.hasinv::before{ content:""; position:absolute; top:-2px; right:-2px; left:auto; bottom:auto;
    width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 2px #fff;
    pointer-events:none; z-index:1; }
  /* ---------- .ipip — the SAME pip, pressable (.pipbtn on the host turns the decorative one off) ----------
     The dot is 8/9 px at the host's top-right corner, exactly where the decorative one sits; the button around it is
     transparent and thumb-sized (26 px on touch, 20 px with a mouse). On a LIST host (a guest chip, a seat row) it
     leans outward into that row's own gutter, so it shadows nothing useful. On a name pill on the FLOOR it goes the
     other way — inside the pill, see the block below. Either way it is a CHILD of its host, so a name pushed out to
     the outer ring by a collision carries its mark along the leader line. */
  .ipip{ position:absolute; top:-13px; right:-13px; width:20px; height:20px; padding:0; border:none; background:none;
    cursor:pointer; z-index:2; -webkit-appearance:none; appearance:none; line-height:0; font-size:0; }
  .ipip::after{ content:""; position:absolute; right:10px; top:10px; width:8px; height:8px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 0 2px var(--card); transition:transform .1s; }
  .ipip:hover::after{ transform:scale(1.4); box-shadow:0 0 0 2px var(--card),0 1px 5px rgba(40,30,20,.5); }
  .ipip:focus-visible{ outline:2px solid var(--accent); outline-offset:-1px; border-radius:50%; }
  body.touch .ipip{ top:-16px; right:-16px; width:26px; height:26px; }
  body.touch .ipip::after{ right:13px; top:13px; width:9px; height:9px; }
  .seat .ipip::after, .fdotw .ipip::after{ box-shadow:0 0 0 2px #fff; }
  /* ---- on the floor the mark lives INSIDE the pill ----
     Hung 3 px outside the pill's top-right corner it sat exactly where the next name lands: measured on the
     335-guest lab floor, 156 of 286 marks had their dot centre resolve to ANOTHER pill — the mark invisible and the
     tap arming a move of the wrong person. Inside, the pill's own silhouette IS the hit box (the seat keeps
     overflow:hidden, which clips paint and hit-testing alike), so nothing can ever cover it and a near-miss costs at
     worst a tap on its own name. The pill is built --pipw wider (seatWidthFor + PIP_W) and gives that width straight
     back as padding, so the name keeps exactly the room it had and no letter is lost to the mark. */
  .seat.occupied.hasinv{ padding-right:var(--pipw); }
  .seat .ipip{ top:0; right:0; bottom:0; height:auto; width:18px; max-width:45%; z-index:35; }
  .seat .ipip::after{ right:4px; top:4px; }
  .seat .ipip:focus-visible{ border-radius:8px; }
  body.touch .seat .ipip{ top:0; right:0; bottom:0; height:auto; width:24px; max-width:45%; }
  body.touch .seat .ipip::after{ right:4px; top:4px; }
  body.far .seat .ipip{ display:none; }         /* phone overview: the pills are 6 px tall, nothing there is aimable */
  /* Per host, the box leans into whatever is dead space next to it, so nothing useful is shadowed:
     a pill has 10 px of text gutter, a chip has the section gutter, a seat row has the gap above it. */
  .gchip>.ipip{ top:-10px; right:-10px; width:22px; height:22px; }
  .gchip>.ipip::after{ right:7px; top:7px; }
  body.touch .gchip>.ipip{ top:-11px; right:-11px; width:24px; height:24px; }
  body.touch .gchip>.ipip::after{ right:8px; top:8px; }
  .fdotw{ position:relative; flex:none; display:flex; }          /* the seat row's dot + its mark, one box */
  .fdotw .ipip{ top:-12px; right:-8px; width:24px; height:24px; }
  /* its own touch box, or `body.touch .ipip` (0,2,1) wins over `.fdotw .ipip` (0,2,0): the 26 px box then sat at
     -16/-16, detaching the dot from its colour dot and reaching 10x16 px into the row's name field, so tapping
     before the first letter opened an invitation instead of putting the caret in. 24 px still meets the touch size. */
  body.touch .fdotw .ipip{ top:-12px; right:-8px; width:24px; height:24px; }
  .fdotw .ipip::after, body.touch .fdotw .ipip::after{ right:6px; top:10px; }   /* → top:-2 right:-2 on the dot: where it has always been */
  .fsug div.hasinv{ position:relative; padding-right:22px; }
  .fsug div.hasinv::after{ content:""; position:absolute; right:9px; top:50%; margin-top:-4px; width:8px; height:8px;
    border-radius:50%; background:var(--accent); pointer-events:none; }
  .invbtn{ width:100%; height:38px; justify-content:flex-start; gap:8px; margin-bottom:8px; color:var(--accent-ink); }
  .invbtn .n{ margin-left:auto; font-size:11.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .invbtn .ch{ width:15px; height:15px; color:var(--faint); flex:none; }

  /* ---------- Invitations take over the left panel: INDEX (body.invlist) and FILL (body.invfill) ---------- */
  body.invlist #toolsSec, body.invfill #toolsSec,
  body.invlist #addNames, body.invfill #addNames,
  body.invlist #groupList, body.invfill #groupList,
  body.invlist #invLooseWrap, body.invfill #invLooseWrap,
  body.invlist .invbtn, body.invfill .invbtn,
  body.invlist .sec>.sec-title, body.invfill .sec>.sec-title{ display:none !important; }
  body.invlist #pool{ display:none; }                      /* INDEX replaces the list entirely */
  body.invlist #invSheet, body.invfill #invIndex{ display:none; }
  /* the one search field of the panel stays put in both states (on PC it already was) */
  body.invlist .search, body.invfill .search{ position:sticky; top:0; z-index:6; background:var(--card);
    padding:2px 0 6px; margin:-2px 0 4px; box-shadow:-14px 0 0 var(--card), 14px 0 0 var(--card); }
  #invHead{ position:sticky; top:var(--invhead-top,44px); z-index:4; background:var(--card); padding:6px 0 8px;
    box-shadow:-14px 0 0 var(--card), 14px 0 0 var(--card); }
  #invFoot{ position:sticky; bottom:0; z-index:5; background:var(--card); border-top:1px solid var(--line);
    padding:8px 14px; display:flex; gap:6px; flex:none; }
  @media (min-width:901px){ body.invlist #invFoot{ display:none !important; } }
  .invtop{ display:flex; align-items:center; gap:8px; }
  .invtop .sec-title{ margin:0; }
  .invtop .invsum{ margin-left:auto; font-size:11px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .invtop .invx{ flex:none; width:30px; height:30px; padding:0; }
  #invNewSide{ width:100%; height:36px; margin-top:8px; }
  /* ---------- the two paper blocks ----------
     «0 άτομα» sitting above 300 names read as the list's own count. So the panel now says, in words, which block is
     which: a headed band for THE INVITATION (its people, or "nobody yet") and a separately headed band for THE LIST
     YOU TICK FROM. The counter lives in its band's heading, on its own line, where nothing competes for width. */
  .invband{ display:flex; align-items:baseline; gap:8px; padding:9px 0 5px; }
  .invband .bt{ font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--accent-ink); }
  .invband .bn{ margin-left:auto; font-size:11.5px; color:var(--soft); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #invSheet .invband{ padding-top:4px; border-top:1px solid var(--line); }

  /* Band C's heading and its tabs are pinned, the way the index already pins its letter caps. The pick list is

     scrolled off, the panel was back to a count pinned over an unheaded column of names, which is exactly the
     picture behind «το 0 τι είναι που έχει και ονόματα?», with the three tabs gone with it. --invpick-top is

  .invpickhead{ position:sticky; top:var(--invpick-top,150px); z-index:2; background:var(--card); padding-bottom:3px;

    border:1px solid var(--line); border-radius:9px; background:var(--paper); cursor:pointer; font-size:13px; color:inherit;
    font-family:inherit; transition:box-shadow .12s,background .12s; }

  body.invfill #invSheet{ position:sticky; top:var(--invcap-top,108px); z-index:3; background:var(--card);
    padding:0 0 8px; box-shadow:-14px 0 0 var(--card), 14px 0 0 var(--card); }

    border-radius:9px; padding:3px 6px; cursor:pointer; font:inherit; color:inherit; text-align:left; }

  #invSheet .members{ display:flex; flex-wrap:wrap; gap:4px; max-height:96px; overflow-y:auto; overscroll-behavior:contain; }
  #invSheet .mchip{ display:inline-flex; align-items:center; gap:2px; max-width:100%; padding:3px 2px 3px 8px;
    border-radius:999px; background:var(--accent-soft); color:var(--accent-ink); font-size:12.5px; }

    color:var(--soft); cursor:pointer; }
  /* Three tabs, each saying in full words WHAT it filters, with its number under the words — a paper folder's tabs.

  #invSeg{ display:flex; margin:0 0 4px; }

  .gchip.tickable{ cursor:pointer; }

  .gtick{ flex:none; width:22px; height:22px; border:1.5px solid var(--soft); border-radius:6px; background:#fff;
    display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:13px; line-height:1; }

  .gchip.tickable.on{ background:var(--accent-soft); outline:1.5px solid var(--accent); outline-offset:-1px; }

  /* «is this person already spoken for, and by whom?» is the one fact he reads here, and at 40 % it was cut off

  .gchip.tickable{ flex-wrap:wrap; }

  .invnew-guest{ display:flex; align-items:center; gap:7px; width:100%; min-height:40px; margin-top:4px; padding:7px 9px;
    border:1px dashed var(--accent); border-radius:10px; background:var(--accent-soft); color:var(--accent-ink);
    font:inherit; font-size:12.5px; text-align:left; cursor:pointer; }

  .seat.invhi{ box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--accent); }
  .frow.invhi{ background:var(--accent-soft); border-radius:9px; }
  #invswitch{ width:min(300px,92vw); max-height:min(70vh,440px); overflow-y:auto; overscroll-behavior:contain; }
  #invswitch .gm-item .n{ flex:none; }

  #invswitch .gm-item .tk{ width:14px; flex:none; color:var(--accent); font-weight:700; }
  .gchip:hover{ box-shadow:var(--shadow-1); background:#fff; }
  .gchip:active{ cursor:grabbing; }
  .gchip .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gchip .acts{ display:flex; gap:0; opacity:0; transition:opacity .12s; }

  body.touch .grip{ color:var(--soft); }
  .frow .grip{ visibility:hidden; cursor:pointer; }

  #placemenu{ width:260px; padding:6px; }
  #placemenu .pm-list{ max-height:min(48vh,340px); overflow-y:auto; overscroll-behavior:contain; }
  #placemenu .gm-item .n{ margin-left:auto; color:var(--faint); font-size:11.5px; font-variant-numeric:tabular-nums; }
  #placemenu .gm-item.dim{ opacity:.5; }
  #placemenu .pm-seat .fn{ width:18px; color:var(--faint); font-size:11px; font-variant-numeric:tabular-nums; }
  #placemenu .pm-seat.taken{ opacity:.5; cursor:default; }
  #placemenu .pm-seat i{ color:var(--faint); }
  #placemenu .pm-list{ overflow-x:hidden; }
  #placemenu .gm-item{ min-width:0; }
  #placemenu .pm-name{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  #placemenu .gm-item .n, #placemenu .pm-seat .fn{ flex:none; }
  .gchip:hover .acts, .gchip.picked .acts{ opacity:1; }
  body.touch .gchip .acts{ opacity:.45; }   /* still tappable, just quieter */
  .gchip .acts button{ border:none; background:none; color:var(--faint); cursor:pointer; font-size:13px; padding:4px 6px; border-radius:6px; line-height:1; }
  .gchip .acts button:hover{ background:var(--card); color:var(--ink); }
  .gchip .acts .x:hover{ color:var(--danger); }
  .gchip.picked{ outline:2px solid var(--accent); outline-offset:1px; background:var(--accent-soft); }
  /* an invitation = a subsection of the list: header (drag it / its handle / tap it to seat everyone together) + indented members */
  .pparty{ display:flex; align-items:center; gap:6px; padding:8px 4px 4px 4px; margin-top:4px; font-size:12.5px; color:var(--ink); border-bottom:1px dashed var(--line); cursor:pointer; user-select:none; }
  .pparty b{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--serif); font-size:13.5px; }
  .pparty .n{ color:var(--faint); font-size:11px; }

  .invro{ padding:8px 2px 0 !important; }
  .invt{ flex:none; max-width:42%; border:none; background:var(--paper); color:var(--accent-ink); border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .invt:hover{ background:var(--accent-soft); }

  .invx{ flex:none; width:30px; height:30px; border:none; background:none; color:var(--faint); border-radius:8px; cursor:pointer; font-size:14px; }

  .pparty .pedit .ic{ width:13px; height:13px; }

  .gchip.inparty{ margin-left:12px; }

  .gchip.seated{ cursor:pointer; background:var(--card); padding-left:10px; }
  .gchip.seated .to{ flex:none; max-width:48%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--soft); font-size:12px; padding-right:4px; }
  #pool .gm-cap{ padding:10px 4px 2px; }

  @keyframes seatFound{ 0%,100%{ box-shadow:0 0 0 3px #fff,0 0 0 5px var(--accent); } 50%{ box-shadow:0 0 0 3px #fff,0 0 0 13px rgba(125,90,140,.35); } }
  .stag{ font-size:9.5px; color:#a0692b; background:#fff4e6; border:1px solid #f0d9bf; border-radius:6px; padding:0 4px; margin-left:5px; vertical-align:middle; }
  .stag.cut{ color:#b03535; background:#fdeaea; border-color:#f2c7c7; }

  /* ---------- Stage ---------- */
  #stagewrap{ flex:1; position:relative; overflow:auto; background:var(--paper-2); background-image:radial-gradient(rgba(60,40,20,.09) 1px,transparent 1.2px); background-size:22px 22px; touch-action:pan-x pan-y; }
  #stage{ position:relative; width:1700px; height:1360px; margin:24px; border-radius:14px; transform-origin:top left; box-shadow:0 2px 4px rgba(0,0,0,.12),0 24px 60px rgba(40,30,20,.22),inset 0 0 0 1px rgba(0,0,0,.14); }
  /* The floor's layers, in order, all BELOW a table: zone (-3) · vignette (-2) · card (-1) · table (auto).
     They are negative so that `.table` needs no z-index of its own — a z-index there makes every table a stacking
     context, and a stacking context is a lid: an invitation mark inside table A could never paint above a name of
     table B, and on this packed floor a neighbouring table's name covered 38 of 156 marks. Tables are contiguous
     blocks of the DOM, so tree order between them is exactly the order z-index:5 gave them: nothing else moves. */
  #stage::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:-2; background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(20,20,10,.16) 100%); }
  .feature.k-prop, .feature.k-marker, .feature.k-label{ z-index:-1; }   /* cards float above the vignette; floor zones sit under it like the ground */

  .feature{ position:absolute; font-size:12px; color:#fff; font-weight:600; display:flex; align-items:center; justify-content:center; text-align:center; transform:translate(-50%,-50%); border-radius:8px; padding:2px 4px; line-height:1.15; cursor:grab; user-select:none; z-index:-3; }
  .feature:active{ cursor:grabbing; }
  .feature .rz{ position:absolute; right:-6px; bottom:-6px; width:16px; height:16px; background:#fff; border:1px solid #8a7f72; border-radius:4px; cursor:nwse-resize; opacity:0; visibility:hidden; transition:opacity .15s, visibility 0s .6s; z-index:3; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .feature:hover .rz, .feature.hsel .rz{ opacity:1; visibility:visible; transition-delay:0s; }
  .rot-h{ position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; border:1px solid #8a7f72; cursor:grab; opacity:0; visibility:hidden; transition:opacity .15s, visibility 0s .6s; z-index:4; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .rot-h:active{ cursor:grabbing; }
  .rot-h::after{ content:"⟳"; font-size:12px; color:#666; display:flex; align-items:center; justify-content:center; height:100%; }
  .feature:hover .rot-h, .feature.hsel .rot-h, .table:hover .rot-h, .table.focused .rot-h{ opacity:1; visibility:visible; transition-delay:0s; }
  .feature.k-zone{ border-radius:10px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),inset 0 0 40px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.14); }
  .feature.k-zone .zlabel{ font-family:var(--serif); font-size:16px; letter-spacing:.04em; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.6); background:rgba(0,0,0,.24); padding:3px 11px; border-radius:20px; pointer-events:none; }
  .feature.k-marker{ background:#2a2622; color:#fff; box-shadow:0 3px 8px rgba(0,0,0,.3); border-radius:8px; letter-spacing:.04em; }
  .feature.k-label{ background:rgba(255,253,250,.93); color:var(--ink); font-family:var(--serif); font-weight:600; font-size:13px; letter-spacing:.02em; box-shadow:0 2px 6px rgba(0,0,0,.16); border-radius:20px; }
  .feature.k-prop{ background:linear-gradient(180deg,#fffdf9,#f3ece2); color:var(--ink); border:1px solid rgba(120,90,60,.3); box-shadow:0 4px 10px rgba(0,0,0,.18),inset 0 1px 0 #fff; flex-direction:column; gap:2px; padding:4px; border-radius:10px; }
  .feature.k-prop .picon{ font-size:24px; line-height:1; pointer-events:none; filter:drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
  .feature.k-prop .plabel{ font-size:11px; color:var(--soft); font-weight:600; pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .feat-gear{ position:absolute; left:-9px; top:-9px; width:22px; height:22px; border-radius:50%; background:#fff; border:1px solid var(--line-2); box-shadow:0 1px 4px rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; z-index:3; touch-action:manipulation; }

  /* ---------- Tables & seats ---------- */
  .table{ position:absolute; }   /* NO z-index — see the floor layers above: it would trap every mark inside its table */
  .table-disc{ position:absolute; left:0; top:0; border-radius:50%; background:radial-gradient(circle at 38% 32%,#fffefc 0%,#f6f1e9 55%,#e8e0d3 100%); border:1px solid rgba(110,85,60,.3); box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 18px rgba(70,40,15,.2),0 2px 4px rgba(70,40,15,.12); display:flex; align-items:center; justify-content:center; flex-direction:column; transform:translate(-50%,-50%); cursor:grab; transition:box-shadow .15s; }
  .table-disc::before{ content:""; position:absolute; inset:-5px; border-radius:inherit; border:1px solid rgba(255,255,255,.6); box-shadow:0 0 0 4px rgba(255,255,255,.2); pointer-events:none; }
  .table-disc.head{ border-radius:14px; background:linear-gradient(180deg,#fffaf1 0%,#f6ecd9 100%); border:1.5px solid #cdb07a; }
  .table-disc.dragover{ box-shadow:0 0 0 4px #fff,0 0 0 8px var(--accent) !important; }
  .table.mergeto .table-disc{ box-shadow:0 0 0 4px #fff,0 0 0 8px var(--accent) !important; }
  .table-disc.rect{ border-radius:10px; background:linear-gradient(180deg,#fffefc 0%,#f4eee5 100%); }   /* a long table: chairs on both long sides */
  .table.shape-rect.focused::before{ border-radius:46px; }   /* its focus ring is a rounded box, not an ellipse */
  .fside{ height:1px; background:var(--line); margin:5px 0 5px 28px; }   /* long table: side A | side B in the seat list */
  .table-disc.head::after{ content:""; position:absolute; inset:4px; border:1px solid rgba(181,138,60,.55); border-radius:10px; pointer-events:none; }   /* gold inner rule */
  .table-disc:active{ cursor:grabbing; }
  .table:hover .table-disc{ box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 26px rgba(30,20,10,.28),0 2px 4px rgba(30,20,10,.12); }
  .table.focused .table-disc{ box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 26px rgba(30,20,10,.3); }
  /* focus ring drawn around the WHOLE table (seats included) — --frx/--fry are set per table in renderTables */
  .table.focused::before{ content:""; position:absolute; left:calc(-1*var(--frx,120px)); top:calc(-1*var(--fry,90px)); width:calc(2*var(--frx,120px)); height:calc(2*var(--fry,90px)); border-radius:50%; border:2px solid var(--accent); box-shadow:0 0 0 5px rgba(125,90,140,.16), inset 0 0 0 60px rgba(255,255,255,.08); pointer-events:none; z-index:0; }
  .table-disc .tnum{ font-family:var(--serif); font-size:17px; font-weight:700; color:var(--accent-ink); text-align:center; padding:0 6px; line-height:1.1; }
  .table-disc.head .tnum{ font-size:14px; }
  .table-disc .tcount{ font-size:10px; color:var(--faint); margin-top:2px; font-weight:600; letter-spacing:.02em; }
  .table-disc .tgear{ position:absolute; top:2px; right:6px; font-size:12px; color:var(--faint); cursor:pointer; display:none; padding:2px; }
  .table:hover .tgear, .table.focused .tgear{ display:block; }
  /* empty seat = a small linen chair (solid, with a chair back); occupied = the guest's pill in the group colour */
  /* NO transform on a pill, deliberately — buildSeat() sets its top-left corner instead. Any transform makes the
     pill a stacking context, and that lid is what kept its invitation mark from ever painting above a neighbouring
     name; a rotated table is the one exception (applyTableRot), where the counter-rotation is worth the lid. */
  .seat{ position:absolute; border:1px solid rgba(90,70,50,.32); background:linear-gradient(180deg,#fffdf9 0%,#efe8dd 100%); display:flex; align-items:center; justify-content:center; color:rgba(90,70,50,.75); text-align:center; overflow:hidden; cursor:pointer; user-select:none; transition:background .1s,border-color .1s; box-shadow:0 1px 1px rgba(0,0,0,.12); }
  .seat:not(.occupied):hover{ background:rgba(255,255,255,.95); border-color:var(--accent); }
  .seat:not(.occupied)::after{ content:""; position:absolute; left:22%; right:22%; top:3px; height:2px; border-radius:2px; background:rgba(90,70,50,.22); }
  .seat:not(.occupied) .nm{ display:none; }
  body.picking .seat:not(.occupied) .nm{ display:block; }   /* the '+' only when it means something */
  .seat.occupied{ border-color:transparent; color:#fff; font-weight:700; cursor:grab; background-image:linear-gradient(180deg,rgba(255,255,255,.2),rgba(0,0,0,.06)); box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 5px rgba(0,0,0,.22); text-shadow:0 1px 1px rgba(0,0,0,.25); }
  .seat.occupied:active{ cursor:grabbing; }
  .stem{ position:absolute; width:8px; height:8px; border-radius:50%; transform:translate(-50%,-50%); border:1.5px solid #fff; box-shadow:0 1px 2px rgba(0,0,0,.25); pointer-events:none; z-index:0; }
  .leader{ position:absolute; height:1.5px; transform-origin:0 50%; opacity:.6; pointer-events:none; z-index:0; }
  /* No z-index on an occupied pill, deliberately: a z-index here makes the pill a stacking context and TRAPS its
     invitation mark inside it, so a pill drawn later painted over — and swallowed the tap of — its neighbour's mark
     (169 of 286 marks on the lab floor). With the pill at auto the mark is free to sit at z-index 35, above every
     pill of its table, while overflow:hidden still clips it to the pill's own silhouette. The leaders are appended
     before the pills for the same reason: they are z-index:0, so only tree order now keeps them underneath.
     `.table` carries no z-index either, so a mark clears the names of the NEIGHBOURING tables too. */
  .table:hover{ z-index:50; }
  .seat.occupied:hover{ z-index:30; box-shadow:0 0 0 2px #fff,0 4px 14px rgba(30,20,10,.35) !important; }   /* a hovered name comes to the front while the mouse is on it */
  .seat:not(.occupied){ z-index:2; }   /* an empty chair must stay visible next to long names */
  .seat.lifted, body.touch .seat.lifted{ z-index:80; box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent),0 12px 28px rgba(30,20,10,.4); transition:none; }
  body.touch .seat{ -webkit-touch-callout:none; }
  /* the chair a lifted pill will land on: bigger, ringed — the finger no longer has to be exactly on it */
  .seat.snap{ z-index:55; transition:none; }
  .seat.snap:not(.occupied){ scale:1.45; background:#fff !important; border-color:var(--accent) !important; box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent),0 6px 16px rgba(30,20,10,.35) !important; }
  .seat.snap.occupied{ scale:1.25; box-shadow:0 0 0 3px #fff,0 0 0 6px #e0a030,0 6px 16px rgba(30,20,10,.35) !important; }
  #dragtag{ position:fixed; top:calc(var(--appbar-h) + 10px); left:50%; transform:translateX(-50%); z-index:360; background:#2a2622; color:#fff; padding:7px 14px; border-radius:999px; font-size:14px; font-weight:600; white-space:nowrap; max-width:calc(100vw - 24px); overflow:hidden; text-overflow:ellipsis; box-shadow:0 6px 20px rgba(0,0,0,.3); pointer-events:none; }
  #dragtag[hidden]{ display:none; }
  #dragtag.free{ background:#2f8f4e; }
  #dragtag.swap{ background:#b8791a; }
  #dragtag.merge{ background:var(--accent); }
  .seat.dragover{ background:#fff !important; border-color:var(--accent) !important; border-style:solid !important; color:var(--accent-ink) !important; }
  .seat .nm{ padding:0 5px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .table.focused .seat.sel{ box-shadow:0 0 0 3px #fff,0 0 0 5px var(--accent); }
  /* a name is picked: every chair says what happens if you tap it — green = free, amber = occupied (swap / replace) */
  body.picking .seat:not(.occupied){ border-color:#2f8f4e; border-style:solid; background:#d9f2df; color:#1f6b38; animation:pulseFree 1.3s ease-in-out infinite; }
  body.picking .seat:not(.occupied) .nm{ opacity:1 !important; font-weight:700; }
  @keyframes pulseFree{ 0%,100%{ box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 4px rgba(47,143,78,.9); } 50%{ box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 9px rgba(47,143,78,0); } }
  #stageResize{ position:absolute; right:-4px; bottom:-4px; width:26px; height:26px; background:var(--accent); border:2px solid #fff; border-radius:7px; cursor:nwse-resize; z-index:8; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  body:not(.touch) #stagewrap{ cursor:grab; }
  #stagewrap.grabbing, #stagewrap.grabbing *{ cursor:grabbing !important; }
  #stageResize::after{ content:"⤡"; color:#fff; font-size:15px; display:flex; align-items:center; justify-content:center; height:100%; }

  /* ---------- Focus panel (table sheet) ---------- */
  #focus{ width:var(--focus-w); flex:none; background:var(--card); border-left:1px solid var(--line); display:none; flex-direction:column; min-height:0; }
  body.focused #focus{ display:flex; }
  .fhandle{ display:none; width:100%; height:24px; padding:9px 0 0; cursor:pointer; flex:none; touch-action:manipulation; }
  .fhandle::before{ content:""; display:block; width:44px; height:5px; border-radius:3px; background:var(--line-2); margin:0 auto; }
  .fhead{ display:flex; align-items:center; gap:5px; padding:10px 10px 8px; border-bottom:1px solid var(--line); flex:none; }
  .fhead .ftitle{ flex:1; min-width:0; padding:0 2px; }
  .fhead .ftitle b{ font-family:var(--serif); font-size:18px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.35; cursor:pointer; }
  .fhead .ftitle span{ font-size:12px; color:var(--faint); }
  .fhint{ font-size:12px; color:var(--faint); padding:8px 14px 4px; line-height:1.4; flex:none; }
  .fhint[hidden]{ display:none; }
  #fSeats{ flex:1; overflow-y:auto; padding:6px 10px 10px; min-height:0; overscroll-behavior:contain; }
  .frow{ display:flex; align-items:center; gap:6px; padding:3px 0; }
  .frow .fn{ width:22px; text-align:right; font-size:11px; color:var(--faint); font-weight:700; flex:none; }
  .frow .fdot{ width:24px; height:24px; padding:4px; border:none; border-radius:50%; flex:none; background:#e2ddd5; background-clip:content-box; cursor:pointer; box-shadow:none; position:relative; }
  .frow .fdot::after{ content:""; position:absolute; inset:4px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
  .frow .fdot.empty{ opacity:.45; }
  .frow .fdot:hover{ transform:scale(1.1); }
  /* groups manager */
  .grow{ display:flex; align-items:center; gap:8px; padding:5px 0; }
  .grow .sw{ width:32px; height:32px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line-2); cursor:pointer; flex:none; padding:0; }
  .grow .gname{ flex:1; min-width:0; height:36px; padding:0 10px; border:1px solid var(--line); border-radius:9px; font-size:14px; }
  .grow .n{ font-size:12px; color:var(--faint); min-width:26px; text-align:right; font-variant-numeric:tabular-nums; }
  .grow.add{ border-top:1px solid var(--line); margin-top:8px; padding-top:12px; }
  #palette, #groupmenu{ z-index:320; }   /* may open from inside a modal (300) — must sit above it */
  #palette{ width:auto; padding:6px; }
  .pal{ display:grid; grid-template-columns:repeat(5,34px); gap:6px; padding:4px; }
  .psw{ width:34px; height:34px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line-2); cursor:pointer; padding:0; }
  .psw.on{ box-shadow:0 0 0 2px var(--accent); }
  .frow input{ flex:1; min-width:0; height:36px; padding:0 10px; border:1px solid var(--line); border-radius:9px; background:var(--paper); font-size:13.5px; }
  .frow input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:#fff; }
  .frow.occ input{ background:#fff; font-weight:600; }
  .frow .fx{ border:none; background:none; color:var(--faint); cursor:pointer; font-size:14px; padding:4px; border-radius:6px; width:26px; flex:none; visibility:hidden; }
  .frow.occ .fx{ visibility:visible; }
  .frow .fx:hover{ color:var(--danger); background:var(--paper); }
  .fsug{ margin:2px 0 6px 40px; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-1); overflow:hidden; }
  .fsug div{ padding:8px 10px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .fsug div .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .fsug div:hover, .fsug div.sel{ background:var(--accent-soft); }
  .fsug div.new{ color:var(--accent-ink); font-weight:600; }
  .fsug div.more{ color:var(--faint); font-size:11.5px; cursor:default; padding-top:4px; }
  .ffoot{ padding:8px 10px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px; flex:none; }
  .fchk{ width:22px; height:22px; border:2px solid var(--line); border-radius:6px; background:#fff; flex:none; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; }
  .frow.sel .fchk{ background:var(--accent); border-color:var(--accent); }
  .frow.sel .fchk::after{ content:"✓"; }
  /* Typing the name of an invitation that already exists: the people of it who sit at THIS table show as already in
     — an outlined tick, not the solid one of the names being ticked right now. Two states, never confusable. */
  .frow.inparty:not(.sel) .fchk{ border-color:var(--accent); background:#fff; color:var(--accent); }
  .frow.inparty:not(.sel) .fchk::after{ content:"✓"; font-size:13px; font-weight:700; }
  body.partysel .frow.inparty:not(.sel) input{ background:var(--accent-soft); opacity:.75; }
  #partysel .pbfound{ display:flex; align-items:baseline; gap:6px; font-size:12.5px; color:var(--accent-ink); }
  #partysel .pbfound b{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #partysel .pbfound .ps{ display:none; }   /* the selection count — folded in here only where the room is short */
  #partysel .pbfound .n{ margin-left:auto; color:var(--soft); font-size:11.5px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  body.partysel .frow:not(.occ){ opacity:.4; }
  body.partysel .frow.occ{ cursor:pointer; }
  body.partysel .frow input{ pointer-events:none; }
  body.partysel .frow.sel input{ background:var(--accent-soft); }
  #partysel{ padding:8px 10px; border-bottom:1px solid var(--line); background:var(--paper); display:flex; flex-direction:column; gap:6px; flex:none; }
  #partysel[hidden]{ display:none; }
  #partysel .pb1{ font-size:12.5px; color:var(--soft); }
  #partysel .pb2{ display:flex; gap:6px; }
  #partysel input{ flex:1; min-width:0; height:34px; border:1px solid var(--line); border-radius:9px; padding:0 10px; font:inherit; font-size:13.5px; background:var(--card); }
  #partysel .ibtn{ height:34px; }
  .ffoot .ibtn{ flex:1 1 calc(50% - 3px); height:36px; font-size:12.5px; }   /* Fill | Clear on one row, Group | Invitation on the next */

  /* ---------- Mobile bar · pick bar · drawer ---------- */
  #mobilebar{ display:none; position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:120; gap:2px; padding:4px; background:rgba(255,253,250,.96); border:1px solid var(--line); border-radius:18px; box-shadow:0 6px 22px rgba(40,30,20,.16); }
  #mobilebar .ibtn{ height:42px; flex:1; background:transparent; border:none; box-shadow:none; font-size:13.5px; font-weight:600; border-radius:13px; }
  #mobilebar .ibtn:active{ background:var(--paper); }
  #mobilebar .ibtn.sq{ flex:0 0 44px; font-size:18px; padding:0; }
  #mobilebar .ibtn:disabled{ opacity:.35; }
  #mobilebar .ibtn b{ background:var(--accent); color:#fff; border-radius:20px; padding:2px 8px; font-size:11px; }
  @media (max-width:430px){ #mobilebar #mbGuests span{ display:none; } }
  #navScrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:140; }
  #pickbar{ display:none; position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:210; background:#2a2622; color:#fff; border-radius:999px; padding:6px 7px 6px 16px; font-size:13px; align-items:center; gap:8px; box-shadow:0 8px 26px rgba(0,0,0,.35); max-width:95vw; }
  body.picking #pickbar{ display:flex; }
  body.picking .toast{ bottom:70px; }
  #pickbar .pbname{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:36vw; }
  #pickbar .pbhint{ color:#c9c2b8; white-space:nowrap; }
  #pickbar button{ border:none; background:rgba(255,255,255,.14); color:#fff; border-radius:999px; padding:7px 12px; font-size:12px; cursor:pointer; white-space:nowrap; }
  #pickbar button:hover{ background:rgba(255,255,255,.28); }
  .gchip, .seat, .chip, button, .fsug div, .frow, .gm-item, #pickbar, #focus, .fhead{ touch-action:manipulation; }
  .table-disc, .feature, .rz, .rot-h, #stageResize{ touch-action:none; }
  /* touch: a finger on a table or decor PANS the floor; a HELD finger (long-press) lifts it to move — see makeDraggable */
  body.touch .table-disc, body.touch .feature{ touch-action:pan-x pan-y; }
  /* touch: cheaper paint — no soft shadows on 300 pills, no drape ring, no dotted paper */
  body.touch .seat.occupied{ box-shadow:0 1px 3px rgba(0,0,0,.28); text-shadow:none; }
  body.picking .seat.occupied, body.touch.picking .seat.occupied{ box-shadow:0 0 0 2px #fff,0 0 0 4px #e0a030; }
  body.picking .seat.occupied.picked, body.touch.picking .seat.occupied.picked{ box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent); }   /* the one being moved */
  body.picking .seat.occupied.lifted, body.touch.picking .seat.occupied.lifted{ box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent),0 12px 28px rgba(30,20,10,.4); }
  body.touch .table-disc{ box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 3px 8px rgba(70,40,15,.22); }
  body.touch .table-disc::before{ display:none; }
  body.touch #stage{ box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 8px 24px rgba(40,30,20,.2); }
  body.touch #stagewrap{ background-image:none; }
  .table-disc .tnum{ font-size:calc(17px * var(--tfs,1)); }
  .table-disc.head .tnum{ font-size:calc(14px * var(--tfs,1)); }
  /* far view (phones only, zoom < 0.4): only a big number per table — set/cleared in applyZoom */
  body.far .table-disc .tcount, body.far .seat .nm, body.far .tgear{ display:none !important; }
  body.far .table-disc .tnum{ font-size:min(calc(var(--dd,112px) * .5), calc(56px * var(--tfs,1))); line-height:1; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:font-size .15s; }
  body.far .table-disc.head .tnum{ font-size:calc(30px * var(--tfs,1)); }
  body.far .table-disc.rect .tnum{ font-size:min(54px, calc(46px * var(--tfs,1))); }
  body.far .seat:not(.occupied)::after{ display:none; }

  /* ---------- Popovers & modals ---------- */
  .popover{ position:fixed; z-index:250; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-2); padding:8px; font-size:13px; display:none; }
  .gm-item{ display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .gm-item:hover{ background:var(--paper); }
  .gm-item .dot{ width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); flex:none; }
  .gm-item.danger{ color:var(--danger); }
  .gm-item.on{ background:var(--accent-soft); color:var(--accent-ink); font-weight:600; }
  /* view menu (names · sizes · zoom) */
  #viewmenu{ width:256px; padding:8px; }
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button{ height:32px; padding:0 11px; border:none; background:var(--card); cursor:pointer; font-size:12.5px; border-left:1px solid var(--line); }
  .seg button:first-child{ border-left:none; }
  .seg button.on{ background:var(--accent); color:#fff; }
  .vrow{ display:flex; align-items:center; gap:6px; padding:2px 6px 8px; }
  .vrow .pct{ min-width:44px; text-align:center; font-size:12px; color:var(--soft); font-variant-numeric:tabular-nums; }
  /* an object lifted by a long-press (touch) or grabbed with the mouse */
  .lifted{ z-index:9 !important; }
  .table.lifted .table-disc{ box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent),0 18px 40px rgba(30,20,10,.38); }
  .feature.lifted{ outline:3px solid var(--accent); box-shadow:0 18px 40px rgba(30,20,10,.38); }
  body.zooming #stage{ will-change:transform; }
  .gm-item .n{ margin-left:auto; color:var(--faint); font-size:11.5px; padding-left:10px; }
  .gm-sep{ height:1px; background:var(--line); margin:4px 2px; }
  .gm-item .gmx{ width:16px; flex:none; text-align:center; font-size:14px; color:var(--faint); }
  .gm-cap{ font-size:11px; color:var(--faint); padding:4px 9px 6px; letter-spacing:.04em; text-transform:uppercase; font-weight:700; }
  #tablemenu{ width:236px; padding:12px; }
  #tablemenu h3{ font-size:13.5px; margin-bottom:8px; font-family:var(--serif); }
  #tablemenu .row{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  #tablemenu label{ font-size:11.5px; color:var(--soft); }
  #tablemenu input[type=text]{ width:100%; height:34px; padding:0 9px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  #tablemenu .caps{ display:flex; gap:5px; flex-wrap:wrap; }
  #tablemenu .caps button{ height:30px; padding:0 10px; border:1px solid var(--line); background:var(--card); border-radius:7px; cursor:pointer; font-size:12.5px; }
  #tablemenu .caps button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  #tablemenu input[type=number]{ width:58px; height:30px; padding:0 6px; border:1px solid var(--line); border-radius:7px; }
  #tablemenu .menu-actions{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  #tablemenu .menu-actions .ibtn{ height:34px; font-size:12px; padding:0 6px; justify-content:flex-start; }
  .menu-actions .ibtn.wide{ grid-column:1 / -1; }
  .gm-item.gm-new{ padding:4px 6px; cursor:default; }
  .gm-item.gm-new:hover{ background:transparent; }
  .gm-item.gm-new input{ flex:1; min-width:0; width:120px; height:30px; border:1px solid var(--line); border-radius:8px; padding:0 8px; font:inherit; font-size:13px; background:var(--card); color:var(--ink); }
  .gm-item.gm-new .ibtn{ height:30px; width:34px; padding:0; flex:none; justify-content:center; }
  #groupmenu, #profilemenu, #moremenu, #fillmenu{ min-width:190px; padding:6px; }
  #moremenu{ max-height:calc(100vh - 70px); max-height:calc(100dvh - 70px); overflow-y:auto; }
  #moremenu .gm-more{ display:none; }
  #moremenu.expanded .gm-more{ display:block; }
  #moremenu.expanded .gm-item.more{ display:none; }
  #moremenu .gm-item.more{ color:var(--accent-ink); font-weight:600; }
  #guesteditor{ width:236px; padding:10px; }
  #guesteditor .ge-name{ width:100%; height:36px; padding:0 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; font-size:14px; }
  #guesteditor .ge-lab{ font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin:0 2px 5px; font-weight:700; }
  #guesteditor .ge-types{ display:flex; flex-direction:column; gap:2px; max-height:220px; overflow:auto; }
  #guesteditor .ge-type{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  #guesteditor .ge-type:hover{ background:var(--paper); }
  #guesteditor .ge-type.sel{ background:var(--accent-soft); font-weight:600; }
  #guesteditor .ge-type .dot{ width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); flex:none; }
  #guesteditor .ge-type .chk{ margin-left:auto; color:var(--good); font-weight:700; }
  #guesteditor .ge-inv{ margin:-4px 0 8px; padding:6px 8px; color:var(--accent-ink); font-size:12.5px; white-space:normal; line-height:1.3; }
  #guesteditor .ge-inv span{ min-width:0; overflow-wrap:anywhere; }
  #featuremenu{ width:230px; padding:8px; }
  #featuremenu .fm-mats{ display:flex; flex-wrap:wrap; gap:6px; margin:0 6px 8px; }
  #featuremenu .fm-mat{ cursor:pointer; border-radius:7px; padding:2px; border:2px solid transparent; }
  #featuremenu .fm-mat:hover, #featuremenu .fm-mat.on{ border-color:var(--accent); }
  #featuremenu .fm-mat .sw{ display:block; width:32px; height:24px; border-radius:4px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.2); }
  .modal-back{ position:fixed; inset:0; background:rgba(30,20,10,.45); display:none; align-items:center; justify-content:center; z-index:300; backdrop-filter:blur(2px); }
  .modal-back.open{ display:flex; }
  .modal{ background:var(--card); border-radius:16px; width:min(620px,94vw); max-height:84vh; overflow:auto; box-shadow:0 30px 80px rgba(0,0,0,.35); }
  .modal.narrow{ width:min(440px,94vw); }
  .delskip{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--soft); margin:6px 0 2px; cursor:pointer; user-select:none; }
  .delskip input{ width:16px; height:16px; margin:0; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card); z-index:1; }
  .modal-head strong{ font-size:15px; font-family:var(--serif); }
  .modal-head .mx{ border:none; background:none; font-size:20px; cursor:pointer; color:var(--faint); line-height:1; }
  .modal .mhint{ padding:10px 16px 0; font-size:12.5px; color:var(--soft); line-height:1.45; }
