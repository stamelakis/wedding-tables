<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --grass:#6ab61e; --grass2:#79c62b; --ink:#2b2b2b; --panel:#ffffff; --line:#e2e2e2;
    --accent:#b5835a; --accent-dark:#8a5f3c; --lake:#2f6fd0; --danger:#d9534f;
  }
  html,body{height:100%;}
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:#f4f1ec; display:flex; height:100vh; overflow:hidden; }

  /* ---------- Sidebar ---------- */
  #sidebar{ width:290px; min-width:290px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; height:100%; }
  #sidebar h1{ font-size:17px; padding:16px 16px 4px; font-weight:700; letter-spacing:.2px; }
  #sidebar .sub{ padding:0 16px 12px; font-size:12px; color:#888; }
  .toolbar{ padding:10px 16px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; }
  button.btn{ font-size:13px; padding:7px 11px; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; color:var(--ink); transition:.12s; }
  button.btn:hover{ background:#f5f5f5; border-color:#ccc; }
  button.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  button.btn.primary:hover{ background:var(--accent-dark); }
  button.btn.danger{ color:var(--danger); }
  .section{ padding:12px 16px 4px; }
  .section-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#999; margin-bottom:8px; }
  #groupList{ display:flex; flex-wrap:wrap; gap:6px; }
  .group-pill{ display:flex; align-items:center; gap:6px; padding:4px 8px 4px 6px; border-radius:16px; border:1.5px solid var(--line); background:#fff; cursor:pointer; font-size:12px; user-select:none; }
  .group-pill.active{ border-color:#333; box-shadow:0 0 0 2px rgba(0,0,0,.06); }
  .group-pill .dot{ width:13px; height:13px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.15); }
  .group-pill .gname{ white-space:nowrap; }
  .group-pill .gcount{ color:#aaa; font-size:11px; }
  .group-pill.addgroup{ color:#888; border-style:dashed; }
  .addguest{ padding:8px 16px 6px; }
  .addguest textarea{ width:100%; height:64px; resize:vertical; padding:8px; font-size:13px; border:1px solid var(--line); border-radius:8px; font-family:inherit; }
  .addguest .hint{ font-size:11px; color:#999; margin:4px 0 6px; }
  .pool-head{ display:flex; justify-content:space-between; align-items:center; padding:8px 16px 6px; }
  .pool-head span{ font-size:13px; font-weight:600; }
  .pool-head .count{ font-size:12px; color:#888; font-weight:400; }
  #unassigned{ flex:1; overflow-y:auto; padding:0 16px 16px; display:flex; flex-direction:column; gap:6px; }
  #unassigned.dragover{ background:#fbf6ef; outline:2px dashed var(--accent); outline-offset:-6px; border-radius:8px; }
  .guest-chip{ background:#f3ede4; border:1px solid #e6dccb; border-left:4px solid #ccc; border-radius:8px; padding:6px 10px; font-size:13px; cursor:grab; display:flex; align-items:center; justify-content:space-between; user-select:none; }
  .guest-chip:active{ cursor:grabbing; }
  .guest-chip .x{ color:#bbb; font-size:15px; padding-left:8px; cursor:pointer; }
  .guest-chip .x:hover{ color:var(--danger); }
  .empty-note{ font-size:12px; color:#bbb; padding:14px 4px; text-align:center; }

  /* ---------- Stage ---------- */
  #stagewrap{ flex:1; position:relative; overflow:auto; }
  #topbar{ position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(4px); border-bottom:1px solid var(--line); padding:8px 14px; display:flex; align-items:center; gap:12px; font-size:13px; color:#666; }
  #topbar .spacer{ flex:1; }
  #topbar .ctl{ display:flex; align-items:center; gap:6px; }
  #topbar .ctl button{ min-width:28px; height:28px; padding:0 6px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:14px; }
  #topbar .ctl .lbl{ color:#999; }
  #stage{ position:relative; width:1700px; height:1360px; margin:24px; background:radial-gradient(circle at 30% 20%, var(--grass2), var(--grass)); border:3px solid #4f8f14; border-radius:6px; transform-origin:top left; }

  .feature{ position:absolute; font-size:12px; color:#fff; font-weight:600; display:flex; align-items:center; justify-content:center; text-align:center; transform:translate(-50%,-50%); border-radius:4px; padding:2px 4px; line-height:1.15; cursor:grab; user-select:none; z-index:1; }
  .feature:active{ cursor:grabbing; }
  .lake{ background:var(--lake); box-shadow:inset 0 0 20px rgba(0,0,0,.15); }
  .deck{ background:var(--accent-dark); border:2px dashed #f0d9bf; }
  .dancefloor{ background:#2f8f2f; border:3px solid #256f25; color:#fff; font-size:18px; letter-spacing:.5px; }
  .box{ background:#111; color:#fff; }
  .kiosk{ background:#fff; color:#333; border:1px solid #bbb; }
  .label-plain{ background:rgba(255,255,255,.85); color:#333; }

  /* ---------- Tables ---------- */
  .table{ position:absolute; z-index:5; }
  .table-disc{ position:absolute; left:0; top:0; border-radius:50%; background:#ffffff; border:2px solid #d8c4a8; box-shadow:0 3px 8px rgba(0,0,0,.18); display:flex; align-items:center; justify-content:center; flex-direction:column; transform:translate(-50%,-50%); cursor:grab; }
  .table-disc.head{ border-radius:12px; background:#fff7ef; border:2px solid var(--accent); }
  .table-disc:active{ cursor:grabbing; }
  .table-disc .tnum{ font-size:15px; font-weight:800; color:var(--accent-dark); text-align:center; padding:0 6px; }
  .table-disc.head .tnum{ font-size:14px; }
  .table-disc .tcount{ font-size:10px; color:#999; margin-top:1px; }
  .table-disc .tgear{ position:absolute; top:3px; right:6px; font-size:12px; color:#bbb; cursor:pointer; display:none; }
  .table:hover .tgear{ display:block; }
  .seat{ position:absolute; transform:translate(-50%,-50%); border:1.5px dashed #cbb48f; background:rgba(255,255,255,.6); display:flex; align-items:center; justify-content:center; color:#a08a68; text-align:center; overflow:hidden; cursor:pointer; user-select:none; transition:background .1s, border-color .1s; }
  .seat.occupied{ border-style:solid; color:#fff; font-weight:700; cursor:grab; }
  .seat.occupied:active{ cursor:grabbing; }
  .seat.dragover{ background:#ffe9cf !important; border-color:#e08a1e !important; color:#8a5f3c !important; }
  .seat .nm{ padding:0 4px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .seat input{ width:100%; border:none; background:transparent; color:#fff; text-align:center; outline:none; font-family:inherit; font-size:inherit; }
  .seat.editing{ background:#fff !important; border-color:#e08a1e; z-index:9; }
  .seat.editing input{ color:#333; }

  /* popovers */
  .popover{ position:fixed; z-index:100; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); padding:10px; font-size:13px; display:none; }
  #tablemenu{ width:220px; }
  #tablemenu h3{ font-size:13px; margin-bottom:8px; }
  #tablemenu .row{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  #tablemenu label{ font-size:12px; color:#666; }
  #tablemenu input[type=text]{ width:100%; padding:5px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  #tablemenu .caps{ display:flex; gap:5px; flex-wrap:wrap; }
  #tablemenu .caps button{ padding:5px 9px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; font-size:12px; }
  #tablemenu .caps button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  #tablemenu input[type=number]{ width:56px; padding:5px; border:1px solid var(--line); border-radius:6px; }
  #tablemenu .menu-actions{ display:flex; justify-content:space-between; margin-top:6px; }
  #groupmenu{ width:190px; padding:6px; }
  #groupmenu .gm-item{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  #groupmenu .gm-item:hover{ background:#f4f0ea; }
  #groupmenu .gm-item .dot{ width:13px; height:13px; border-radius:50%; border:1px solid rgba(0,0,0,.15); flex:none; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; transition:.3s; z-index:200; }
  .toast.show{ opacity:.95; }

  /* ---------- Print ---------- */
  #printarea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printarea, #printarea *{ visibility:visible; }
    #printarea{ display:block; position:absolute; left:0; top:0; width:100%; padding:0 10px; }
  }
  #printarea h2{ font-size:22px; margin:0 0 2px; }
  #printarea .psub{ color:#666; margin-bottom:14px; font-size:13px; }
  #printarea .plegend{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; font-size:12px; }
  #printarea .plegend span{ display:flex; align-items:center; gap:5px; }
  #printarea .plegend .dot{ width:12px; height:12px; border-radius:50%; display:inline-block; }
  #printarea .ptables{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  #printarea .pcard{ border:1px solid #ccc; border-radius:8px; padding:10px 12px; break-inside:avoid; }
  #printarea .pcard h3{ font-size:15px; margin-bottom:6px; border-bottom:1px solid #eee; padding-bottom:4px; }
  #printarea .pcard ol{ margin-left:18px; font-size:12.5px; line-height:1.55; }
  #printarea .pcard li .gdot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
  #printarea .pcard .empty{ color:#bbb; }
  #printarea .punassigned{ margin-top:18px; font-size:12.5px; }
</style>

  <div class="sub">Drag names onto chairs · double-click a chair to type · right-click a guest for its group · drag tables & garden items to move them</div>
  <div class="toolbar">
    <button class="btn primary" id="addTableBtn">＋ Round table</button>
    <button class="btn" id="addHeadBtn">＋ Head table</button>

  </div>

  <div id="topbar">
    <strong>Garden layout</strong>

<script>
"use strict";
// ============================================================
//  Wedding Seating Planner — single self-contained file
// ============================================================
const STORE_KEY = "weddingSeatingPlanner.v2";
const LAYOUT_VERSION = 4;
const FONT_FAMILY = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

// 27 round-table centres on the 1700 x 1360 garden (block of tables above, columns flanking the floor)
const DEFAULT_POSITIONS = [
  [360,190],[555,190],[750,190],[945,190],[1140,190],[1335,190],[1530,190],
  [360,360],[555,360],[750,360],[945,360],[1140,360],[1335,360],[1530,360],
  [360,530],[555,530],[750,530],[945,530],[1140,530],[1335,530],[1530,530],
  [360,720],[360,900],[360,1080],
  [1530,720],[1530,900],[1530,1080],
];

// Garden features — movable; the lake is split into two by the deck (the couple's entrance)
function defaultFeatures(){ return [
  {id:"f-pil1",  cls:"box",        x:400, y:95,  w:34, h:34, text:""},
  {id:"f-pil2",  cls:"box",        x:520, y:95,  w:34, h:34, text:""},
  {id:"f-ent",   cls:"label-plain",x:460, y:55,  w:172,h:26, text:"ΕΙΣΟΔΟΣ · Guest entrance"},
  {id:"f-kiosk", cls:"kiosk",      x:720, y:70,  w:180,h:42, text:"ΚΙΟΣΚΙ · Welcome drink"},
  {id:"f-lake1", cls:"lake",       x:150, y:320, w:100,h:190,text:"ΛΙΜΝΗ · Lake"},
  {id:"f-deck",  cls:"deck",       x:150, y:460, w:122,h:92, text:"DECK · Couple entrance"},
  {id:"f-lake2", cls:"lake",       x:150, y:600, w:100,h:190,text:""},
  {id:"f-floor", cls:"dancefloor", x:945, y:925, w:450,h:450,text:"ΠΙΣΤΑ · Dance floor"},
  {id:"f-dj",    cls:"box",        x:120, y:1300,w:78, h:34, text:"DJ"},
  {id:"f-stools",cls:"box",        x:1560,y:95,  w:130,h:30, text:"Stools"},
]; }

const GROUP_PALETTE = ["#e26d8a","#4a90d9","#3aa657","#e0a030","#8e7cc3","#e0663a","#3ab0a6","#b07cc3","#7c9cc3","#c3a03a"];

let state = load() || defaultState();
let zoom = 1;
let fontScale = state.seatFontScale || 1;
let activeMenuTableId = null;
let uid = state._uid || 2001;
function nextId(){ uid++; state._uid = uid; return uid; }

function makeHeadTable(id){ return { id, label:"💑 Head Table", shape:"head", x:945, y:1245, capacity:10, seats:Array(10).fill(null) }; }

function defaultState(){
  const tables = DEFAULT_POSITIONS.map((p,i)=>({ id:1001+i, label:String(i+1), shape:"round", x:p[0], y:p[1], capacity:10, seats:Array(10).fill(null) }));
  tables.push(makeHeadTable(2000));
  const groups = [
    {id:"grp1", name:"Bride's side", color:GROUP_PALETTE[0]},
    {id:"grp2", name:"Groom's side", color:GROUP_PALETTE[1]},
    {id:"grp3", name:"Friends",      color:GROUP_PALETTE[2]},
    {id:"grp4", name:"Family",       color:GROUP_PALETTE[3]},
  ];
  return { _uid:2001, tables, guests:{}, groups, activeGroupId:null, features:defaultFeatures(), seatFontScale:1, layoutVersion:LAYOUT_VERSION };
}

// ---------- persistence ----------
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(STORE_KEY));
    if(s&&s.tables){
      if(!s.groups) s.groups=[];
      if(s.layoutVersion!==LAYOUT_VERSION) migrateLayout(s);
      return s;
    }
  }catch(e){}
  return null;
}
// Keep guests / groups / seat assignments; refresh the garden layout to this version.
function migrateLayout(s){
  let ri=0;
  s.tables.forEach(t=>{ if(t.shape!=="head"){ t.shape="round"; if(DEFAULT_POSITIONS[ri]){ t.x=DEFAULT_POSITIONS[ri][0]; t.y=DEFAULT_POSITIONS[ri][1]; } ri++; } });
  if(!s.tables.some(t=>t.shape==="head")){ s._uid=(s._uid||2001)+1; s.tables.push(makeHeadTable(s._uid)); }
  s.features = defaultFeatures();
  if(typeof s.seatFontScale!=="number") s.seatFontScale=1;
  s.layoutVersion=LAYOUT_VERSION;
}

// ---------- helpers ----------
function assignedGuestIds(){ const set=new Set(); state.tables.forEach(t=>t.seats.forEach(g=>{ if(g)set.add(g); })); return set; }
function guestName(id){ return state.guests[id]?.name ?? "?"; }
function guestGroup(id){ const gid=state.guests[id]?.groupId; return gid? state.groups.find(g=>g.id===gid) : null; }
function guestColor(id){ const g=guestGroup(id); return g? g.color : "#b5835a"; }
function hexTint(hex){ return hex+"22"; }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._to); t._to=setTimeout(()=>t.classList.remove("show"),1600); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// ---------- text measuring (so seats grow to fit the name) ----------
const _measureCtx = document.createElement("canvas").getContext("2d");
function textWidth(txt, fs){ _measureCtx.font = `700 ${fs}px ${FONT_FAMILY}`; return _measureCtx.measureText(txt).width; }
function seatWidthFor(name, fs){ return Math.round(clamp(textWidth(name,fs)+18, 46, 190)); }

// ============================================================
//  RENDER
// ============================================================
const stage = document.getElementById("stage");

function renderFeatures(){
  stage.querySelectorAll(".feature").forEach(e=>e.remove());
  (state.features||[]).forEach(f=>{
    const el=document.createElement("div");
    el.className="feature "+f.cls;
    el.style.left=f.x+"px"; el.style.top=f.y+"px"; el.style.width=f.w+"px"; el.style.height=f.h+"px";
    el.textContent=f.text;
    el.title="Drag to move";
    makeDraggable(el, el, f, ()=>{});
    stage.appendChild(el);
  });
}

function roundGeom(t){
  const n=t.capacity;
  const fs=Math.round(11*fontScale);
  const seatH=fs+10;
  let maxW=48;
  t.seats.forEach(gid=>{ if(gid){ const w=seatWidthFor(guestName(gid),fs); if(w>maxW)maxW=w; } });
  const need=maxW/(2*Math.sin(Math.PI/n))*0.98;
  const ringR=Math.max(need, 46, seatH*1.25);
  const discR=Math.max(24, ringR - seatH/2 - 6);
  return {n,fs,seatH,ringR,discR};
}

function buildSeat(t,i,relx,rely,fs,seatH){
  const seat=document.createElement("div");
  const gid=t.seats[i];
  seat.className="seat"+(gid?" occupied":"");
  seat.style.left=relx+"px"; seat.style.top=rely+"px";
  seat.style.height=seatH+"px"; seat.style.borderRadius=(seatH/2)+"px"; seat.style.fontSize=fs+"px";
  seat.dataset.tableId=t.id; seat.dataset.seatIndex=i;
  if(gid){
    const col=guestColor(gid);
    seat.style.background=col; seat.style.borderColor=col; seat.style.width=seatWidthFor(guestName(gid),fs)+"px";
    seat.innerHTML=`<span class="nm">${escapeHtml(guestName(gid))}</span>`;
    seat.title=guestName(gid)+(guestGroup(gid)?` · ${guestGroup(gid).name}`:"");
    seat.draggable=true; seat.dataset.guestId=gid;
  }else{
    seat.style.width="42px";
    seat.innerHTML=`<span class="nm" style="opacity:.55">+</span>`;
  }
  wireSeat(seat);
  return seat;
}

function renderRoundTable(t, wrap){
  const g=roundGeom(t);
  const disc=document.createElement("div");
  disc.className="table-disc";
  disc.style.width=(g.discR*2)+"px"; disc.style.height=(g.discR*2)+"px";
  const occ=t.seats.filter(Boolean).length;
  disc.innerHTML=`<span class="tgear" title="Table settings">⚙</span><span class="tnum">${escapeHtml(t.label)}</span><span class="tcount">${occ}/${t.capacity}</span>`;
  disc.querySelector(".tgear").addEventListener("click",e=>{ e.stopPropagation(); openMenu(t.id,e); });
  disc.addEventListener("contextmenu",e=>{ e.preventDefault(); openMenu(t.id,e); });
  makeDraggable(disc, wrap, t, ()=>renderTables());
  wrap.appendChild(disc);
  for(let i=0;i<t.capacity;i++){
    const a=(i/t.capacity)*2*Math.PI - Math.PI/2;
    wrap.appendChild(buildSeat(t,i, g.ringR*Math.cos(a), g.ringR*Math.sin(a), g.fs, g.seatH));
  }
}

function headGeom(t){
  const n=t.capacity;
  const top=Math.max(1,n-2);
  const fs=Math.round(11*fontScale);
  const seatH=fs+10;
  let slot=64;
  for(let i=0;i<top;i++){ const gid=t.seats[i]; if(gid){ const w=seatWidthFor(guestName(gid),fs)+8; if(w>slot)slot=w; } }
  const innerW=top*slot;
  const tableW=innerW+34;
  const tableH=seatH+50;
  return {n,top,fs,seatH,slot,innerW,tableW,tableH};
}

function renderHeadTable(t, wrap){
  const g=headGeom(t);
  const disc=document.createElement("div");
  disc.className="table-disc head";
  disc.style.width=g.tableW+"px"; disc.style.height=g.tableH+"px";
  const occ=t.seats.filter(Boolean).length;
  disc.innerHTML=`<span class="tgear" title="Table settings">⚙</span><span class="tnum">${escapeHtml(t.label)}</span><span class="tcount">${occ}/${t.capacity} · faces the dance floor</span>`;
  disc.querySelector(".tgear").addEventListener("click",e=>{ e.stopPropagation(); openMenu(t.id,e); });
  disc.addEventListener("contextmenu",e=>{ e.preventDefault(); openMenu(t.id,e); });
  makeDraggable(disc, wrap, t, ()=>renderTables());
  wrap.appendChild(disc);

  // top row (facing the dance floor, which sits above the head table)
  for(let i=0;i<g.top;i++){
    const relx = -g.innerW/2 + g.slot/2 + i*g.slot;
    const rely = -(g.tableH/2) - g.seatH/2 - 6;
    wrap.appendChild(buildSeat(t,i, relx, rely, g.fs, g.seatH));
  }
  // the two end seats
  const li=g.top, ri=g.top+1;
  const lw=t.seats[li]?seatWidthFor(guestName(t.seats[li]),g.fs):46;
  const rw=t.seats[ri]?seatWidthFor(guestName(t.seats[ri]),g.fs):46;
  if(li<t.capacity) wrap.appendChild(buildSeat(t,li, -(g.tableW/2)-lw/2-6, 0, g.fs, g.seatH));
  if(ri<t.capacity) wrap.appendChild(buildSeat(t,ri,  (g.tableW/2)+rw/2+6, 0, g.fs, g.seatH));
}

function renderTables(){
  stage.querySelectorAll(".table").forEach(e=>e.remove());
  state.tables.forEach(t=>{
    const wrap=document.createElement("div");
    wrap.className="table"; wrap.style.left=t.x+"px"; wrap.style.top=t.y+"px"; wrap.dataset.tableId=t.id;
    if(t.shape==="head") renderHeadTable(t,wrap); else renderRoundTable(t,wrap);
    stage.appendChild(wrap);
  });
  updateStats();
}

function renderGroups(){
  const box=document.getElementById("groupList"); box.innerHTML="";
  const counts={};
  Object.keys(state.guests).forEach(id=>{ const g=state.guests[id].groupId; if(g)counts[g]=(counts[g]||0)+1; });
  box.appendChild(makeGroupPill({id:null,name:"No group",color:"#cccccc"}, counts, true));
  state.groups.forEach(g=> box.appendChild(makeGroupPill(g, counts, false)) );
  const add=document.createElement("div");
  add.className="group-pill addgroup"; add.innerHTML="＋ group"; add.title="Add a new group";
  add.addEventListener("click",addGroup); box.appendChild(add);
}
function makeGroupPill(g, counts, isNone){
  const pill=document.createElement("div");
  pill.className="group-pill"+(state.activeGroupId===g.id?" active":"");
  const c=isNone?0:(counts[g.id]||0);
  pill.innerHTML=`<span class="dot" style="background:${g.color}"></span><span class="gname">${escapeHtml(g.name)}</span>${isNone?"":`<span class="gcount">${c}</span>`}`;
  pill.addEventListener("click",()=>{ state.activeGroupId=g.id; save(); renderGroups(); });
  if(!isNone){
    pill.title="Click: set active · Double-click: rename · Right-click: recolor / delete";
    pill.addEventListener("dblclick",e=>{ e.stopPropagation(); renameGroup(g.id); });
    pill.addEventListener("contextmenu",e=>{ e.preventDefault(); editGroup(g.id,e); });
    pill.querySelector(".dot").addEventListener("click",e=>{ e.stopPropagation(); recolorGroup(g.id); });
  }
  return pill;
}

function renderPool(){
  const pool=document.getElementById("unassigned"); pool.innerHTML="";
  const assigned=assignedGuestIds();
  const un=Object.keys(state.guests).filter(id=>!assigned.has(id));
  document.getElementById("poolCount").textContent=un.length;
  if(un.length===0){ pool.innerHTML=`<div class="empty-note">No unassigned guests.<br>Add names above ↑</div>`; return; }
  un.forEach(id=>{
    const col=guestColor(id);
    const chip=document.createElement("div");
    chip.className="guest-chip"; chip.draggable=true; chip.dataset.guestId=id;
    chip.style.borderLeftColor=col; chip.style.background=hexTint(col);
    chip.innerHTML=`<span>${escapeHtml(guestName(id))}</span><span class="x" title="Remove guest">✕</span>`;
    chip.addEventListener("dragstart",e=>{ dragData={type:"guest",guestId:id,from:"pool"}; e.dataTransfer.effectAllowed="move"; });
    chip.addEventListener("contextmenu",e=>{ e.preventDefault(); openGroupMenu(id,e); });
    chip.querySelector(".x").addEventListener("click",()=>{ delete state.guests[id]; save(); renderPool(); renderGroups(); toast("Guest removed"); });
    pool.appendChild(chip);
  });
}

function updateStats(){
  const totalSeats=state.tables.reduce((s,t)=>s+t.capacity,0);
  const seated=assignedGuestIds().size;
  document.getElementById("statLine").textContent=`· ${state.tables.length} tables · ${seated} seated · ${totalSeats} seats`;
}

// ============================================================
//  GROUPS
// ============================================================
function addGroup(){
  const name=prompt("New group name:","Group "+(state.groups.length+1)); if(!name)return;
  const color=GROUP_PALETTE[state.groups.length % GROUP_PALETTE.length];
  const g={id:"grp"+nextId(), name:name.trim(), color};
  state.groups.push(g); state.activeGroupId=g.id; save(); renderGroups();
}
function renameGroup(id){ const g=state.groups.find(x=>x.id===id); if(!g)return; const nm=prompt("Rename group:",g.name); if(nm&&nm.trim()){ g.name=nm.trim(); save(); renderGroups(); } }
function recolorGroup(id){
  const g=state.groups.find(x=>x.id===id); if(!g)return;
  const inp=document.createElement("input"); inp.type="color"; inp.value=g.color;
  inp.style.position="fixed"; inp.style.left="-9999px"; document.body.appendChild(inp);
  inp.addEventListener("input",()=>{ g.color=inp.value; save(); renderGroups(); renderTables(); renderPool(); });
  inp.addEventListener("change",()=>inp.remove()); inp.click();
}
function editGroup(id,evt){
  const g=state.groups.find(x=>x.id===id); if(!g)return;
  const menu=document.getElementById("groupmenu");
  menu.innerHTML=`
    <div class="gm-item" data-act="rename"><span class="dot" style="background:${g.color}"></span>Rename “${escapeHtml(g.name)}”</div>
    <div class="gm-item" data-act="recolor"><span class="dot" style="background:${g.color}"></span>Change colour</div>
    <div class="gm-item" data-act="delete" style="color:#d9534f"><span class="dot" style="background:#d9534f"></span>Delete group</div>`;
  menu.querySelector('[data-act="rename"]').onclick=()=>{ closeGroupMenu(); renameGroup(id); };
  menu.querySelector('[data-act="recolor"]').onclick=()=>{ closeGroupMenu(); recolorGroup(id); };
  menu.querySelector('[data-act="delete"]').onclick=()=>{
    closeGroupMenu();
    if(!confirm(`Delete group “${g.name}”? Guests keep their seats but lose the colour.`))return;
    Object.values(state.guests).forEach(gu=>{ if(gu.groupId===id) gu.groupId=null; });
    state.groups=state.groups.filter(x=>x.id!==id);
    if(state.activeGroupId===id) state.activeGroupId=null;
    save(); renderGroups(); renderTables(); renderPool();
  };
  showPopover(menu,evt);
}
function openGroupMenu(guestId, evt){
  const menu=document.getElementById("groupmenu");
  const rows=[`<div class="gm-item" data-gid=""><span class="dot" style="background:#ccc"></span>No group</div>`]
    .concat(state.groups.map(g=>`<div class="gm-item" data-gid="${g.id}"><span class="dot" style="background:${g.color}"></span>${escapeHtml(g.name)}</div>`));
  menu.innerHTML=rows.join("");
  menu.querySelectorAll(".gm-item").forEach(it=>{ it.onclick=()=>{ state.guests[guestId].groupId=it.dataset.gid||null; save(); renderTables(); renderPool(); renderGroups(); closeGroupMenu(); }; });
  showPopover(menu,evt);
}
function showPopover(menu,evt){
  menu.style.display="block";
  const x=Math.min(evt.clientX, window.innerWidth - menu.offsetWidth - 10);
  const y=Math.min(evt.clientY, window.innerHeight - menu.offsetHeight - 10);
  menu.style.left=x+"px"; menu.style.top=y+"px";
}
function closeGroupMenu(){ document.getElementById("groupmenu").style.display="none"; }

// ============================================================
//  DRAG & DROP (guests between seats / pool)
// ============================================================
let dragData=null;
function wireSeat(seat){
  const tableId=+seat.dataset.tableId, idx=+seat.dataset.seatIndex;
  seat.addEventListener("dragstart",e=>{ if(!seat.classList.contains("occupied"))return; dragData={type:"guest", guestId:seat.dataset.guestId, from:"seat", tableId, seatIndex:idx}; e.dataTransfer.effectAllowed="move"; e.stopPropagation(); });
  seat.addEventListener("dragover",e=>{ if(dragData&&dragData.type==="guest"){ e.preventDefault(); seat.classList.add("dragover"); }});
  seat.addEventListener("dragleave",()=>seat.classList.remove("dragover"));
  seat.addEventListener("drop",e=>{ e.preventDefault(); e.stopPropagation(); seat.classList.remove("dragover"); if(dragData&&dragData.type==="guest"){ placeGuestInSeat(dragData,tableId,idx); dragData=null; } });
  seat.addEventListener("dblclick",e=>{ e.stopPropagation(); editSeatInline(seat,tableId,idx); });
  seat.addEventListener("click",e=>{ if(seat.classList.contains("editing"))return; if(!seat.classList.contains("occupied")) editSeatInline(seat,tableId,idx); });
  seat.addEventListener("contextmenu",e=>{ if(seat.classList.contains("occupied")){ e.preventDefault(); e.stopPropagation(); openGroupMenu(seat.dataset.guestId,e); } });
}
function placeGuestInSeat(drag, tableId, seatIndex){
  const table=state.tables.find(t=>t.id===tableId);
  const occupant=table.seats[seatIndex];
  if(drag.from==="seat"){
    const src=state.tables.find(t=>t.id===drag.tableId);
    src.seats[drag.seatIndex]=occupant;
    table.seats[seatIndex]=drag.guestId;
  }else{
    table.seats[seatIndex]=drag.guestId;
  }
  save(); renderTables(); renderPool();
}
function editSeatInline(seat, tableId, seatIndex){
  const table=state.tables.find(t=>t.id===tableId);
  const gid=table.seats[seatIndex];
  const current=gid?guestName(gid):"";
  seat.classList.add("editing"); seat.style.background=""; seat.style.borderColor="";
  seat.style.width=Math.max(parseFloat(seat.style.width)||0, 110)+"px";
  seat.innerHTML=`<input type="text" value="${escapeHtml(current)}" maxlength="40">`;
  const input=seat.querySelector("input"); input.focus(); input.select();
  function commit(){
    const val=input.value.trim();
    if(val){ if(gid){ state.guests[gid].name=val; } else { const id="g"+nextId(); state.guests[id]={name:val, groupId:state.activeGroupId||null}; table.seats[seatIndex]=id; } }
    else if(gid){ table.seats[seatIndex]=null; }
    save(); renderTables(); renderPool(); renderGroups();
  }
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault(); commit(); const ni=(seatIndex+1)%table.capacity; setTimeout(()=>{ const next=stage.querySelector(`.seat[data-table-id="${tableId}"][data-seat-index="${ni}"]`); if(next) editSeatInline(next,tableId,ni); },0); }
    if(e.key==="Escape"){ renderTables(); }
  });
  input.addEventListener("blur",commit);
}
const poolEl=document.getElementById("unassigned");
poolEl.addEventListener("dragover",e=>{ if(dragData&&dragData.type==="guest"){ e.preventDefault(); poolEl.classList.add("dragover"); }});
poolEl.addEventListener("dragleave",()=>poolEl.classList.remove("dragover"));
poolEl.addEventListener("drop",e=>{ e.preventDefault(); poolEl.classList.remove("dragover"); if(dragData&&dragData.type==="guest"&&dragData.from==="seat"){ const src=state.tables.find(t=>t.id===dragData.tableId); src.seats[dragData.seatIndex]=null; save(); renderTables(); renderPool(); } dragData=null; });

// ============================================================
//  MOVE (smooth pointer dragging — moves the element, no rebuild until done)
// ============================================================
function makeDraggable(handleEl, moveEl, obj, onEnd){
  handleEl.addEventListener("pointerdown",e=>{
    if(e.target.closest(".tgear")) return;
    if(e.button!==0) return;
    e.preventDefault(); e.stopPropagation();
    handleEl.setPointerCapture(e.pointerId);
    const sx=e.clientX, sy=e.clientY, ox=obj.x, oy=obj.y; let moved=false;
    function mv(ev){
      const dx=(ev.clientX-sx)/zoom, dy=(ev.clientY-sy)/zoom;
      if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
      obj.x=clamp(ox+dx, 30, 1670); obj.y=clamp(oy+dy, 30, 1330);
      moveEl.style.left=obj.x+"px"; moveEl.style.top=obj.y+"px";
    }
    function up(){ handleEl.releasePointerCapture(e.pointerId); handleEl.removeEventListener("pointermove",mv); handleEl.removeEventListener("pointerup",up); if(moved){ save(); if(onEnd)onEnd(); } }
    handleEl.addEventListener("pointermove",mv); handleEl.addEventListener("pointerup",up);
  });
}

// ============================================================
//  TABLE SETTINGS
// ============================================================
const menu=document.getElementById("tablemenu");
function openMenu(tableId, evt){
  activeMenuTableId=tableId;
  const t=state.tables.find(x=>x.id===tableId);
  document.getElementById("menuTitle").textContent = t.shape==="head" ? "Head table settings" : "Table settings";
  document.getElementById("menuCapLabel").textContent = t.shape==="head" ? "Total seats (2 are the end seats)" : "Seats";
  document.getElementById("menuLabel").value=t.label;
  document.getElementById("menuCapCustom").value=[8,10,12].includes(t.capacity)?"":t.capacity;
  menu.querySelectorAll(".caps button").forEach(b=>b.classList.toggle("active",+b.dataset.cap===t.capacity));
  showPopover(menu,evt);
}
function closeMenu(){ menu.style.display="none"; activeMenuTableId=null; }
document.getElementById("menuLabel").addEventListener("input",e=>{ const t=state.tables.find(x=>x.id===activeMenuTableId); if(!t)return; t.label=e.target.value; save(); renderTables(); });
menu.querySelectorAll(".caps button").forEach(b=>b.addEventListener("click",()=>setCapacity(+b.dataset.cap)));
document.getElementById("menuCapCustom").addEventListener("change",e=>{ const v=parseInt(e.target.value,10); if(v>=1&&v<=30) setCapacity(v); });
function setCapacity(n){
  const t=state.tables.find(x=>x.id===activeMenuTableId); if(!t)return;
  if(t.shape==="head") n=Math.max(3,n);
  const old=t.seats, newSeats=Array(n).fill(null); let bumped=0;
  for(let i=0;i<old.length;i++){ if(old[i]!=null){ if(i<n)newSeats[i]=old[i]; else{ const free=newSeats.indexOf(null); if(free>=0)newSeats[free]=old[i]; else bumped++; } } }
  t.capacity=n; t.seats=newSeats; save(); renderTables();
  menu.querySelectorAll(".caps button").forEach(bt=>bt.classList.toggle("active",+bt.dataset.cap===n));
  if(bumped) toast(bumped+" guest(s) moved to unassigned");
  renderPool();
}
document.getElementById("menuDelete").addEventListener("click",()=>{
  const t=state.tables.find(x=>x.id===activeMenuTableId); if(!t)return;
  if(!confirm(`Delete "${t.label}"? Its guests go back to unassigned.`))return;
  state.tables=state.tables.filter(x=>x.id!==activeMenuTableId);
  save(); renderTables(); renderPool(); closeMenu();
});
document.getElementById("menuClose").addEventListener("click",closeMenu);
document.addEventListener("click",e=>{
  if(menu.style.display==="block" && !menu.contains(e.target) && !e.target.classList.contains("tgear")) closeMenu();
  const gm=document.getElementById("groupmenu");
  if(gm.style.display==="block" && !gm.contains(e.target)) closeGroupMenu();
});

// ============================================================
//  TOOLBAR
// ============================================================
document.getElementById("addTableBtn").addEventListener("click",()=>{
  const id=nextId();
  const roundCount=state.tables.filter(t=>t.shape!=="head").length;
  state.tables.push({id, label:String(roundCount+1), shape:"round", x:850, y:250, capacity:10, seats:Array(10).fill(null)});
  save(); renderTables(); toast("Round table added — drag it into place");
});
document.getElementById("addHeadBtn").addEventListener("click",()=>{
  const t=makeHeadTable(nextId()); t.y=1245; state.tables.push(t);
  save(); renderTables(); toast("Head table added — drag it into place");
});
document.getElementById("addGuestBtn").addEventListener("click",()=>{
  const ta=document.getElementById("guestInput");
  const lines=ta.value.split("\n").map(s=>s.trim()).filter(Boolean); if(!lines.length)return;
  lines.forEach(nm=>{ const id="g"+nextId(); state.guests[id]={name:nm, groupId:state.activeGroupId||null}; });
  ta.value=""; save(); renderPool(); renderGroups(); toast(lines.length+" guest(s) added");
});
document.getElementById("guestInput").addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) document.getElementById("addGuestBtn").click(); });
document.getElementById("autoSeatBtn").addEventListener("click",()=>{
  const assigned=assignedGuestIds();
  const un=Object.keys(state.guests).filter(id=>!assigned.has(id)).sort((a,b)=>String(state.guests[a].groupId).localeCompare(String(state.guests[b].groupId)));
  let idx=0;
  for(const t of state.tables){ if(t.shape==="head") continue; for(let i=0;i<t.capacity&&idx<un.length;i++){ if(t.seats[i]==null){ t.seats[i]=un[idx++]; } } if(idx>=un.length)break; }
  save(); renderTables(); renderPool(); toast(idx?`Seated ${idx} guest(s)`:"No open seats / no unassigned guests");
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("Reset everything back to the default layout? This clears all guests."))return;
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  state=defaultState(); uid=state._uid; fontScale=1; save(); renderAll(); toast("Reset to default layout");
});
document.getElementById("exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="wedding-seating.json"; a.click(); toast("Downloaded wedding-seating.json");
});
document.getElementById("importBtn").addEventListener("click",()=>{
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const s=JSON.parse(r.result); if(s.tables){ if(!s.groups)s.groups=[]; if(!s.features)s.features=defaultFeatures(); state=s; uid=state._uid||uid; fontScale=state.seatFontScale||1; save(); renderAll(); toast("Imported"); } }catch(e){ toast("Invalid file"); } };
    r.readAsText(f); };
  inp.click();
});

// ============================================================
//  PRINT
// ============================================================
document.getElementById("printBtn").addEventListener("click",buildAndPrint);
function buildAndPrint(){
  const area=document.getElementById("printarea");
  const legend=state.groups.map(g=>`<span><span class="dot" style="background:${g.color}"></span>${escapeHtml(g.name)}</span>`).join("");
  const cards=state.tables.map(t=>{
    const rows=t.seats.map(gid=> gid?`<li><span class="gdot" style="background:${guestColor(gid)}"></span>${escapeHtml(guestName(gid))}</li>`:`<li class="empty">— empty —</li>`).join("");
    const occ=t.seats.filter(Boolean).length;
    return `<div class="pcard"><h3>${escapeHtml(t.label)} <span style="font-weight:400;color:#888;font-size:12px">(${occ}/${t.capacity})</span></h3><ol>${rows}</ol></div>`;
  }).join("");
  const assigned=assignedGuestIds();
  const un=Object.keys(state.guests).filter(id=>!assigned.has(id));
  const unHtml=un.length?`<div class="punassigned"><strong>Unassigned (${un.length}):</strong> ${un.map(id=>escapeHtml(guestName(id))).join(", ")}</div>`:"";
  const seated=assigned.size, totalSeats=state.tables.reduce((s,t)=>s+t.capacity,0);
  area.innerHTML=`<h2>💍 Wedding Seating Plan</h2>
    <div class="psub">${state.tables.length} tables · ${seated} guests seated · ${totalSeats} seats total</div>
    ${legend?`<div class="plegend">${legend}</div>`:""}
    <div class="ptables">${cards}</div>${unHtml}`;
  window.print();
}

// ============================================================
//  TEXT SIZE + ZOOM
// ============================================================
function setFontScale(v){ fontScale=clamp(v,0.6,2.0); state.seatFontScale=fontScale; save(); renderTables(); toast("Name text "+Math.round(fontScale*100)+"%"); }
document.getElementById("fontUp").addEventListener("click",()=>setFontScale(fontScale+0.15));
document.getElementById("fontDown").addEventListener("click",()=>setFontScale(fontScale-0.15));

function fitZoom(){ const wrap=document.getElementById("stagewrap"); return Math.min(1,(wrap.clientWidth-60)/1700,(wrap.clientHeight-100)/1360); }
function applyZoom(){ stage.style.transform=`scale(${zoom})`; document.getElementById("zoomLabel").textContent=Math.round(zoom*100)+"%"; }
document.getElementById("zoomIn").addEventListener("click",()=>{ zoom=Math.min(2.5,zoom+0.1); applyZoom(); });
document.getElementById("zoomOut").addEventListener("click",()=>{ zoom=Math.max(0.2,zoom-0.05); applyZoom(); });
document.getElementById("zoomFit").addEventListener("click",()=>{ zoom=fitZoom(); applyZoom(); });

// ============================================================
//  INIT
// ============================================================
function renderAll(){ renderFeatures(); renderTables(); renderGroups(); renderPool(); }
renderAll();
setTimeout(()=>{ zoom=Math.min(1, Math.max(fitZoom(), 0.55)); applyZoom(); },50);
</script>
